[workspace]
# `fts-ui` (the facade) lives in crates/; capability crates live in features/.
# Backend-specific splits (e.g. features/audio/audio-native) are added under
# `features/*/*` only if/when an implementation actually diverges.
members = ["crates/*", "features/*", "apps/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fts-ui = { path = "crates/fts-ui" }
fts-ui-core = { path = "features/core" }
clsx = "0.1.1"
dioxus = { version = "0.7.9", default-features = false, features = ["lib"] }
# Blitz / dioxus-native — upstream DioxusLabs/blitz.
# Re-exported as `dioxus` (via `package = "dioxus-native"`) inside the
# native app so component code can keep `use dioxus::prelude::*` unchanged.
# NOTE: blitz has no released semver, so this git dep tracks `main` HEAD. The
# Cargo.lock is what actually holds it at a known-good commit — DON'T run a
# bare `cargo update` on blitz: newer HEADs pull vello_common 0.0.9, which
# skews against the vello_cpu 0.0.8 used by the VRT snapshot rasteriser
# (fts-story-snapshots) and breaks the test build.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git", features = ["prelude", "system-fonts"] }
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", package = "dioxus-primitives", rev = "837c9d4c1c9f99b19de7a3f087d8af1b0538dcae", default-features = false }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }
tracing = { version = "0.1", features = ["std"] }
tw_merge = "0.1.21"

# fts-story — story registry / Lookbook shell / VRT runner. Pulled from
# Codeberg, tracking `branch = "main"`; pin to `rev = "<sha>"` once the
# API stabilises.
fts-story-runtime   = { git = "https://codeberg.org/FastTrackStudios/fts-story.git", branch = "main" }
fts-story-shell     = { git = "https://codeberg.org/FastTrackStudios/fts-story.git", branch = "main" }
fts-story-snapshots = { git = "https://codeberg.org/FastTrackStudios/fts-story.git", branch = "main" }
fts-story-parity    = { git = "https://codeberg.org/FastTrackStudios/fts-story.git", branch = "main" }
linkme              = "0.3"
# fzf-style fuzzy matching — the matcher core extracted from Helix's
# Nucleo. Used to rank cmdk-style searches in Combobox / Command.
nucleo-matcher      = "0.3"
# Color space conversions used by the ColorPicker wrapper. Pinned to
# match the version that `dioxus-primitives::color_picker` builds against.
palette             = "0.7.6"

[workspace.lints.rust]
unused = "warn"

# Stylistic clippy lints allowed during stabilization (same policy as daw):
# they're churn, not bugs. Tighten per-crate in a later cleanup sweep.
# Each crate opts in via `[lints] workspace = true`.
[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"

# Local fork: build fts-story from the working clone so we can iterate on the
# Lookbook sidebar (two-level Core/Audio grouping) before pushing to Codeberg.
# ALL fts-story crates MUST be patched together — fts-story-runtime defines the
# global STORIES slice the shell reads, so a split source would hand the shell
# an empty registry. Remove this block once the change is pushed and the lock
# is bumped to the new Codeberg commit.
[patch."https://codeberg.org/FastTrackStudios/fts-story.git"]
fts-story-core      = { path = "../fts-story/crates/fts-story-core" }
fts-story-macros    = { path = "../fts-story/crates/fts-story-macros" }
fts-story-runtime   = { path = "../fts-story/crates/fts-story-runtime" }
fts-story-shell     = { path = "../fts-story/crates/fts-story-shell" }
fts-story-snapshots = { path = "../fts-story/crates/fts-story-snapshots" }
fts-story-parity    = { path = "../fts-story/crates/fts-story-parity" }

