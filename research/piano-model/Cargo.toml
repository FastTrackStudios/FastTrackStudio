# Detached from the root workspace on purpose: personal, non-shipping
# research tooling. Empty [workspace] table makes this its own root so the
# ~160-member monorepo lockfile/target are untouched.
[workspace]

[package]
name = "piano-model"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pm"
path = "src/main.rs"

[dependencies]
claxon = "0.4"        # pure-Rust FLAC decode
rustfft = "6"         # spectra
walkdir = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"           # parallel per-sample analysis
hound = "3"           # WAV writer for resynthesis A/B
cpal = "0.15"         # realtime audio output (playable engine)
midir = "0.10"        # MIDI input (playable engine)
crossbeam-channel = "0.5"  # lock-free MIDI event queue into the audio thread
# DDSP training: differentiable additive+noise synth fit to the samples by
# gradient descent (candle = pure-Rust autograd, CPU; matches the WASM target).
candle-core = "0.8"
candle-nn = "0.8"

[profile.release]
opt-level = 3
