[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
facet.workspace = true
figue = "2.0"
reaper-launcher.workspace = true
# `daw::test::runner` is the integration-test harness (formerly the `reaper-test`
# crate, folded into the `daw` facade behind the `test-harness` feature).
daw = { workspace = true, features = ["test-harness"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio.workspace = true
uuid.workspace = true
utils.workspace = true
xshell = "0.2"
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
icns = "0.4"


[[bin]]
name = "xtask"
path = "src/main.rs"
