[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
facet = { git = "https://github.com/facet-rs/facet", branch = "main" }
figue = { git = "https://github.com/bearcove/figue" }
serde_json = "1.0"
signal-proto.workspace = true
xshell = "0.2"

[[bin]]
name = "xtask"
path = "src/main.rs"
