[package]
name = "daw-xtask"
version = "0.1.0"
edition = "2024"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reaper-launcher = { workspace = true, features = ["icon-gen"] }
# Test-runner orchestration now lives at `daw::test::runner` behind the
# `test-harness` feature (former `reaper-test` crate with its `runner` feature).
daw = { workspace = true, features = ["test-harness"] }
fts-repo = { git = "https://codeberg.org/FastTrackStudios/fts-repo", branch = "main" }
