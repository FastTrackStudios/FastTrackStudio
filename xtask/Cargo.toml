[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
facet.workspace = true
figue = "2.0"
reaper-launcher = { path = "../../daw/crates/reaper-launcher" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal.workspace = true
signal-storage = { path = "../crates/signal/signal-storage" }
tokio.workspace = true
uuid.workspace = true
utils.workspace = true
xshell = "0.2"


[[bin]]
name = "xtask"
path = "src/main.rs"
