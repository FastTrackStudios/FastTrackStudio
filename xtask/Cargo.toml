[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fts-devtools = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
# CLAP/VST3 bundler — the nice-plug fork's xtask (fts-plug). Replaces nih_plug_xtask.
nice-plug-xtask = { path = "../../FTS-Plugins/forks/fts-plug/crates/nice-plug-xtask" }
# `reaper-test` folded into the daw facade behind `test-harness`; the runner
# lives at `daw::test::runner`.
daw = { workspace = true, features = ["test-harness"] }
