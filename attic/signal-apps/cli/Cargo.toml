[package]
name = "signal-cli"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately

[lib]
name = "signal_cli"
path = "src/lib.rs"

[[bin]]
name = "signal"
path = "src/main.rs"

[dependencies]
signal.workspace = true
signal-sampler.workspace = true
tokio.workspace = true
eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
uuid.workspace = true
daw-cli.workspace = true
daw = { workspace = true, features = ["file"] }
utils.workspace = true
crossbeam-channel.workspace = true
midir.workspace = true
