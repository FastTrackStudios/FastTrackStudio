[application]
name = "Signal"
default_platform = "desktop"
# `dev` feature switches the entry point to WebKit/WRY so `dx serve` works.
# Production builds (cargo run -p signal-desktop) use Blitz/wgpu instead.
features = ["dev"]

[desktop]
title = "Signal (dev)"

[bundle]
identifier = "com.fasttrackstudio.signal-desktop"
publisher = "FastTrack Studio"
name = "Signal"

[bundle.macos]
minimum_system_version = "13.0"
