[package]
name = "signal-desktop"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
license.workspace = true
authors.workspace = true

[[bin]]
name = "signal-desktop"
path = "src/main.rs"

[features]
# `dev` enables the WebKit/WRY renderer via `dioxus::desktop` for hot-reload
# development with `dx serve`.  It is the DEFAULT so that plain `dx serve`
# works without extra flags (dx 0.7.x doesn't read `features` from Dioxus.toml).
#
# Production / nix builds pass `--no-default-features` to use the
# `nice_plug_dioxus` Blitz/wgpu renderer — the same pipeline as fts-signal-plugin.
default = ["dev"]
dev = ["dioxus/desktop"]

[dependencies]
signal.workspace = true
midicore.workspace = true
# `pipewire` gives the native PipeWire duplex backend (shared device access, no
# exclusive-ALSA "device busy"). Same as apps/amp. Requires libpipewire at
# build/link time (provided by the flake dev shell).
signal-sampler = { workspace = true, features = ["pipewire"] }
# The headless rig core (GuitarRigBackend) + its wire contract. The app only
# builds the backend and serves it over a vox link — all control flows through
# the generated clients, never direct calls into the rig.
signal-guitar.workspace = true
# In-process vox transport (LocalServer) — the desktop flavor of the
# detachable-GUI link; web swaps this for a WebSocket without touching the UI.
architect = { workspace = true, features = ["vox", "local"] }
signal-ui = { workspace = true, default-features = false, features = ["desktop"] }
# Blitz renderer — same pipeline as fts-signal-plugin (VST3/CLAP).
# Do NOT enable dioxus/desktop here; that pulls in WebKit/WRY which conflicts.
# Use --features dev for dx serve hot-reload workflow instead.
nice-plug-dioxus.workspace = true
# dioxus is needed for component macros (rsx!, #[component], Element) and,
# when --features dev is active, for the WebKit/WRY desktop renderer.
dioxus.workspace = true
dock-dioxus = { workspace = true, default-features = false, features = ["web"] }
dock-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
