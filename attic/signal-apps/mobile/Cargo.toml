[package]
name = "signal-mobile"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
license.workspace = true
authors.workspace = true

[[bin]]
name = "signal-mobile"
path = "src/main.rs"

[dependencies]
signal.workspace = true
signal-ui = { workspace = true, default-features = false, features = ["web"] }
# Mobile renderer — WebView (WKWebView on iOS, WebView on Android).
# This is intentionally NOT nice-plug-dioxus; mobile doesn't use Blitz/wgpu.
dioxus = { workspace = true, features = ["mobile"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
