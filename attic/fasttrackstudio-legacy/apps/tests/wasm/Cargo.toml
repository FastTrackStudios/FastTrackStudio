[package]
name = "wasm-tests"
version = "0.1.0"
edition.workspace = true
description = "WASM integration tests using Dioxus - tests browser client connecting to gateway"

[dependencies]
# Dioxus UI framework (for rendering test results)
dioxus = { workspace = true }

# Vox RPC
vox.workspace = true
vox-websocket.workspace = true

# DAW API (same as web app uses)
daw.workspace = true

# Session API (setlist navigation, song control) - via facade
session.workspace = true

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Serialization for test results (exposed to JS)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Web APIs
web-sys = { version = "0.3", features = ["Window", "Location", "console"] }
js-sys = "0.3"

# Async
futures.workspace = true
gloo-timers = { version = "0.3", features = ["futures"] }

# Logging
tracing = "0.1"
tracing-wasm = "0.2"

[features]
default = ["web"]
web = ["dioxus/web"]
