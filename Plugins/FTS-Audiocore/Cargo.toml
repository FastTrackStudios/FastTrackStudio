# Slim workspace: the audiocore library crates moved to the root workspace
# (crates/audiocore/*) in restructure wave 1. Only the meter-plugin app
# remains here until the apps wave audits/relocates it (see LAYOUT.md).
[workspace]
resolver = "2"
members = ["apps/meter-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrackStudio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Moved crates — now in the root workspace, consumed by path.
audiocore-gui = { path = "../../crates/audiocore/audiocore-gui" }
audiocore-core = { path = "../../crates/audiocore/audiocore-core" }
meter-dsp = { path = "../../crates/audiocore/meter-dsp" }
meter-ui = { path = "../../crates/audiocore/meter-ui" }
nice-plug = { path = "../../libs/nice-plug/nice-plug" }
nice-plug-dioxus = { path = "../../libs/nice-plug/nice-plug-dioxus" }
atomic_float = "1.1"

# moire: FTS fork — aligned with the root workspace (rev 7a2f1dc).
[patch.crates-io]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[patch."https://github.com/bearcove/moire"]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
