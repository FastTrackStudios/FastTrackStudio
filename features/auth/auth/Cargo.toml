[package]
name = "auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Auth feature facade. Single import root for the auth slice.
#
# Re-exports `auth-db` (SeaORM entities + better-auth adapter +
# connection/migration helpers). Server crates depend on this facade
# and get the whole auth surface from one place; if/when a UI piece
# lands (login form, account settings) it'll live in `auth-ui` and
# get re-exported here too.

[dependencies]
auth-db = { path = "../auth-db" }
