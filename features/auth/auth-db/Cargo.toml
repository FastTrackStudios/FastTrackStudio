[package]
name = "auth-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# SeaORM-backed persistence + better-auth adapter for the `auth`
# feature.
#
# Owns:
# - the auth_* SeaORM entities (user, org, member, session, account,
#   verification, two_factor)
# - the `SeaOrmAuthAdapter` better-auth-core impl
# - the create-tables migrator
# - connection helpers (`init`, `init_file`, `init_memory`) that
#   migrate-on-connect — every binary that touches auth uses these
#   so the schema lives in one place
#
# Self-contained: doesn't depend on the rest of the feature suite or
# on the legacy `task-core`. Replaces the auth bits of the old
# `task-db` crate as part of the feature-architecture migration.

[dependencies]
sea-orm.workspace = true
sea-orm-migration.workspace = true
better-auth-core.workspace = true
async-trait = "0.1"
chrono.workspace = true
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
