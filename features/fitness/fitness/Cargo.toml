[package]
name = "fitness"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `fitness` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  fitness-crdt + fitness-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
fitness-proto.workspace = true
fitness-crdt = { workspace = true, optional = true }
fitness-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["fitness-proto/vox"]
server = ["dep:fitness-crdt", "dep:fitness-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["fitness-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
