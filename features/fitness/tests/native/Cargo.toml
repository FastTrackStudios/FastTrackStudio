[package]
name = "fitness-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `fitness-proto` contract against the Loro-backed
# `fitness-crdt` using an ephemeral `CrdtDoc` (no persistence). Fast,
# no DB, no WebSocket. Use fake-rs Dummy derives via the `fake`
# feature on `fitness-proto` to seed repositories deterministically.

[dependencies]
fitness-proto = { workspace = true, features = ["fake"] }
fitness-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
chrono.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
