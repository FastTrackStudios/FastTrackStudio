[package]
name = "exercises"
description = "Exercise catalog feature — typed view of exercise pages in a `vault::Vault`. Exercises are markdown files with YAML frontmatter (`type: exercise`) under `<vault>/Wiki/Exercises/` so they ride on the wiki feature for curation + wikilinks (`[[chest press]]` resolves into a concept page, `[[pectoralis-major]]` into an anatomy page). Modeled on wger's Exercise + Category + Muscle + Equipment tables, flattened onto one page-per-exercise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
vault = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[dev-dependencies]
tempfile = "3"
