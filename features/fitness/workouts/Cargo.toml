[package]
name = "workouts"
description = "Workouts feature — Routine + WorkoutSession + WorkoutLog. Routines are optional structured templates (Day → Slot → Set config) for programmed lifters; sessions reference a routine or stand alone for ad-hoc workouts. Per-set log rows record reps + weight + RIR/RPE actuals. Modeled on wger's `Routine` / `Day` / `Slot` / `WorkoutSession` / `WorkoutLog` tables, flattened onto two page types in the vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
vault = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[dev-dependencies]
tempfile = "3"
