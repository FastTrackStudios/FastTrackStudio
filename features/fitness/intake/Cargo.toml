[package]
name = "intake"
description = "Daily food-intake log feature. One page per day (`type: intake-log`) listing what you ate, with nutrition resolved from `mealplan` (Recipe nutrition / PantryItem nutrition_per_unit) or hand-entered. Sum across the day = your calorie + macro totals; the fitness facade combines that with workout + body metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
vault = { workspace = true }
# `mealplan` re-exports `cookbook` + `pantry` so we depend
# on just the facade; intake resolves nutrition through
# `cookbook::Recipe.nutrition` and
# `pantry::PantryItem.nutrition_per_unit`.
mealplan = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = [
    "dep:vox",
    "dep:vox-types",
    "architect/vox",
    "mealplan/vox",
]

[dev-dependencies]
tempfile = "3"
