[package]
name = "example-ui"
version = "0.1.0"
edition = "2024"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

# Per-feature Dioxus components for the `example` feature.
#
# The pattern: each feature owns the visual + interaction concerns that
# belong to it (lists, forms, rows, dialogs). `apps/ui` composes one or
# more feature-ui crates into the pages/shells consumed by the runtime
# apps (`apps/web`, `apps/desktop`).
#
# Wasm-only by virtue of its dioxus + vox-websocket deps; lives outside
# the cargo workspace so its target constraints don't bleed into the
# server build.

[dependencies]
example-proto = { path = "../example-proto" }
dioxus = { version = "0.7.9", default-features = false, features = ["lib"] }
vox = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5", default-features = false, features = ["runtime"] }
vox-core = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
vox-websocket = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
uuid = { version = "1", features = ["v4", "js"] }
