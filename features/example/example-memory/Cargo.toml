[package]
name = "example-memory"
version.workspace = true
edition.workspace = true

# Wasm-clean in-memory implementation of the `example-proto` contract.
# A second backend alongside `example-db` — proves the contract really
# is backend-agnostic. Suitable for tests, demos, and ephemeral
# single-process deployments.
#
# Note: this crate depends on `example-proto` WITHOUT the `server`
# feature — no sea-orm, no tokio runtime beyond the async-trait
# requirements that vox already implies.

[dependencies]
example-proto.workspace = true
architect.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["sync"] }
