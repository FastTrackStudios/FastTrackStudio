[package]
name = "notifications-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Wire contract for the `notifications` feature. Pull this crate (or
# the `notifications` facade) from any consumer — wasm-clean by
# default.

[dependencies]
architect.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["js", "serde"] }
facet.workspace = true
thiserror.workspace = true
serde.workspace = true

vox = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "architect/vox"]
server = ["architect/server-seaorm", "dep:sea-orm"]
fake = ["dep:fake", "architect/fake"]
full = ["vox", "server", "fake"]
