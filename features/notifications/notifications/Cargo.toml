[package]
name = "notifications"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Facade for the `notifications` feature. Default = wire-only;
# `server` pulls in the router + delivery side.

[dependencies]
notifications-proto.workspace = true
agent.workspace = true
agent-proto.workspace = true
chrono = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "rt", "time", "macros"] }
uuid = { workspace = true, optional = true, features = ["v4"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
agent.workspace = true

[features]
default = []
server = ["dep:tokio", "dep:chrono", "dep:uuid", "dep:tracing", "agent/server"]
vox = ["notifications-proto/vox"]
