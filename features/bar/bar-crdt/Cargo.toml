[package]
name = "bar-crdt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

# Loro-backed source-of-truth for the `bar` feature.
#
# Owns the marker type that makes Rust's orphan rules cooperate
# (foreign trait + foreign type), the `EntityCrdt` impl (codec +
# id/timestamp policy + sort lookup), and the `BarRepoLoro`
# newtype that implements the architect-emitted `BarRepo`.
#
# All real work happens inside `LoroRepo<BarEntity>` from
# `libs/crdt`; this crate is intentionally thin so the architect
# derive can emit it from field attributes in a future revision.

[dependencies]
bar-proto.workspace = true
crdt.workspace = true
architect.workspace = true
loro.workspace = true
chrono.workspace = true
uuid.workspace = true
