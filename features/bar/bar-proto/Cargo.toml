[package]
name = "bar-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Wire contract for the `bar` feature. Pull this crate (or the
# `bar` facade) from any consumer — wasm-clean by default.

[dependencies]
architect.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["js"] }
facet.workspace = true
thiserror.workspace = true

vox = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "architect/vox"]
server = ["architect/server-seaorm", "dep:sea-orm"]
full = ["vox", "server"]
