[package]
name = "midi-tools-daw"
version.workspace = true
edition.workspace = true
description = "midi-tools-daw — reads notes from a DAW project and writes midi-tools' velocity edits back"

[dependencies]
# The arithmetic. midi-tools stays DAW-free so its panel can run
# standalone; this crate is the half that knows about projects.
midi-tools = { workspace = true }
daw = { workspace = true }
daw-proto = { workspace = true }

[dev-dependencies]
# The REAPER integration harness (#[reaper_test]).
daw = { workspace = true, features = ["test-harness", "reaper"] }
eyre = { workspace = true }

[lints]
workspace = true
