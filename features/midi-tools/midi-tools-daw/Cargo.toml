[package]
name = "midi-tools-daw"
version.workspace = true
edition.workspace = true
description = "midi-tools-daw — reads notes from a DAW project and writes midi-tools' velocity edits back"

[dependencies]
# The arithmetic. midi-tools stays DAW-free so its panel can run
# standalone; this crate is the half that knows about projects.
midi-tools = { workspace = true }
daw = { workspace = true }
daw-proto = { workspace = true }

[dev-dependencies]
# The REAPER integration harness (#[reaper_test]).
daw = { workspace = true, features = ["test-harness", "reaper"] }
eyre = { workspace = true }

# The end-to-end test (tests/reaper_velocity_gui.rs) drives the real panel
# on a headless Blitz DOM against a real REAPER take. That needs both
# halves, which is why the UI crate is a dev-dep of the DAW crate rather
# than the other way round — the dependency only exists for the test.
midi-tools-ui = { workspace = true }
dioxus = { workspace = true }
dioxus-test = { workspace = true }

[lints]
workspace = true
