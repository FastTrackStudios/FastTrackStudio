[package]
name = "editor"
description = "Umbrella crate. Re-exports editor-state + editor-view + editor-vim + editor-typst, and ships an `EditorApp` Dioxus component that mounts a working markdown editor (live preview, vim, slash menu) with one rsx call."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
editor-state = { workspace = true }
editor-view = { workspace = true }
editor-vim = { workspace = true }
editor-typst = { workspace = true }
# Used by `app::EditorApp` — the turnkey-shell Dioxus component
# the rest of the codebase mounts. `editor-view` already pulls
# dioxus in transitively; declaring it here just makes the
# component's source compile cleanly.
dioxus = { workspace = true }

[lints]
workspace = true
