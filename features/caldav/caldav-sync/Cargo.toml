[package]
name = "caldav-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Server-side CalDAV sync engine. Wraps the `kitchen_fridge` client +
# local-cache + provider to bridge between:
#
# - A remote CalDAV server (Nextcloud, iCloud, Owncloud, …) — the
#   wire side, all operations against the `kitchen_fridge` types.
# - The Task-architect `calendar` feature's Loro-backed `CalendarEvent`
#   CRDT — the local side, our authoritative store.
#
# The engine owns the credentials handle (the username/password lookup
# comes from `auth-db`) and the `CalDavCalendar` metadata bookkeeping.
# Not used by wasm clients — pure server-side.
#
# Kitchen-fridge's upstream caveat (per their docs) is that VTODO is
# fully supported and VEVENT is "fairly trivial" but not yet — file
# issues at https://github.com/daladim/kitchen-fridge if you hit
# gaps. The mapping below stays simple so a future kitchen-fridge
# bump expands what works for free.

[dependencies]
caldav-proto.workspace = true
calendar-proto.workspace = true
crdt.workspace = true
calendar-crdt.workspace = true
caldav-crdt.workspace = true
architect.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

fast-dav-rs.workspace = true
url = "2"
