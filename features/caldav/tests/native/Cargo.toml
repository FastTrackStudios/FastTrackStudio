[package]
name = "caldav-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `caldav-proto` contract against the Loro-backed
# `caldav-crdt` using an ephemeral `CrdtDoc` (no persistence). Fast,
# no DB, no WebSocket. Use fake-rs Dummy derives via the `fake`
# feature on `caldav-proto` to seed repositories deterministically.

[dependencies]
caldav-proto = { workspace = true, features = ["fake"] }
caldav-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
chrono.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
