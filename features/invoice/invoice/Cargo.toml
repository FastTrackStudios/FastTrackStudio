[package]
name = "invoice"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `invoice` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  invoice-crdt + invoice-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
invoice-proto.workspace = true
invoice-crdt = { workspace = true, optional = true }
invoice-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }
# Used by `InvoiceServiceImpl` (server-only, behind `server`).
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# PDF rendering only on native targets — printpdf 0.7 pulls a `time`
# crate version that fails on wasm32. Web build falls back to
# `window.print()` from the InvoicePreview component.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
printpdf = { workspace = true, optional = true }

[features]
default = []
pdf = ["dep:printpdf"]
vox = ["invoice-proto/vox"]
server = [
    "dep:invoice-crdt",
    "dep:invoice-db",
    "dep:crdt",
    "dep:chrono",
    "dep:uuid",
    "dep:architect",
]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["invoice-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
