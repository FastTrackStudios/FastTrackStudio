[package]
name = "invoice-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `invoice-proto` contract against the Loro-backed
# `invoice-crdt` using an ephemeral `CrdtDoc` (no persistence). Fast,
# no DB, no WebSocket. Use fake-rs Dummy derives via the `fake`
# feature on `invoice-proto` to seed repositories deterministically.

[dependencies]
invoice-proto = { workspace = true, features = ["fake"] }
invoice-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
