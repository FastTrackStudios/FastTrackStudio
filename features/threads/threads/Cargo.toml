[package]
name = "threads"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `threads` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  threads-crdt + threads-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
threads-proto.workspace = true
threads-crdt = { workspace = true, optional = true }
threads-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["threads-proto/vox"]
server = ["dep:threads-crdt", "dep:threads-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["threads-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
