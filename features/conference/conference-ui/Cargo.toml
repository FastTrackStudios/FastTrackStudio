[package]
name = "conference-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Dumb Dioxus components for the `conference` feature.
#
# Caller hands in data + receives events. No state ownership, no Loro
# client, no WebSocket — keeps the components portable and easy to
# storybook in isolation. `task-ui` does the wiring.

[dependencies]
dioxus = { workspace = true }
conference-proto.workspace = true
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
uuid = { workspace = true, features = ["v4", "js"] }
