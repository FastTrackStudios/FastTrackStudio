[package]
name = "conference"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `conference` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  conference-crdt + conference-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
conference-proto.workspace = true
conference-crdt = { workspace = true, optional = true }
conference-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["conference-proto/vox"]
server = ["dep:conference-crdt", "dep:conference-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["conference-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
