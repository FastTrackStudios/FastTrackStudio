[package]
name = "cookbook"
description = "Cookbook feature — cooklang-native recipe storage. Recipes are `.cook` files under `<vault>/Cookbook/` parsed by the `cooklang` crate. One file per recipe; no sidecar; identity = vault-relative path. Ingredient names ARE wikilink targets — the wiki layer resolves `@flour` to a `[[flour]]` page (e.g. a pantry item or concept page) so the recipe knows nothing about pantry IDs. Mealprep matches at runtime by name. Provides parse / scan / write plus a `#[architect::rpc] trait CookbookService`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
architect = { workspace = true }
cooklang = { workspace = true }
walkdir = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[[bin]]
name = "migrate-md-to-cook"
path = "src/bin/migrate_md_to_cook.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
