[package]
name = "cookbook"
description = "Cookbook feature — typed view of recipe pages in a `vault::Vault`. Recipes are markdown files with YAML frontmatter (`type: recipe`) living under `<vault>/Wiki/Cookbook/` so they ride on the wiki feature for curation + wikilinks (e.g. `[[saute]]` resolves into a concept page). Provides parse / serialize / scan plus a `#[architect::rpc] trait CookbookService` for agent integrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
vault = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
