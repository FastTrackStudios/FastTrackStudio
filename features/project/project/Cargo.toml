[package]
name = "project"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `project` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  project-crdt + project-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
project-proto.workspace = true
project-crdt = { workspace = true, optional = true }
project-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["project-proto/vox"]
server = ["dep:project-crdt", "dep:project-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["project-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
