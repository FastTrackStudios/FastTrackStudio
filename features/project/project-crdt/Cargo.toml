[package]
name = "project-crdt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Loro-backed source-of-truth for the `project` feature.
#
# Owns the marker type that makes Rust's orphan rules cooperate
# (foreign trait + foreign type), the `EntityCrdt` impl (codec +
# id/timestamp policy + sort lookup), and the `ProjectRepoLoro`
# newtype that implements the architect-emitted `ProjectRepo`.
#
# All real work happens inside `LoroRepo<ProjectEntity>` from
# `libs/crdt`; this crate is intentionally thin so the architect
# derive can emit it from field attributes in a future revision.

[dependencies]
project-proto.workspace = true
crdt.workspace = true
architect.workspace = true
loro.workspace = true
chrono.workspace = true
uuid.workspace = true
serde_json.workspace = true
