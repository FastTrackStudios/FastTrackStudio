[package]
name = "project-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Dumb Dioxus components for the `project` feature.
#
# Scoped to the `Project` entity for v1 — Task/Cycle/Milestone come
# later. Caller hands in data + receives events. No state ownership,
# no Loro client, no WebSocket — keeps the components portable and
# easy to storybook in isolation. `task-ui` does the wiring
# (constructing `ProjectRepoLoro` against a workspace-wide `CrdtDoc`,
# calling these components with the live list, dispatching
# `create`/`delete`).
#
# Outside the workspace because dioxus + wasm constraints can't be
# unified with the native server build.

[dependencies]
dioxus = { workspace = true }
project-proto.workspace = true
agent-proto.workspace = true
agent-ui.workspace = true
knowledge-proto.workspace = true
knowledge-ui.workspace = true
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
uuid = { workspace = true, features = ["v4", "js"] }

fts-ui.workspace = true

# Web-only — clipboard writes from the TaskGitPanel. Gated with
# `#[cfg(target_arch = "wasm32")]` at the call sites.
web-sys = { workspace = true, features = [
    "Window",
    "Navigator",
    "Clipboard",
] }
