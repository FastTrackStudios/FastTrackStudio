[package]
name = "daw-extension-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Integrated REAPER extension runtime helpers"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
# Depend on internal crates directly so `daw` can re-export this crate
# under `daw::extension_runtime` without a dependency cycle.
daw-control = { path = "../../../../crates/daw-control" }
daw-module = { path = "../../../../crates/daw-module" }
daw-proto = { path = "../../../../crates/daw-proto" }
daw-reaper = { path = "../daw-reaper" }
vox.workspace = true
eyre = "0.6"
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
crossbeam-channel.workspace = true
reaper-high.workspace = true
reaper-low.workspace = true
reaper-medium.workspace = true

[lints]
workspace = true
