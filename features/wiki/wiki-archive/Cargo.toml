[package]
name = "wiki-archive"
description = "URL archiving front-end for the wiki feature. Routes a URL (or local file) to a content extractor — readability articles, Google Docs export, yt-dlp video transcripts — and emits provenance-stamped markdown ready for the unchanged raw→ingest pipeline. Also hosts the bookmark-service importers (Readwise, Karakeep, Pocket, Netscape HTML) as batch front-ends to the same router."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# WHATWG URL parsing — the router's canonicalization (host
# normalization, tracking-param strip, provider-specific
# rewrites) needs a real URL model, not string hacks.
url = "2.5"
# Readability-style article extraction — the maintained
# winner among the Rust readability ports (html5ever-based,
# mozilla/readability test-suite parity). `TextMode::Markdown`
# emits markdown straight from the cleaned DOM.
dom_smoothie = "0.18"
# turndown-style HTML→Markdown. Used where the HTML is
# *already* reader-clean (Readwise Reader `html_content`,
# Karakeep `htmlContent`, dom_smoothie's cleaned-HTML
# fallback) and running full readability again would
# wrongly re-prune content.
htmd = "0.5"
# Article + subtitle-track fetches. Workspace config =
# rustls, no openssl.
reqwest = { workspace = true }
# yt-dlp `-J` probe output + json3 subtitle tracks + the
# importer API payloads (Readwise/Karakeep) are all JSON.
serde_json = { workspace = true }
# yt-dlp runs as an async subprocess (`tokio::process`) with
# a hard timeout — never let a stuck extractor wedge the CLI.
tokio = { workspace = true }

[lints]
workspace = true
