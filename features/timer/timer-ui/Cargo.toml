[package]
name = "timer-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Dumb Dioxus components for the `timer` feature.
#
# Caller hands in data + receives events. No state ownership, no Loro
# client, no WebSocket — keeps the components portable and easy to
# storybook in isolation. `task-ui` does the wiring (constructing
# `TimerRepoLoro` against a workspace-wide `CrdtDoc`, calling these
# components with the live list, dispatching `create`/`delete`/`stop`).
#
# Outside the workspace because dioxus + wasm constraints can't be
# unified with the native server build.

[dependencies]
dioxus = { workspace = true }
timer-proto.workspace = true
project-proto.workspace = true
invoice-proto.workspace = true
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
uuid = { workspace = true, features = ["v4", "js"] }
gloo-timers.workspace = true

fts-ui.workspace = true

# Web-only — used to attach a `visibilitychange` listener for the
# tab-idle detector. Gated with `#[cfg(target_arch = "wasm32")]` at
# the source level so native builds skip the call sites.
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Event",
    "EventTarget",
    "VisibilityState",
] }
