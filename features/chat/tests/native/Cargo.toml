[package]
name = "chat-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `chat-proto` contract against the Loro-backed
# `chat-crdt` using an ephemeral `CrdtDoc` (no persistence). Fast,
# no DB, no WebSocket. Use fake-rs Dummy derives via the `fake`
# feature on `chat-proto` to seed repositories deterministically.

[dependencies]
chat-proto = { workspace = true, features = ["fake"] }
chat-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
chrono.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
