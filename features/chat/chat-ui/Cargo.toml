[package]
name = "chat-ui"
version = "0.1.0"
edition = "2021"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

# Dumb Dioxus components for the `chat` feature.
#
# Caller hands in data + receives events. No state ownership, no Loro
# client, no WebSocket — keeps the components portable and easy to
# storybook in isolation. `task-ui` does the wiring (constructing
# `MessageRepoLoro` against a workspace-wide `CrdtDoc`, calling these
# components with the live list, dispatching `create`/`delete`).
#
# Outside the workspace because dioxus + wasm constraints can't be
# unified with the native server build.

[dependencies]
dioxus = { version = "0.7.9", default-features = false, features = ["lib"] }
chat-proto = { path = "../chat-proto", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
uuid = { version = "1", features = ["v4", "js"] }
