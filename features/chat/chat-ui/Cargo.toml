[package]
name = "chat-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Dumb Dioxus components for the `chat` feature.
#
# Caller hands in data + receives events. No state ownership, no Loro
# client, no WebSocket — keeps the components portable and easy to
# storybook in isolation. `task-ui` does the wiring (constructing
# `MessageRepoLoro` against a workspace-wide `CrdtDoc`, calling these
# components with the live list, dispatching `create`/`delete`).
#
# Outside the workspace because dioxus + wasm constraints can't be
# unified with the native server build.

[dependencies]
dioxus = { workspace = true }
chat-proto.workspace = true
agent-proto.workspace = true
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
uuid = { workspace = true, features = ["v4", "js"] }

fts-ui.workspace = true

# AI message body Markdown rendering. Wasm-clean — workspace dep
# disables default features so the SIMD-accel codepath (which pulls
# `getrandom` indirectly) stays out of the graph.
pulldown-cmark = { workspace = true }
serde_json.workspace = true
tracing.workspace = true

# Web-only — clipboard writes from `MessageActions` (`Copy` button).
# Gated with `#[cfg(target_arch = "wasm32")]` at the call sites so
# native builds skip them.
web-sys = { workspace = true, features = [
    "Window",
    "Navigator",
    "Clipboard",
] }
