[package]
name = "scheduling-proto"
description = "Wire contract for the scheduling feature: `#[architect::rpc] trait SchedulingService` + facet payload types covering personal day templates, cal.com-style bookable event types, availability schedules, and bookings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wasm-clean baseline (Facet types). Enable the `vox` feature to
# pull in the architect-emitted RPC client + dispatcher.
[dependencies]
facet = { workspace = true }
thiserror = { workspace = true }
architect = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[lints]
workspace = true
