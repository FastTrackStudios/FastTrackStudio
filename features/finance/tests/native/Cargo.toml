[package]
name = "finance-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `finance-proto` contract against the Loro-backed
# `finance-crdt` using an ephemeral `CrdtDoc` (no persistence). Fast,
# no DB, no WebSocket. Use fake-rs Dummy derives via the `fake`
# feature on `finance-proto` to seed repositories deterministically.

[dependencies]
finance-proto = { workspace = true, features = ["fake"] }
finance-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
