[package]
name = "finance"
description = "Finance facade: ledger + invoicing + expenses, SQLite-authoritative (see `finance-db`). One-way exports to the vault's Records sub-vault (`Records/Finance/{book}/Invoices/{year}/INV-####.md` + PDF). Carve-out from the Loro-is-truth rule — finance needs hard invariants (sum-to-zero, unique numbers, FK integrity) that CRDT LWW merges can't provide."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Native-only: the facade owns the markdown export path into the
# Records sub-vault. wasm builds use finance-proto + finance-ui.
[dependencies]
finance-proto = { workspace = true, default-features = false }
finance-db = { workspace = true }
timer-proto = { workspace = true, default-features = false }
vault = { workspace = true }
chrono = { workspace = true, features = ["clock", "std", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
