[package]
name = "finance"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `finance` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  finance-crdt + finance-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
finance-proto.workspace = true
finance-crdt = { workspace = true, optional = true }
finance-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["finance-proto/vox"]
server = ["dep:finance-crdt", "dep:finance-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["finance-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
