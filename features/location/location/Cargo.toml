[package]
name = "location"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `location` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  location-crdt + location-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
location-proto.workspace = true
location-crdt = { workspace = true, optional = true }
location-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["location-proto/vox"]
server = ["dep:location-crdt", "dep:location-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["location-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
