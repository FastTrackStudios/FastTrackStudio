[package]
name = "location-crdt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Loro-backed source-of-truth for the `location` feature.
#
# Owns the marker type that makes Rust's orphan rules cooperate
# (foreign trait + foreign type), the `EntityCrdt` impl (codec +
# id/timestamp policy + sort lookup), and the `LocationRepoLoro`
# newtype that implements the architect-emitted `LocationRepo`.
#
# All real work happens inside `LoroRepo<LocationEntity>` from
# `libs/crdt`; this crate is intentionally thin so the architect
# derive can emit it from field attributes in a future revision.

[dependencies]
location-proto.workspace = true
crdt.workspace = true
architect.workspace = true
loro.workspace = true
chrono.workspace = true
uuid.workspace = true
