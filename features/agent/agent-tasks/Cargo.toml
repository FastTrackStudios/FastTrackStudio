[package]
name = "agent-tasks"
description = "SQLite-backed implementation of `agent_proto::service::tasks::AgentTaskQueue`. Owns the queue DBs, the `AgentTaskStatus` lifecycle (including dispatcher-owned `Running` claim), and the `queue_events` tail used for live UI updates. The `agent-dispatch` crate sits on top of this and bridges task notes ↔ agent tasks; this crate is pure data + claim semantics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-proto = { workspace = true, default-features = false }
chrono = { workspace = true, features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = { workspace = true }
tracing = { workspace = true }
ulid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
