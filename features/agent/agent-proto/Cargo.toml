[package]
name = "agent-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Wire contract for the `agent` feature. Pull this crate (or the
# `agent` facade) from any consumer — wasm-clean by default.

[dependencies]
architect.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["js"] }
facet.workspace = true
thiserror.workspace = true
# `futures-core` is wasm-friendly (no executor) — pulled in for
# `BoxStream` on `ChatModel::complete_stream` without dragging the
# full `futures` crate (which includes `futures-executor`) into wasm.
futures-core = "0.3"
serde = { workspace = true, features = ["derive"] }

vox = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "architect/vox"]
server = ["architect/server-seaorm", "dep:sea-orm"]
fake = ["dep:fake", "architect/fake"]
full = ["vox", "server", "fake"]
