[package]
name = "agent-proto"
description = "Wire contract for the `agent/` feature — LLM-agent integration (Hermes, Codex CLI, Claude CLI, Pi, custom). Models projects/sessions/threads/messages/tools/approvals/kanban, plus the streaming `AgentEvent` union. Backends implement the trait by either embedding an agent in-process (hermes-webui style) or monitoring an external CLI's on-disk logs (CodexMonitor style)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
facet = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
thiserror = { workspace = true }
architect = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[lints]
workspace = true
