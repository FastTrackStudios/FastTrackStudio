[package]
name = "agent-hermes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Server-only Hermes-agent integration plugin. Implements the
# AgentIntegration trait from agent-proto. Talks HTTP + WebSocket
# to a Hermes dashboard (typically http://127.0.0.1:9119 via SSH
# tunnel, or whatever the user configures in IntegrationSettings).

[dependencies]
agent-proto = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
