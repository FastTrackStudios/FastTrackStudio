[package]
name = "agent"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `agent` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  agent-crdt + agent-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
agent-proto.workspace = true
agent-crdt = { workspace = true, optional = true }
agent-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["v4"] }
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
agent-hermes = { workspace = true }
agent-crdt = { workspace = true }
crdt = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[features]
default = []
vox = ["agent-proto/vox"]
server = [
    "dep:agent-crdt",
    "dep:agent-db",
    "dep:crdt",
    "dep:async-trait",
    "dep:chrono",
    "dep:uuid",
    "dep:tokio",
]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["agent-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
