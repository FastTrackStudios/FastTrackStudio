[package]
name = "agent-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Dumb Dioxus components for the `agent` feature.
#
# Caller hands in data + receives events. No state ownership, no Loro
# client, no WebSocket — keeps the components portable and easy to
# storybook in isolation. `task-ui` does the wiring.

[dependencies]
dioxus = { workspace = true }
agent-proto.workspace = true
chat-proto.workspace = true
chat-ui.workspace = true
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
uuid = { workspace = true, features = ["v4", "js"] }

fts-ui.workspace = true

# Web-only — used for clipboard writes from the IntegrationSettings
# card. Gated with `#[cfg(target_arch = "wasm32")]` at the call
# sites so native builds skip them.
web-sys = { workspace = true, features = [
    "Window",
    "Navigator",
    "Clipboard",
] }
