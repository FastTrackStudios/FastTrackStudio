[package]
name = "agent-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `agent-proto` contract against the Loro-backed
# `agent-crdt` using an ephemeral `CrdtDoc` (no persistence). Fast,
# no DB, no WebSocket. Use fake-rs Dummy derives via the `fake`
# feature on `agent-proto` to seed repositories deterministically.

[dependencies]
agent-proto = { workspace = true, features = ["fake"] }
agent-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
chrono.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
async-trait.workspace = true
futures-core = "0.3"
