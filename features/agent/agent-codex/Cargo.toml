[package]
name = "agent-codex"
description = "Codex agent backend — implements `agent_proto::AgentService` against the official `codex app-server` daemon. Vendors CodexMonitor's `app_server.rs` + sibling modules (events, process_core, codex/args) under `vendor/`; the wrapper at `src/` bridges its `WorkspaceSession` + `EventSink` surface to our trait, types, and broadcast channels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-proto = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
