[package]
name = "cookbook"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `cookbook` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  cookbook-crdt + cookbook-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
cookbook-proto.workspace = true
cookbook-crdt = { workspace = true, optional = true }
cookbook-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["cookbook-proto/vox"]
server = ["dep:cookbook-crdt", "dep:cookbook-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["cookbook-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
