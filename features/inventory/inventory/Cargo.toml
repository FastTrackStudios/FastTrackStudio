[package]
name = "inventory"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `inventory` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  inventory-crdt + inventory-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
inventory-proto.workspace = true
inventory-crdt = { workspace = true, optional = true }
inventory-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["inventory-proto/vox"]
server = ["dep:inventory-crdt", "dep:inventory-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["inventory-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
