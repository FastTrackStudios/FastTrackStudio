[package]
name = "inventory"
description = "Inventory feature — typed view of gear/equipment pages in a `vault::Vault`. Items are markdown files with YAML frontmatter (`type: item`) recording name, category, location, condition, status, repair tasks, and freeform notes. Each item references locations by id (see the `locations` crate) so renames don't break links. Provides parse / serialize / scan plus an `#[architect::rpc] trait InventoryService` for agent integrations over vox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
vault = { workspace = true }
locations = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[dev-dependencies]
tempfile = "3"
