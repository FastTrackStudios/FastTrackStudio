[package]
name = "inventory-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `inventory-proto` contract against the Loro-backed
# `inventory-crdt` using an ephemeral `CrdtDoc` (no persistence). Fast,
# no DB, no WebSocket. Use fake-rs Dummy derives via the `fake`
# feature on `inventory-proto` to seed repositories deterministically.

[dependencies]
inventory-proto = { workspace = true, features = ["fake"] }
inventory-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
