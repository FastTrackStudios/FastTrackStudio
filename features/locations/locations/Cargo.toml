[package]
name = "locations"
description = "Locations feature — typed view of place pages in a `vault::Vault`. Locations are markdown files with YAML frontmatter (`type: location`) describing a studio, room, storage spot, or venue. Provides parse / serialize / scan over the vault, plus an `#[architect::rpc] trait LocationsService` so agents reach the same surface over vox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
vault = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
# Pull architect's vox emission for `LocationsService` so the
# generated client + dispatcher + service bridge are available
# for agent integrations. Native impls compile fine without it.
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
