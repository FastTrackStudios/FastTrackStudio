[package]
name = "calendar"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `calendar` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence (pulls
#                  calendar-crdt + calendar-db together — they're paired)
#   server-axum    architect::axum_ws helpers, re-exported here
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
calendar-proto.workspace = true
calendar-crdt = { workspace = true, optional = true }
calendar-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["calendar-proto/vox"]
server = ["dep:calendar-crdt", "dep:calendar-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["calendar-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
