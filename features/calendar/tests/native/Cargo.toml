[package]
name = "calendar-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `calendar-proto` contract against the Loro-backed
# `calendar-crdt` using an ephemeral `CrdtDoc` (no persistence). Fast,
# no DB, no WebSocket. Use fake-rs Dummy derives via the `fake`
# feature on `calendar-proto` to seed repositories deterministically.

[dependencies]
calendar-proto = { workspace = true, features = ["fake"] }
calendar-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
architect = { workspace = true, features = ["fake"] }
fake.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
