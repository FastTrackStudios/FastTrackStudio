[package]
name = "task"
description = "First-party task feature for Task. `TaskInfo` is an `architect::Entity` — markdown frontmatter at `tasks/<slug>.md` is the source of truth today (TaskNotes-shape so Obsidian vaults round-trip); SeaORM Model emitted under `--features server`. Parser backfills `id: Uuid` for legacy task pages that don't have one yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
architect = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
indexmap = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
workflows-proto.workspace = true
# `VaultPage` lives in vault-proto (wasm-clean wire shape). The
# parser consumes the proto shape so it works everywhere; the
# richer `vault::Vault` (filesystem walker) is server-only and
# sits behind a non-wasm gate below.
vault-proto = { workspace = true, default-features = false }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { version = "4", optional = true, features = ["derive", "chrono", "uuid"] }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]
server = ["architect/server-seaorm", "dep:sea-orm"]
fake = ["dep:fake", "architect/fake", "workflows-proto/fake"]
full = ["vox", "server", "fake"]

# `vault::Vault` is server-only (it walks std::fs and pulls
# tokio-net transitively). The wasm UI imports task's wire types
# + RPC client (model / parse / service) without touching the
# scanner / writer / backend, so vault sits behind a non-wasm
# gate to keep it out of the wasm crate graph. Mirrors `project`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vault = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
