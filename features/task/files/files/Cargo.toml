[package]
name = "files"
description = "Files feature server-side backend (issue #259/ADR 0001): `FilesBackend` implements `files-proto`'s `FilesService` over `task-files-version-store`'s jj-lib-on-CAS engine — create a File Root from an existing folder (marker file + stable id), browse its live tree, derive a file's version chain, and trigger a Session checkpoint on demand."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
architect = { workspace = true }
files-proto = { workspace = true, features = ["vox"] }
task-files-version-store = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true, features = ["clock", "serde"] }
gix = { workspace = true }
jj-lib = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
vox = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
architect = { workspace = true, features = ["local"] }

[lints]
workspace = true
