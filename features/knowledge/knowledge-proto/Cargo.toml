[package]
name = "knowledge-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Wire contract for the `knowledge` feature — an Obsidian-compatible
# PKM/outliner. Wasm-clean by default; the vault-obsidian helpers
# (parse/serialize markdown) are pure functions with no Loro/Repo
# dependency so they can be reused from sync + UI crates.

[dependencies]
architect.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["js", "serde"] }
facet.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serde_yaml.workspace = true
indexmap = { workspace = true, features = ["serde"] }
regex.workspace = true

vox = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "architect/vox"]
server = ["architect/server-seaorm", "dep:sea-orm"]
fake = ["dep:fake", "architect/fake"]
full = ["vox", "server", "fake"]
