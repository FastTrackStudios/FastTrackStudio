[package]
name = "knowledge-tests-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Drives the `knowledge-proto` contract against the Loro-backed
# `knowledge-crdt` using an ephemeral `CrdtDoc`. Round-trip per
# entity; no DB, no WebSocket.

[dependencies]
knowledge-proto.workspace = true
knowledge-crdt.workspace = true
crdt.workspace = true
loro.workspace = true
chrono.workspace = true
architect.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
