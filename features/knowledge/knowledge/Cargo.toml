[package]
name = "knowledge"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `knowledge` feature.
#
#   default        wire types only (wasm-clean client baseline)
#   vox            #[vox::service] surface + dispatcher/client
#   server         CRDT source of truth + SeaORM persistence
#   server-axum    architect::axum_ws helpers
#   fake           #[derive(Dummy)] on every emitted wire struct
#   full           everything above

[dependencies]
knowledge-proto.workspace = true
knowledge-crdt = { workspace = true, optional = true }
knowledge-db = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["knowledge-proto/vox"]
server = ["dep:knowledge-crdt", "dep:knowledge-db", "dep:crdt"]
server-axum = ["dep:architect", "architect/server-axum"]
fake = ["knowledge-proto/fake"]
full = [
    "vox",
    "server",
    "server-axum",
    "fake",
]
