[package]
name = "knowledge-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# v1.5a live-preview outliner editor for the `knowledge` feature.
# Span-level live preview: the caret-containing span shows raw
# markdown; everything else stays rendered. Block-level constructs
# (headings, code, callouts) flip block-wide on focus.
#
# Dumb-components rule applies: callers hand in `Block`s + receive
# patch events. No Loro client, no service wiring; `task-ui` builds
# the runtime around it.

[dependencies]
dioxus = { workspace = true }
knowledge-proto.workspace = true
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
uuid = { workspace = true, features = ["v4", "js"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
fts-ui.workspace = true

# Used by `canvas::agent_diagram` (pure layout helper turning runs +
# tasks into whiteboard Blocks). No UI types from these crates are
# referenced — proto-only.
agent-proto.workspace = true
project-proto.workspace = true

regex.workspace = true
nucleo-matcher.workspace = true
indexmap = { workspace = true, features = ["serde"] }
tracing.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "Range",
    "Selection",
    "DomRect",
    "DomStringMap",
    "HtmlElement",
    "InputEvent",
    "KeyboardEvent",
    "MouseEvent",
    "Event",
    "EventTarget",
    "Navigator",
    "Clipboard",
    "NodeList",
] }
wasm-bindgen.workspace = true
js-sys.workspace = true
