[package]
name = "knowledge-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Read-only Obsidian-vault importer. Walks a directory, parses
# markdown / canvas / base files via knowledge_proto::obsidian helpers,
# and produces in-memory entities suitable for inserting into the Loro
# repos. Server-only — never enters the wasm graph; write-back to disk
# is deferred so we don't risk corrupting user files in v1.

[dependencies]
knowledge-proto.workspace = true
knowledge-crdt.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
uuid = { workspace = true, features = ["v4"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
walkdir = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile = "3"
