[package]
name = "knowledge-crdt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Loro-backed source-of-truth for the `knowledge` feature.
#
# Six entity types, six `EntityCrdt` impls, six `*RepoLoro`
# newtypes. Roots: `knowledge_vaults`, `knowledge_folders`,
# `knowledge_pages`, `knowledge_blocks`, `knowledge_tags`,
# `knowledge_bases` (prefixed to avoid colliding with any other
# feature's CRDT root name).
#
# `Block.content` is stored as a plain Loro string (LWW per write).
# FUTURE: upgrade to `LoroText` for character-level CRDT merges.

[dependencies]
knowledge-proto.workspace = true
crdt.workspace = true
architect.workspace = true
loro.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
