[package]
name = "foo"
version.workspace = true
edition.workspace = true

# Facade — single import root for the `foo` feature.

[dependencies]
foo-proto.workspace = true
foo-memory = { workspace = true, optional = true }
architect = { workspace = true, optional = true }

[features]
default = []
vox = ["foo-proto/vox"]
server-seaorm = ["foo-proto/server"]
server-axum = ["dep:architect", "architect/server-axum"]
backend-memory = ["dep:foo-memory"]
full = [
    "vox",
    "server-seaorm",
    "server-axum",
    "backend-memory",
]
