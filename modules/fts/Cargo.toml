[package]
name = "fts"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "FastTrackStudio core modules - setlist, lyrics, chords, naming conventions, and templates"

[dependencies]
# Core dependencies
# TODO: Re-enable when rig-control roam service issues are fixed
# rig-control = {workspace = true, optional = true}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2.0.17"
uuid = { version = "1.0", features = ["v4", "v5", "serde", "js"] }
tracing = { workspace = true }
regex = "1.0"
once_cell = "1.20"
nucleo-matcher = "0.3"
chrono = { workspace = true }
splitty = "1.0.2"
colored = "2.1"

# Workspace dependencies
daw = { path = "../../modules/daw" }
keyflow = { path = "../../packages/keyflow" }

# Roam RPC framework
roam = { workspace = true }
facet = { workspace = true }

# Common async dependencies (used by reaper and iroh features)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1.0"
async-trait = "0.1"
# Native-only: tokio with rt for spawn (optional full features for iroh)
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }

# IROH/IRPC dependencies (optional)
irpc = { workspace = true, optional = true }
irpc-iroh = { version = "0.11.0", optional = true }
iroh = { version = "0.95", features = ["discovery-local-network"], optional = true }
rxrust = { workspace = true, optional = true }

# WASM: tokio with minimal features (no runtime) + async-channel for broadcast + gloo-timers for sleep
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["sync"], optional = true }
async-channel = "2.0"
gloo-timers = { version = "0.3", features = ["futures"] }

# Dioxus integration (optional)
[dependencies.dioxus]
workspace = true
optional = true
default-features = true

# RPP file parsing (optional)
[features]
default = []
reaper = ["dep:reaper-high", "dep:reaper-medium", "dep:reaper-low", "dep:enumflags2", "dep:fragile"]
rpp = ["dep:rpp-parser"]
# TODO: Re-enable rig-control when roam service issues are fixed
# dioxus = ["dep:dioxus", "rig-control/dioxus"]
dioxus = ["dep:dioxus"]
iroh = ["daw/iroh", "dep:irpc", "dep:irpc-iroh", "dep:iroh", "dep:rxrust"]
full = ["reaper", "rpp", "iroh"]

[dependencies.rpp-parser]
version = "0.1"
optional = true

# Thread-safety wrapper for main-thread-only types (reaper feature)
[dependencies.fragile]
version = "2.0"
optional = true

# REAPER dependencies (optional, enabled by reaper feature)
[dependencies.reaper-high]
workspace = true
optional = true

[dependencies.reaper-medium]
workspace = true
optional = true

[dependencies.reaper-low]
workspace = true
optional = true

[dependencies.enumflags2]
version = "0.7"
optional = true

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
colored = "2.1"
reqwest = { version = "0.11", features = ["json"] }

[lints.rust]
unsafe_code = "allow"  # Required for low-level REAPER API calls in reaper feature
unused = { level = "allow", priority = -1 }

