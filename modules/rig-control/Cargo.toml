[package]
name = "rig-control"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "FastTrackStudio rig control — core data types and gapless module engine"

[dependencies]
uuid = { version = "1.0", features = ["v4", "v5", "js"] }
facet = { workspace = true }
roam = { workspace = true }
async-trait = "0.1.89"
tokio = { version = "1", features = ["time"] }

# UI dependencies (optional, enabled with "dioxus" feature)
dioxus = { workspace = true, features = ["router"], optional = true }
dioxus-router = { version = "0.7", optional = true }
lucide-dioxus = { version = "2.44", features = ["all-icons"], optional = true }
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0", optional = true }
nucleo-matcher = { version = "0.3", optional = true }
tracing = { workspace = true, optional = true }
web-sys = { version = "0.3", features = ["Window", "ResizeObserver", "Element", "CssStyleDeclaration", "HtmlElement", "Document", "MouseEvent", "WheelEvent", "DomRect"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-timer = { version = "0.2", optional = true }
paste = { version = "1.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[features]
default = []
dioxus = [
    "dep:dioxus",
    "dep:dioxus-router",
    "dep:lucide-dioxus",
    "dep:lumen-blocks",
    "dep:nucleo-matcher",
    "dep:tracing",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:wasm-timer",
    "dep:paste",
]

[lints]
workspace = true
