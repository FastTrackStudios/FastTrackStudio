[package]
name = "ui"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-router = "0.7"
lucide-dioxus = { version = "2.44", features = ["all-icons"] }
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
audio-controls = { path = "../../modules/audio-controls" }
fts = { path = "../../modules/fts", features = ["dioxus"] }
daw = { path = "../../modules/daw" }
roam = { workspace = true }
keyflow = { path = "../../packages/keyflow" }
wasm-timer = "0.2"
uuid = { version = "1.0", features = ["v4"] }
nucleo-matcher = "0.3"
tracing = { workspace = true }
web-sys = { version = "0.3", features = ["Window", "ResizeObserver", "Element", "CssStyleDeclaration", "HtmlElement", "Document", "MouseEvent", "WheelEvent", "DomRect"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[features]
default = []
server = ["dioxus/server", "dioxus/fullstack"]

[lints]
workspace = true
