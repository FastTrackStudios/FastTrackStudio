[package]
name = "actions"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Action definitions and ActionGroup trait for FastTrackStudio"

[features]
default = []
# Enable roam service for remote action execution
roam = ["dep:roam", "dep:facet"]

[dependencies]
# Core
thiserror = "2.0"

# Optional roam integration
roam = { workspace = true, optional = true }
facet = { workspace = true, optional = true }

[lints]
workspace = true
