[package]
name = "host-client"
version = "0.1.0"
edition = "2021"
description = "Shared library for connecting to FastTrackStudio hosts"

[dependencies]
# Roam RPC framework
roam.workspace = true
roam-session.workspace = true
roam-local.workspace = true
roam-websocket.workspace = true
roam-stream.workspace = true
roam-wire.workspace = true

# Protocols
daw-proto.workspace = true
gateway-proto.workspace = true
host-manager-proto.workspace = true

# Serialization
facet.workspace = true
facet-postcard.workspace = true

# Async runtime
tokio = { workspace = true, features = ["net", "sync"] }
futures.workspace = true

# Error handling
thiserror.workspace = true
eyre.workspace = true

# Logging
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-specific: tokio runtime features and WebSocket
tokio = { workspace = true, features = ["time"] }
tokio-tungstenite = "0.26"
