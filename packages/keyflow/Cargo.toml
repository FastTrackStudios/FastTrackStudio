[package]
name = "keyflow"
version.workspace = true
edition.workspace = true
description = "Music theory, chord parsing, and optional GPU-based music notation rendering"

[features]
default = []
# Syntax highlighting for Keyflow notation using the parser's AST spans
highlighting = []
# Engraver feature: GPU-accelerated music notation rendering
engraver = [
    "dep:wgpu",
    "dep:vello",
    "dep:kurbo",
    "dep:parley",
    "dep:skrifa",
    "dep:smufl",
    "dep:lyon",
    "dep:bytemuck",
    "dep:bitflags",
    "dep:serde_json",
    "dep:thiserror",
    "dep:macro_rules_attribute",
    "dep:printpdf",
    "dep:svg2pdf",
    "dep:usvg",
    "dep:pdf-writer",
    "dep:lopdf",
]
# Example feature: adds windowing for running examples
engraver-example = ["engraver", "dep:winit", "dep:pollster", "dep:env_logger", "dep:log"]
# MIDI file import
midi-import = ["engraver", "dep:midly"]

[dependencies]
# Core dependencies
tracing = "0.1"
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
colored = "3.0"
regex = "1.11.3"
derive_more = { version = "1.0", features = ["debug", "display", "from", "error"] }

# GPU rendering (optional, for engraver feature)
# Use wgpu 26 to match anyrender/blitz
wgpu = { version = "26", features = ["wgsl"], optional = true }

# Linebender stack for 2D vector graphics (versions matched to vello 0.6)
vello = { version = "0.6", optional = true }
kurbo = { version = "0.12", optional = true }
# Use parley without default features to avoid fontique's system feature on WASM
parley = { version = "0.2", optional = true, default-features = false, features = ["std"] }
skrifa = { version = "0.26", optional = true }

# SMuFL music font metadata
smufl = { version = "0.2", optional = true }

# 2D tessellation for Canvas2D
lyon = { version = "1.0", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
bitflags = { version = "2.4", features = ["serde"], optional = true }

# JSON serialization (for engraver styles)
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

# Derive macros for engraver
macro_rules_attribute = { version = "0.2", optional = true }

# PDF export (optional, WASM compatible)
# Enable png feature for image embedding
printpdf = { version = "0.8", optional = true, features = ["png"] }

# SVG to PDF conversion (WASM compatible with proper features)
# Use usvg's re-exported fontdb to avoid version conflicts
svg2pdf = { version = "0.13", optional = true }
usvg = { version = "0.45", optional = true, default-features = false, features = ["text"] }
# PDF writing (used for multi-page PDF merging, matches svg2pdf's version)
pdf-writer = { version = "0.12", optional = true }
# PDF parsing and merging (for combining multiple PDFs into one)
lopdf = { version = "0.36", optional = true }

# MIDI file parsing (optional)
midly = { version = "0.5", optional = true }

# Example dependencies (optional)
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }

# DAW and facet (WASM compatible)
daw = { path = "../../modules/daw" }
facet = { workspace = true }
helgoboss-midi = "0.4.0"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.0", features = ["serde", "v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }
# WASM wgpu needs webgpu/webgl features (unified with main wgpu dep)
wgpu = { version = "26", features = ["wgsl", "webgpu", "webgl"], optional = true }

# Non-WASM dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
pollster = "0.4"

[[bin]]
name = "debug-keyflow"
path = "src/bin/debug_keyflow.rs"
required-features = ["engraver"]

[[example]]
name = "reckless_love"
path = "examples/simple/reckless_love.rs"

[[example]]
name = "build_my_life"
path = "examples/simple/build_my_life.rs"

[[example]]
name = "all_along_the_watchtower"
path = "examples/intermediate/all_along_the_watchtower.rs"

[[example]]
name = "well_jacob_collier"
path = "examples/intermediate/well_jacob_collier.rs"

[[example]]
name = "music_symbols"
required-features = ["engraver-example"]

[[example]]
name = "canvas_shapes"
required-features = ["engraver-example"]

[[example]]
name = "canvas_sdf"
required-features = ["engraver-example"]

[[example]]
name = "layout_demo"
required-features = ["engraver-example"]

[[example]]
name = "snippet_viewer"
required-features = ["engraver-example"]

[[example]]
name = "rhythm_equivalence_viewer"
required-features = ["engraver-example"]

[[example]]
name = "rhythm_test_viewer"
required-features = ["engraver-example"]

[[example]]
name = "highlighting_demo"
required-features = ["highlighting"]

# Tests that require specific features
[[test]]
name = "021_midi_import_thriller"
required-features = ["midi-import"]

[lints]
workspace = true
