[package]
name = "engraver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WGPU-based music notation renderer and editor"

[lib]
name = "engraver"
path = "src/lib.rs"

[features]
default = []
example = ["dep:winit", "dep:pollster", "dep:env_logger", "dep:log"]
keyflow-import = ["dep:keyflow"]

[dependencies]
# Internal dependencies (optional - keyflow import is being reworked)
keyflow = { path = "../keyflow", optional = true }

# GPU rendering (use wgpu 26 to match anyrender/blitz)
wgpu = { version = "26", features = ["wgsl"] }

# Linebender stack for 2D vector graphics (versions matched to vello 0.6)
# NOTE: peniko re-exported from vello to avoid version conflicts
vello = "0.6"
kurbo = "0.12"
parley = "0.2"
skrifa = "0.26"

# SMuFL music font metadata
smufl = "0.2"

# 2D tessellation for Canvas2D
lyon = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
bitflags = { version = "2.4", features = ["serde"] }

# Utility
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Error handling and derive macros (architectural rewrite)
derive_more = { version = "1.0", features = ["debug", "display", "error", "from"] }
macro_rules_attribute = "0.2"

# Example dependencies (optional)
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
pollster = "0.4"

[[example]]
name = "music_symbols"
required-features = ["example"]

[[example]]
name = "canvas_shapes"
required-features = ["example"]

[[example]]
name = "canvas_sdf"
required-features = ["example"]

[[example]]
name = "layout_demo"
required-features = ["example"]

[lints]
workspace = true
