[package]
name = "engraver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WGPU-based music notation renderer and editor"

[lib]
name = "engraver"
path = "src/lib.rs"

[features]
default = []
example = ["dep:winit", "dep:pollster", "dep:env_logger", "dep:log"]

[dependencies]
# Internal dependencies
keyflow = { path = "../keyflow" }

# GPU rendering (use wgpu 27 to match vello 0.7)
wgpu = { version = "27", features = ["wgsl"] }

# Text rendering (wgpu 27 compatible)
glyphon = "0.10"

# Linebender stack for 2D vector graphics (versions matched to vello 0.7)
vello = "0.7"
peniko = "0.6"
kurbo = "0.13"
parley = "0.3"
skrifa = "0.40"

# SMuFL music font metadata
smufl = "0.2"

# 2D tessellation for Canvas2D
lyon = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
bitflags = { version = "2.4", features = ["serde"] }

# Utility
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Example dependencies (optional)
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
pollster = "0.4"

[[example]]
name = "music_symbols"
required-features = ["example"]

[[example]]
name = "canvas_shapes"
required-features = ["example"]

[[example]]
name = "canvas_sdf"
required-features = ["example"]

[[example]]
name = "layout_demo"
required-features = ["example"]

[lints]
workspace = true
