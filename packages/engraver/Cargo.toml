[package]
name = "engraver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WGPU-based music notation renderer and editor"

[lib]
name = "engraver"
path = "src/lib.rs"

[features]
default = []
example = ["dep:winit", "dep:pollster", "dep:env_logger", "dep:log"]

[dependencies]
# Internal dependencies
keyflow = { path = "../keyflow" }

# GPU rendering (use wgpu 26 to match blitz/anyrender ecosystem)
wgpu = { version = "26", features = ["wgsl"] }

# Text rendering (use wgpu 26 compatible commit)
glyphon = { git = "https://github.com/grovesNL/glyphon", rev = "d4ded1d1309f867b7b613ca91ebd0d1fb1a8b280" }

# Linebender stack for 2D vector graphics (for future use)
vello = "0.4"
peniko = "0.3"
kurbo = "0.11"
parley = "0.3"
skrifa = "0.28"

# SMuFL music font metadata
smufl = "0.2"

# 2D tessellation for Canvas2D
lyon = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }

# Utility
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Example dependencies (optional)
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
pollster = "0.4"

[[example]]
name = "music_symbols"
required-features = ["example"]

[[example]]
name = "canvas_shapes"
required-features = ["example"]

[[example]]
name = "canvas_sdf"
required-features = ["example"]

[lints]
workspace = true
