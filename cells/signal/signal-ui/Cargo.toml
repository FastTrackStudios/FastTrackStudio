[package]
name = "signal-ui"
description = "Signal rig control — Dioxus UI components, hooks, and context providers"
version.workspace = true
edition.workspace = true

[dependencies]
signal-control = { path = "../signal-control" }
audio-controls = { path = "../audio-controls" }
uuid = { version = "1.0", features = ["v4"] }
serde = { workspace = true }
serde_json = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
signal-storage = { path = "../signal-storage" }

# UI framework (conditional on feature)
dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }

# Icons
lucide-dioxus = { version = "2.44", features = ["all-icons"], optional = true }

# Fuzzy search for preset browser
nucleo-matcher = { version = "0.3", optional = true }

# Logging
tracing = { workspace = true, optional = true }

# ROAM for Rx<T> channel type (used by SignalControl::subscribe)
roam.workspace = true
tokio = { version = "1", features = ["time"] }

[features]
default = ["web"]
web = ["dep:dioxus", "dep:lucide-dioxus", "dep:nucleo-matcher", "dep:tracing", "audio-controls/web"]
native = ["dep:dioxus-native", "dep:lucide-dioxus", "dep:nucleo-matcher", "dep:tracing", "audio-controls/native"]

[lints]
workspace = true
