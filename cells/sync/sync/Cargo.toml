[package]
name = "sync"
description = "Sync cell — OAuth2 authentication, token management, and sync services"
version.workspace = true
edition = "2024"

[dependencies]
sync-proto = { path = "../sync-proto" }
signal-storage = { path = "../../signal/signal-storage" }
async-trait = "0.1"
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json.workspace = true
oauth2 = "5"
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "linux-native"] }
url = "2"
sea-orm = { version = "1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

[lints]
workspace = true
