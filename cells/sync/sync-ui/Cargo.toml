[package]
name = "sync-ui"
description = "Sync UI — Dioxus components for auth settings and sync status"
version.workspace = true
edition = "2024"

[dependencies]
sync-proto = { path = "../sync-proto" }
uuid = { version = "1", features = ["v4"] }
tracing = { workspace = true, optional = true }

# Conditional UI framework
dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dep:dioxus", "dep:tracing"]
native = ["dep:dioxus-native", "dep:tracing"]

[lints]
workspace = true
