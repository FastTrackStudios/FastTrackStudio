[package]
name = "frame-ui"
description = "Frame UI — Dioxus components for Figma-compatible design rendering"
version.workspace = true
edition.workspace = true

[dependencies]
frame-proto = { path = "../frame-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

# UI framework (conditional on feature)
dioxus = { workspace = true, optional = true, features = ["desktop"] }
dioxus-native = { workspace = true, optional = true }
anyrender = { workspace = true, optional = true }
anyrender_svg = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
skrifa = { version = "0.26", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["web"]
web = ["dep:dioxus"]
native = ["dep:dioxus-native"]
anyrender = ["dep:anyrender", "dep:anyrender_svg", "dep:kurbo", "dep:peniko", "dep:skrifa", "dep:base64"]

[lints]
workspace = true
