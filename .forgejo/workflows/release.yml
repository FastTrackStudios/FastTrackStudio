# Releases — cargo-rail's changesets-style flow, dispatch-driven.
#
# Day-to-day: PRs record release intent as change files (.changes/*.md,
# `cargo rail change add <crate> --bump <level> -m "..."`). On release
# day, dispatch this workflow:
#
#   mode=check    read-only release plan: bumps, causes, changelog
#                 sections, publish order, skips. ALWAYS start here.
#   mode=pr       open a release PR (bumps + changelogs + lockfile;
#                 no tags, no publish). Review, merge, then...
#   mode=finalize tag + push + publish in dependency order, from
#                 updated main.
#
# Notes:
#   - `--bump auto` precedence: change files > conventional commits >
#     dependency updates. Crates with nothing release-worthy are
#     skipped with the reason recorded.
#   - rail's forge-release integration supports GitHub (gh) / GitLab
#     (glab), NOT Forgejo yet — create_github_release=false in
#     rail.toml; tags land on the forge via plain git push.
#   - Publishing to crates.io needs CARGO_REGISTRY_TOKEN in the org
#     runner secrets once we start publishing packages.
#   - Full-history checkout is REQUIRED: --bump auto refuses shallow
#     clones (missing tags mean wrong answers).

name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only plan) | pr (open release PR) | finalize (tag + publish)"
        required: true
        default: "check"

concurrency:
  group: release
  cancel-in-progress: false

env:
  FTS_CI: /var/lib/gitea-runner/codeberg-org/fts-ci
  CARGO_TARGET_DIR: /var/lib/gitea-runner/codeberg-org/fts-ci/target
  CARGO_HOME: /var/lib/gitea-runner/codeberg-org/fts-ci/cargo-home
  FTS_LOCAL_REPO: /run/media/Development/FastTrackStudio

jobs:
  release:
    runs-on: nix-host
    steps:
      - name: Checkout (local-first, full history + tags)
        run: |
          set -eu
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          sha="${GITHUB_SHA:-}"
          if [ -n "$FTS_LOCAL_REPO" ]; then
            git config --global --add safe.directory "$FTS_LOCAL_REPO" 2>/dev/null || true
            git config --global --add safe.directory "$FTS_LOCAL_REPO/.git" 2>/dev/null || true
          fi
          git clone --quiet "$FTS_LOCAL_REPO" . || git clone "$url" .
          git fetch --tags "$url" 2>/dev/null || true
          if [ -n "$sha" ] && git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            git checkout --quiet --detach "$sha"
          fi
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Release (${{ github.event.inputs.mode }})
        run: |
          set -eu
          mode="${{ github.event.inputs.mode }}"
          case "$mode" in
            check)
              nix develop .#ci -c cargo rail change status || true
              nix develop .#ci -c cargo rail release run --all --bump auto --check
              ;;
            pr)
              nix develop .#ci -c cargo rail release run --all --bump auto --pr --yes
              ;;
            finalize)
              nix develop .#ci -c cargo rail release finalize --all --yes
              ;;
            *)
              echo "unknown mode: $mode" >&2; exit 1
              ;;
          esac
