# Container images — pure-Nix OCI builds, pushed to the in-cluster LAN
# registry on every push to dev and main. No Docker daemon, no buildx.
#
#   dev  -> registry.starcommand.live:30050/task-{server,web,ui-lab}:dev    + :sha-<short>
#   main -> registry.starcommand.live:30050/task-{server,web,ui-lab}:latest + :sha-<short>
#
# ArgoCD deploys these via deploy/chart/task (targetRevision dev/main).
#
# How the images are built:
#   * Each image is `pkgs.dockerTools.streamLayeredImage` in flake.nix —
#     it builds an *executable* that streams a docker-archive tarball to
#     stdout. We pipe that straight into skopeo. No Docker, no buildx, no
#     BuildKit, no Dockerfiles. The image builds produce the web/ui-lab
#     bundles themselves (task-webapp's dx build + ui-lab's pnpm/vite are
#     nix derivations), so there is NO separate bundle step here.
#
# Runner assumptions (verify on your runner before trusting a green check):
#   * runs-on: nix-host — THEBATTLESHIP's runner carries this HOST-mode
#     label. `nix` is on PATH; the host resolves
#     registry.starcommand.live:30050 to the in-cluster registry (LAN,
#     10.10.10.1 via /etc/hosts) and trusts it as an insecure plain-HTTP
#     registry. skopeo is run via `nix run nixpkgs#skopeo`.
#   * The registry is UNAUTHENTICATED — no login step, no secrets.
#   * Every formerly-sibling dependency is a rev-pinned Codeberg git dep;
#     cargo (under crane) fetches them itself. The build needs network
#     access to fetch git deps.
name: images
on:
  push:
    branches: [dev, main]

env:
  REGISTRY: registry.starcommand.live:30050

jobs:
  images:
    runs-on: nix-host
    # Self-hosted runner: it holds a working copy of Task. Check out
    # from there when it has the triggering commit (offline, instant),
    # else a retried shallow clone from the forge — codeberg's git
    # transfers intermittently reset and actions/checkout has no retry.
    # This is only how CI gets THE SOURCE; the dependency graph is pure
    # rev-pinned codeberg git deps (cargo fetches them, cached).
    env:
      TASK_LOCAL_REPO: /run/media/Development/Task
    steps:
      - name: Checkout
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          branch="${GITHUB_REF_NAME:-dev}"
          sha="${GITHUB_SHA:-}"
          if [ -n "$TASK_LOCAL_REPO" ] && [ -d "$TASK_LOCAL_REPO/.git" ] \
              && [ -n "$sha" ] \
              && git -C "$TASK_LOCAL_REPO" cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "local checkout @ ${sha} (from $TASK_LOCAL_REPO)"
            git clone --quiet "$TASK_LOCAL_REPO" .
            git checkout --quiet --detach "$sha"
          else
            attempt=1
            until git clone --depth 1 --no-tags --branch "$branch" "$url" .; do
              [ "$attempt" -ge 8 ] && { echo "clone failed after 8 attempts"; exit 1; }
              echo "clone attempt $attempt failed — retrying in 15s"
              find . -mindepth 1 -delete 2>/dev/null || true
              attempt=$((attempt + 1)); sleep 15
            done
            if [ -n "$sha" ] && [ "$(git rev-parse HEAD)" != "$sha" ]; then
              attempt=1
              until git fetch --depth 1 --no-tags origin "$sha"; do
                [ "$attempt" -ge 8 ] && { echo "fetch sha failed"; exit 1; }
                echo "fetch attempt $attempt failed — retrying in 15s"
                attempt=$((attempt + 1)); sleep 15
              done
              git checkout --detach "$sha"
            fi
          fi
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Compute tags
        id: tags
        run: |
          short="$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then channel=latest; else channel=dev; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$short" >> "$GITHUB_OUTPUT"
          echo "tags: $channel sha-$short"

      # ── Image builds + pushes ──────────────────────────────────────
      #
      # For each image: build the streamLayeredImage executable, run it
      # to stream a docker-archive to stdout, and pipe that into skopeo,
      # which copies it to the insecure plain-HTTP registry under both
      # the channel tag (dev/latest) and the immutable sha-<short> tag.
      #
      # `nix build .#<image>` yields the streamer script in $out (it is
      # the default output, runnable directly). We --print-out-paths it,
      # execute it, and a single skopeo `copy` reads the archive once and
      # writes both tags in one shot via additional-tag.

      - name: Push task-server
        run: |
          streamer="$(nix build .#task-server-image --no-link --print-out-paths)"
          "$streamer" | nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-tls-verify=false \
            --additional-tag "task-server:${{ steps.tags.outputs.sha }}" \
            docker-archive:/dev/stdin \
            "docker://${REGISTRY}/task-server:${{ steps.tags.outputs.channel }}"

      - name: Push task-web
        run: |
          streamer="$(nix build .#task-web-image --no-link --print-out-paths)"
          "$streamer" | nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-tls-verify=false \
            --additional-tag "task-web:${{ steps.tags.outputs.sha }}" \
            docker-archive:/dev/stdin \
            "docker://${REGISTRY}/task-web:${{ steps.tags.outputs.channel }}"

      - name: Push task-ui-lab
        run: |
          streamer="$(nix build .#task-ui-lab-image --no-link --print-out-paths)"
          "$streamer" | nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-tls-verify=false \
            --additional-tag "task-ui-lab:${{ steps.tags.outputs.sha }}" \
            docker-archive:/dev/stdin \
            "docker://${REGISTRY}/task-ui-lab:${{ steps.tags.outputs.channel }}"
