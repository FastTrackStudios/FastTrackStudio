# Container images — builds + pushes task-server / task-web /
# task-ui-lab to the Codeberg registry on every push to dev and main.
#
#   dev  -> codeberg.org/fasttrackstudios/task-{server,web,ui-lab}:dev    + :sha-<short>
#   main -> codeberg.org/fasttrackstudios/task-{server,web,ui-lab}:latest + :sha-<short>
#
# ArgoCD deploys these via deploy/chart/task (targetRevision dev/main).
#
# Runner assumptions (header per deploy/README.md — verify on your
# runner before trusting a green check):
#   * runs-on: nix-host — THEBATTLESHIP's codeberg-org runner carries
#     this HOST-mode label (a deliberate, documented relaxation of its
#     docker-only sandbox for org repos; see the runner's nix config).
#   * `nix` is available for the dev-shell wasm build, `docker` (with
#     buildx/BuildKit) for image builds + pushes.
#   * The workspace path-depends on sibling repos; the clone step
#     materializes them NEXT TO the checkout from the pins in
#     deploy/docker/siblings.lock. If a pin is not pushed to its
#     remote yet the build fails fast there — push the sibling first.
#   * Secrets REGISTRY_USER / REGISTRY_TOKEN must be set in the repo's
#     Actions secrets: a Codeberg user (or org bot) + an access token
#     with package:write scope.
name: images
on:
  push:
    branches: [dev, main]

jobs:
  images:
    runs-on: nix-host
    steps:
      - uses: actions/checkout@v4

      - name: Sibling checkouts (workspace path deps)
        run: bash deploy/docker/siblings.sh clone "$(dirname "$PWD")"

      - name: Compute tags
        id: tags
        run: |
          short="$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then channel=latest; else channel=dev; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$short" >> "$GITHUB_OUTPUT"
          echo "tags: $channel sha-$short"

      - name: Build web bundle (env-agnostic)
        # No TASK_VOX_URL_WEB in the environment: the bundle then
        # derives its vox URL same-origin from window.location at
        # runtime, so one image serves every hostname.
        # wasm-opt: dx's downloaded prebuilt binaryen SIGABRTs under the
        # runner's service environment (works interactively — same
        # binary, same machine). Pre-seed dx's tool dir with a symlink to
        # the dev shell's nix-built wasm-opt: dx prefers an installed
        # tool, so the broken download never happens. (NO_DOWNLOADS is
        # NOT used — it's global and breaks wasm-bindgen version
        # resolution.) The binaryen-129 dir name is dx 0.7.9's pinned
        # BINARYEN_VERSION (cli/src/wasm_opt.rs); a dx upgrade that bumps
        # it just re-downloads and this seed becomes inert.
        run: |
          rm -rf ~/.local/share/.dx/tools/binaryen-*
          nix develop .#playwright --command bash -c '
            set -e
            mkdir -p ~/.local/share/.dx/tools/binaryen-129/bin
            ln -sf "$(command -v wasm-opt)" ~/.local/share/.dx/tools/binaryen-129/bin/wasm-opt
            cd apps/web && env -u TASK_VOX_URL_WEB dx build --platform web --release'
          rm -rf deploy/docker/web-public
          cp -r target/dx/task-app-web/release/web/public deploy/docker/web-public

      - name: Build ui-lab dist
        run: |
          nix develop .#playwright --command bash -c \
            'cd ui-lab && pnpm install --frozen-lockfile && pnpm build'
          rm -rf deploy/docker/ui-lab-dist
          cp -r ui-lab/dist deploy/docker/ui-lab-dist

      - name: Registry login + CI builder
        # The builder needs the network.host entitlement explicitly
        # allowed — --network=host (systemd-resolved DNS inside
        # BuildKit) is refused by an entitlement-default builder.
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login codeberg.org -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker buildx inspect ci >/dev/null 2>&1 || \
            docker buildx create --name ci --driver docker-container \
              --buildkitd-flags '--allow-insecure-entitlement network.host'
          docker buildx use ci

      - name: Build + push task-server
        run: |
          ctx="$(mktemp -d)"
          bash deploy/docker/siblings.sh context "$ctx"
          docker buildx build --network=host --push \
            -f "$ctx/Task/deploy/docker/server.Dockerfile" \
            -t codeberg.org/fasttrackstudios/task-server:${{ steps.tags.outputs.channel }} \
            -t codeberg.org/fasttrackstudios/task-server:${{ steps.tags.outputs.sha }} \
            "$ctx"
          rm -rf "$ctx"

      - name: Build + push task-web
        run: |
          docker buildx build --network=host --push \
            -f deploy/docker/web.Dockerfile \
            -t codeberg.org/fasttrackstudios/task-web:${{ steps.tags.outputs.channel }} \
            -t codeberg.org/fasttrackstudios/task-web:${{ steps.tags.outputs.sha }} \
            deploy/docker

      - name: Build + push task-ui-lab
        run: |
          docker buildx build --network=host --push \
            -f deploy/docker/ui-lab.Dockerfile \
            -t codeberg.org/fasttrackstudios/task-ui-lab:${{ steps.tags.outputs.channel }} \
            -t codeberg.org/fasttrackstudios/task-ui-lab:${{ steps.tags.outputs.sha }} \
            deploy/docker
