# FastTrackStudio Checks — the one PR/push gate (facet/dodeca-style:
# one "Checks" surface = build, tests, clippy, docs; deployments live in
# deploy.yml; REAPER integration is intentionally-triggered only, see
# reaper.yml; releases in release.yml).
#
# Runs on the FastTrackStudios ORG-scoped forgejo-runner on THEBATTLESHIP
# (NixOS service `gitea-runner-codeberg-org`; label `nix-host` = HOST
# mode, nix + git on PATH). Toolchain comes from the repo flake: every
# step runs under `nix develop .#ci -c` (rust pin, wasm target, clang
# env for ring, native headers).
#
# CHANGE SELECTION: the `plan` job asks `cargo rail plan` (patched flake
# build — nix/modules/cargo-rail.nix) which workspace crates the range
# actually affects, walking cargo's resolved reverse-dependency graph.
# Gates are crate-membership checks against the plan's execution set.
# The heavy job ALWAYS runs and ALWAYS reports success — individual
# steps are gated on the plan outputs — so branch protection that
# requires it never leaves a PR pending. If the base cannot be
# resolved, rail fails, or the plan flags the infra surface (.forgejo/**,
# flake.*, nix/**, root manifests — rail.toml
# [change-detection].infrastructure), the filter FAILS OPEN.
#
# Persistent caches (OUTSIDE the checkout, owned by gitea-runner —
# never shared with the dev tree's target/):
#   /var/lib/gitea-runner/codeberg-org/fts-ci/target      CARGO_TARGET_DIR
#   /var/lib/gitea-runner/codeberg-org/fts-ci/cargo-home  CARGO_HOME
# ONE build job with sequential steps — parallel jobs on one
# CARGO_TARGET_DIR clobber each other's fingerprints.

name: checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FTS_CI: /var/lib/gitea-runner/codeberg-org/fts-ci
  CARGO_TARGET_DIR: /var/lib/gitea-runner/codeberg-org/fts-ci/target
  CARGO_HOME: /var/lib/gitea-runner/codeberg-org/fts-ci/cargo-home
  # Local working copy on the runner host — offline, instant checkout
  # when it already has the triggering commit.
  FTS_LOCAL_REPO: /run/media/Development/FastTrackStudio

jobs:
  # Graph-aware change selection (see header).
  plan:
    runs-on: nix-host
    outputs:
      workspace: ${{ steps.filter.outputs.workspace }}
      patchbay: ${{ steps.filter.outputs.patchbay }}
      signal: ${{ steps.filter.outputs.signal }}
    steps:
      # Full-history checkout: the diff needs BOTH endpoints' ancestry.
      # Local-first (offline, instant), but the local mirror can lag the
      # forge — merge commits created forge-side and PR head commits may
      # not exist in it. After a local-first clone `origin` IS the
      # mirror, so any missing commit must be fetched from the FORGE URL
      # explicitly.
      - name: Checkout (local-first, full history for the diff)
        run: |
          set -eu
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          sha="${GITHUB_SHA:-}"
          if [ -n "$FTS_LOCAL_REPO" ]; then
            git config --global --add safe.directory "$FTS_LOCAL_REPO" 2>/dev/null || true
            git config --global --add safe.directory "$FTS_LOCAL_REPO/.git" 2>/dev/null || true
          fi
          git clone --quiet "$FTS_LOCAL_REPO" . || git clone "$url" .
          if [ -n "$sha" ] && ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "$sha not in the local mirror — fetching from the forge"
            attempt=1
            until git fetch --no-tags "$url" "$sha"; do
              [ "$attempt" -ge 8 ] && { echo "fetch $sha from forge failed"; exit 1; }
              echo "fetch attempt $attempt failed — retrying in 15s"
              attempt=$((attempt + 1)); sleep 15
            done
          fi
          git checkout --quiet --detach "$sha"
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Plan affected crates
        id: filter
        run: |
          set -u
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          # Fail open: if we cannot compute an honest plan, run everything.
          run_all() {
            echo "plan: $1 — running EVERYTHING (fail open)"
            for o in workspace patchbay signal; do
              echo "$o=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          }

          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && run_all "manual dispatch"

          # Diff base:
          #   pull_request — merge-base of the PR base branch and HEAD
          #     (three-dot semantics: only the PR's own changes count).
          #   push — the previous tip (github.event.before).
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            base_tip="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "${base_tip}^{commit}" 2>/dev/null; then
              git fetch --no-tags "$url" "$base_tip" 2>/dev/null || true
            fi
            base="$(git merge-base "$base_tip" HEAD 2>/dev/null)" \
              || run_all "no merge-base for ${base_tip}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null)" || run_all "no parent commit"
            elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags "$url" "$base" 2>/dev/null || true
              git cat-file -e "${base}^{commit}" 2>/dev/null \
                || base="$(git rev-parse HEAD~1 2>/dev/null)" \
                || run_all "push base unavailable"
            fi
          fi

          # Graph-aware selection: rail maps the diff to owning crates
          # and walks cargo's resolved reverse-dependency graph. The
          # execution set is every workspace crate whose build/test
          # result the range can change.
          plan="$(nix develop .#ci -c cargo rail plan --quiet --from "$base" --to HEAD -f json)" \
            || run_all "cargo rail plan failed"

          eval "$(printf '%s' "$plan" | nix develop .#ci -c python3 -c '
          import json, sys

          plan = json.load(sys.stdin)

          # Infra surface (rail.toml [change-detection].infrastructure)
          # or a failed/partial plan -> run everything.
          infra = bool(plan.get("surfaces", {}).get("infra", {}).get("enabled"))
          if plan.get("result") != "success":
              infra = True

          crates = set(plan.get("scope", {}).get("crates", []))

          # Patchbay is a leaf domain: a patchbay-only change gets its
          # cheap targeted check instead of the full pipeline.
          PATCHBAY = {"patchbay", "patchbay-proto", "patchbay-ui", "fts-patchbay"}
          # Crates the audio/signal steps build or test; rail already
          # folded reverse deps into `crates`, so membership is enough.
          SIGNAL = {"signal-guitar", "daw-standalone", "neural-amp-modeler",
                    "architect", "pitch-dsp", "fasttrackstudio"}

          gates = {
              "workspace": bool(crates - PATCHBAY),
              "patchbay":  bool(crates & PATCHBAY),
              "signal":    bool(crates & SIGNAL),
          }
          if infra:
              gates = {k: True for k in gates}
              print("run_all_reason=\"rail infra surface\"")
          for k, v in gates.items():
              print(f"{k}={str(v).lower()}")
          print(f"n_crates={len(crates)}")
          ')" || run_all "plan parse failed"

          [ -n "${run_all_reason:-}" ] && run_all "$run_all_reason"

          {
            echo "workspace=$workspace"
            echo "patchbay=$patchbay"
            echo "signal=$signal"
          } >> "$GITHUB_OUTPUT"
          echo "rail plan: $n_crates affected crate(s) — workspace=$workspace patchbay=$patchbay signal=$signal"

  # Build + tests + quality, sequential in one job so everything shares
  # one warm CARGO_TARGET_DIR without lock contention. The job is NOT
  # `if:`-gated: it always runs and reports success so required checks
  # never sit pending; steps whose inputs did not change are skipped.
  checks:
    runs-on: nix-host
    needs: plan
    steps:
      - name: Checkout (local-first)
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          branch="${GITHUB_REF_NAME:-main}"
          sha="${GITHUB_SHA:-}"
          # The local repo is owned by a different user than the runner —
          # trust it (worktree AND gitdir) or git's dubious-ownership
          # guard silently degrades this to a forge clone.
          if [ -n "$FTS_LOCAL_REPO" ]; then
            git config --global --add safe.directory "$FTS_LOCAL_REPO" 2>/dev/null || true
            git config --global --add safe.directory "$FTS_LOCAL_REPO/.git" 2>/dev/null || true
          fi
          if [ -n "$FTS_LOCAL_REPO" ] && [ -d "$FTS_LOCAL_REPO/.git" ] \
              && [ -n "$sha" ] \
              && git -C "$FTS_LOCAL_REPO" cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "local checkout @ ${sha} (from $FTS_LOCAL_REPO)"
            git clone --quiet "$FTS_LOCAL_REPO" .
            git checkout --quiet --detach "$sha"
          else
            attempt=1
            until git clone --depth 1 --no-tags --branch "$branch" "$url" .; do
              [ "$attempt" -ge 8 ] && { echo "clone failed after 8 attempts"; exit 1; }
              echo "clone attempt $attempt failed — retrying in 15s"
              find . -mindepth 1 -delete 2>/dev/null || true
              attempt=$((attempt + 1)); sleep 15
            done
            if [ -n "$sha" ] && [ "$(git rev-parse HEAD)" != "$sha" ]; then
              attempt=1
              until git fetch --depth 1 --no-tags origin "$sha"; do
                [ "$attempt" -ge 8 ] && { echo "fetch sha failed"; exit 1; }
                echo "fetch attempt $attempt failed — retrying in 15s"
                attempt=$((attempt + 1)); sleep 15
              done
              git checkout --detach "$sha"
            fi
          fi
          echo "checked out $(git rev-parse --short HEAD)"

      # CARGO_HOME's git/ + registry/ are SEEDED from the dev user's
      # ~/.cargo (one-time rsync, chown gitea-runner) — this host's
      # egress to github.com is unreliable, and a fresh CARGO_HOME
      # would have to re-fetch every locked git dep from there. If this
      # cache is ever wiped, re-seed it:
      #   sudo rsync -a ~cody/.cargo/{git,registry} $FTS_CI/cargo-home/
      #   sudo chown -R gitea-runner:gitea-runner $FTS_CI/cargo-home
      - name: Prepare persistent caches
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$CARGO_HOME"
          if [ ! -d "$CARGO_HOME/git/db" ]; then
            echo "::warning::CARGO_HOME git db is empty — locked git deps will fetch from the network (github egress is unreliable on this host; re-seed from ~cody/.cargo)"
          fi
          # Root the dev shell so nix GC can't take paths the shell's env
          # vars point at (env-var store paths are only alive while
          # something roots the shell derivation).
          nix develop .#ci --profile "$FTS_CI/devshell-ci" -c true

      # Workspace manifest + lockfile gate: every member manifest
      # parses, the dependency graph resolves, and Cargo.lock is in sync
      # (--locked fails on drift). Seconds on the warm runner; always on.
      - name: Manifests + lockfile
        run: nix develop .#ci -c cargo metadata --locked --format-version 1 > /dev/null

      - name: Build (cargo check --workspace)
        if: needs.plan.outputs.workspace == 'true'
        run: nix develop .#ci -c cargo check --workspace --exclude vox-discover

      # Patchbay is excluded from the full-workspace gate (leaf domain);
      # a patchbay-only change still gets its own compile check here.
      - name: Build patchbay (patchbay-only change)
        if: needs.plan.outputs.patchbay == 'true' && needs.plan.outputs.workspace != 'true'
        run: |
          nix develop .#ci -c cargo check \
            -p patchbay -p patchbay-proto -p patchbay-ui -p fts-patchbay

      - name: Test signal-guitar
        if: needs.plan.outputs.signal == 'true'
        run: nix develop .#ci -c cargo test -p signal-guitar

      - name: Test daw-standalone (audio)
        if: needs.plan.outputs.signal == 'true'
        run: nix develop .#ci -c cargo test -p daw-standalone --features audio

      - name: Test neural-amp-modeler (incl. NAM parity)
        if: needs.plan.outputs.signal == 'true'
        run: nix develop .#ci -c cargo test -p neural-amp-modeler

      - name: Test architect (iroh)
        if: needs.plan.outputs.signal == 'true'
        run: nix develop .#ci -c cargo test -p architect --features iroh

      - name: Test pitch-dsp
        if: needs.plan.outputs.signal == 'true'
        run: nix develop .#ci -c cargo test -p pitch-dsp

      # Browser-remote build of THE app. wasm32 target + ring's clang
      # env come from the flake dev shell.
      - name: Check wasm (fasttrackstudio, signal feature)
        if: needs.plan.outputs.signal == 'true'
        run: |
          nix develop .#ci -c cargo check -p fasttrackstudio \
            --target wasm32-unknown-unknown \
            --no-default-features --features signal

      # ── Quality (advisory while the tree isn't lint-clean) ─────────
      # facet runs clippy/docs as hard gates; this tree isn't there yet.
      # continue-on-error keeps the signal visible in the run log
      # without blocking merges — flip to hard once the tree is clean.
      - name: Clippy (advisory)
        if: needs.plan.outputs.workspace == 'true'
        continue-on-error: true
        run: |
          nix develop .#ci -c cargo clippy --workspace --exclude vox-discover \
            --all-targets -- -D warnings

      - name: Docs (advisory)
        if: needs.plan.outputs.workspace == 'true'
        continue-on-error: true
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          nix develop .#ci -c cargo doc --workspace --exclude vox-discover --no-deps
