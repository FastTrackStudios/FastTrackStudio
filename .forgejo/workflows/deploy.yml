# Production deploy — fires when dev is merged into main.
#
# Pipeline model:
#   dev   the trunk. Always healthy — every feature branch merges here
#         after its gates (tests, native+wasm checks, live smoke).
#   main  production. Advances ONLY by deliberate merges from dev
#         ("we want this in production now"). This workflow builds the
#         release artifacts and runs the deploy steps.
#
# The deploy target isn't wired yet — steps below build everything and
# stop at a placeholder gate so flipping production on later is one
# edit, not a pipeline project.
#
# NOTE: container-based deployment now exists — images.yml pushes
# task-server / task-web / task-ui-lab images on dev+main pushes, and
# ArgoCD deploys deploy/chart/task from this repo. See deploy/README.md.
name: deploy
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: nix-host
    steps:
      - uses: actions/checkout@v4
      - name: Build server (release)
        run: cargo build --release -p task-server -p task-cli
      - name: Build web bundle
        run: |
          # TASK_VOX_URL_WEB must point at the production endpoint.
          echo "dx build --release -p task-app-web  # (enable when prod endpoint exists)"
      - name: Deploy
        run: |
          echo "DEPLOY GATE: no production target configured yet."
          echo "Wire this step (rsync/systemd/container push) when going live."
