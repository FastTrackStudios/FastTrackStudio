name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    # `ubuntu-latest` is the label this forgejo instance's runners advertise.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Use FTS Cachix
        uses: cachix/cachix-action@v15
        with:
          name: fasttrackstudio
        continue-on-error: true

      # Same gate developers run via `just ci` / `cargo xtask ci`:
      # fmt → clippy -D warnings → check → nextest → tracey. Runs in the
      # slim `.#ci` dev shell (build deps + hygiene tools, no REAPER).
      # REAPER integration tests (`cargo xtask reaper-test`) use `.#reaper-ci`
      # in a separate, gated workflow.
      - name: cargo xtask ci
        run: nix develop .#ci --impure --command cargo xtask ci
