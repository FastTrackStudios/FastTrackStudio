# FastTrackStudio CI — Forgejo Actions (Codeberg)
#
# The cheap early gate. It USED to target codeberg's shared runners
# (codeberg-medium) — but no shared runner ever picked the job up, so
# every run sat "waiting" forever. It now runs on the same self-hosted
# org runner as ci-heavy ("THEBATTLESHIP", NixOS service
# gitea-runner-codeberg-org, defined in ~/.flake hosts/THEBATTLESHIP;
# labels: nix-host = HOST mode with nix on PATH, docker / ubuntu-latest
# = podman containers). With warm caches this gate is seconds.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /var/lib/gitea-runner/codeberg-org/fts-ci/target
  CARGO_HOME: /var/lib/gitea-runner/codeberg-org/fts-ci/cargo-home
  FTS_LOCAL_REPO: /run/media/Development/FastTrackStudio

jobs:
  # Workspace manifest + lockfile gate: every member manifest parses,
  # the dependency graph resolves, and Cargo.lock is in sync (--locked
  # fails on drift). No compilation — seconds on the warm runner.
  # (cargo fmt --check is NOT here: the tree is not fmt-clean today.)
  manifest:
    runs-on: nix-host
    steps:
      - name: Checkout (local-first)
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          branch="${GITHUB_REF_NAME:-main}"
          sha="${GITHUB_SHA:-}"
          if [ -n "$FTS_LOCAL_REPO" ]; then
            git config --global --add safe.directory "$FTS_LOCAL_REPO" 2>/dev/null || true
            git config --global --add safe.directory "$FTS_LOCAL_REPO/.git" 2>/dev/null || true
          fi
          if [ -n "$FTS_LOCAL_REPO" ] && [ -d "$FTS_LOCAL_REPO/.git" ] \
              && [ -n "$sha" ] \
              && git -C "$FTS_LOCAL_REPO" cat-file -e "${sha}^{commit}" 2>/dev/null; then
            git clone --quiet "$FTS_LOCAL_REPO" .
            git checkout --quiet --detach "$sha"
          else
            git clone --depth 1 --no-tags --branch "$branch" "$url" .
            if [ -n "$sha" ] && [ "$(git rev-parse HEAD)" != "$sha" ]; then
              git fetch --depth 1 --no-tags origin "$sha" && git checkout --detach "$sha"
            fi
          fi
      - name: cargo metadata --locked (manifest + lockfile sanity)
        run: nix develop -c cargo metadata --locked --format-version 1 > /dev/null
