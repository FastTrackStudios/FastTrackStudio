# FastTrackStudio CI — Forgejo Actions (Codeberg)
#
# Runner reality check (2026-07, codeberg.org/actions/meta):
#   Codeberg's shared runners are codeberg-tiny (1cpu/2GB/2min),
#   codeberg-small (2cpu/4GB/5min) and codeberg-medium (4cpu/8GB/10min).
#   A ~160-crate workspace does not cold-build inside 10 minutes, so the
#   shared runners only carry the cheap, honest stage below. Every
#   compile-heavy stage lives in ci-heavy.yml and runs on the SELF-HOSTED
#   org runner "THEBATTLESHIP" (registered org-wide to FastTrackStudios,
#   NixOS service gitea-runner-codeberg-org, defined in ~/.flake
#   hosts/THEBATTLESHIP). Its labels:
#     nix-host      — HOST mode, user gitea-runner, nix on PATH
#     docker        — podman container (node:lts, /nix/store ro)
#     ubuntu-latest — podman container (catthehacker act image)

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Workspace manifest + lockfile gate: every member manifest parses,
  # the dependency graph resolves, and Cargo.lock is in sync (--locked
  # fails on drift). No compilation — fits the shared runner's cap.
  # (cargo fmt --check is NOT here: the tree is not fmt-clean today.)
  manifest:
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1.90-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: cargo metadata --locked (manifest + lockfile sanity)
        run: cargo metadata --locked --format-version 1 > /dev/null
