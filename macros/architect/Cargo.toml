[package]
name = "architect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Facet-native, vox-friendly entity framework. One #[derive(Entity)] → wire types + SeaORM Model + auto-generated repo trait, all in one source struct."
repository.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

# `architect` is the user-facing crate. It re-exports the derive macro
# from `architect-derive`, and provides the runtime traits / helper
# types the macro's output references (`RepoError`, `CrudStorage`, etc).
#
# Wasm-clean by default. The `server` feature pulls in sea-orm + the
# server-side storage glue so the same `#[derive(Entity)]` user struct
# also gets a full ORM-backed repository implementation.

[features]
# architect itself stays minimal. Feature crates (e.g. example-proto)
# pull `architect/vox` when they want the RPC stack so the choice
# happens at the contract crate's level, not by accident.
default = []
vox = ["dep:vox"]

# Adds #[derive(fake::Dummy)] to every architect-emitted struct
# (Create/Update/List/Model). Pure test-data scaffolding; enable it
# in your proto crate and the wire structs become trivially seedable.
fake = ["dep:fake"]

# `full` enables every architect optional — vox, SeaORM bridge, axum
# adapter, fake. Matches tokio's `full` convention: when you just want
# everything turned on for development or a single-binary build.
full = ["vox", "server-seaorm", "server-axum", "fake", "diagnostics", "platform", "schedule"]

# Platform layer (`architect::platform`): a `Clock` (async `sleep` + `now`)
# and task `spawn`, abstracted native (tokio) <-> wasm (browser timers).
# Centralizes the cfg-split scattered across resource/local/axum_ws and
# ships a deterministic `TestClock` for testable scheduled code.
#
#   native  tokio::time / tokio::task::spawn (needs a running tokio rt)
#   wasm    gloo-timers TimeoutFuture / wasm_bindgen_futures::spawn_local
#
# `web-time` provides a monotonic `Instant` on both targets.
platform = ["dep:web-time", "tokio/time", "tokio/rt", "dep:gloo-timers", "dep:wasm-bindgen-futures"]

# Schedule layer (`architect::schedule`): composable retry/repeat policies
# (exponential backoff, jitter, caps, recurrence limits) + drivers that run
# a plain `async FnMut() -> Result` under them. Implies `platform` (it sleeps
# between attempts through a `Clock`).
schedule = ["platform"]

# Two server-side features, deliberately independent so a binary can
# pick storage and transport à la carte:
#
#   server-seaorm   the SeaORM bridge — pulls sea-orm + async-trait,
#                   exposes `architect::storage::DbConn`, and lets the
#                   derive emit `<T>RepoStorage<C>`.
#
#   server-axum     the axum WebSocket adapter — pulls axum + tokio +
#                   futures + tracing + vox-core + vox-types, exposes
#                   `architect::axum_ws::{AxumWsLink, serve, ...}`.
#
# A consumer that brings its own repo impl (or fronts a remote API)
# enables `server-axum` only and never compiles sea-orm.

# In-process transport (`architect::local`): serve a `LayerRouter` over a
# vox in-memory link so a typed client consumes a local backend with no
# server/socket. Native only — vox's `MemoryLink` is `#[cfg(not(wasm))]`.
local = ["vox", "dep:vox-core", "dep:tracing", "tokio/rt"]

server-seaorm = ["dep:sea-orm", "dep:async-trait"]
server-axum = [
    "dep:axum",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "dep:futures",
    "dep:tracing",
    "dep:vox-core",
    "dep:vox-types",
    "dep:moire",
]

# Enables moiré's instrumentation — named mpsc/oneshot/spawn primitives
# in axum_ws light up the moire-web dashboard at MOIRE_DASHBOARD.
# Without this, the same primitives compile to plain tokio passthroughs
# with zero runtime cost. Off by default.
diagnostics = ["moire/diagnostics"]
# Back-compat alias — older consumers that wrote `features = ["server"]`
# get the SeaORM bridge for free. Drop after one release cycle.
server = ["server-seaorm"]

# Dispatcher impls (see `architect::dispatch`). The current-thread
# dispatcher is always available; runtime-specific impls are gated.
#
#   dispatch-tokio   spawn_blocking-backed dispatcher. Right for
#                    server-side binaries wrapping sync work behind an
#                    async service.
dispatch-tokio = ["tokio/rt-multi-thread"]

[dependencies]
architect-derive = { path = "../architect-derive" }
architect-rpc-derive = { path = "../architect-rpc-derive" }
facet.workspace = true
facet-core.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

# Construction layer (`architect::resource`): the default error type for
# `Resource<T, E = eyre::Report>`, and a `sync`-only tokio for the async
# `OnceCell` that backs memoization. `sync` is wasm-safe; the runtime
# features (rt-multi-thread/macros) are added by `server-axum` /
# `dispatch-tokio` so the wasm client never pulls a non-wasm runtime.
eyre.workspace = true
# Direct (not workspace) so we get sync-only — the workspace tokio pins
# rt-multi-thread, which doesn't build on wasm32. server-axum /
# dispatch-tokio add the runtime features on top for native builds.
tokio = { version = "1", default-features = false, features = ["sync"] }

# Vox RPC stack — optional. When the `vox` feature is off, the macro
# emits a plain async trait instead of a `#[vox::service]`-decorated one,
# and the dispatcher/client types simply don't exist.
vox = { workspace = true, optional = true }
fake = { workspace = true, optional = true }

# Platform layer. `web-time` gives a monotonic `Instant` that works on
# both native and wasm (std on native, performance.now() on wasm). The
# native timer/spawn path rides the base `tokio` dep (the `platform`
# feature adds `tokio/time` + `tokio/rt`); the wasm path uses the
# target-cfg deps below.
web-time = { version = "1", optional = true }

# Server-side only — sea-orm + async-trait are gated.
sea-orm = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }

# server-axum bundle. All optional; only pulled when the feature is on.
axum = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
tracing = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
moire = { workspace = true, optional = true }

# Wasm-only platform deps. Browser timers (gloo-timers' `TimeoutFuture`
# is a real async sleep backed by setTimeout) and `spawn_local` for the
# `spawn` primitive. Both optional, pulled by the `platform` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", default-features = false, features = ["futures"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
futures-lite = "2"
