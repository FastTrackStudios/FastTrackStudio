[package]
name = "daw-bridge"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]
name = "reaper_daw_bridge"
path = "src/lib.rs"

[dependencies]
# DAW facade (REAPER impl). The UI host is provided by the pinned direct
# daw-reaper-dioxus dependency below so local dioxus work cannot break bridge.
daw = { workspace = true, features = ["reaper"] }
# Direct dep so we can construct ReaperDockHost in plugin_main. Pinned to
# isolate daw-bridge from local daw-reaper-dioxus development work.
daw-reaper-dioxus = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", rev = "de70e73ef0919a01bc28faf3f18d5aa390629469" }
daw-proto = { path = "../daw-proto" }
daw-audio-sync = { path = "../daw-audio-sync" }
uuid = { workspace = true }

# RT-aware allocator
daw-allocator.workspace = true

# ROAM service framework
vox.workspace = true
vox-stream.workspace = true
architect = { workspace = true, features = ["vox"] }

# Async runtime

moire.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

# REAPER bindings
reaper-high.workspace = true
reaper-medium.workspace = true
reaper-low.workspace = true
reaper-macros.workspace = true

# Main thread dispatch
crossbeam-channel.workspace = true
fragile.workspace = true

# File watching
notify.workspace = true

# Project file import (Ableton/ProTools/AAF/DAWproject → REAPER conversion)
dawfile-ableton = { path = "../dawfile-ableton" }
dawfile-protools = { path = "../dawfile-protools" }
dawfile-aaf = { path = "../dawfile-aaf" }
dawfile-dawproject = { path = "../dawfile-dawproject" }
dawfile-reaper = { path = "../dawfile-reaper" }

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile = "3"
eyre = "0.6"

# Sync stack — engine + peer mesh. Default-on so reaper-test multi-instance
# tests have the runtime available; production users that don't want it can
# disable the feature.
daw-synchronization = { workspace = true, optional = true }
daw-network = { workspace = true, optional = true }

[features]
default = ["sync"]
sync = ["dep:daw-synchronization", "dep:daw-network"]

[dev-dependencies]
eyre = "0.6"
reaper-test.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
