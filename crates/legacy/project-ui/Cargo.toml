[package]
name = "project-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Dioxus components for the `project` feature.
#
# Two layers:
#   - Dumb components — data + callbacks in, RSX out. Storybook-able
#     in isolation; no I/O.
#   - "Live" wrappers — own a `use_resource` and a vox client connect
#     so a route can mount them with just a URL. These pull in the
#     vox-websocket transport and only compile under wasm32.
#
# Outside the workspace because dioxus + wasm constraints can't be
# unified with the native server build.

[dependencies]
dioxus = { workspace = true }
project-proto.workspace = true
knowledge-proto.workspace = true
knowledge-crdt.workspace = true
knowledge-ui.workspace = true
serde_json.workspace = true
indexmap = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
uuid = { workspace = true, features = ["v4", "js"] }

fts-ui.workspace = true

# Vox client surface — this crate owns the wasm fetching glue for the
# project feature so task-ui only routes; it doesn't construct
# clients. `vox` (high-level) re-exports `Tx`/`Rx`/`channel`; the
# `runtime` baseline keeps the wasm side small.
vox = { workspace = true }
vox-core = { workspace = true }
vox-websocket = { workspace = true }
crdt = { workspace = true }
project-crdt = { workspace = true }
tracing = { workspace = true }
# `futures::channel::mpsc::unbounded` bridges Loro's sync
# `subscribe_local_update` callback into the async `apply_update`
# uploader task.
futures = { workspace = true }

# Web-only — clipboard writes from the TaskGitPanel. Gated with
# `#[cfg(target_arch = "wasm32")]` at the call sites.
web-sys = { workspace = true, features = [
    "Window",
    "Navigator",
    "Clipboard",
] }
