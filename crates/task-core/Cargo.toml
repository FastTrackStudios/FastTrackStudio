[package]
name = "task-core"
version.workspace = true
edition.workspace = true

[features]
# "server" enables the async vault, service trait, and service implementation.
# Disable it for wasm32 builds (obsidian-plugin) to avoid tokio/mio.
default = ["server"]
server = ["dep:tokio", "dep:vox", "dep:vox-core", "dep:vox-types", "dep:toml", "dep:async-trait", "dep:tracing", "dep:reqwest", "dep:rusqlite", "dep:base64", "dep:async-imap", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:rustls-pemfile", "dep:tokio-util", "dep:futures", "dep:sha2", "dep:scraper"]
# Kept for downstream compatibility; persistence definitions are always present.
db = ["server"]
# "caldav" enables CalDAV sync and VTODO conversion.
caldav = ["server", "dep:icalendar", "dep:libdav", "dep:reqwest"]
# "realtime" enables CRDT-based real-time collaboration (Loro).
realtime = ["server", "dep:loro"]

[dependencies]
# Facet — replaces serde for all data types (wasm-safe)
facet.workspace = true
facet-core.workspace = true
facet-json.workspace = true
facet-yaml.workspace = true
facet-reflect.workspace = true

# Date / recurrence (wasm-safe)
chrono = "0.4"
fuzzydate = "0.4"
rrule.workspace = true

# Slugs (wasm-safe)
slug = "0.1"

# Error handling (wasm-safe)
thiserror.workspace = true
eyre.workspace = true

# IDs
uuid.workspace = true

# Server-only — not compiled for wasm32
vox     = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
tokio   = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
toml    = { version = "0.8", optional = true }
serde.workspace = true
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }

# CalDAV sync (optional)
icalendar = { version = "0.17", optional = true }
libdav    = { version = "0.10", optional = true }
reqwest   = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json"] }
serde_json.workspace = true

# Base64 — used by the Nextcloud Mail provider to decode the tag list
# that ships inside the Mail app's page bootstrap (no API endpoint).
base64 = { version = "0.22", optional = true }

# IMAP IDLE push client — used by `task email watch` to stream a
# notification whenever new mail arrives on a Bridge-proxied account.
async-imap = { version = "0.11", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["tls12", "ring"] }
rustls-pki-types = { version = "1", optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
futures = { version = "0.3", optional = true }

# Async trait (server-side)
async-trait = { version = "0.1", optional = true }

# Real-time collaboration (optional) — Loro replaces Automerge + Yrs.
loro = { version = "1.10", optional = true }

# SHA-256 — used for attachment checksums (server-side).
sha2 = { workspace = true, optional = true }

# HTML parser — used by the recipe-import workflow (JSON-LD + OpenGraph
# extraction). Pure Rust, no Python sidecar.
scraper = { version = "0.20", optional = true }

# Database entity derives
sea-orm.workspace = true
crudcrate.workspace = true
utoipa = { version = "5", features = ["chrono", "uuid"] }
