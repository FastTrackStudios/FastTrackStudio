[package]
name = "fts-extensions"
version.workspace = true
edition.workspace = true
description = "FTS Extensions — standalone REAPER extension providing utility actions (cdylib)"

[lib]
crate-type = ["cdylib"]
name = "reaper_fts_extensions"
path = "src/lib.rs"

[dependencies]
# FTS Launcher — search/workflow engine
fts-launcher = { workspace = true }

# Modules — each implements daw::DawModule
dynamic-template = { workspace = true }
dynamic-template-proto = { workspace = true }
session = { workspace = true }
sync = { workspace = true }
sync-proto = { workspace = true }
reaper-input = { workspace = true }
keyflow = { workspace = true }

# DAW API. `reaper-ui` pulls in the Dioxus panel rendering host.
# `daw-extension-runtime` is a public sibling of daw (not a daw feature)
# because folding it in would cycle through daw-reaper.
daw = { workspace = true, features = ["reaper", "sync", "reaper-ui"] }
daw-extension-runtime = { workspace = true }

# Keyflow chart/chord analysis service. fts-extensions composes this
# with the daw bridge handler so chart data is available over the
# same in-process RPC channel as the daw services.
keyflow-daw-analysis = { workspace = true }

# FTS design system (shadcn-ui clone for Dioxus)
fts-ui = { workspace = true }

# REAPER entry point machinery
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true
reaper-macros.workspace = true

# Async runtime + task dispatch
tokio.workspace = true
crossbeam-channel.workspace = true
fragile.workspace = true
eyre.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
reaper-test = { workspace = true }
eyre.workspace = true
tokio = { workspace = true, features = ["macros"] }
