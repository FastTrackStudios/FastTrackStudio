[package]
name = "fts-extensions"
version.workspace = true
edition.workspace = true
description = "FTS Extensions — standalone REAPER extension providing utility actions (cdylib)"

[lib]
crate-type = ["cdylib"]
name = "reaper_fts_extensions"
path = "src/lib.rs"

[features]
# All subsystems off by default. Bisect by enabling one at a time.
default = []

# Modules — each implements daw::DawModule
mod-launcher = ["dep:fts-launcher"]
mod-session = ["dep:session"]
mod-sync = ["dep:daw-synchronization"]
mod-input = ["dep:reaper-input"]

# Dioxus dock host (panels, ui_test_panel, dock_state restore, update_panels tick)
ui-dock = ["daw/reaper-ui"]

# Per-frame DAW state polling + broadcast (items, tempo, transport, markers, regions, tracks)
poll-broadcast = []

# FastTrackStudio extensions menu hook + REAPER project importer registration
host-hooks = []

[dependencies]
# FTS Launcher — search/workflow engine
fts-launcher = { workspace = true, optional = true }

# Modules — each implements daw::DawModule
session = { workspace = true, optional = true }
# `default-features = false` disables `overlay-prewarm` so reaper-input
# doesn't try to allocate wgpu/Vello surfaces during plugin_main, where
# the REAPER host window isn't ready yet and surface creation OOMs.
# Declared directly (not via `workspace = true`) because workspace
# inheritance forbids overriding `default-features`. The path is the same
# one the workspace's `[patch]` table redirects to.
reaper-input = { path = "../../../input/crates/reaper-input", optional = true, default-features = false }
daw-synchronization = { workspace = true, optional = true }

# DAW API. `reaper-ui` pulls in the Dioxus panel rendering host and is gated
# behind the `ui-dock` feature. `daw-extension-runtime` is a public sibling
# of daw (not a daw feature) because folding it in would cycle through
# daw-reaper.
daw = { workspace = true, features = ["reaper"] }
daw-reaper.workspace = true
daw-extension-runtime = { workspace = true }

# FTS design system (shadcn-ui clone for Dioxus)
fts-ui = { workspace = true }

# REAPER entry point machinery
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true
reaper-macros.workspace = true

# Async runtime + task dispatch
tokio.workspace = true
crossbeam-channel.workspace = true
fragile.workspace = true
eyre.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
reaper-test = { workspace = true }
eyre.workspace = true
tokio = { workspace = true, features = ["macros"] }
