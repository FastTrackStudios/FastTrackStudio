[package]
name = "fts-extensions"
version.workspace = true
edition.workspace = true
description = "FTS Extensions — standalone REAPER extension providing utility actions (cdylib)"

[lib]
crate-type = ["cdylib"]
name = "reaper_fts_extensions"
path = "src/lib.rs"

[dependencies]
# FTS Launcher — search/workflow engine
fts-launcher = { workspace = true }

# Modules — each implements daw::DawModule
dynamic-template = { workspace = true }
dynamic-template-proto = { workspace = true }
session = { workspace = true }
sync = { workspace = true }
sync-proto = { workspace = true }
reaper-input = { workspace = true }
keyflow = { workspace = true }

# DAW API — in-process via the `extension-runtime` feature. `reaper-ui`
# pulls in the Dioxus panel rendering host.
daw = { workspace = true, features = ["reaper", "sync", "reaper-ui", "extension-runtime"] }

# FTS design system (shadcn-ui clone for Dioxus)
fts-ui = { workspace = true }

# REAPER entry point machinery
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true
reaper-macros.workspace = true

# Async runtime + task dispatch
tokio.workspace = true
crossbeam-channel.workspace = true
fragile.workspace = true
eyre.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
reaper-test = { workspace = true }
eyre.workspace = true
tokio = { workspace = true, features = ["macros"] }
