[package]
name = "editor-state"
description = "Document, transactions, selections, and decorations for the Editor."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
editor-syntax = { workspace = true, features = ["default-langs"] }
editor-typst = { workspace = true }
editor-mermaid = { workspace = true }
ropey = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Block-id generator. `v4` for random IDs; `js` so it routes
# through `crypto.getRandomValues` on `wasm32-unknown-unknown`.
uuid = { version = "1", features = ["v4", "js"] }

# wasm-only: `performance.now()` for the live-preview perf
# trace (native uses `Instant`, which traps on wasm32-unknown-
# unknown).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[features]
default = []
serde = ["dep:serde"]
