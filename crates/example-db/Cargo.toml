[package]
name = "example-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Re-exports the server-side bits of `example-proto` (SeaORM entity
# + the auto-generated `ExampleRepo` impl) and owns the migration
# definitions. Server / db apps depend on this; wasm clients depend
# on `example-proto` directly without the `server` feature.

[dependencies]
example-proto = { workspace = true, features = ["server"] }
sea-orm.workspace = true
sea-orm-migration.workspace = true
chrono.workspace = true
uuid.workspace = true
