[package]
name = "fts-plugin-core"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Core abstraction layer for FTS audio plugins (nih_plug + dioxus)"

[features]
default = ["gui"]
gui = ["nice-plug-dioxus", "audio-gui"]

[dependencies]
nice-plug = { workspace = true }
nice-plug-dioxus = { workspace = true, optional = true }
audio-gui = { workspace = true, optional = true }
atomic_float = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
