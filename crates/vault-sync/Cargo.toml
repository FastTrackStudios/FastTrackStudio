[package]
name = "vault-sync"
description = "Phase-2 client for the task-server vault-sync endpoints: manifest pull, file get/put/delete with If-Match, and a WebSocket subscriber for live change events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Native-only client. Desktop, CLI, playground, and the server's
# own integration tests consume this. A wasm-friendly variant for
# the web app lands in a later slice — reqwest + tokio-tungstenite
# both need feature gating that's not yet wired here.
[dependencies]
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
sha2 = "0.10"
bytes = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
# `examples/watch.rs` uses `#[tokio::main]` and prints VaultEvent
# JSON via serde_json. Both are workspace deps already; restate
# them as dev-deps so `cargo run --example` builds cleanly.
tokio = { workspace = true }
serde_json = { workspace = true }
# E2E coverage (client + server together) lives in
# apps/server/tests/, where task-server is already a build
# target. The unit tests here just cover types + URL shaping.
