[package]
name = "signal-extension"
version.workspace = true
edition.workspace = true
description = "Signal domain in-process REAPER extension (cdylib)"

[lib]
crate-type = ["cdylib", "rlib"]
name = "reaper_signal_extension"
path = "src/lib.rs"

[dependencies]
daw = { workspace = true, features = ["reaper"] }
daw-extension-runtime.workspace = true
macromod.workspace = true
signal.workspace = true
fragile = "2"
reaper-low = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
tokio = { workspace = true, features = ["time", "net", "rt"] }
eyre.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
