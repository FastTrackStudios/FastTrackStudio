[package]
name = "daw-reaper"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

# This is a library crate, not a cell binary.
# The REAPER implementation runs in-process within the reaper-extension.

[dependencies]
daw-proto = { path = "../daw-proto" }
daw-audio-sync = { path = "../daw-audio-sync" }
uuid = { workspace = true }
architect = { workspace = true, features = ["vox"] }
vox.workspace = true
tracing.workspace = true
tokio.workspace = true
moire.workspace = true

# RPP chunk parsing/serialization for chunk-based FX manipulation
dawfile-reaper = { path = "../dawfile-reaper" }
dawfile-ableton = { path = "../dawfile-ableton" }
dawfile-protools = { path = "../dawfile-protools" }
dawfile-aaf = { path = "../dawfile-aaf" }
dawfile-dawproject = { path = "../dawfile-dawproject" }

# REAPER bindings for actual DAW control
reaper-high.workspace = true
reaper-medium.workspace = true
reaper-low.workspace = true
enumflags2.workspace = true
camino = "1"
libloading = "0.8"
crossbeam-channel.workspace = true
daw-control = { path = "../daw-control" }
eyre.workspace = true
facet-json.workspace = true

# Cross-platform monitor topology enumeration for screenset capture.
display-info = "0.5"

# Typed SWELL Window/Hwnd wrappers from FTS reaper-lib. Used by the
# window-geometry helpers (nudge / resize / center) so our action set
# rides on the same primitives the rest of FTS's reaper-side UIs use.
swell-ui.workspace = true

[dev-dependencies]
daw-control = { path = "../daw-control" }
daw-proto = { path = "../daw-proto" }
base64 = "0.22.1"
reaper-test.workspace = true
eyre.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
vox.workspace = true
moire.workspace = true

[lints]
workspace = true
