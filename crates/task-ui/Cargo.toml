[package]
name = "task-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Workspace member. Sharing the lockfile + dep graph with the
# server/CLI crates avoids the dioxus / dioxus-router version drift
# that bit us before. wasm-only call sites (web-sys::WebSocket, etc.)
# are gated with `#[cfg(target_arch = "wasm32")]` so this crate
# compiles cleanly on the native target too — `cargo check
# --workspace` works inside the nix dev shell.

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-router.workspace = true

# Local-first source-of-truth in the browser.
loro.workspace = true
architect = { path = "../../../architect/macros/architect" }
crdt = { path = "../../../architect/libs/crdt" }

# Per-feature trios.
asset-proto.workspace = true
asset-crdt.workspace = true
asset-ui.workspace = true
agent-proto.workspace = true
agent-crdt.workspace = true
agent-ui.workspace = true
caldav-proto.workspace = true
caldav-crdt.workspace = true
caldav-ui.workspace = true
calendar-proto.workspace = true
calendar-crdt.workspace = true
calendar-ui.workspace = true
chat-proto.workspace = true
chat-crdt.workspace = true
chat-ui.workspace = true
conference-proto.workspace = true
conference-crdt.workspace = true
conference-ui.workspace = true
cookbook-proto.workspace = true
cookbook-crdt.workspace = true
cookbook-ui.workspace = true
email-proto.workspace = true
email-crdt.workspace = true
email-ui.workspace = true
finance-proto.workspace = true
finance-crdt.workspace = true
finance-ui.workspace = true
fitness-proto.workspace = true
fitness-crdt.workspace = true
fitness-ui.workspace = true
inventory-proto.workspace = true
inventory-crdt.workspace = true
inventory-ui.workspace = true
invoice-proto.workspace = true
invoice-crdt.workspace = true
invoice-ui.workspace = true
location-proto.workspace = true
location-crdt.workspace = true
location-ui.workspace = true
person-proto.workspace = true
person-crdt.workspace = true
person-ui.workspace = true
project-proto.workspace = true
project-crdt.workspace = true
project-ui.workspace = true
threads-proto.workspace = true
threads-crdt.workspace = true
threads-ui.workspace = true
timer-proto.workspace = true
timer-crdt.workspace = true
timer-ui.workspace = true

uuid = { workspace = true, features = ["v4", "js"] }
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }

# Browser glue. Compiles cleanly on native too; the source uses
# them only inside `cfg(target_arch = "wasm32")` blocks.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Location",
    "History",
    "Navigator",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "Blob",
    "Event",
    "CloseEvent",
    "ErrorEvent",
    "console",
] }
futures-channel.workspace = true
futures-util.workspace = true

[features]
default = []
# Opt-in WASM bundle splitting along route variants.
wasm-split = ["dioxus-router/wasm-split"]
