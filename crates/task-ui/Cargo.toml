[package]
name = "task-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Workspace member. Sharing the lockfile + dep graph with the
# server/CLI crates avoids the dioxus / dioxus-router version drift
# that bit us before. wasm-only call sites (web-sys::WebSocket, etc.)
# are gated with `#[cfg(target_arch = "wasm32")]` so this crate
# compiles cleanly on the native target too — `cargo check
# --workspace` works inside the nix dev shell.

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-router.workspace = true
fts-ui = { workspace = true, features = ["router"] }

# Local-first source-of-truth in the browser.
loro.workspace = true
architect = { path = "../../../architect/macros/architect" }
crdt = { path = "../../../architect/libs/crdt" }

# Vertical-slice reset: only project trio remains.
project-proto = { workspace = true, features = ["fake"] }
project-crdt.workspace = true
project-ui.workspace = true
# `knowledge-ui` parked under `crates/legacy/` — task-ui mounts
# `editor::EditorApp` now. Re-add the dep when we mine the
# legacy shell (virt-folder views, properties pane, tasks-kanban).
editor.workspace = true
view-gantt.workspace = true

uuid = { workspace = true, features = ["v4", "js"] }
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
fake.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Browser glue. Compiles cleanly on native too; the source uses
# them only inside `cfg(target_arch = "wasm32")` blocks.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Location",
    "History",
    "Navigator",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "Blob",
    "Event",
    "CloseEvent",
    "ErrorEvent",
    "Storage",
    "console",
] }
futures-channel.workspace = true
futures-util.workspace = true

# Vox runtime (gives `#[vox::service]` clients + acceptor_on / NoopClient).
# `transport-websocket` is enabled separately via `vox-websocket` so the
# wasm build sidesteps `vox::highlevel::ws::WsListener` which always
# wires `tokio::net::TcpListener`.
vox.workspace = true
vox-core.workspace = true
vox-websocket.workspace = true

[features]
default = []
# Opt-in WASM bundle splitting along route variants.
wasm-split = ["dioxus-router/wasm-split"]
