[package]
name = "vault-sync-proto"
description = "Wire contract for the vault-sync vox service: types, IfMatch enum, VaultEvent stream, and the `#[vox::service] trait VaultSync` consumed by server + native + wasm clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wasm-clean baseline (just Facet types). Enable the `vox` feature
# to pull in `#[vox::service]` + `vox-types::Reborrow` impls; the
# server crate and both transport clients all enable it.
[dependencies]
facet = { workspace = true }
thiserror = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types"]
