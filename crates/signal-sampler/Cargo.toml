[package]
name        = "signal-sampler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sample library playback engine for Signal — loads and plays orchestral, drum, and instrument libraries"

[dependencies]
# Spec loading
facet       = { workspace = true }
facet-styx  = { workspace = true }
facet-toml  = { workspace = true }

# Tagging schema reuse (TagSet / TagCategory / StructuredTag)
signal-proto = { path = "../signal-proto" }

# Audio I/O
cpal        = { workspace = true }
crossbeam-channel = { workspace = true }
arc-swap    = "1.7"
hound       = "3.5"
claxon      = "0.4"
zstd        = "0.13"
flacenc     = "0.5.1"

# Error handling
thiserror   = { workspace = true }
eyre        = { workspace = true }
tracing     = { workspace = true }
rayon       = "1"
walkdir     = "2"

[dev-dependencies]
tracing-subscriber = { workspace = true }
