[package]
name = "store-proto"
description = "General app-state persistence. Feature-agnostic `KvStore` + `LogStore` capability sub-traits (`#[architect::rpc]`) plus an in-memory impl for tests. Backends (json-on-disk, sqlite, …) live in sibling `store-json` / `store-sqlite` crates so each feature can choose the right shape without coupling its proto to a specific store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wasm-clean baseline (Facet types + the in-memory backend).
# Backends with native-only deps live in separate crates.
[dependencies]
facet = { workspace = true }
thiserror = { workspace = true }
architect = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]

[lints]
workspace = true
