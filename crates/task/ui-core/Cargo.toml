[package]
name = "task-ui-core"
description = "The seam every Task UI crate shares: vox endpoint resolution + the cached per-org connection root, display formatting, and vault-note frontmatter parsing. Deliberately tiny and proto-free — feature UI crates and the player depend on this instead of on the `ui` shell, which is what makes the shell splittable at all."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The shared phase components (`states`) and the badge-variant mapping
# for the status ladder (`format::status_variant`).
dioxus.workspace = true
fts-ui.workspace = true

# `OrgMeta::id` — the org's stable UUID from the well-known endpoint.
uuid = { workspace = true, features = ["v4", "js", "serde"] }

# Vox runtime + the WebSocket transport the per-org connection root dials.
vox-core.workspace = true
vox-websocket.workspace = true

tracing.workspace = true
futures-channel.workspace = true
# `join_all` for the multi-org fan-out (`feeds::fan_out`).
futures-util.workspace = true

wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Location",
    "WebSocket",
    "BinaryType",
    "Event",
    "CloseEvent",
] }

[lints]
workspace = true
