edition.workspace = true
description = "Keyflow integrated REAPER extension — chart parsing, guide tracks, MIDI export"

[lib]
crate-type = ["cdylib"]
name = "fts_keyflow_extension"
path = "src/lib.rs"

[dependencies]
daw.workspace = true
daw-extension-runtime.workspace = true
keyflow = { workspace = true, features = ["midi"] }
eyre.workspace = true
fragile.workspace = true
reaper-low.workspace = true
reaper-macros.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
