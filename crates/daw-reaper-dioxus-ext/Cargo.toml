[package]
name = "daw-reaper-dioxus-ext"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "REAPER extension providing daw-reaper-dioxus rendering as a service (cdylib loaded into REAPER as `reaper_daw_dioxus.so`)"

[lib]
crate-type = ["cdylib"]
name = "reaper_daw_dioxus"
path = "src/lib.rs"

[dependencies]
daw = { workspace = true, features = ["reaper", "reaper-ui"] }
daw-extension-runtime.workspace = true
daw-module = { path = "../daw-module" }
daw-reaper-dioxus = { path = "../daw-reaper-dioxus" }
daw-ui = { workspace = true, default-features = false, features = ["reaper-test-panels"] }
crossbeam-channel = "0.5"
eyre = "0.6"
fragile.workspace = true
vox.workspace = true
reaper-low.workspace = true
reaper-high.workspace = true
reaper-macros = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "allow"


[lints.rustdoc]
broken_intra_doc_links = "allow"
