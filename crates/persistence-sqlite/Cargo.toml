[package]
name = "persistence-sqlite"
version.workspace = true
edition.workspace = true

# SQLite-backed implementation of `architect::crdt::Persistence`.
# Drop-in for `CrdtDoc::open(persistence)` on native targets so
# desktop/CLI builds can persist Loro snapshots + update logs to
# a single `.sqlite` file. Wasm clients use the IndexedDB-backed
# impl in `features/knowledge/knowledge-ui::idb_persistence`.
#
# Self-contained: `rusqlite` is configured with the `bundled`
# feature so users don't need a system libsqlite3 install.

[dependencies]
crdt = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true, features = ["clock", "std"] }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
# Pinned to 0.32.x because newer rusqlite uses
# libsqlite3-sys >= 0.31, which conflicts with the
# `libsqlite3-sys = "^0.30"` that `sea-orm`'s `sqlx-sqlite`
# transitively requires. cargo's `links =` rule allows only
# one version of a -sys crate per build.
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
