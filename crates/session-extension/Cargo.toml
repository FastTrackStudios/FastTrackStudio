[package]
name = "session-extension"
version.workspace = true
edition.workspace = true
description = "Test-only REAPER extension that hosts the session DawModule"

[lib]
crate-type = ["cdylib"]
name = "reaper_session_extension"
path = "src/lib.rs"

[dependencies]
daw = { workspace = true, features = ["reaper"] }
daw-reaper.workspace = true
daw-extension-runtime.workspace = true
session.workspace = true
tokio = { workspace = true, features = ["time", "net", "rt"] }
eyre.workspace = true
fragile = "2"
crossbeam-channel = "0.5"
reaper-low = { git = "ssh://forgejo@git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "ssh://forgejo@git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
tracing.workspace = true
tracing-subscriber.workspace = true
