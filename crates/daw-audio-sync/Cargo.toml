[package]
name = "daw-audio-sync"
description = "Audio-thread sync primitives — sample-accurate peer alignment for redundant playback"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Companion to `daw-synchronization`. That crate handles state sync (mixer,
# tracks, markers, …) at main-thread cadence via TCP mesh + suppression. This
# crate handles the sample-accurate transport layer: audio-callback hook,
# per-buffer position snapshot, peer clock sync (PTP-style), and drift
# correction. The two run side-by-side — state sync owns "what does the
# DAW look like", audio-sync owns "where exactly is the playhead, right now."
#
# Designed for live redundant playback: N REAPER instances playing the same
# project, kept aligned to single-sample tolerance during steady-state via
# continuous playrate-nudge correction. Failover-ready: each peer always
# has an up-to-date snapshot of every other peer's sample position.

[lib]
path = "src/lib.rs"

[dependencies]
reaper-medium = { workspace = true }
reaper-low = { workspace = true }
tracing.workspace = true

[lints]
workspace = true
