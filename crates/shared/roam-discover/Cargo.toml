[package]
name = "roam-discover"
version = "0.1.0"
edition = "2021"
description = "mDNS service discovery for roam RPC services"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"
zeroconf = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
