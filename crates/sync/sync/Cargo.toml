[package]
name = "sync"
description = "Sync engine — DAW-to-DAW real-time synchronization via roam"
version.workspace = true
edition = "2024"

[dependencies]
sync-proto = { path = "../sync-proto" }
daw = { workspace = true }
roam.workspace = true
moire.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = "0.7"
facet.workspace = true
rusty_link = { version = "0.4", optional = true }

[features]
default = ["link"]
link = ["dep:rusty_link"]

[lints]
workspace = true
