[package]
name = "vim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# First-class modal editing layer for the app.
#
# Built on top of `keybindings` (state-machine framework) and
# `editor-types` (action vocabulary) from the modalkit project,
# both Apache-2.0 licensed and free of terminal-only deps. We own
# the binding table, key adapter, and dispatcher so the same engine
# can drive the editor today and app-wide navigation tomorrow.

[dependencies]
keybindings = { workspace = true }
editor-types = { workspace = true }
dioxus = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
