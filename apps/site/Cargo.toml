# fasttrackstudio.app — the public website (Dioxus web app).
#
# Subtree-imported from the standalone fasttrackstudio-site repo (history
# preserved) and dissolved into the root workspace: intra-tree deps
# (keyflow, fts-ui, dioxus pins) come from [workspace.dependencies]; the
# Editor crates stay a git dep (external repo — its keyflow.git references
# fold onto the in-tree crates via the root [patch] table).
[package]
name = "fts-site"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2024"
description = "FastTrackStudio website — landing, live keyflow editor, chart browser"

[dependencies]
# Dioxus web framework — root pins =0.7.9 (lib only); the site re-enables
# router here and web/desktop via its own features below.
dioxus = { workspace = true, features = ["router"] }

# UI component library (shadcn-inspired, Tailwind-styled)
lucide-dioxus = { workspace = true }

# Chart parsing and layout
keyflow = { workspace = true, features = ["engraver", "pdf", "text", "highlighting"] }

# /input tutorial — the keybind config data model + styx parsing (the
# canonical profiles are embedded by build.rs).
input-config-proto = { workspace = true }
facet-styx = { workspace = true }

# Live contenteditable editor + keyflow language bindings (homepage demo).
# External repo — kept as a git dep; NOT an intra-tree crate.
editor = { workspace = true }
editor-keyflow = { workspace = true }
editor-keyflow-lang = { workspace = true }

# FTS design system (components, layout, typography, theme tokens)
fts-ui = { workspace = true }

# /guides vault — knowledge graph of the markdown notes (wasm-clean SVG view)
view-knowledge-graph = { workspace = true }

# /session/{org}/{collection} library browser — the fts-server CollectionService
# wire contract + a minimal vox WebSocket client (wasm-clean). The site dials
# `<fts-server base>/org/{org}/vox` and lists that org's collections.
collection-proto = { workspace = true, features = ["vox"] }
vox-core = { workspace = true }
vox-websocket = { workspace = true }

# Session performance view — the real session-ui presentational components
# (mixer, transport, progress bars) plus the proto types that drive them. The
# browser session player populates session-ui's global signals directly and
# renders these components (same crates the fasttrackstudio wasm remote uses).
session-ui = { workspace = true, features = ["web"] }
session-proto = { workspace = true }
daw-proto = { workspace = true }

# Color type used by the engraver's SVG export config
peniko = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Archive creation for multi-file exports (site-only dep — no root pin)
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Logging
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Override fontique to disable system feature (not available on WASM)
fontique = { version = "0.2", default-features = false, features = ["std"] }
parley = { version = "0.2", default-features = false, features = ["std"] }

# Override uuid to enable js feature for WASM (uses browser crypto API)
uuid = { version = "1.0", features = ["serde", "v4", "js"] }

# WASM-specific utilities
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "registry"] }

# Async timers for WASM — "futures" feature backs the debounced live-preview
# render task in LiveEditor.
gloo-timers = { version = "0.3", features = ["futures"] }

# Web APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Navigator",
    "CanvasRenderingContext2d",
    "Performance",
    "Location",
    # Read the fts.task-server-ws-url pref from localStorage
    "Storage",
    # Mouse/touch interaction
    "MouseEvent",
    "WheelEvent",
    "EventTarget",
    "AddEventListenerOptions",
    "DomRect",
    # Resize observation
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "ResizeObserverBoxOptions",
    # File download
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    # SVG fallback rendering
    "HtmlImageElement",
    # Dev-mode guides-vault fetch (live markdown from the dx server)
    "Request",
    "RequestInit",
    "Response",
    # Session view — Web Audio multitrack player. Each stem is streamed via an
    # HTMLAudioElement (progressive Opus/ogg, low memory) routed through a
    # per-stem GainNode for the mixer (mute/solo/volume).
    "AudioContext",
    "AudioContextState",
    "BaseAudioContext",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "AudioDestinationNode",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "MediaElementAudioSourceNode",
] }

# Async runtime for WASM — deliberately NOT the workspace tokio (that one is
# full-featured and pulls mio, which breaks wasm32 builds).
tokio = { version = "1.48", default-features = false, features = ["sync"] }

# Random number generation for WASM (needed for getrandom 0.2 used by uuid)
getrandom = { version = "0.2", features = ["js"] }
# getrandom 0.3 pulled in by transitive deps - need wasm_js feature for wasm32
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Desktop/server dependencies
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[lints]
workspace = true
