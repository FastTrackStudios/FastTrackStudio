# Container image — pure-Nix OCI build, pushed to the in-cluster LAN
# registry on every push to main. No Docker daemon, no buildx.
#
#   main -> registry.starcommand.live:30050/fasttrackstudio-site:latest + :sha-<short>
#
# The ~/.starcommand fasttrackstudio-site service module deploys this image
# via argocd-image-updater (rolls the mutable `latest` tag by digest — no
# git commits needed for redeploys). Modeled directly on Task's
# .forgejo/workflows/images.yml.
#
# How the image is built:
#   * `pkgs.dockerTools.streamLayeredImage` in flake.nix (via dioxus-flake's
#     mkDioxusWebImage) — it builds an *executable* that streams a
#     docker-archive tarball to stdout. We pipe that straight into skopeo.
#     No Docker, no buildx, no BuildKit, no Dockerfiles.
#
# Runner assumptions (verify on your runner before trusting a green check):
#   * runs-on: nix-host — THEBATTLESHIP's runner carries this HOST-mode
#     label. `nix` is on PATH; the host resolves
#     registry.starcommand.live:30050 to the in-cluster registry (LAN,
#     10.10.10.1 via /etc/hosts) and trusts it as an insecure plain-HTTP
#     registry. skopeo is run via `nix run nixpkgs#skopeo`.
#   * The registry is UNAUTHENTICATED — no login step, no secrets.
#   * This workflow only runs where the runner is attached — currently
#     Task's self-hosted Forgejo (git.starcommand.live). This repo does not
#     yet have a `starcommand` remote; add one and push before expecting
#     this workflow to fire (Codeberg/GitHub Actions won't see it).
name: images
on:
  push:
    branches: [main]

env:
  REGISTRY: registry.starcommand.live:30050
  # skopeo floats with nixpkgs; newer skopeo rejects the runner host's
  # v1-format /etc/containers/registries.conf outright ("must be in v2
  # format"). We don't need any registries.conf — the copy names the
  # registry explicitly with --dest-tls-verify/--no-creds — so point
  # skopeo at an empty (valid-v2) config instead of the host's.
  CONTAINERS_REGISTRIES_CONF: /dev/null

jobs:
  image:
    runs-on: nix-host
    steps:
      - name: Checkout
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          branch="${GITHUB_REF_NAME:-main}"
          sha="${GITHUB_SHA:-}"
          attempt=1
          until git clone --depth 1 --no-tags --branch "$branch" "$url" .; do
            [ "$attempt" -ge 8 ] && { echo "clone failed after 8 attempts"; exit 1; }
            echo "clone attempt $attempt failed — retrying in 15s"
            find . -mindepth 1 -delete 2>/dev/null || true
            attempt=$((attempt + 1)); sleep 15
          done
          if [ -n "$sha" ] && [ "$(git rev-parse HEAD)" != "$sha" ]; then
            attempt=1
            until git fetch --depth 1 --no-tags origin "$sha"; do
              [ "$attempt" -ge 8 ] && { echo "fetch sha failed"; exit 1; }
              echo "fetch attempt $attempt failed — retrying in 15s"
              attempt=$((attempt + 1)); sleep 15
            done
            git checkout --detach "$sha"
          fi
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Compute tags
        id: tags
        run: |
          short="$(git rev-parse --short HEAD)"
          echo "sha=sha-$short" >> "$GITHUB_OUTPUT"
          echo "tags: latest sha-$short"

      # Build the streamLayeredImage executable, run it to stream a
      # docker-archive to stdout, and pipe that into skopeo, which copies it
      # to the insecure plain-HTTP registry under the `latest` tag. Then a
      # cheap registry-to-registry `skopeo copy` re-tags that same digest as
      # the immutable sha-<short> tag.
      #
      # (`--additional-tag` is NOT used: for a docker:// destination it only
      # names the source archive, so the extra tag never lands in the
      # registry — hence the explicit second copy.)
      #
      # --src/--dest-no-creds: the LAN registry is unauthenticated, and
      # without these flags skopeo probes /run/containers/$UID/auth.json for
      # creds. As the gitea-runner user that path is present but unreadable
      # (EACCES) — a *fatal* error (a missing file is fine). --no-creds
      # skips the lookup entirely.
      - name: Push image
        run: |
          streamer="$(nix build .#image --no-link --print-out-paths)"
          "$streamer" | nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-tls-verify=false --dest-no-creds docker-archive:/dev/stdin \
            "docker://${REGISTRY}/fasttrackstudio-site:latest"
          nix run nixpkgs#skopeo -- --insecure-policy copy \
            --src-tls-verify=false --src-no-creds --dest-tls-verify=false --dest-no-creds \
            "docker://${REGISTRY}/fasttrackstudio-site:latest" \
            "docker://${REGISTRY}/fasttrackstudio-site:${{ steps.tags.outputs.sha }}"

      # Green run == the deployment is SERVING this commit, not just "image
      # pushed". The image bakes the git rev into /version.json (see
      # mkDioxusWebImage / Task's mkStaticSite for the pattern); poll until
      # it matches, or fail the run. Budget: the image-updater polls every
      # ~2min + rollout; 15min is generous — a timeout here means the
      # delivery pipeline is broken (stuck updater, failed rollout) and
      # SHOULD read as a red run.
      - name: Verify live
        run: |
          url="https://fasttrackstudio.app"
          want="${GITHUB_SHA}"
          echo "waiting for $url to serve $want"
          for i in $(seq 1 60); do
            web="$(curl -sf --max-time 10 "$url/version.json" | sed -n 's/.*"rev":"\([^"]*\)".*/\1/p' || true)"
            echo "  poll $i: web=${web:-?}"
            if [ "$web" = "$want" ]; then
              echo "LIVE: $url serves $want"
              exit 0
            fi
            sleep 15
          done
          echo "TIMED OUT: $url never served $want — check argocd-image-updater / rollouts"
          exit 1
