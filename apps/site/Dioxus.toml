[application]
name = "fts-site"
default_platform = "web"

[web.app]
title = "FastTrackStudio"

[web.watcher]
reload_html = true
# assets/guides is the guides vault (docs/guides symlinks to it) -
# already inside the watched assets dir, so note edits hot-serve in dev.
watch_path = ["src", "assets", "tailwind.css"]
