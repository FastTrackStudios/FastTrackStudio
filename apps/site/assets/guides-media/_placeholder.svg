<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-label="Screencast placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5b8cff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="718" height="403" rx="12"/></clipPath>
    <style>
      @keyframes sweep { 0% { transform: translateX(-260px) } 100% { transform: translateX(720px) } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.06); opacity: 1 } }
      @keyframes ring  { 0% { r: 46; opacity: .55 } 100% { r: 74; opacity: 0 } }
      @keyframes play  { 0% { transform: translateX(0) } 100% { transform: translateX(636px) } }
      .sheen { animation: sweep 2.8s linear infinite }
      .btn   { animation: pulse 2.2s ease-in-out infinite; transform-origin: 360px 176px }
      .ring  { animation: ring 2.2s ease-out infinite }
      .head  { animation: play 6s ease-in-out infinite alternate }
      @media (prefers-reduced-motion: reduce) { .sheen,.btn,.ring,.head { animation: none } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="720" height="405" fill="url(#bg)"/>
    <!-- faint grid -->
    <g stroke="#2b3547" stroke-width="1" opacity="0.5">
      <path d="M0 68 H720 M0 136 H720 M0 270 H720"/>
      <path d="M120 0 V405 M240 0 V405 M360 0 V405 M480 0 V405 M600 0 V405"/>
    </g>
    <!-- moving sheen -->
    <rect class="sheen" x="0" y="0" width="260" height="405" fill="url(#sheen)"/>

    <!-- play button -->
    <circle class="ring" cx="360" cy="176" fill="none" stroke="#5b8cff" stroke-width="2"/>
    <g class="btn">
      <circle cx="360" cy="176" r="46" fill="#5b8cff" fill-opacity="0.16" stroke="#5b8cff" stroke-width="2"/>
      <path d="M348 156 L388 176 L348 196 Z" fill="#8fb0ff"/>
    </g>

    <text x="360" y="272" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="15" letter-spacing="3" fill="#8fa0b8">SCREENCAST</text>
    <text x="360" y="296" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
          font-size="12" fill="#5c6b82">placeholder &#183; recording coming soon</text>

    <!-- transport timeline -->
    <rect x="42" y="356" width="636" height="4" rx="2" fill="#2b3547"/>
    <g class="head">
      <rect x="40" y="348" width="4" height="20" rx="2" fill="#5b8cff"/>
      <circle cx="42" cy="346" r="4" fill="#8fb0ff"/>
    </g>
  </g>

  <rect x="1" y="1" width="718" height="403" rx="12" fill="none" stroke="#37425a" stroke-width="1.5" stroke-dasharray="7 6"/>
</svg>
