[package]
name = "fts-native"
version.workspace = true
edition.workspace = true

[dependencies]
# Use dioxus-native from local blitz submodule with post-processing support
dioxus-native = { path = "../../libs/vendor/blitz/packages/dioxus-native", features = ["prelude"] }
dioxus-html = "0.7"

# Blitz crates from local submodule
blitz-dom = { path = "../../libs/vendor/blitz/packages/blitz-dom" }
blitz-traits = { path = "../../libs/vendor/blitz/packages/blitz-traits" }

# Anyrender for CustomPaintSource and ImageRenderer
anyrender = { path = "../../libs/vendor/anyrender/crates/anyrender" }
anyrender_vello = { path = "../../libs/vendor/anyrender/crates/anyrender_vello" }
wgpu_context = { path = "../../libs/vendor/anyrender/crates/wgpu_context" }

# Lumen Blocks - workspace dependency
lumen-blocks = { workspace = true }

# Icons
lucide-dioxus = "2"

# Keyflow for chart parsing
keyflow = { path = "../../packages/keyflow" }

# Engraver for layout system (with example features for Vello rendering)
engraver = { path = "../../packages/engraver", features = ["example"] }

# Vello for vector graphics rendering (match anyrender/engraver versions)
# NOTE: peniko re-exported from vello to avoid version conflicts
vello = "0.6"
kurbo = "0.12"

# WGPU integration (match blitz/anyrender)
wgpu = "26"
bytemuck = { version = "1", features = ["derive"] }

# Font parsing for text rendering
skrifa = "0.26"

# Async runtime for wgpu device creation
pollster = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Window management (match blitz version)
winit = "0.30"

[build-dependencies]
wesl = "0.2"

[lints]
workspace = true
