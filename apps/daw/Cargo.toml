[package]
name = "daw-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "daw_cli"
path = "src/lib.rs"

[[bin]]
name = "daw"
path = "src/main.rs"

[dependencies]
daw.workspace = true
vox.workspace = true
vox-stream.workspace = true
moire.workspace = true
tokio.workspace = true
clap.workspace = true
eyre.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json.workspace = true
facet.workspace = true
facet-json.workspace = true
libc = "0.2"
dawfile-reaper = { path = "../../features/backends/reaper/dawfile-reaper" }

[features]
default = []

[dev-dependencies]
# Integration-test harness via the daw facade's `test-harness` feature
# (replaces the former `reaper-test` crate).
daw = { workspace = true, features = ["test-harness"] }
eyre.workspace = true

[lints]
workspace = true
