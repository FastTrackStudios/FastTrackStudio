[package]
name = "reaper-extension"
version = "0.1.0"
edition = "2021"
description = "REAPER extension that provides FastTrackStudio integration"

[lib]
crate-type = ["cdylib"]
name = "reaper_fts"
path = "src/lib.rs"

[dependencies]
# REAPER bindings
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true
reaper-macros.workspace = true
swell-ui.workspace = true

# Protocols
actions-proto.workspace = true
actions-registry.workspace = true
input-reaper.workspace = true

# DAW facade (reaper impl + sync wrapper)
daw = { workspace = true, features = ["reaper", "sync"] }

# Keyflow guide generation
keyflow-proto.workspace = true
keyflow-midi.workspace = true

# Dynamic template (sorting items into track hierarchies)
dynamic-template-proto.workspace = true
dynamic-template.workspace = true

# Session (setlist management, navigation, auto-advance)
session.workspace = true

# Signal (rig/profile/preset management)
signal = { workspace = true, features = ["daw"] }

# Runtime
roam.workspace = true
roam-stream.workspace = true
moire.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fragile.workspace = true
anyhow = "1.0"
eyre = "0.6"
libloading = "0.8"
crossbeam-channel.workspace = true
camino = "1.1"
midly = "0.5.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26"
