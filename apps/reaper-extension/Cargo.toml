[package]
name = "reaper-extension"
version = "0.1.0"
edition = "2021"
description = "REAPER extension that provides FastTrackStudio integration"

[lib]
crate-type = ["cdylib"]
name = "reaper_fts"
path = "src/lib.rs"

[dependencies]
# REAPER bindings
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true
reaper-macros.workspace = true
swell-ui.workspace = true

# Protocols
actions-proto.workspace = true
actions-registry.workspace = true

# DAW facade (reaper impl + sync wrapper)
daw = { workspace = true, features = ["reaper", "sync"] }

# RT-aware allocator and task dispatch
daw-allocator.workspace = true

# Runtime
roam.workspace = true
roam-stream.workspace = true
moire.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fragile.workspace = true
anyhow = "1.0"
eyre = "0.6"
libloading = "0.8"
crossbeam-channel.workspace = true
camino = "1.1"
utils.workspace = true

[features]
default = ["rt-allocator", "eager-plugins"]
# Diagnostic feature flags — disable individually to isolate performance issues.
rt-allocator = []       # RT-safe deallocation offloading (global allocator wrapping)
eager-plugins = []      # Eagerly load fts-macros CLAP plugin at startup

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26"
