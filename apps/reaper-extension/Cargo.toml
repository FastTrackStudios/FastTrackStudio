[package]
name = "reaper-extension"
version = "0.1.0"
edition = "2021"
description = "REAPER extension that provides FastTrackStudio integration"

[lib]
crate-type = ["cdylib"]
name = "reaper_fts"
path = "src/lib.rs"

[dependencies]
# REAPER bindings
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true
reaper-macros.workspace = true
swell-ui.workspace = true

# Host runtime infrastructure
host-runtime.workspace = true

# Protocols
actions-proto.workspace = true
actions-registry.workspace = true
cell-host-proto.workspace = true
daw-proto.workspace = true
input-reaper.workspace = true

# DAW REAPER implementation (in-process, not a cell)
daw-reaper.workspace = true

# Dynamic template (sorting items into track hierarchies)
dynamic-template-proto.workspace = true
dynamic-template.workspace = true

# Runtime
roam.workspace = true
roam-telemetry.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fragile.workspace = true
anyhow = "1.0"
tempfile = "3.24.0"
crossbeam-channel.workspace = true
camino = "1.1"
