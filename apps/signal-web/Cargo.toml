[package]
name = "signal-web"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
license.workspace = true
authors.workspace = true

# The browser remote: the same guitar-rig UI (`signal-guitar-ui`), connected
# to a running `signal-engine` over a vox WebSocket. Only the UI is wasm — the
# audio engine stays native in rigd.

[dependencies]
dioxus = { workspace = true, features = ["web", "launch"] }
signal-guitar-proto.workspace = true
signal-guitar-ui.workspace = true
vox.workspace = true
vox-core.workspace = true
vox-websocket.workspace = true
session-proto.workspace = true
session-ui = { workspace = true, features = ["web"] }
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = { version = "0.3", default-features = false }
tracing.workspace = true
web-sys = { version = "0.3", features = ["Window", "Location", "Storage"] }
# Portable sleep for the connect-retry loop (browser timers on wasm).
architect = { workspace = true, features = ["platform", "iroh"] }

# wasm: uuid (pulled via signal-proto's typed ids) needs the js RNG.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
