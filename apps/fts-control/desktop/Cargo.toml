[package]
name = "fts-control-desktop"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2021"

[dependencies]
# UI - conditionally use Dioxus desktop (Wry/WebView) or native (Blitz/GPU)
dioxus = { version = "0.7.2", features = ["desktop"], optional = true }
dioxus-native = { workspace = true, optional = true }

# Session UI components - feature selected based on renderer
session-ui = { path = "../../../cells/session/session-ui", default-features = false }

# Services (run in-process)
session = { path = "../../../cells/session/session" }
session-proto.workspace = true
gateway-ws = { path = "../../../cells/gateway/gateway-ws" }
gateway-proto.workspace = true

# Roam - for connecting to host and service dispatch
roam.workspace = true
roam-stream.workspace = true
roam-local.workspace = true
roam-session.workspace = true

# DAW connection via Unix socket
host-client.workspace = true

# Protocols
daw-proto.workspace = true
daw-control.workspace = true
host-manager-proto.workspace = true
host-manager.workspace = true

# Async
tokio = { workspace = true, features = ["full"] }
futures.workspace = true

# Utils
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre.workspace = true
serde_json.workspace = true

# Chart rendering via anyrender (WGPU/Vello backend)
anyrender.workspace = true
anyrender_vello.workspace = true
vello = "0.7"
peniko.workspace = true
kurbo.workspace = true

# Keyflow chart editor UI
keyflow-ui = { path = "../../../cells/keyflow/keyflow-ui", default-features = false }
keyflow = { path = "../../../cells/keyflow/keyflow", features = ["text"] }

# Signal rig control UI
signal-ui = { path = "../../../cells/signal/signal-ui", default-features = false }
signal-control = { path = "../../../cells/signal/signal-control" }

# Chart engraver
engraver-proto = { path = "../../../cells/keyflow/engraver-proto", features = ["engraver"] }

[features]
# Default to desktop (Wry/WebView) renderer - fast and stable
default = ["desktop"]

# Desktop renderer using Wry/WebView (recommended)
desktop = ["dioxus", "session-ui/web", "keyflow-ui/web", "signal-ui/web"]

# Native GPU-accelerated renderer using Blitz (experimental)
native = ["dioxus-native", "session-ui/native", "keyflow-ui/native", "signal-ui/native"]

# Enable Blitz's built-in frame time logging (only works with native feature)
log-frame-times = ["dioxus-native/log-frame-times"]
