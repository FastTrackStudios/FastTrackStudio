[package]
name = "fts-control-desktop"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2021"

[dependencies]
# UI
dioxus = { version = "0.7.1", features = ["router"] }

# Roam - for connecting to host
roam.workspace = true
roam-stream.workspace = true
roam-local.workspace = true

# Protocols
daw-proto.workspace = true
daw-control.workspace = true
gateway-proto.workspace = true
host-manager-proto.workspace = true
host-manager.workspace = true

# Async
tokio.workspace = true
futures.workspace = true

# Utils
tracing.workspace = true
eyre.workspace = true

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
