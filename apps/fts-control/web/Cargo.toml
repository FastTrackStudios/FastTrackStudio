[package]
name = "fts-control-web"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2021"

[dependencies]
# Dioxus UI framework
dioxus = { version = "0.7.2", features = ["router"] }

# Roam RPC over WebSocket (WASM-compatible)
roam.workspace = true
roam-websocket.workspace = true

# DAW control API - same API works on desktop and web
daw.workspace = true

# Session control - setlist and song navigation
session-proto.workspace = true

# Session UI components
session-ui.workspace = true

# Keyflow chart rendering (WASM WebGL2 backend)
keyflow.workspace = true
keyflow-ui = { workspace = true, default-features = false, features = ["wasm-panels"] }

# Rendering primitives (used by chart canvas)
anyrender.workspace = true
peniko.workspace = true
kurbo.workspace = true

# Actions system - command palette and action execution
actions-proto.workspace = true
actions-standalone.workspace = true

# Async/WASM utilities
futures.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
async-lock = "3.4"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"

# Web APIs (for window.location to get WebSocket URL)
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlCanvasElement", "DomRect"] }

# Logging in browser
tracing = "0.1"
tracing-wasm = "0.2"

# Error handling
eyre.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
