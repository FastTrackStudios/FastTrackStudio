[package]
name = "fts-installer"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition.workspace = true

[dependencies]
# Root pins dioxus default-features = false, features = ["lib"]; the
# installer is a desktop binary (launch/asset! macros), so defaults go
# back on plus the desktop renderer.
dioxus = { workspace = true, default-features = true, features = ["desktop", "launch"] }
installer-core.workspace = true
utils.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
eyre.workspace = true
clap.workspace = true
rfd = "0.17"
