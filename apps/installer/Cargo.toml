[package]
name = "fts-installer"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition.workspace = true
license.workspace = true

# Thin downloader/installer for FastTrackStudio releases (codeberg).
# Resolves a release via the Gitea API, downloads the platform tarball
# with progress + retry, verifies SHA256SUMS, and applies the same
# installed layout as `just install` / the tarball's install.sh.

[dependencies]
installer-core.workspace = true
clap.workspace = true
eyre.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Same HTTP stack as installer-core (rustls, streaming).
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
tar = "0.4"
flate2 = "1"
# .tar.xz (REAPER + SWS downloads on Linux); static liblzma so the shipped
# binary has no system lzma dependency.
xz2 = { version = "0.1", features = ["static"] }
# .zip (the macOS plugin bundle release asset — Apple notarization only
# accepts zip/pkg/dmg, not tar.gz).
zip = { version = "2", default-features = false, features = ["deflate"] }
