[package]
name = "fasttrackstudio-desktop"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition.workspace = true

[dependencies]
# UI
dioxus = { workspace = true, features = ["desktop"] }

# Session — facade, UI, and the shared CLI connection helper
session.workspace = true
session-ui = { workspace = true, features = ["web"] }
session-cli.workspace = true

# Vox RPC (gateway link/dispatch + connection)
vox.workspace = true

# WebSocket gateway
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }

# Async
tokio = { workspace = true, features = ["full"] }
moire.workspace = true

# Utils
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre.workspace = true
