[package]
name = "signal-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "signal-desktop"
path = "src/main.rs"

[features]
# `dev` enables the WebKit/WRY renderer via `dioxus::desktop` for hot-reload
# development with `dx serve`.  It is the DEFAULT so that plain `dx serve`
# works without extra flags (dx 0.7.x doesn't read `features` from Dioxus.toml).
#
# Production / nix builds pass `--no-default-features` to use the
# `nice_plug_dioxus` Blitz/wgpu renderer — the same pipeline as fts-signal-plugin.
default = ["dev"]
dev = ["dioxus/desktop"]

[dependencies]
signal.workspace = true
daw-midi-io.workspace = true
signal-sampler.workspace = true
signal-ui = { workspace = true, default-features = false, features = ["desktop"] }
# Blitz renderer — same pipeline as fts-signal-plugin (VST3/CLAP).
# Do NOT enable dioxus/desktop here; that pulls in WebKit/WRY which conflicts.
# Use --features dev for dx serve hot-reload workflow instead.
nice-plug-dioxus.workspace = true
# dioxus is needed for component macros (rsx!, #[component], Element) and,
# when --features dev is active, for the WebKit/WRY desktop renderer.
dioxus.workspace = true
dock-dioxus = { workspace = true, default-features = false, features = ["web"] }
dock-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
