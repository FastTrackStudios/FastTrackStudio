[package]
name = "signal-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "signal-desktop"
path = "src/main.rs"

[features]
# Enable the `dev` feature to use the WebKit/WRY renderer via `dioxus::desktop`.
# This is ONLY for rapid prototyping with `dx serve` — it enables hot-reloading
# of RSX templates and instant feedback on layout/styling changes.
#
#   dx serve --features dev
#
# The production/plugin renderer uses `nih_plug_dioxus` (Blitz/wgpu), which
# guarantees identical rendering in both standalone and VST3/CLAP contexts.
# RSX components are renderer-agnostic, so dev → prod divergence is minimal.
dev = ["dioxus/desktop"]

[dependencies]
signal.workspace = true
signal-audio.workspace = true
signal-sampler.workspace = true
signal-ui = { workspace = true, default-features = false, features = ["desktop"] }
# Blitz renderer — same pipeline as fts-signal-plugin (VST3/CLAP).
# Do NOT enable dioxus/desktop here; that pulls in WebKit/WRY which conflicts.
# Use --features dev for dx serve hot-reload workflow instead.
nih_plug_dioxus.workspace = true
# dioxus is needed for component macros (rsx!, #[component], Element) and,
# when --features dev is active, for the WebKit/WRY desktop renderer.
dioxus.workspace = true
dock-dioxus = { workspace = true, default-features = false, features = ["web"] }
dock-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
