[package]
name = "fasttrackstudio-desktop"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2021"

[dependencies]
# UI
dioxus = { version = "0.7.2", features = ["desktop"] }

# Session
session.workspace = true
session-ui = { workspace = true, features = ["web"] }

# Vox RPC
vox.workspace = true
vox-stream.workspace = true

# DAW facade
daw = { workspace = true, features = ["sync"] }

# WebSocket gateway
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }

# Async
tokio = { workspace = true, features = ["full"] }
moire.workspace = true

# Utils
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre.workspace = true
