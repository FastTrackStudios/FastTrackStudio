[package]
name = "ui-showcase"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "ui-showcase"
path = "src/main.rs"

[dependencies]
# Reusable DAW panels under test (TrackControlPanel / MixerControlPanel /
# ArrangeView / DawWorkspace) + their widgets — now part of daw-ui.
daw-ui = { path = "../../features/ui/daw-ui" }
dioxus = { workspace = true }
# Native (Blitz/GPU) renderer — `dioxus_native::launch`.
dioxus-native = { workspace = true }

[lints]
workspace = true
