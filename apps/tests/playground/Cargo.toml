[package]
name = "playground"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
signal2.workspace = true
signal2-ui.workspace = true

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
