[package]
name = "playground"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { workspace = true }
signal.workspace = true
signal-ui.workspace = true
macromod.workspace = true
lumen-blocks.workspace = true
tokio = { workspace = true, features = ["time"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
