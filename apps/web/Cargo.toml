[package]
name = "web"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2024"
description = "FastTrackStudio Web App - Documentation, chart browser, and more"

[dependencies]
# Dioxus web framework
dioxus = { version = "0.7.3", features = ["router"] }

# UI component library (shadcn-inspired, Tailwind-styled)
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", package = "lumen-blocks" }
dioxus-sdk-time = "0.7"
lucide-dioxus = "2"

# Chart parsing and layout
keyflow = { path = "../../packages/keyflow", features = ["engraver", "highlighting"] }

# Geometry (match engraver version)
kurbo = "0.12"

# Graphics rendering (cross-platform)
vello = "0.6"
peniko = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Dioxus web feature for WASM
dioxus = { version = "0.7.1", features = ["router", "web"] }

# Override fontique to disable system feature (not available on WASM)
fontique = { version = "0.2", default-features = false, features = ["std"] }
parley = { version = "0.2", default-features = false, features = ["std"] }

# Override uuid to enable js feature for WASM (uses browser crypto API)
uuid = { version = "1.0", features = ["serde", "v4", "js"] }

# WASM-specific utilities
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "registry"] }

# Web APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Navigator",
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
    "GpuCanvasContext",
    "GpuTextureFormat",
    "CanvasRenderingContext2d",
    "Performance",
    "Location",
    # Mouse/touch interaction
    "MouseEvent",
    "WheelEvent",
    "EventTarget",
    "AddEventListenerOptions",
    "DomRect",
    # Resize observation
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "ResizeObserverBoxOptions",
] }

# Graphics rendering (WASM) - version must match vello 0.6's wgpu dependency
wgpu = { version = "26", features = ["webgpu", "webgl"] }

# Async runtime for WASM
tokio = { version = "1.0", default-features = false, features = ["sync"] }

# Random number generation for WASM (needed for getrandom 0.2 used by uuid)
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Desktop/server dependencies
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[lints]
workspace = true
