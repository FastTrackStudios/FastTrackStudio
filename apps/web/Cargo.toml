[package]
name = "fasttrackstudio-web"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition.workspace = true

[dependencies]
# UI
dioxus = { workspace = true }

# Session
session.workspace = true
session-ui = { workspace = true, features = ["web"] }

# Vox RPC (WASM-compatible) — declared directly (not `.workspace = true`)
# because Cargo won't let a member override `default-features` on an
# inherited dependency. Default features pull in `transport-tcp`/
# `transport-local` (vox-stream), which drag mio's native socket backend
# into the wasm32 build. This target only ever connects over WebSocket.
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime", "transport-websocket"] }
vox-websocket.workspace = true

# Async/WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Performance"] }

# Logging
tracing = "0.1"
tracing-wasm = "0.2"

[features]
default = ["web"]
web = ["dioxus/web"]
