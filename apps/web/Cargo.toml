[package]
name = "fasttrackstudio-web"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition.workspace = true

[dependencies]
# UI
dioxus = { workspace = true }

# Session
session.workspace = true
session-ui = { workspace = true, features = ["web"] }

# Vox RPC (WASM-compatible)
vox.workspace = true
vox-websocket.workspace = true

# DAW types
daw.workspace = true

# Async/WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Performance"] }

# Logging
tracing = "0.1"
tracing-wasm = "0.2"

[features]
default = ["web"]
web = ["dioxus/web"]
