[package]
name = "signal-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The browser remote: the same guitar-rig UI (`signal-guitar-ui`), connected
# to a running `signal-rigd` over a vox WebSocket. Only the UI is wasm — the
# audio engine stays native in rigd.

[dependencies]
dioxus = { workspace = true, features = ["web", "launch"] }
signal-guitar-proto.workspace = true
signal-guitar-ui.workspace = true
vox-core.workspace = true
vox-websocket.workspace = true
tracing.workspace = true
web-sys = { version = "0.3", features = ["Window", "Location"] }
# Portable sleep for the connect-retry loop (browser timers on wasm).
architect = { workspace = true, features = ["platform"] }

# wasm: uuid (pulled via signal-proto's typed ids) needs the js RNG.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
