[package]
name = "web"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2021"
description = "FastTrackStudio Web App - Chart viewer with real-time playback sync"

[dependencies]
# Dioxus web framework
dioxus = { version = "0.7.1", features = ["router"] }

# Chart data types and layout
keyflow = { path = "../../packages/keyflow", features = ["engraver"] }
fts = { path = "../../modules/fts", features = ["iroh"] }

# Geometry (match engraver version)
kurbo = "0.12"

# Graphics rendering (cross-platform)
vello = "0.6"
peniko = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# Async utilities
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Dioxus web feature for WASM
dioxus = { version = "0.7.1", features = ["router", "web"] }

# Override fontique to disable system feature (not available on WASM)
fontique = { version = "0.2", default-features = false, features = ["std"] }
parley = { version = "0.2", default-features = false, features = ["std"] }

# WASM-specific utilities
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

# Web APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Navigator",
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
    "GpuCanvasContext",
    "GpuTextureFormat",
    "CanvasRenderingContext2d",
    "Performance",
    "Location",
] }

# Note: iroh P2P support for WASM requires additional work
# iroh = { version = "0.95", default-features = false }
# irpc = { version = "0.11.0", features = ["rpc", "derive"] }
# irpc-iroh = "0.11.0"

# Graphics rendering (WASM)
wgpu = { version = "25", features = ["webgpu", "webgl"] }

# Async runtime for WASM
tokio = { version = "1.0", default-features = false, features = ["sync"] }

# Random number generation for WASM
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Desktop/server dependencies
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]

[lints]
workspace = true
