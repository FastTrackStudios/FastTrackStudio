[package]
name = "task-web"
version.workspace = true
edition.workspace = true

[[bin]]
name = "task-web"
path = "src/main.rs"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7.2", features = ["router"] }
fts-ui.workspace = true
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http", "json", "websocket"] }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage"] }
js-sys = "0.3"
futures.workspace = true
slug = "0.1"
