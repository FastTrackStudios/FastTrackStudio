[package]
name = "session-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "session_cli"
path = "src/lib.rs"

[[bin]]
name = "session"
path = "src/main.rs"

[dependencies]
daw = { workspace = true, features = ["file"] }
daw-proto.workspace = true
session-proto.workspace = true
vox.workspace = true
vox-stream.workspace = true
moire.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }
eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
facet.workspace = true
facet-json.workspace = true
clap = { version = "4", features = ["derive"] }
