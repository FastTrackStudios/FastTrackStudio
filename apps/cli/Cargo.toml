[package]
name = "task-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "task"
path = "src/main.rs"

[dependencies]
vox = { workspace = true, features = ["transport-websocket", "transport-websocket-tls"] }
tokio = { workspace = true }
chrono.workspace = true
eyre.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# `task-cli vault …` subcommands operate on a filesystem vault
# via vault-obsidian's parsed helpers (outline / tasks / props /
# base-query) and vault-live's wire types (refs::Ref, bases::*).
vault.workspace = true
vault-live = { workspace = true }
vault-obsidian = { workspace = true }
# `task-cli task …` subcommands — first-party task feature.
task.workspace = true
# `task-cli agent …` subcommands — drives `codex app-server`
# via agent-codex (vendored CodexMonitor control plane).
agent-codex.workspace = true
agent-proto.workspace = true
# `task-cli wiki ingest` — agent-driven two-step CoT ingest
# of source files into `<vault>/Wiki/`.
agent-wiki.workspace = true
wiki-live.workspace = true
# `task-cli wiki graph|gaps` — pure-computation graph layer
# (no LLM).
wiki-graph.workspace = true
wiki-proto.workspace = true
wiki-search.workspace = true
# `task-cli timer …` — local time tracking against a sqlite
# db. No server needed; the same `timer::Store` the server
# mounts works fine for a single-user CLI session.
timer-proto = { workspace = true, features = ["server", "vox"] }
timer = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
# `task-cli auth …` — local-sqlite ArchitectAuth flow. Same
# auth.sqlite the server opens (matched by XDG path). Remote
# vox-client sign-in lands in a follow-up.
architect-auth = { workspace = true, features = ["full"] }
sha2 = "0.10"
base64 = { workspace = true }
# Project lookup for timer's project-defaults resolver.
project = { workspace = true }
# Org-root layout (Phase 1 of plans/federated-task-platform.md).
# Owns `task org init|list` + the `DataRoot` / `OrgRoot` path
# resolvers. Existing auth/timer/finance paths keep working at
# their XDG locations until PR 2 migrates them through OrgRoot.
org-proto = { workspace = true }
# Mount registry — `task mount add|list|rm` reads/writes
# `mounts.toml` and resolves project-id → local path.
mount = { workspace = true }
# Cyclic life-calendar — `task cycle current|list` reads
# from the pure-function generator.
cycle = { workspace = true }
# Finance — reports + invoice build. CLI shells out to the
# `task-pdf-render` binary (libs/pdf) for the actual PDF
# render; pulling fulgur into the CLI's compile graph hits a
# stylo recursion-limit issue we can't easily patch around.
finance-proto = { workspace = true, features = ["server"] }
finance-db = { workspace = true }
finance = { workspace = true }
walkdir = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
# Pull TASK_SERVER (and friends) from a `.env` file in CWD or any
# parent dir, so a user can `task list` instead of typing
# `--server ws://...` every time.
dotenvy = "0.15"

[lints]
workspace = true
