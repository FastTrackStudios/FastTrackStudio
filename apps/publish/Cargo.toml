[package]
name = "task-publish"
version.workspace = true
edition.workspace = true

# Static-site generator for `.loro` vault snapshots — Quartz
# equivalent that reads the same source-of-truth the live app
# uses and emits a publishable doc site.
#
# See `plans/vault-publisher.md` for architecture + phases.

[[bin]]
name = "task-publish"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
eyre = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Dioxus SSR — render rsx! to HTML strings. Same component DSL
# as the live web app so we can lift components into a shared
# crate later and reuse them between live + published views.
# Future: hydrate the static HTML into an interactive client
# app for search/graph/dark-mode without rewriting components.
dioxus = { workspace = true }
dioxus-ssr = { workspace = true }

# Syntax highlighting for code blocks. `default-fancy` enables
# regex-based parsing of Sublime grammars (fancy-regex backend);
# we strip `default-themes` because we ship our own ~200-line
# CSS theme via `assets/style.css` instead.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

crdt = { workspace = true }
knowledge-proto = { workspace = true }
knowledge-crdt = { workspace = true }
project-proto = { workspace = true }
architect = { workspace = true }
