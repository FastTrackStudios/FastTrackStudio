[package]
name = "app-server"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[[bin]]
name = "app-server"
path = "src/main.rs"

# Axum HTTP + vox WebSocket. The actual repository implementation comes
# from the `example` facade, which selects backend by cargo feature.
# Pick exactly one at build time:
#
#   cargo run -p app-server --features backend-db      # default
#   cargo run -p app-server --no-default-features --features backend-memory

[features]
default = ["backend-db"]
# Note both backend features enable `example/server-axum` so the
# axum WebSocket adapter is available regardless of which storage
# backend the binary picks.
backend-db = [
    "example/backend-db",
    "example/server-axum",
    "example/vox",
    "dep:sea-orm",
    "dep:sea-orm-migration",
]
backend-memory = [
    "example/backend-memory",
    "example/server-axum",
    "example/vox",
]
full = ["backend-db", "backend-memory"]

[dependencies]
example = { workspace = true }

axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true

# Pulled in only when backend-db is on. We hold a `DatabaseConnection` in
# AppState and run migrations on boot — both are sea-orm specific.
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }

uuid.workspace = true
