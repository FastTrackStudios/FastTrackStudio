[package]
name = "task-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Database control plane. Subcommands:
#
#   task-db up      run pending crdt-seaorm migrations
#   task-db seed    populate every feature's CRDT with fake data
#                   via the architect-emitted seed_fake_<entity>
#                   helpers, then compact to a snapshot the
#                   sync-demo server hydrates on startup
#   task-db         shorthand for `up` then `seed`
#
# All mutations flow through Loro's `subscribe_local_update` →
# `SeaOrmPersistence::append_update` path. The compact step at the
# end of `seed` writes one consolidated snapshot.

[dependencies]
tokio = { version = "1", features = ["full"] }
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
uuid.workspace = true

crdt.workspace = true
crdt-seaorm.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true

# Every feature's proto + crdt — the proto for the seed helper, the
# crdt for the matching RepoLoro newtype that wraps a shared CrdtDoc.
agent-proto = { workspace = true, features = ["fake"] }
agent-crdt.workspace = true
caldav-proto = { workspace = true, features = ["fake"] }
caldav-crdt.workspace = true
calendar-proto = { workspace = true, features = ["fake"] }
calendar-crdt.workspace = true
chat-proto = { workspace = true, features = ["fake"] }
chat-crdt.workspace = true
conference-proto = { workspace = true, features = ["fake"] }
conference-crdt.workspace = true
cookbook-proto = { workspace = true, features = ["fake"] }
cookbook-crdt.workspace = true
email-proto = { workspace = true, features = ["fake"] }
email-crdt.workspace = true
finance-proto = { workspace = true, features = ["fake"] }
finance-crdt.workspace = true
fitness-proto = { workspace = true, features = ["fake"] }
fitness-crdt.workspace = true
inventory-proto = { workspace = true, features = ["fake"] }
inventory-crdt.workspace = true
invoice-proto = { workspace = true, features = ["fake"] }
invoice-crdt.workspace = true
location-proto = { workspace = true, features = ["fake"] }
location-crdt.workspace = true
person-proto = { workspace = true, features = ["fake"] }
