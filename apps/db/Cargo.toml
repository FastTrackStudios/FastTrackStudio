[package]
name = "task-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Database control plane. Subcommands:
#
#   task-db up      run pending crdt-seaorm migrations
#   task-db seed    populate every feature's CRDT with fake data
#                   via the architect-emitted seed_fake_<entity>
#                   helpers, then compact to a snapshot the
#                   sync-demo server hydrates on startup
#   task-db         shorthand for `up` then `seed`
#
# All mutations flow through Loro's `subscribe_local_update` →
# `SeaOrmPersistence::append_update` path. The compact step at the
# end of `seed` writes one consolidated snapshot.

[dependencies]
tokio = { version = "1", features = ["full"] }
chrono.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
uuid.workspace = true

crdt.workspace = true
crdt-seaorm.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true

# Vertical-slice reset: only project trio remains.
project-proto = { workspace = true, features = ["fake"] }
project-crdt.workspace = true
