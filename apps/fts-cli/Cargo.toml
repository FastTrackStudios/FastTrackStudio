[package]
name = "fts-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fts"
path = "src/main.rs"

[dependencies]
session-cli.workspace = true
session-proto.workspace = true
# Facade — needed directly (not just transitively) so this crate can read the
# `<Trait>Actions::all()` const lists the `#[architect::actions]`-decorated
# modules emit, to generate the `fts session <action>` subcommand surface.
session.workspace = true
architect.workspace = true
# fts-extensions' own #[architect::actions] declarations (21 actions) —
# pure metadata, no REAPER deps, so this pulls in nothing heavier than
# `architect` itself.
fts-extensions-actions.workspace = true
daw-proto.workspace = true
vox.workspace = true
vox-stream.workspace = true
moire.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "time"] }
eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
which = "7"
ratatui = "0.28"
crossterm = "0.28"
# Daemon protocol: facet-defined messages + postcard wire encoding.
# Both stay in the reflective path so the CLI client doesn't trigger
# vox-jit's cranelift compile (the 870ms cold-start cost we're
# avoiding by introducing the daemon in the first place).
facet.workspace = true
facet-postcard.workspace = true
libc = "0.2"

# Disabled until the corresponding domain crates catch up to the
# current vox / facet / daw API:
# - daw-cli + daw  → ported, but fts-cli's own daw.rs / introspect.rs
#   modules still reference removed APIs (FxParamHandle, private Daw,
#   …). Re-add after a port.
# - signal-cli + signal + macromod → signal pins old
#   Codys-Wright/vox@2a2f793b (facet 0.44); workspace runs facet 0.46.
#
# daw-cli.workspace = true
# daw = { workspace = true, features = ["file"] }
# signal-cli.workspace = true
# signal.workspace = true
# macromod.workspace = true
# serde_json.workspace = true
# serde.workspace = true
# midly = "0.5.3"
