[package]
name = "fts-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fts"
path = "src/main.rs"

[dependencies]
session-cli.workspace = true
session-proto.workspace = true
daw-proto.workspace = true
vox.workspace = true
vox-stream.workspace = true
moire.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "time"] }
eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
which = "7"
ratatui = "0.28"
crossterm = "0.28"

# Disabled until the corresponding domain crates catch up to the
