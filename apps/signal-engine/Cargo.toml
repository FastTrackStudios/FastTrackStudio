[package]
name = "signal-engine"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
license.workspace = true
authors.workspace = true

# The signal engine: the 100%-headless guitar-rig core serving its vox
# router over a WebSocket. Every GUI — browser wasm, desktop, tablets on the
# same network, an embedded pedalboard's front panel — is a remote client of
# this process. This is the same router the desktop app serves in-process.

[dependencies]
signal-guitar.workspace = true
signal-sampler.workspace = true
architect = { workspace = true, features = ["vox", "server-axum"] }
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The native PipeWire duplex backend is Linux-only (cpal's pipewire host);
# on macOS/other platforms the sampler core falls back to plain cpal
# (CoreAudio), keeping the engine buildable on darwin (voyager).
[target.'cfg(target_os = "linux")'.dependencies]
signal-sampler = { workspace = true, features = ["pipewire"] }

[features]
# p2p transport: serve the same vox router over an iroh endpoint, dialable
# by bare EndpointId from anywhere (endpoint id logged at startup and
# written to ~/.config/signal/iroh-endpoint-id).
default = ["iroh"]
iroh = ["architect/iroh"]
