[package]
name = "signal-native"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "signal-native"
path = "src/main.rs"

[dependencies]
# Dioxus-native (Blitz/Vello/wgpu) renderer, pulled from the blitz repo and
# renamed to `dioxus` so app code uses `use dioxus::prelude::*`. Pinned to the
# SAME blitz rev as signal's [patch] table, so the whole graph shares one
# blitz / dioxus-core (also used by nih_plug_dioxus + signal-ui).
# Run with `dx serve --platform native` (hot-reload) or `cargo run`.
dioxus = { package = "dioxus-native", git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4", features = ["prelude", "system-fonts"] }
# Shared UI components (Piano, …). Built against crates.io dioxus 0.7.x; unifies
# with dioxus-native on dioxus-core at link time.
signal-ui = { workspace = true, default-features = false, features = ["desktop"] }
# The sampler player under test + MIDI input.
signal-sampler.workspace = true
signal-audio.workspace = true
# Runtime-agnostic timer for the MIDI / readout poll loops (dioxus-native
# doesn't necessarily run a tokio reactor, so avoid tokio::time here).
futures-timer = "3"
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
