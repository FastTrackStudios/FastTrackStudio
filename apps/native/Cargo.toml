[package]
name = "fts-ui-showcase-native"
version.workspace = true
edition.workspace = true

[dependencies]
# Pull dioxus-native from the Blitz repo (per upstream guidance) but rename
# it to `dioxus` so app code can keep `use dioxus::prelude::*`. The fts-ui
# library crate independently depends on the real crates.io `dioxus`; both
# unify on dioxus-core 0.7.x at link time.
dioxus = { package = "dioxus-native", git = "https://github.com/DioxusLabs/blitz.git", features = ["prelude", "system-fonts"] }
fts-ui = { workspace = true }
fts-story-shell.workspace = true
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
