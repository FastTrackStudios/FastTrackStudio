[package]
name = "task-server"
version.workspace = true
edition.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
base64 = "0.22"

axum = { version = "0.8", features = ["ws"] }
chrono.workspace = true
uuid.workspace = true
hostname = "0.4"
futures.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
slug = "0.1"
task-db = { path = "../../crates/task-db" }
task-core = { workspace = true, features = ["realtime"] }
vox = { workspace = true, features = ["transport-websocket"] }
better-auth = { workspace = true, features = ["axum"] }
better-auth-core = { workspace = true }
better-auth-api = { workspace = true, features = ["rustls"] }
