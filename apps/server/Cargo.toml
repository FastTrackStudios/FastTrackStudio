[package]
name = "task-server"
version.workspace = true
edition.workspace = true
publish = false

# task-server — the canonical vox endpoint.
#
# Vertical-slice scope: `/health` + `/vox`. The vox handler accepts
# per-entity Repo dispatchers emitted by architect on the project
# feature trio (Project / Task / Cycle / Milestone). Each dispatcher
# wraps a `*RepoLoro` constructed against the shared workspace
# `CrdtDoc` opened over `crdt-seaorm`.

[dependencies]
tokio = { workspace = true, features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
uuid.workspace = true
async-trait.workspace = true
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

crdt.workspace = true
crdt-seaorm.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true

task-db = { path = "../db" }

project-proto = { workspace = true }
project-crdt = { workspace = true }
knowledge-proto = { workspace = true }
knowledge-crdt = { workspace = true }
attachments-proto = { workspace = true }
vault-sync-proto = { workspace = true }
vox = { workspace = true }
chrono.workspace = true
architect = { workspace = true, features = ["server-axum"] }
architect-auth = { workspace = true, features = ["full"] }

[dev-dependencies]
# Native vox client for the end-to-end sync test in `tests/sync.rs`.
vox = { workspace = true, features = ["transport-websocket"] }
loro = "1.10"
futures = { workspace = true }
crdt = { workspace = true }
project-crdt = { workspace = true }
project-proto = { workspace = true, features = ["fake"] }
knowledge-proto = { workspace = true }
attachments-proto = { workspace = true }
architect = { workspace = true }
chrono = { workspace = true }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
walkdir = { workspace = true }
tower = { version = "0.5", features = ["util"] }
knowledge-crdt = { workspace = true }
vault-sync-proto = { workspace = true }
