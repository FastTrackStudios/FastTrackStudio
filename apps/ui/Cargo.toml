[package]
name = "example-ui"
version = "0.1.0"
edition = "2024"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

# Shared Dioxus components. Platform-agnostic — `apps/web` and
# `apps/desktop` mount the same `App` component. Anywhere we need
# to talk to the server, we go through `ExampleServiceClient` via
# `vox-websocket`, which compiles for both wasm32 and native.

[dependencies]
example-proto = { path = "../../features/example/example-proto" }
dioxus = { version = "0.7.9", default-features = false, features = ["lib", "router"] }
# vox with `runtime` only — matches the workspace's wasm-clean baseline so
# this crate compiles for wasm32 (where `apps/web` consumes it).
vox = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5", default-features = false, features = ["runtime"] }
vox-core = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
vox-websocket = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
uuid = { version = "1", features = ["v4", "js"] }
