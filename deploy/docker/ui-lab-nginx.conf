# nginx vhost for ui-lab (vite SPA).
#
# ui-lab already derives its backend URL same-origin
# (location.origin -> ws), so the Ingress in front routes the API
# paths (/vox, /org, /server, /blobs, /.well-known) to task-server on
# the same host; this vhost only serves the static dist.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    # Vite emits content-hashed files under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
