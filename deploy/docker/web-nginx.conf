# nginx vhost for the Task wasm web app (dx bundle).
#
# The bundle is env-agnostic: when TASK_VOX_URL_WEB is NOT baked at
# compile time the app derives its vox websocket URL from
# window.location at runtime, so one image serves any hostname. The
# reverse proxy / Ingress in front of this container must route the
# API paths (/vox, /org, /server, /blobs, /.well-known) to task-server
# on the SAME host — this vhost only serves static files.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # dx emits .wasm under /wasm/ and /assets/; make sure the mime
    # type is right even if the base image's mime.types predates it.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # Hashed artifacts (tailwind-dxh….css, task-app-web_bg.wasm, …):
    # safe to cache forever — a new build emits new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /wasm/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entrypoint must always be revalidated so deploys roll out.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: the dioxus router owns every other path.
    location / {
        try_files $uri /index.html;
    }
}
