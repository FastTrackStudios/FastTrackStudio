# Sibling source pins for clean-context builds.
#
# The Task workspace has hard `path = "../..."` dependencies on sibling
# repos (see the root Cargo.toml's [workspace.dependencies] + [patch]
# sections). A checkout of Task alone CANNOT build `task-server` or the
# web bundle — the siblings must sit next to the repo in this layout:
#
#   <root>/Task                                (this repo)
#   <root>/Editor
#   <root>/architect
#   <root>/FastTrackStudio/fts-ui
#   <root>/FastTrackStudio/keyflow
#   <root>/FastTrackStudio/input_actions
#   <root>/FastTrackStudio/daw
#
# `siblings.sh` consumes this file. Columns (whitespace-separated):
#   <dest-path-relative-to-root>  <clone-url>  <commit-sha>
#
# Maintenance: when you bump a sibling (new commits in ../Editor etc.),
# push the sibling branch FIRST, then update the sha here. A sha that
# only exists in your local checkout builds locally (siblings.sh prefers
# local checkouts) but breaks CI and self-hosters.
#
# All pins below are published and clone-able (2026-06-12).
