[workspace.metadata.crane]
name = "fasttrackstudio"

[workspace]
members = [
    # Apps
    "apps/keyflow-playground",
    "apps/installer",
    "apps/tests/wasm",
    # Tools
    "xtask",
]
resolver = "2"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/FastTrackStudios/FastTrackStudio"
authors = ["FastTrack Studio"]

[workspace.dependencies]
# Facet ecosystem — only `facet` (xtask's CLI struct, via figue) and
# `facet-postcard` (fts-cli's daemon wire protocol) are actually used
# directly by our own code; everything RPC-related (session/daw/keyflow
# types crossing the vox wire) carries its OWN facet pin internally and
# is untouched by this version (this ecosystem does not keep facet-core
# uniform even within a single sibling repo — see fts-extensions' lock,
# which has 0.44.4/0.46.5/0.50.0-rc.5 coexisting). 0.46 is the version
# where `facet` (figue's requirement) and `facet-postcard` (facet-core
# ^0.46, via facet-postcard 0.46.1) actually overlap.
facet = { version = "0.46" }
facet-postcard = { version = "0.46" }
facet-styx = { version = "3.0" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
anyhow = "1.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures = "0.3"
clap = { version = "4", features = ["derive"] }

# Vox crates — plain crates.io releases (matches fts-extensions / session
# (dev) / daw (main)). The old Codys-Wright/vox git fork lineage is retired;
# 0.10 renamed/restructured several subcrates (vox-fdpass, vox-phon, vox-rt,
# vox-rt-macros replace vox-inprocess/vox-jit/vox-codegen/vox-local/
# subject-rust from the pre-0.10 fork).
vox = { version = "0.10.0-rc.5" }
vox-core = { version = "0.10.0-rc.5" }
vox-schema = { version = "0.10.0-rc.5" }
vox-stream = { version = "0.10.0-rc.5" }
vox-websocket = { version = "0.10.0-rc.5" }
vox-types = { version = "0.10.0-rc.5" }
vox-fdpass = { version = "0.10.0-rc.5" }
vox-phon = { version = "0.10.0-rc.5" }
vox-rt = { version = "0.10.0-rc.5" }
vox-rt-macros = { version = "0.10.0-rc.5" }
vox-macros-core = { version = "0.10.0-rc.5" }
vox-macros-parse = { version = "0.10.0-rc.5" }
vox-service-macros = { version = "0.10.0-rc.5" }

# Instrumentation
# diagnostics feature disabled — moire's backtrace capture panics on NixOS
# (broken frame pointers / dladdr inside REAPER-loaded .so), and cargo
# feature-unification would force it on across the whole graph (incl vox's
# JIT encode path → abort). Matches daw/session.
moire = { version = "1.0" }

# Keyflow/Engraver crates (sibling repo — facade pattern)
# NOTE: keyflow-proto, keyflow-text, keyflow-midi, engraver-proto are INTERNAL.
# Access them through the `keyflow` or `engraver` facade crates.
keyflow = { path = "../crates/keyflow/keyflow" }
engraver = { path = "../features/engraver/engraver" }
keyflow-ui = { path = "../crates/keyflow/keyflow-ui", default-features = false }

# DAW domain
# `daw` is the facade. `daw-cli` is a public sibling crate of CLI
# helpers reused by `fts-cli`. `daw-extension-runtime` is a public
# sibling crate for in-process REAPER extension hosting (folding it
# into `daw` would cycle through daw-reaper → keyflow → daw, see daw
# a823b67).
daw = { path = "../crates/daw/daw" }
daw-cli = { path = "../apps/daw-cli" }
daw-extension-runtime = { path = "../features/reaper/daw-extension-runtime" }
# `daw-proto` is listed here so the fts-cli TUI can build typed
# service clients (TransportClient, TracksClient, ProjectsClient) on
# top of the Vox connection it shares with session-cli.
daw-proto = { path = "../crates/daw/proto" }

# Dock UI (sibling repo)
dock-proto = { path = "../libs/dock/dock-proto" }
dock-dioxus = { path = "../libs/dock/dock-dioxus" }

# Actions / Input (sibling repo). actions-proto/actions-registry (action
# declaration + registration) retired in favor of architect::actions —
# see session/fts-extensions. input/input-dioxus/actions-standalone/
# actions-keybindings (keybinding + MIDI mapping) are a separate concern
# and stay.
actions-standalone = { path = "../crates/input/actions-standalone" }
actions-keybindings = { path = "../crates/input/actions-keybindings" }
input-dioxus = { path = "../crates/input/input-dioxus" }
input = { path = "../crates/input/input" }

# Dynamic template (sibling repo)
color-palette = { path = "../features/dynamic-template/color-palette" }
music-catalog = { path = "../features/dynamic-template/music-catalog" }
dynamic-template-proto = { path = "../features/dynamic-template/dynamic-template-proto" }
dynamic-template = { path = "../features/dynamic-template/dynamic-template" }

# Shared infrastructure
# NOTE: `audio-controls` was merged into daw's `daw-ui` crate upstream
# (daw afec7be) and no longer exists as a standalone crate; unused here.
vox-discover = { path = "../libs/vox-discover" }
installer-core = { path = "../libs/installer-core" }

# Signal — dissolved into the root workspace (wave 4). No member of this
# LEGACY workspace consumed these entries, so they were dropped; the crates
# now live at ../crates/signal/* and ../features/fx/macromod (signal-cli is
# parked in ../attic/signal-apps/cli).

# Session (sibling repo)
# NOTE: session-proto is listed here for use by session-ui (internal domain crate only).
# App crates must NOT depend on session-proto directly — use the `session` facade instead.
session = { path = "../crates/session/session" }
session-proto = { path = "../crates/session/proto" }
session-ui = { path = "../crates/session/ui" }
# session-cli parked in attic/session-apps/cli (wave 3) — no member consumed it.

# architect (sibling repo) — `ActionMeta`/`ActionBackend` types, needed directly
# by fts-cli to read `<Trait>Actions::all()` and build the generated CLI surface.
architect = { git = "https://codeberg.org/FastTrackStudios/architect.git", branch = "main" }

# fts-extensions-actions (sibling repo, fts-extensions' workspace) — pure
# #[architect::actions] trait declarations, no REAPER deps, so fts-cli's
# generated action menu can include fts-extensions' own actions (21) too,
# alongside session's 90, without linking the full fts-extensions cdylib
# crate (which pulls the whole REAPER binding stack).
fts-extensions-actions = { git = "https://codeberg.org/FastTrackStudios/fts-extensions.git", branch = "feat/setlist-record-groups" }

# Sync (sibling repo)
sync = { git = "https://codeberg.org/FastTrackStudios/sync.git", branch = "main" }
sync-proto = { git = "https://codeberg.org/FastTrackStudios/sync.git", branch = "main" }
sync-ui = { git = "https://codeberg.org/FastTrackStudios/sync.git", branch = "main" }

utils = { path = "../libs/utils" }

# REAPER extension dependencies (FTS fork with v7.63 ruler lane APIs)
reaper-low = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-common-types = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes", features = ["palette"] }
# NOTE: the former `reaper-test` / `reaper-test-macro` crates were folded into
# the `daw` facade's `test-harness` feature (daw 9b04180). xtask now depends on
# `daw = { features = ["test-harness"] }` for the `daw::test::runner` harness.
reaper-launcher = { path = "../features/reaper/reaper-launcher" }
fragile = "2.0.1"
crossbeam-channel = "0.5"
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
palette = "0.7.3"

# FTS design system (wraps lumen-blocks, lucide-dioxus, layout, typography)
fts-ui = { path = "../libs/fts-ui/fts-ui" }

# Lumen blocks (Dioxus shadcn-inspired components)
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
dioxus-time = { git = "https://github.com/ealmloff/dioxus-std", rev = "7e0c41ef8c5514e46e8ac657227568660cf38987" }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }

# Dioxus UI framework — git pin to upstream DioxusLabs/dioxus (matches
# dioxus-flake's pinned dx + fts-extensions/daw). See the dioxus-* redirects
# in [patch.crates-io] below, which unify every subcrate onto this rev.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de" }
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }

# macOS dependencies for swell-ui (using exact versions for compatibility)
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies (optional, for cross-platform)
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

image = "0.25"
ab_glyph = "0.2"
imageproc = "0.25"

# Anyrender - 2D rendering abstraction (WGPU/Vello backend)
anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_svg = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }

# Linebender graphics crates (matching anyrender's versions)
vello = { version = "0.7", features = ["wgpu"] }
peniko = "0.6"
kurbo = "0.13"
color = "0.3"
wgpu = "27"
pollster = "0.4"

# ── Sibling FTS repo deps ─────────────────────────────────────────────
# All sibling domain crates (and session, which is what used to require the
# redirects below) are now consumed from the same canonical codeberg.org
# remotes, so the old ssh/github → https URL-unification [patch] blocks are
# gone — every source already agrees. To iterate on a sibling locally, add a
# temporary `[patch."<url>"] crate = { path = "../<repo>/..." }` block (and
# don't commit it).

# Signal patched out for now — local signal pins an older vox rev
# (Codys-Wright/vox@2a2f793b) that drags facet 0.44 into the
# workspace and conflicts with the rest of FTS on facet 0.46.
# Re-enable when signal bumps to bearcove/vox@27eef573 (or matches
# whatever rev daw/session settle on).
#

# LOCAL DEV (do not commit): redirect the keyflow facade crates to the sibling
# checkout. The published keyflow main (aa9fe949) declares `fts-ui` as a path
# dep, which can't resolve when keyflow-ui is consumed as a git dependency; the
# local keyflow HEAD declares it as a git dep. Drop this block once that fix is
# pushed to keyflow main. The facade crates pull their internal keyflow-* deps
# via relative paths inside the sibling workspace, so those resolve locally too.
[patch."https://github.com/bearcove/moire"]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[patch.crates-io]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
# Dioxus pinned to upstream DioxusLabs/dioxus rev 3e43ffa6 (matches the `dx`
# CLI + fts-extensions/daw pin). Redirect every dioxus-* subcrate so the whole
# graph resolves to a single copy instead of mixing the registry release with
# this git rev.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus" }
dioxus-asset-resolver = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-asset-resolver" }
dioxus-cli-config = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-cli-config" }
dioxus-config-macros = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-config-macros" }
dioxus-core = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-core" }
dioxus-core-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-core-macro" }
dioxus-core-types = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-core-types" }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-devtools" }
dioxus-devtools-types = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-devtools-types" }
dioxus-document = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-document" }
dioxus-history = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-history" }
dioxus-hooks = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-hooks" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-html" }
dioxus-html-internal-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-html-internal-macro" }
dioxus-rsx = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-rsx" }
dioxus-signals = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-signals" }
dioxus-stores = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-stores" }
dioxus-stores-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-stores-macro" }
generational-box = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "generational-box" }
manganis = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "manganis" }
manganis-core = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "manganis-core" }
manganis-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "manganis-macro" }

# WASM dev profile: opt-level 1 avoids "too many locals" error in walrus
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
