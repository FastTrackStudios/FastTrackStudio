[workspace]
members = [
    "apps/cli",
    "apps/desktop",
    "apps/web",
    "crates/session",
    "crates/session-extension",
    "crates/session-proto",
    "crates/session-ui",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── Session crates (facade pattern) ──────────────────────────────────
# `session` is the facade — the only public API surface for the session domain.
# `session-proto` is INTERNAL. App crates must NOT depend on it directly;
# use the `session` facade instead. session-ui is an exception (Dioxus components).
session = { path = "crates/session" }
session-proto = { path = "crates/session-proto" }
session-ui = { path = "crates/session-ui", default-features = false }

# ── DAW domain ───────────────────────────────────────────────────────
# `daw` is the facade — types/handles/services for the DAW domain. The
# extension-runtime crate is a documented public sibling (couldn't fold
# into the facade — cycle through daw-reaper → keyflow → daw). It's
# only needed by the in-process REAPER extension binary in this repo.
daw = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-reaper = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-proto = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-synchronization = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }

# ── REAPER bindings (reaper-rs) ──────────────────────────────────────
# Needed by REAPER-touching action modules (e.g. take_ranking) that
# call raw FFI for cursor / item selection / take-marker operations.
# Branch must match daw-reaper's pin or Cargo will resolve two copies.
reaper-high = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-low = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# ── Testing ─────────────────────────────────────────────────────────
# The former standalone `reaper-test` crate was folded into the daw
# facade as `daw::test` (behind the `test-harness` feature). Consumers
# now enable that feature on `daw` instead of depending on reaper-test.

# ── Vox service framework ────────────────────────────────────────────
# Aligned with daw + architect on bearcove upstream so the FTS workspace
# resolves a single vox copy across all sibling repos.
vox = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-types = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-stream = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-websocket = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }

# ── Architect service framework ─────────────────────────────────────
architect = { git = "https://git.starcommand.live/FastTrackStudios/architect.git", branch = "main" }

# ── Facet reflection ────────────────────────────────────────────────
facet = { version = "0.46" }
facet-json = { version = "0.46" }

# ── Keyflow (sibling repo — facade pattern) ─────────────────────────
keyflow = { git = "https://git.starcommand.live/FastTrackStudios/keyflow.git", branch = "main" }
keyflow-daw-analysis = { git = "https://git.starcommand.live/FastTrackStudios/keyflow.git", branch = "main" }

# ── Dynamic session templates ───────────────────────────────────────
dynamic-template = { git = "https://git.starcommand.live/FastTrackStudios/dynamic-template.git", branch = "main" }

# ── Actions / Input (sibling repo) ──────────────────────────────────
actions-proto = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }

# ── Dock UI (sibling repo) ──────────────────────────────────────────
dock-dioxus = { git = "https://git.starcommand.live/FastTrackStudios/dock-dioxus.git", branch = "main", default-features = false }
dock-proto = { git = "https://git.starcommand.live/FastTrackStudios/dock-dioxus.git", branch = "main" }

# ── FTS design system ───────────────────────────────────────────────
fts-ui = { git = "https://git.starcommand.live/FastTrackStudios/fts-ui.git", branch = "main" }

# ── Shared infrastructure ───────────────────────────────────────────
utils = { git = "https://git.starcommand.live/FastTrackStudios/fts-utils.git", branch = "main" }

# ── Instrumentation ─────────────────────────────────────────────────
moire = { version = "1.0" }  # diagnostics disabled — dladdr panics inside REAPER-loaded .so

# ── UI framework ─────────────────────────────────────────────────────
dioxus = "0.7.2"

# ── Async runtime ───────────────────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# ── Serialization ───────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# ── Observability ───────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Utilities ────────────────────────────────────────────────────────
eyre = "0.6"

# ── Patches ──────────────────────────────────────────────────────────
# Full git-dep policy: NO local-path [patch] blocks. All sibling crates
# resolve from git.starcommand.live via [workspace.dependencies] above so
# CI (which has no sibling checkouts) builds identically to local dev.

# moire: FTS fork — tolerates broken frame-pointer chains on NixOS glibc.
# All moire crates must point to the same fork rev to avoid duplicate
# moire-runtime #[ctor] registrations that crash. Aligned with daw (7a2f1dc).
[patch."https://github.com/bearcove/moire"]
moire = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[patch.crates-io]
# Dioxus: FTS fork (codywright/dioxus) — must match daw exactly so the
# reaper → daw-reaper-dioxus → patched-dioxus graph resolves one copy.
dioxus = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus" }
dioxus-asset-resolver = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-asset-resolver" }
dioxus-cli-config = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-cli-config" }
dioxus-config-macros = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-config-macros" }
