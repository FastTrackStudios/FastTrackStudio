# Fork of `mermaid-rs-renderer` 0.2.2 — the upstream crate calls
# `std::time::Instant::now()` unconditionally from its layout
# pipeline, which panics on `wasm32-unknown-unknown`. Our fork swaps
# that for `web_time::Instant` so editor-mermaid can render diagrams
# in the browser.
#
# Extracted to its own repo (was `Editor/vendor/mermaid-rs-renderer`,
# a NON-member subdir of Editor.git). Regular `cargo build` could
# locate the package inside Editor by name, but crane's offline
# vendoring cannot resolve a `[patch]` git source that isn't a real
# workspace member — so it lives standalone now. The crate is fully
# self-contained (no path deps), so this is a clean lift.
[patch.crates-io.mermaid-rs-renderer]
git = "https://codeberg.org/FastTrackStudios/mermaid-rs-renderer.git"
rev = "6033d0a05b90875bde3d55ab9278bbc2ec54ca8d"
