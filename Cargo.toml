[workspace.dependencies.serde_json]
version = "1"

[workspace.dependencies.shm-primitives]
git = "https://github.com/Codys-Wright/vox"
rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5"

[workspace.dependencies.tokio]
version = "1"
features = ["full"]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

# Used by the editor playground (and any future binary that
# wants a structured log file alongside stdout).
[workspace.dependencies.tracing-appender]
version = "0.2"

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
    "v5",
    "v7",
