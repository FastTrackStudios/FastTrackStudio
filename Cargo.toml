# FastTrackStudio — ONE root workspace.
#
# Every crate in the tree is a member here (libs/, crates/, features/,
# apps/) — the old per-domain workspaces (daw, session, signal, keyflow,
# FastTrackStudio, Plugins) are fully dissolved. One lockfile, one
# target/, one [workspace.dependencies] table carrying every intra-repo
# path dep exactly once. See LAYOUT.md for the shape; parked/legacy code
# lives in attic/.

[workspace]
resolver = "3"
members = [
    # ── libs/architect — the entity/RPC framework (subtree-imported, ──
    #    history preserved; framework changes are ordinary in-tree work)
    "libs/architect/architect",
    "libs/architect/macros/architect-derive",
    "libs/architect/macros/architect-rpc-derive",
    "libs/architect/macros/architect-action-derive",
    "libs/architect/atom",
    "libs/architect/form",
    "libs/architect/auth/architect-auth",
    "libs/architect/auth/auth",
    "libs/architect/auth/auth-proto",
    "libs/architect/auth/auth-db",
    "libs/architect/auth/auth-client",
    "libs/architect/auth/tests/native",
    "libs/architect/crdt/crdt",
    "libs/architect/crdt/crdt-derive",
    "libs/architect/crdt/crdt-seaorm",
    # ── libs/ — UI + infrastructure libraries ─────────────────────────
    "libs/fts-ui/fts-ui",
    "libs/fts-ui/fts-ui-audio",
    "libs/fts-ui/showcase",
    "libs/fts-story/fts-story-core",
    "libs/fts-story/fts-story-macros",
    "libs/fts-story/fts-story-runtime",
    "libs/fts-story/fts-story-shell",
    "libs/fts-story/fts-story-snapshots",
    "libs/fts-story/fts-story-parity",
    "libs/fts-story/fts-story-fuzz",
    "libs/dock/dock-dioxus",
    "libs/dock/dock-proto",
    "libs/nice-plug/nice-plug",
    "libs/nice-plug/nice-plug-core",
    "libs/nice-plug/nice-plug-derive",
    "libs/nice-plug/nice-plug-dioxus",
    "libs/nice-plug/nice-plug-egui",
    "libs/nice-plug/nice-plug-iced",
    "libs/nice-plug/nice-plug-xtask",
    "libs/nice-plug/nice-log",
    "libs/nice-plug/cargo-nice-plug",
    "libs/nice-plug/egui-baseview",
    "libs/nice-plug/iced_baseview",
    "libs/utils",
    "libs/monarchy/monarchy",
    "libs/monarchy/monarchy-derive",
    "libs/vox-discover",
    "libs/installer-core",
    "libs/neural-amp-modeler",
    "libs/moire-trace-capture",
    # ── crates/ — domain cores ────────────────────────────────────────
    "crates/audiocore/audiocore-core",
    "crates/audiocore/audiocore-dsp",
    "crates/audiocore/audiocore-gui",
    "crates/audiocore/fts-modulation",
    "crates/audiocore/fts-sample",
    "crates/audiocore/fts-themes",
    "crates/audiocore/meter-dsp",
    "crates/audiocore/meter-ui",
    "crates/midicore/midicore",
    "crates/midicore/midicore-proto",
    "crates/midicore/midicore-midir",
    "crates/input/actions-proto",
    "crates/input/actions-registry",
    "crates/input/actions-keybindings",
    "crates/input/actions-standalone",
    "crates/input/input",
    "crates/input/input-dioxus",
    # ── crates/daw — daw domain core (wave 2) ─────────────────────────
    "crates/daw/daw",
    "crates/daw/proto",
    "crates/daw/control",
    "crates/daw/module",
    # ── libs/devtools ─────────────────────────────────────────────────
    "libs/devtools/fts-devtools",
    "libs/devtools/daw-test-macro",
    # ── features/audio ────────────────────────────────────────────────
    "features/audio/daw-audio-graph",
    "features/audio/daw-audio-io",
    "features/audio/daw-midi-io",
    "features/audio/daw-allocator",
    "features/audio/fts-audio-proto",
    "features/audio/audio-controls",
    # ── features/sync ─────────────────────────────────────────────────
    "features/sync/daw-synchronization",
    "features/sync/daw-link",
    "features/sync/daw-network",
    "features/sync/daw-audio-sync",
    # ── features/dawfile — per-DAW file-format parsers ────────────────
    "features/dawfile/dawfile-aaf",
    "features/dawfile/dawfile-ableton",
    "features/dawfile/dawfile-dawproject",
    "features/dawfile/dawfile-logic",
    "features/dawfile/dawfile-protools",
    "features/dawfile/dawfile-reaper",
    # ── features/reaper ───────────────────────────────────────────────
    "features/reaper/daw-reaper",
    "features/reaper/daw-bridge",
    "features/reaper/daw-extension-runtime",
    "features/reaper/daw-reaper-dioxus",
    "features/reaper/daw-reaper-dioxus-ext",
    "features/reaper/daw-reaper-dioxus-ext-test",
    "features/reaper/daw-reaper-embed",
    "features/reaper/reaper-launcher",
    "features/reaper/reaper-config",
    "features/reaper/daw-perf-test",
    "features/reaper/actions-reaper",
    # ── features/standalone / surfaces / daw-ui ───────────────────────
    "features/standalone/daw-standalone",
    "features/surfaces/daw-csi",
    "features/daw-ui/daw-ui",
    "features/daw-ui/daw-theme-reaper",
    # ── crates/session — session domain core (wave 3) ─────────────────
    "crates/session/session",
    "crates/session/proto",
    "crates/session/ui",
    "features/guide",
    "features/reaper/session-extension",
    # ── crates/keyflow — keyflow domain core (wave 3) ─────────────────
    "crates/keyflow/keyflow",
    "crates/keyflow/keyflow-proto",
    "crates/keyflow/keyflow-syntax",
    "crates/keyflow/keyflow-text",
    "crates/keyflow/keyflow-chordpro",
    "crates/keyflow/keyflow-midi",
    "crates/keyflow/keyflow-live",
    "crates/keyflow/keyflow-lsp",
    "crates/keyflow/keyflow-musicxml",
    "crates/keyflow/keyflow-orchestra",
    "crates/keyflow/keyflow-sync",
    "crates/keyflow/keyflow-daw-analysis",
    "crates/keyflow/keyflow-ui",
    "crates/keyflow/tree-sitter-keyflow",
    # ── features/engraver ─────────────────────────────────────────────
    "features/engraver/engraver",
    "features/engraver/proto",
    # ── features/dynamic-template (subtree-imported, wave 3) ──────────
    "features/dynamic-template/dynamic-template",
    "features/dynamic-template/dynamic-template-proto",
    "features/dynamic-template/dynamic-template-extension",
    "features/dynamic-template/music-catalog",
    "features/dynamic-template/color-palette",
    "features/dynamic-template/tests",
    # ── crates/signal — signal domain core (wave 4) ───────────────────
    # `signal` is the facade — the only public API surface for the signal
    # domain. proto/live/storage/controller/import/daw-bridge are INTERNAL
    # (signal-ui / signal-browser / signal-grid-ui are the documented
    # exceptions: Dioxus components / the headless browser data layer).
    "crates/signal/signal",
    "crates/signal/proto",
    "crates/signal/ui",
    "crates/signal/live",
    "crates/signal/storage",
    "crates/signal/controller",
    "crates/signal/import",
    "crates/signal/browser",
    "crates/signal/grid",
    "crates/signal/grid-ui",
    "crates/signal/daw-bridge",
    # ── features/fx — built-in FX (wave 4; vendored from FTS plugin repos)
    # Facade crates (eq / comp / reverb / delay / …) are the public deps;
    # the -dsp crates are internal (like signal-proto under the facade).
    # The per-FX -ui/-profiles crates + apps/ plugin binaries moved along
    # inside each FX dir; they stay implicit members via path deps.
    "features/fx/eq/eq",
    "features/fx/eq/eq-dsp",
    "features/fx/eq/eq-profiles",
    "features/fx/eq/eq-ui",
    "features/fx/eq/spectrum-analyzer/spectrum-analyzer",
    "features/fx/eq/spectrum-analyzer/spectrum-analyzer-dsp",
    "features/fx/comp/comp",
    "features/fx/comp/comp-dsp",
    "features/fx/reverb/reverb",
    "features/fx/reverb/reverb-dsp",
    "features/fx/delay/delay",
    "features/fx/delay/delay-dsp",
    "features/fx/pitch/pitch",
    "features/fx/pitch/pitch-dsp",
    "features/fx/modulation/modulation",
    "features/fx/modulation/chorus-dsp",
    "features/fx/modulation/trem-dsp",
    "features/fx/modulation/wah-dsp",
    "features/fx/signal-fx",
    "features/fx/macromod",
    # ── features/rigs / sampler / nam / plugin-host (wave 4) ──────────
    "features/rigs/guitar",
    "features/rigs/guitar/proto",
    "features/rigs/guitar/ui",
    "features/rigs/keys",
    "features/rigs/orchestra",
    "features/rigs/drums",
    "features/rigs/synth",
    "features/sampler/signal-sampler",
    "features/sampler/signal-sampler-clap",
    "features/nam",
    "features/plugin-host",
    "features/reaper/signal-extension",
    "features/reaper/signal-reaper-controller",
    # ── apps ──────────────────────────────────────────────────────────
    "apps/fasttrackstudio",
    "apps/installer",
    "crates/keyflow/cli",
    "apps/signal-engine",
    "apps/signal-web",
]
# attic/ holds parked crates (dead apps, legacy shells) — never built.
exclude = [
    "attic",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/FastTrackStudios/FastTrackStudio"

[workspace.dependencies]
# ── Internal — every moved crate, path declared ONCE here ─────────────
fts-ui = { path = "libs/fts-ui/fts-ui" }
fts-ui-audio = { path = "libs/fts-ui/fts-ui-audio" }
fts-ui-showcase = { path = "libs/fts-ui/showcase" }
fts-story-core = { path = "libs/fts-story/fts-story-core" }
fts-story-macros = { path = "libs/fts-story/fts-story-macros" }
fts-story-runtime = { path = "libs/fts-story/fts-story-runtime" }
fts-story-shell = { path = "libs/fts-story/fts-story-shell" }
fts-story-snapshots = { path = "libs/fts-story/fts-story-snapshots" }
fts-story-parity = { path = "libs/fts-story/fts-story-parity" }
fts-story-fuzz = { path = "libs/fts-story/fts-story-fuzz" }
dock-dioxus = { path = "libs/dock/dock-dioxus", default-features = false }
dock-proto = { path = "libs/dock/dock-proto" }
nice-plug = { path = "libs/nice-plug/nice-plug" }
nice-plug-core = { path = "libs/nice-plug/nice-plug-core" }
nice-plug-derive = { path = "libs/nice-plug/nice-plug-derive" }
nice-plug-dioxus = { path = "libs/nice-plug/nice-plug-dioxus" }
nice-plug-egui = { path = "libs/nice-plug/nice-plug-egui" }
nice-plug-iced = { path = "libs/nice-plug/nice-plug-iced" }
nice-plug-xtask = { path = "libs/nice-plug/nice-plug-xtask" }
nice-log = { path = "libs/nice-plug/nice-log" }
egui-baseview = { path = "libs/nice-plug/egui-baseview", default-features = false }
iced_baseview = { path = "libs/nice-plug/iced_baseview", default-features = false }
utils = { path = "libs/utils" }
vox-discover = { path = "libs/vox-discover" }
installer-core = { path = "libs/installer-core" }
neural-amp-modeler = { path = "libs/neural-amp-modeler" }
moire-trace-capture = { path = "libs/moire-trace-capture" }
audiocore-core = { path = "crates/audiocore/audiocore-core" }
audiocore-dsp = { path = "crates/audiocore/audiocore-dsp", default-features = false }
audiocore-gui = { path = "crates/audiocore/audiocore-gui" }
fts-modulation = { path = "crates/audiocore/fts-modulation" }
fts-sample = { path = "crates/audiocore/fts-sample" }
fts-themes = { path = "crates/audiocore/fts-themes" }
meter-dsp = { path = "crates/audiocore/meter-dsp" }
meter-ui = { path = "crates/audiocore/meter-ui" }
# Canonical MIDI facade. Defaults OFF at the root: daw-proto re-exports
# `midicore::MidiEvent` and must not drag midicore's `vox` service traits
# (nor the `midir` feature — midicore-midir pins midir 0.10/alsa-sys 0.3,
# colliding with daw's midir 0.11/alsa-sys 0.4 via `links = "alsa"`).
# Consumers that want the vox surface set `features = ["vox"]` themselves.
midicore = { path = "crates/midicore/midicore", default-features = false }
midicore-proto = { path = "crates/midicore/midicore-proto" }
midicore-midir = { path = "crates/midicore/midicore-midir" }
actions-proto = { path = "crates/input/actions-proto" }
actions-registry = { path = "crates/input/actions-registry" }
actions-keybindings = { path = "crates/input/actions-keybindings" }
actions-standalone = { path = "crates/input/actions-standalone" }
actions-reaper = { path = "features/reaper/actions-reaper" }
input = { path = "crates/input/input" }
input-dioxus = { path = "crates/input/input-dioxus" }

# ── daw domain (wave 2) ───────────────────────────────────────────────
# Facade crate — the only public API surface for the daw domain.
# daw-proto, daw-control, daw-standalone, dawfile-* are INTERNAL to the
# domain; consumers outside it go through the `daw` facade.
daw = { path = "crates/daw/daw" }
daw-proto = { path = "crates/daw/proto" }
daw-control = { path = "crates/daw/control" }
daw-module = { path = "crates/daw/module" }
fts-devtools = { path = "libs/devtools/fts-devtools" }
daw-test-macro = { path = "libs/devtools/daw-test-macro" }
daw-audio-graph = { path = "features/audio/daw-audio-graph" }
daw-audio-io = { path = "features/audio/daw-audio-io" }
daw-midi-io = { path = "features/audio/daw-midi-io" }
# RT-aware allocator — offloads RT deallocation to background thread
daw-allocator = { path = "features/audio/daw-allocator" }
fts-audio-proto = { path = "features/audio/fts-audio-proto" }
audio-controls = { path = "features/audio/audio-controls" }
daw-synchronization = { path = "features/sync/daw-synchronization" }
daw-link = { path = "features/sync/daw-link" }
daw-network = { path = "features/sync/daw-network" }
daw-audio-sync = { path = "features/sync/daw-audio-sync" }
dawfile-aaf = { path = "features/dawfile/dawfile-aaf" }
dawfile-ableton = { path = "features/dawfile/dawfile-ableton" }
dawfile-dawproject = { path = "features/dawfile/dawfile-dawproject" }
dawfile-logic = { path = "features/dawfile/dawfile-logic" }
dawfile-protools = { path = "features/dawfile/dawfile-protools" }
dawfile-reaper = { path = "features/dawfile/dawfile-reaper" }
# default = all-formats; the daw facade opts into formats individually,
# so the root entry keeps defaults OFF and consumers that want every
# importer set `default-features = true`.
daw-reaper = { path = "features/reaper/daw-reaper", default-features = false }
daw-bridge = { path = "features/reaper/daw-bridge" }
# Extension runtime — integrated REAPER extension helpers
daw-extension-runtime = { path = "features/reaper/daw-extension-runtime" }
daw-reaper-dioxus = { path = "features/reaper/daw-reaper-dioxus" }
daw-reaper-dioxus-ext = { path = "features/reaper/daw-reaper-dioxus-ext" }
daw-reaper-embed = { path = "features/reaper/daw-reaper-embed" }
reaper-launcher = { path = "features/reaper/reaper-launcher" }
reaper-config = { path = "features/reaper/reaper-config" }
daw-standalone = { path = "features/standalone/daw-standalone" }
daw-csi = { path = "features/surfaces/daw-csi" }
daw-ui = { path = "features/daw-ui/daw-ui", default-features = false }
daw-theme-reaper = { path = "features/daw-ui/daw-theme-reaper" }

# ── session domain (wave 3) ───────────────────────────────────────────
# `session` is the facade — the only public API surface for the session
# domain. session-proto is INTERNAL (session-ui and session-guide are the
# documented exceptions: Dioxus components / the guide engine).
session = { path = "crates/session/session" }
session-proto = { path = "crates/session/proto" }
session-ui = { path = "crates/session/ui", default-features = false }
# Portable guide engine (click / count-in / section guide). Optional `tts`
# feature adds local Chatterbox TTS (its ort/chatterbox pins live in the
# crate's own manifest, not here).
session-guide = { path = "features/guide" }

# ── keyflow domain (wave 3) ───────────────────────────────────────────
# `keyflow` and `engraver` are the facades; keyflow-proto/-text/-midi/
# -syntax/-live and engraver-proto are INTERNAL to the domain.
keyflow = { path = "crates/keyflow/keyflow" }
keyflow-proto = { path = "crates/keyflow/keyflow-proto" }
keyflow-syntax = { path = "crates/keyflow/keyflow-syntax" }
keyflow-text = { path = "crates/keyflow/keyflow-text" }
keyflow-chordpro = { path = "crates/keyflow/keyflow-chordpro" }
keyflow-midi = { path = "crates/keyflow/keyflow-midi" }
keyflow-live = { path = "crates/keyflow/keyflow-live" }
keyflow-musicxml = { path = "crates/keyflow/keyflow-musicxml" }
keyflow-orchestra = { path = "crates/keyflow/keyflow-orchestra" }
keyflow-sync = { path = "crates/keyflow/keyflow-sync" }
keyflow-daw-analysis = { path = "crates/keyflow/keyflow-daw-analysis" }
keyflow-ui = { path = "crates/keyflow/keyflow-ui" }
keyflow-cli = { path = "crates/keyflow/cli" }
tree-sitter-keyflow = { path = "crates/keyflow/tree-sitter-keyflow" }
# Engraver — defaults OFF at the root (the full `engraver` feature drags
# wgpu/vello + PDF export); consumers opt into `svg`/`wgpu`/`engraver`.
engraver = { path = "features/engraver/engraver", default-features = false }
engraver-proto = { path = "features/engraver/proto", default-features = false }

# ── signal domain (wave 4) ────────────────────────────────────────────
# `signal` is the facade — the only public API surface for the signal
# domain. Apps depend on `signal`, `signal-ui`, or `signal-sampler`;
# never on the internal domain crates (proto/live/storage/controller/
# import/daw-bridge/nam-manager).
signal = { path = "crates/signal/signal" }
signal-proto = { path = "crates/signal/proto" }
signal-ui = { path = "crates/signal/ui", default-features = false }
signal-browser = { path = "crates/signal/browser" }
signal-grid = { path = "crates/signal/grid" }
signal-grid-ui = { path = "crates/signal/grid-ui" }
signal-controller = { path = "crates/signal/controller" }
signal-live = { path = "crates/signal/live" }
signal-storage = { path = "crates/signal/storage" }
signal-import = { path = "crates/signal/import" }
signal-daw-bridge = { path = "crates/signal/daw-bridge" }
signal-nam = { path = "features/nam" }
signal-extension = { path = "features/reaper/signal-extension" }
signal-macromod = { path = "features/fx/macromod" }
signal-plugin-host = { path = "features/plugin-host", default-features = false }
signal-sampler = { path = "features/sampler/signal-sampler" }
signal-guitar = { path = "features/rigs/guitar" }
signal-guitar-proto = { path = "features/rigs/guitar/proto" }
signal-guitar-ui = { path = "features/rigs/guitar/ui" }
signal-keys = { path = "features/rigs/keys" }
signal-orchestra = { path = "features/rigs/orchestra" }
signal-drums = { path = "features/rigs/drums" }
signal-synth = { path = "features/rigs/synth" }

# ── features/fx — built-in FX (wave 4) ────────────────────────────────
# Facade crates — the public FX deps (downstream uses these, not `*-dsp`).
eq = { path = "features/fx/eq/eq" }
# The full Pro-Q EQ editor. Core (graph model / response / SVG / interaction)
# is wasm-portable; the vello/nice-plug editor is behind its `native` feature.
eq-ui = { path = "features/fx/eq/eq-ui", default-features = false }
eq-profiles = { path = "features/fx/eq/eq-profiles" }
spectrum-analyzer = { path = "features/fx/eq/spectrum-analyzer/spectrum-analyzer" }
spectrum-analyzer-dsp = { path = "features/fx/eq/spectrum-analyzer/spectrum-analyzer-dsp" }
spectrum-analyzer-ui = { path = "features/fx/eq/spectrum-analyzer/spectrum-analyzer-ui" }
comp = { path = "features/fx/comp/comp" }
reverb = { path = "features/fx/reverb/reverb" }
delay = { path = "features/fx/delay/delay" }
pitch = { path = "features/fx/pitch/pitch" }
pitch-dsp = { path = "features/fx/pitch/pitch-dsp" }
modulation = { path = "features/fx/modulation/modulation" }
# Internal DSP cores (behind the facades).
eq-dsp = { path = "features/fx/eq/eq-dsp" }
comp-dsp = { path = "features/fx/comp/comp-dsp" }
reverb-dsp = { path = "features/fx/reverb/reverb-dsp" }
delay-dsp = { path = "features/fx/delay/delay-dsp" }
chorus-dsp = { path = "features/fx/modulation/chorus-dsp" }
trem-dsp = { path = "features/fx/modulation/trem-dsp" }
wah-dsp = { path = "features/fx/modulation/wah-dsp" }
signal-fx = { path = "features/fx/signal-fx" }

# ── Facet reflection + vox RPC — the rc.5 fleet pins ──────────────────
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-json = { version = "0.50.0-rc.5" }
facet-postcard = { version = "0.50.0-rc.5" }
facet-styx = { version = "5.0.0-rc.5" }
facet-toml = { version = "0.50.0-rc.5" }
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-types = { version = "0.10.0-rc.5" }
vox-phon = { version = "0.10.0-rc.5" }
vox-stream = { version = "0.10.0-rc.5" }
vox-core = { version = "0.10.0-rc.5" }
vox-websocket = { version = "0.10.0-rc.5" }
axum = { version = "0.8", features = ["ws"] }

# ── Architect framework — in-tree at libs/architect (subtree import) ──
architect = { path = "libs/architect/architect" }
architect-derive = { path = "libs/architect/macros/architect-derive" }
architect-rpc-derive = { path = "libs/architect/macros/architect-rpc-derive" }
architect-action-derive = { path = "libs/architect/macros/architect-action-derive" }
architect-atom = { path = "libs/architect/atom" }
architect-form = { path = "libs/architect/form" }
architect-auth = { path = "libs/architect/auth/architect-auth" }
auth = { path = "libs/architect/auth/auth" }
auth-proto = { path = "libs/architect/auth/auth-proto" }
auth-db = { path = "libs/architect/auth/auth-db" }
auth-client = { path = "libs/architect/auth/auth-client" }
crdt = { path = "libs/architect/crdt/crdt" }
crdt-derive = { path = "libs/architect/crdt/crdt-derive" }
crdt-seaorm = { path = "libs/architect/crdt/crdt-seaorm" }

# Architect's externals, merged from its dissolved workspace table
# (root pins win — both were already on the rc.5 fleet).
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
fake = { version = "4", features = ["derive", "uuid", "chrono"] }
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
async-trait = "0.1"
loro = { version = "1.12", default-features = false }
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
cookie = "0.18"
hkdf = "0.12"
jsonwebtoken = "9"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# ── Dynamic session templates (subtree-imported into the tree) ────────
dynamic-template = { path = "features/dynamic-template/dynamic-template" }
dynamic-template-proto = { path = "features/dynamic-template/dynamic-template-proto" }
# Canonical music-production taxonomy (instrument groups + the REAPER
# 128-slot group partition). Single source of truth shared with
# dynamic-template.
music-catalog = { path = "features/dynamic-template/music-catalog" }
color-palette = { path = "features/dynamic-template/color-palette" }
# Monarchy hierarchy framework (dynamic-template's engine) — subtree-
# imported at libs/monarchy so the whole graph shares one facet line.
monarchy = { path = "libs/monarchy/monarchy" }
monarchy_derive = { path = "libs/monarchy/monarchy-derive" }

# ── MusicXML parsing (keyflow) ─────────────────────────────────────────
musicxml = "1.1"

# ── UI framework ──────────────────────────────────────────────────────
dioxus = { version = "=0.7.9", default-features = false, features = ["lib"] }
# Blitz native renderer — one rev for the whole stack (dioxus-native +
# blitz-* must resolve to the same source). Feature union of the wave-1
# UI libs (prelude, system-fonts) and daw-reaper-dioxus (svg, autofocus,
# incremental, data-uri theme-skin PNGs).
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git", rev = "727dab0105fb42659f76f7862040b82f4e982893", features = ["prelude", "system-fonts", "svg", "autofocus", "incremental", "data-uri"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git", rev = "727dab0105fb42659f76f7862040b82f4e982893" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git", rev = "727dab0105fb42659f76f7862040b82f4e982893" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git", rev = "727dab0105fb42659f76f7862040b82f4e982893" }
dioxus-devtools = "0.7"
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", package = "dioxus-primitives", rev = "837c9d4c1c9f99b19de7a3f087d8af1b0538dcae", default-features = false }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }
clsx = "0.1.1"
tw_merge = "0.1.21"
nucleo-matcher = "0.3"
palette = "0.7.6"
linkme = "0.3"

# ── REAPER bindings (FTS fork with v7.63 ruler lane APIs) ─────────────
reaper-low = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
# swell-ui from FTS reaper-lib — typed Window/Hwnd wrappers around SWELL.
swell-ui = { git = "https://codeberg.org/FastTrackStudios/reaper-lib.git", branch = "main" }

# ── Plugin frameworks / hosting (daw) ─────────────────────────────────
nih_plug = { git = "https://codeberg.org/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }
clack-host = { git = "https://github.com/prokopyl/clack" }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = [
    "clack-host",
    "audio-ports",
    "note-ports",
    "params",
    "state",
    "latency",
    "gui",
    "timer",
    "log",
    "thread-check",
    "tail",
] }
# VST3 hosting — MIT/Apache-2.0 COM bindings (not GPL vst3-sys).
vst3 = "0.3"
libloading = "0.8"

# ── GPU rendering stack (daw-reaper-embed / daw-reaper-dioxus) ────────
wgpu = { version = "29", features = ["wgsl"] }
vello = { version = "0.9", features = ["wgpu"] }
skrifa = "0.37"
anyrender_vello = "0.11"
# keyflow-ui / engraver-proto renderer stack (paired with dioxus-native
# 0.7.9 from crates.io). NOTE: keyflow-ui pins anyrender_vello 0.10.1 and
# dioxus-native 0.7.9 INLINE in its own manifest — they collide with the
# root's anyrender_vello 0.11 / blitz-git dioxus-native pins above, and
# root pins win in the workspace table, so the conflicting pair stays
# crate-local.
anyrender = "0.10"
anyrender_vello_hybrid = "0.5.1"
vello_hybrid = "0.0.6"
vello_common = "0.0.6"
peniko = "0.6"
kurbo = "0.13"

# ── Platform UI bindings ──────────────────────────────────────────────
cocoa = "0.26"
objc = "0.2.7"

# ── Async runtime ─────────────────────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# ── Serialization ─────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# ── Observability ─────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moire = { version = "1.0" }

# ── Proc-macro plumbing ───────────────────────────────────────────────
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# ── fts-story tooling ─────────────────────────────────────────────────
dssim-core = "3"
png = "0.17"
proptest = "1"

# ── Audio / plugin framework externals (nice-plug + audiocore) ───────
atomic_float = "1.1"
atomic_refcell = "0.1"
bitflags = "2.11"
baseview = "0.1.1"
raw-window-handle = "0.5"
realfft = "3.0"
approx = "0.5.1"
crossbeam = "0.8"
crossbeam-channel = "0.5"
open = "5.3.3"
triple_buffer = "9.0.0"
rtrb = "0.3.3"
semver = "1.0.27"
pollster = "0.4.0"
parking_lot = "0.12"
egui = { version = "0.34.1", default-features = false, features = ["bytemuck"] }
symphonium = { version = "0.6", default-features = false, features = ["wav", "pcm", "fft-resampler"] }
once_cell = "1.19"

# ── Utilities ─────────────────────────────────────────────────────────
eyre = "0.6"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
enumflags2 = "0.7"
fragile = "2"
# Hardware MIDI I/O — 0.11 to share one alsa-sys across the stack.
midir = "0.11"
# Audio I/O host abstraction — the signal rigs run on cpal's native
# pipewire host (via daw-audio-io); the `pipewire`/`jack` backends are
# feature-gated per consumer.
cpal = "0.18"

# ── Patches ───────────────────────────────────────────────────────────
# NOTE: the old daw.git patch table is gone — dynamic-template (the only
# thing that still referenced the dead daw.git repo) is subtree-imported at
# features/dynamic-template/ and consumes the in-tree daw crates directly.

# keyflow.git: Editor.git (and older git-dep graphs) reference keyflow.git;
# fold those onto this workspace's crates so one keyflow exists graph-wide.
# (Carried over from the dissolved keyflow workspace's self-patch.)
[patch."https://codeberg.org/FastTrackStudios/keyflow.git"]
keyflow = { path = "crates/keyflow/keyflow" }
keyflow-proto = { path = "crates/keyflow/keyflow-proto" }
keyflow-text = { path = "crates/keyflow/keyflow-text" }
keyflow-midi = { path = "crates/keyflow/keyflow-midi" }
keyflow-syntax = { path = "crates/keyflow/keyflow-syntax" }
keyflow-chordpro = { path = "crates/keyflow/keyflow-chordpro" }
keyflow-daw-analysis = { path = "crates/keyflow/keyflow-daw-analysis" }
engraver = { path = "features/engraver/engraver" }
engraver-proto = { path = "features/engraver/proto" }

# Some transitive deps still reference input_actions by its old github URL;
# fold those onto the in-tree copy. (From the dissolved keyflow workspace.)
[patch."https://github.com/FastTrackStudios/input_actions.git"]
actions-proto = { path = "crates/input/actions-proto" }

# moire: FTS fork — tolerates broken frame-pointer chains on NixOS glibc.
# All moire crates must point to the same fork rev to avoid duplicate
# moire-runtime #[ctor] registrations (aligned with daw/session/signal).
[patch."https://github.com/bearcove/moire"]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[patch.crates-io]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

# ── Lints — merged union of the dissolved workspaces' policies ─────────
[workspace.lints.rust]
dead_code = "allow"
unused = "allow"
unused_unsafe = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"
type_complexity = "allow"
# from the dissolved daw workspace
manual_clamp = "allow"
needless_range_loop = "allow"
not_unsafe_ptr_arg_deref = "allow"
only_used_in_recursion = "allow"
unnecessary_sort_by = "allow"
unusual_byte_groupings = "allow"
# from the dissolved session workspace
manual_c_str_literals = "allow"
branches_sharing_code = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
collapsible_if = "allow"
map_clone = "allow"
unnecessary_map_or = "allow"
if_same_then_else = "allow"
redundant_locals = "allow"
# from the dissolved keyflow workspace
large_enum_variant = "allow"
explicit_counter_loop = "allow"
manual_strip = "allow"
too_many_arguments = "allow"
double_must_use = "allow"
vec_init_then_push = "allow"
collapsible_match = "allow"
filter_next = "allow"

# ── Dev profile (carried from the dissolved signal workspace) ──────────
# The live rig runs from target/debug/signal-engine (formerly signal-rigd): the vendored NAM C++
# core and the DSP crates are unusable at opt-level 0 (~10-50x slower,
# xruns), so dependencies build at release opt in dev while the thin
# app/UI workspace crates stay at light opt for fast rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
