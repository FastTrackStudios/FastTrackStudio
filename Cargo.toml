[workspace.metadata.crane]
name = "fasttrackstudio"

[workspace]
members = [
    # Crates
    "crates/dynamic-template/dynamic-template-extension",
    "crates/input/input-extension",
    "crates/keyflow/keyflow-extension",
    "crates/reaper/input-reaper",
    "crates/reaper/reaper-embed",
    "crates/reaper/swell-ui",
    "crates/shared/installer-core",
    "crates/shared/utils",
    "crates/shared/vox-discover",
    # Apps
    "apps/desktop",
    "apps/web",
    "apps/mobile",
    "apps/fts-cli",
    "apps/installer",
    "apps/tests/playground-wasm",
    "apps/tests/wasm",
    # Tools
    "xtask",
]
resolver = "2"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.package]
edition = "2021"
rust-version = "1.82"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FastTrackStudios/FastTrackStudio"
authors = ["FastTrack Studio"]

[workspace.dependencies]
# Facet ecosystem - use crates.io 0.44.x to match git main branch
facet = { version = "0.44" }
facet-core = { version = "0.44" }
facet-default = { version = "0.44" }
facet-format = { version = "0.44" }
facet-json = { version = "0.44" }
facet-postcard = { version = "0.44" }
facet-pretty = { version = "0.44" }
facet-toml = { version = "0.44" }
facet-value = { version = "0.44" }
facet-yaml = { version = "0.44" }
facet-styx = { version = "2.0" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
anyhow = "1.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures = "0.3"

# Vox crates (bearcove upstream — pinned, latest main needs peeps sub-crates not yet published)
vox = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-codegen = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-core = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-hash = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-schema = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-service-macros = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-inprocess = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-stream = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-task-local = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-tracing = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-websocket = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-local = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
vox-http-bridge = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
subject-rust = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }
ur-taking-me-with-you = { git = "https://github.com/bearcove/vox.git", rev = "53bff48", features = ["tokio"] }
shm-primitives = { git = "https://github.com/bearcove/vox.git", rev = "53bff48" }

# Instrumentation
moire = { version = "1.0", features = ["diagnostics"] }

# Keyflow/Engraver crates (sibling repo — facade pattern)
# NOTE: keyflow-proto, keyflow-text, keyflow-midi, engraver-proto are INTERNAL.
# Access them through the `keyflow` or `engraver` facade crates.
keyflow = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "main" }
engraver = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "main" }
keyflow-ui = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "main", default-features = false }

# DAW facade crate (sibling repo — single public API surface)
daw = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
daw-ui = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
daw-cli = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
# NOTE: daw-proto, daw-control, daw-control-sync, daw-reaper, daw-standalone,
# dawfile-reaper are INTERNAL. Access them through the `daw` facade crate.
# Use features: sync, reaper, standalone, file

# Dock UI (sibling repo)
dock-proto = { git = "https://github.com/FastTrackStudios/dock-dioxus.git", branch = "main" }
dock-dioxus = { git = "https://github.com/FastTrackStudios/dock-dioxus.git", branch = "main" }

# Actions / Input (sibling repo)
actions-proto = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
actions-registry = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
actions-standalone = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
actions-keybindings = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
input-dioxus = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
input = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
input-reaper = { path = "crates/reaper/input-reaper" }

# Dynamic template (sibling repo)
color-palette = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "main" }
music-catalog = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "main" }
dynamic-template-proto = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "main" }
dynamic-template = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "main" }

# Shared infrastructure
audio-controls = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
daw-allocator = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
vox-discover = { path = "crates/shared/vox-discover" }
installer-core = { path = "crates/shared/installer-core" }

# Signal (sibling repo)
signal = { path = "../signal/crates/signal" }
signal-ui = { path = "../signal/crates/signal-ui", default-features = false }
signal-cli = { path = "../signal/apps/signal-cli" }
macromod = { path = "../signal/crates/macromod" }

# Session (sibling repo)
# NOTE: session-proto is listed here for use by session-ui (internal domain crate only).
# App crates must NOT depend on session-proto directly — use the `session` facade instead.
session = { path = "../session/crates/session" }
session-proto = { path = "../session/crates/session-proto" }
session-ui = { path = "../session/crates/session-ui" }
session-cli = { path = "../session/apps/cli" }

# Sync (sibling repo)
sync = { path = "../sync/crates/sync" }
sync-proto = { path = "../sync/crates/sync-proto" }
sync-ui = { path = "../sync/crates/sync-ui" }

utils = { path = "crates/shared/utils" }

# REAPER extension dependencies (FTS fork with v7.63 ruler lane APIs)
reaper-low = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-common-types = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes", features = ["palette"] }
# FTS REAPER crates (in-workspace)
swell-ui = { path = "crates/reaper/swell-ui" }
reaper-embed = { path = "crates/reaper/reaper-embed" }
reaper-test = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
reaper-test-macro = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
reaper-launcher = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
fragile = "2.0.1"
crossbeam-channel = "0.5"
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
palette = "0.7.3"

# FTS design system (wraps lumen-blocks, lucide-dioxus, layout, typography)
fts-ui = { git = "https://github.com/FastTrackStudios/fts-ui.git", branch = "main" }

# Lumen blocks (Dioxus shadcn-inspired components)
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
dioxus-time = { git = "https://github.com/ealmloff/dioxus-std", rev = "7e0c41ef8c5514e46e8ac657227568660cf38987" }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }

# Dioxus UI framework (pinned to 0.7.2 - native 0.7.3 not yet on crates.io)
dioxus = "0.7.2"
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }

# macOS dependencies for swell-ui (using exact versions for compatibility)
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies (optional, for cross-platform)
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

image = "0.25"
ab_glyph = "0.2"
imageproc = "0.25"

# Anyrender - 2D rendering abstraction (WGPU/Vello backend)
anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_svg = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }

# Linebender graphics crates (matching anyrender's versions)
vello = { version = "0.7", features = ["wgpu"] }
peniko = "0.6"
kurbo = "0.13"
color = "0.3"
wgpu = "27"
pollster = "0.4"

# ── Local development overrides ──────────────────────────────────────
# Uncomment the sections below to use local checkouts instead of GitHub.
# This gives you instant rebuilds when iterating across repos.
#
[patch."https://github.com/FastTrackStudios/keyflow.git"]
keyflow = { path = "../keyflow/crates/keyflow" }
engraver = { path = "../keyflow/crates/engraver" }
keyflow-ui = { path = "../keyflow/crates/keyflow-ui" }
#
[patch."https://github.com/FastTrackStudios/daw.git"]
daw = { path = "../daw/crates/daw" }
daw-proto = { path = "../daw/crates/daw-proto" }
daw-control = { path = "../daw/crates/daw-control" }
daw-control-sync = { path = "../daw/crates/daw-control-sync" }
daw-extension-runtime = { path = "../daw/crates/daw-extension-runtime" }
daw-ui = { path = "../daw/crates/daw-ui" }
daw-cli = { path = "../daw/apps/daw" }
audio-controls = { path = "../daw/crates/audio-controls" }
dawfile-reaper = { path = "../daw/crates/dawfile-reaper" }
reaper-test = { path = "../daw/crates/reaper-test" }
reaper-test-macro = { path = "../daw/crates/reaper-test-macro" }
reaper-launcher = { path = "../daw/crates/reaper-launcher" }
daw-allocator = { path = "../daw/crates/daw-allocator" }
#
[patch."https://github.com/FastTrackStudios/dock-dioxus.git"]
dock-proto = { path = "../dock-dioxus/crates/dock-proto" }
dock-dioxus = { path = "../dock-dioxus/crates/dock-dioxus" }
#
[patch."https://github.com/FastTrackStudios/input_actions.git"]
actions-proto = { path = "../input_actions/crates/actions-proto" }
actions-registry = { path = "../input_actions/crates/actions-registry" }
actions-standalone = { path = "../input_actions/crates/actions-standalone" }
actions-keybindings = { path = "../input_actions/crates/actions-keybindings" }
input-dioxus = { path = "../input_actions/crates/input-dioxus" }
input = { path = "../input_actions/crates/input" }
#
[patch."https://github.com/FastTrackStudios/dynamic-template.git"]
color-palette = { path = "../dynamic-template/crates/color-palette" }
music-catalog = { path = "../dynamic-template/crates/music-catalog" }
dynamic-template-proto = { path = "../dynamic-template/crates/dynamic-template-proto" }
dynamic-template = { path = "../dynamic-template/crates/dynamic-template" }

# Keyflow references session from session.git.
# Patches from keyflow's own Cargo.toml are ignored when consumed as a dependency,
# so we must patch them here in the root workspace.
[patch."https://github.com/FastTrackStudios/session.git"]
session = { path = "../session/crates/session" }
session-ui = { path = "../session/crates/session-ui" }

#
# [patch."https://github.com/FastTrackStudios/fts-ui.git"]
# fts-ui = { path = "../../fts-ui/crates/fts-ui" }

# ── Vendored patches ──────────────────────────────────────────────────
# moire: unify crates.io moire with the git rev that vox pulls in,
# avoiding duplicate moire-runtime #[ctor] registrations that crash.
# moire-trace-capture: tolerate broken frame-pointer chains (NixOS glibc).
[patch."https://github.com/bearcove/moire"]
moire-trace-capture = { path = "../forks/moire-trace-capture" }

[patch.crates-io]
moire = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-macros-noop = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-runtime = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-tokio = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-trace-types = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-types = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-wasm = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-wire = { git = "https://github.com/bearcove/moire", rev = "13eac79" }

# WASM dev profile: opt-level 1 avoids "too many locals" error in walrus
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
