[workspace.metadata.crane]
name = "fasttrackstudio"

[workspace]
members = [
    # Crates
    "crates/shared/installer-core",
    "crates/shared/utils",
    "crates/shared/vox-discover",
    # Apps
    "apps/desktop",
    "apps/web",
    "apps/mobile",
    "apps/fts-cli",
    "apps/installer",
    "apps/tests/wasm",
    # Tools
    "xtask",
]
resolver = "2"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://git.starcommand.live/FastTrackStudios/FastTrackStudio"
authors = ["FastTrack Studio"]

[workspace.dependencies]
# Facet ecosystem - 0.46 (matches sibling repos and Codys-Wright/vox 5ce8cdd9)
facet = { version = "0.46" }
facet-core = { version = "0.46" }
facet-default = { version = "0.46" }
facet-format = { version = "0.47" }
facet-json = { version = "0.46" }
facet-postcard = { version = "0.46" }
facet-pretty = { version = "0.46" }
facet-toml = { version = "0.46" }
facet-value = { version = "0.46" }
facet-yaml = { version = "0.46" }
facet-styx = { version = "3.0" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
anyhow = "1.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures = "0.3"
clap = { version = "4", features = ["derive"] }

# Vox crates — using FTS fork (fixes wasm32 compilation)
vox = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-codegen = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-core = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-schema = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-inprocess = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-stream = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-websocket = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-local = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
subject-rust = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
ur-taking-me-with-you = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9", features = ["tokio"] }

# Instrumentation
moire = { version = "1.0", features = ["diagnostics"] }

# Keyflow/Engraver crates (sibling repo — facade pattern)
# NOTE: keyflow-proto, keyflow-text, keyflow-midi, engraver-proto are INTERNAL.
# Access them through the `keyflow` or `engraver` facade crates.
keyflow = { git = "https://git.starcommand.live/FastTrackStudios/keyflow.git", branch = "main" }
engraver = { git = "https://git.starcommand.live/FastTrackStudios/keyflow.git", branch = "main" }
keyflow-ui = { git = "https://git.starcommand.live/FastTrackStudios/keyflow.git", branch = "main", default-features = false }

# DAW domain
# `daw` is the facade. `daw-cli` is a public sibling crate of CLI
# helpers reused by `fts-cli`. `daw-extension-runtime` is a public
# sibling crate for in-process REAPER extension hosting (folding it
# into `daw` would cycle through daw-reaper → keyflow → daw, see daw
# a823b67).
daw = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-cli = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
# `daw-proto` is listed here so the fts-cli TUI can build typed
# service clients (TransportClient, TracksClient, ProjectsClient) on
# top of the Vox connection it shares with session-cli.
daw-proto = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }

# Dock UI (sibling repo)
dock-proto = { git = "https://git.starcommand.live/FastTrackStudios/dock-dioxus.git", branch = "main" }
dock-dioxus = { git = "https://git.starcommand.live/FastTrackStudios/dock-dioxus.git", branch = "main" }

# Actions / Input (sibling repo)
actions-proto = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }
actions-registry = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }
actions-standalone = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }
actions-keybindings = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }
input-dioxus = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }
input = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }

# Dynamic template (sibling repo)
color-palette = { git = "https://git.starcommand.live/FastTrackStudios/dynamic-template.git", branch = "main" }
music-catalog = { git = "https://git.starcommand.live/FastTrackStudios/dynamic-template.git", branch = "main" }
dynamic-template-proto = { git = "https://git.starcommand.live/FastTrackStudios/dynamic-template.git", branch = "main" }
dynamic-template = { git = "https://git.starcommand.live/FastTrackStudios/dynamic-template.git", branch = "main" }

# Shared infrastructure
audio-controls = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
vox-discover = { path = "crates/shared/vox-discover" }
installer-core = { path = "crates/shared/installer-core" }

# Signal (sibling repo)
signal = { git = "https://git.starcommand.live/FastTrackStudios/signal.git", branch = "main" }
signal-ui = { git = "https://git.starcommand.live/FastTrackStudios/signal.git", branch = "main", default-features = false }
signal-cli = { git = "https://git.starcommand.live/FastTrackStudios/signal.git", branch = "main" }
macromod = { git = "https://git.starcommand.live/FastTrackStudios/signal.git", branch = "main" }

# Session (sibling repo)
# NOTE: session-proto is listed here for use by session-ui (internal domain crate only).
# App crates must NOT depend on session-proto directly — use the `session` facade instead.
session = { git = "https://git.starcommand.live/FastTrackStudios/session.git", branch = "main" }
session-proto = { git = "https://git.starcommand.live/FastTrackStudios/session.git", branch = "main" }
session-ui = { git = "https://git.starcommand.live/FastTrackStudios/session.git", branch = "main" }
session-cli = { git = "https://git.starcommand.live/FastTrackStudios/session.git", branch = "main" }

# Sync (sibling repo)
sync = { git = "https://git.starcommand.live/FastTrackStudios/sync.git", branch = "main" }
sync-proto = { git = "https://git.starcommand.live/FastTrackStudios/sync.git", branch = "main" }
sync-ui = { git = "https://git.starcommand.live/FastTrackStudios/sync.git", branch = "main" }

utils = { path = "crates/shared/utils" }

# REAPER extension dependencies (FTS fork with v7.63 ruler lane APIs)
reaper-low = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-common-types = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes", features = ["palette"] }
reaper-test = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
reaper-test-macro = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
reaper-launcher = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
fragile = "2.0.1"
crossbeam-channel = "0.5"
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
palette = "0.7.3"

# FTS design system (wraps lumen-blocks, lucide-dioxus, layout, typography)
fts-ui = { git = "https://git.starcommand.live/FastTrackStudios/fts-ui.git", branch = "main" }

# Lumen blocks (Dioxus shadcn-inspired components)
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
dioxus-time = { git = "https://github.com/ealmloff/dioxus-std", rev = "7e0c41ef8c5514e46e8ac657227568660cf38987" }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }

# Dioxus UI framework (0.7.9 — matches dioxus-flake's pinned dx)
dioxus = "0.7.9"
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }

# macOS dependencies for swell-ui (using exact versions for compatibility)
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies (optional, for cross-platform)
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

image = "0.25"
ab_glyph = "0.2"
imageproc = "0.25"

# Anyrender - 2D rendering abstraction (WGPU/Vello backend)
anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_svg = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }

# Linebender graphics crates (matching anyrender's versions)
vello = { version = "0.7", features = ["wgpu"] }
peniko = "0.6"
kurbo = "0.13"
color = "0.3"
wgpu = "27"
pollster = "0.4"

# ── Sibling FTS repo deps ─────────────────────────────────────────────
# All sibling domain crates are consumed from their git.starcommand.live
# remotes (no local-path overrides) so the workspace builds on any machine
# / in CI from a bare checkout. The only [patch] blocks below redirect
# alternate URL schemes (ssh-starcommand, leftover github) onto the
# canonical https-starcommand remotes so the graph resolves a single copy
# of daw / reaper-rs. To iterate on a sibling locally, add a temporary
# `[patch."<url>"] crate = { path = "../<repo>/..." }` block (and don't
# commit it).

# reaper-rs is referenced via https-starcommand (canonical), ssh-starcommand
# (session), and still github by a couple of daw crates (daw-reaper-dioxus-ext*
# — the daw URL migration missed them). Redirect github + ssh onto the
# https-starcommand remote so the whole graph resolves to one reaper-low —
# otherwise two URL schemes produce HWND/RECT type mismatches in daw-reaper.
[patch."https://github.com/FastTrackStudios/reaper-rs.git"]
reaper-high = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-low = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-common-types = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# session references daw + reaper-rs via the ssh-starcommand URL; our workspace
# uses the https-starcommand URL. Cargo treats the two URL schemes as distinct
# sources, so without these redirects the graph resolves TWO copies of daw /
# reaper-rs (→ daw_control::Daw vs daw::rpc::Daw, duplicate reaper-low, etc.).
# Redirect ssh-starcommand onto the canonical https-starcommand remote.
[patch."ssh://forgejo@git.starcommand.live/FastTrackStudios/daw.git"]
daw = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-cli = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-proto = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-control = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-reaper = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-module = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-standalone = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-synchronization = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
dawfile-reaper = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
audio-controls = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
reaper-test = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
reaper-test-macro = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
reaper-launcher = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }

[patch."ssh://forgejo@git.starcommand.live/FastTrackStudios/reaper-rs.git"]
reaper-high = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-low = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-common-types = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# Signal patched out for now — local signal pins an older vox rev
# (Codys-Wright/vox@2a2f793b) that drags facet 0.44 into the
# workspace and conflicts with the rest of FTS on facet 0.46.
# Re-enable when signal bumps to bearcove/vox@27eef573 (or matches
# whatever rev daw/session settle on).
#
# [patch."https://git.starcommand.live/FastTrackStudios/signal.git"]
# signal = { path = "../signal/crates/signal" }
# signal-ui = { path = "../signal/crates/signal-ui" }
# signal-cli = { path = "../signal/apps/cli" }
# macromod = { path = "../signal/crates/macromod" }


# Pin every transitive vox reference to the same bearcove rev that the
# sibling domain repos (daw, session, keyflow, …) use. Without this,
# any third-party crate that loosely pulls in `bearcove/vox.git` can
# drag an older vox-macros-core in, which transitively pins facet 0.44
# and conflicts with the facet 0.46 the FTS workspace runs on.
# Redirect the OLD `Codys-Wright/vox` rev (signal still pins 2a2f793b
# which transitively drags in facet 0.44 and conflicts with the rest
# of the FTS workspace running on facet 0.46) to the bearcove rev
# every other sibling agrees on.
[patch."https://github.com/Codys-Wright/vox.git"]
vox = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-core = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-types = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-stream = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-inprocess = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
ur-taking-me-with-you = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }

# ── Vendored patches ──────────────────────────────────────────────────
# moire: unify crates.io moire with the git rev that vox pulls in,
# avoiding duplicate moire-runtime #[ctor] registrations that crash.
[patch.crates-io]
moire = { git = "https://github.com/bearcove/moire", rev = "cf162e7" }
moire-macros-noop = { git = "https://github.com/bearcove/moire", rev = "cf162e7" }
moire-runtime = { git = "https://github.com/bearcove/moire", rev = "cf162e7" }
moire-tokio = { git = "https://github.com/bearcove/moire", rev = "cf162e7" }
moire-trace-types = { git = "https://github.com/bearcove/moire", rev = "cf162e7" }
moire-types = { git = "https://github.com/bearcove/moire", rev = "cf162e7" }
moire-wasm = { git = "https://github.com/bearcove/moire", rev = "cf162e7" }
moire-wire = { git = "https://github.com/bearcove/moire", rev = "cf162e7" }

# WASM dev profile: opt-level 1 avoids "too many locals" error in walrus
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
