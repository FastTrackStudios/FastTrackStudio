[workspace.dependencies.validator]
version = "0.19"
features = ["derive"]

[workspace.dependencies.sha2]
version = "0.10"

[workspace.dependencies.aes-gcm]
version = "0.10"

[workspace.dependencies.hkdf]
version = "0.12"

[workspace.dependencies.hmac]
version = "0.12"

[workspace.dependencies.totp-rs]
version = "5"
features = ["gen_secret", "otpauth"]

[profile.wasm-dev]
opt-level = 1
inherits = "dev"

# Use the local FastTrackStudio input_actions checkout during development so
# dependent crates share the same updated vox/facet stack.
[patch."https://github.com/FastTrackStudios/input_actions.git"]
actions-proto = { path = "../FastTrackStudio/input_actions/crates/actions-proto" }

