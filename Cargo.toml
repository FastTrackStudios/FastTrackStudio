    "libs/devtools/fts-devtools",
    "libs/devtools/daw-test-macro",
    # ── features/audio ────────────────────────────────────────────────
    "features/audio/daw-audio-graph",
    "features/audio/daw-audio-io",
    "features/audio/daw-allocator",
    "features/audio/fts-audio-proto",
    "features/audio/audio-controls",
