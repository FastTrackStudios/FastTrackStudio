[workspace.metadata.crane]
name = "fasttrackstudio"

[workspace]
members = [
    # Crates
    "crates/shared/installer-core",
    "crates/shared/utils",
    "crates/shared/vox-discover",
    # Apps
    "apps/desktop",
    "apps/web",
    "apps/mobile",
    "apps/fts-cli",
    "apps/installer",
    "apps/tests/wasm",
    # Tools
    "xtask",
]
resolver = "2"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FastTrackStudios/FastTrackStudio"
authors = ["FastTrack Studio"]

[workspace.dependencies]
# Facet ecosystem - 0.46 (matches sibling repos and Codys-Wright/vox 5ce8cdd9)
facet = { version = "0.46" }
facet-core = { version = "0.46" }
facet-default = { version = "0.46" }
facet-format = { version = "0.47" }
facet-json = { version = "0.46" }
facet-postcard = { version = "0.46" }
facet-pretty = { version = "0.46" }
facet-toml = { version = "0.46" }
facet-value = { version = "0.46" }
facet-yaml = { version = "0.46" }
facet-styx = { version = "3.0" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
anyhow = "1.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures = "0.3"
clap = { version = "4", features = ["derive"] }

# Vox crates — using FTS fork (fixes wasm32 compilation)
vox = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-codegen = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-core = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-schema = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-inprocess = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-stream = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-websocket = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-local = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
subject-rust = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
ur-taking-me-with-you = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9", features = ["tokio"] }

# Instrumentation
moire = { version = "1.0", features = ["diagnostics"] }

# Keyflow/Engraver crates (sibling repo — facade pattern)
# NOTE: keyflow-proto, keyflow-text, keyflow-midi, engraver-proto are INTERNAL.
# Access them through the `keyflow` or `engraver` facade crates.
keyflow = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "main" }
engraver = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "main" }
keyflow-ui = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "main", default-features = false }

# DAW domain
# `daw` is the facade. `daw-cli` is a public sibling crate of CLI
# helpers reused by `fts-cli`. `daw-extension-runtime` is a public
# sibling crate for in-process REAPER extension hosting (folding it
# into `daw` would cycle through daw-reaper → keyflow → daw, see daw
# a823b67).
daw = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
daw-cli = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }

# Dock UI (sibling repo)
dock-proto = { git = "https://github.com/FastTrackStudios/dock-dioxus.git", branch = "main" }
dock-dioxus = { git = "https://github.com/FastTrackStudios/dock-dioxus.git", branch = "main" }

# Actions / Input (sibling repo)
actions-proto = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
actions-registry = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
actions-standalone = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
actions-keybindings = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
input-dioxus = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }
input = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "main" }

# Dynamic template (sibling repo)
color-palette = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "main" }
music-catalog = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "main" }
dynamic-template-proto = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "main" }
dynamic-template = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "main" }

# Shared infrastructure
audio-controls = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
vox-discover = { path = "crates/shared/vox-discover" }
installer-core = { path = "crates/shared/installer-core" }

# Signal (sibling repo)
signal = { git = "https://github.com/FastTrackStudios/signal.git", branch = "main" }
signal-ui = { git = "https://github.com/FastTrackStudios/signal.git", branch = "main", default-features = false }
signal-cli = { git = "https://github.com/FastTrackStudios/signal.git", branch = "main" }
macromod = { git = "https://github.com/FastTrackStudios/signal.git", branch = "main" }

# Session (sibling repo)
# NOTE: session-proto is listed here for use by session-ui (internal domain crate only).
# App crates must NOT depend on session-proto directly — use the `session` facade instead.
session = { git = "https://github.com/FastTrackStudios/session.git", branch = "main" }
session-proto = { git = "https://github.com/FastTrackStudios/session.git", branch = "main" }
session-ui = { git = "https://github.com/FastTrackStudios/session.git", branch = "main" }
session-cli = { git = "https://github.com/FastTrackStudios/session.git", branch = "main" }

# Sync (sibling repo)
sync = { git = "https://github.com/FastTrackStudios/sync.git", branch = "main" }
sync-proto = { git = "https://github.com/FastTrackStudios/sync.git", branch = "main" }
sync-ui = { git = "https://github.com/FastTrackStudios/sync.git", branch = "main" }

utils = { path = "crates/shared/utils" }

# REAPER extension dependencies (FTS fork with v7.63 ruler lane APIs)
reaper-low = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-common-types = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes", features = ["palette"] }
# FTS REAPER crates (shared reaper-lib repo)
swell-ui = { path = "../reaper-lib/crates/swell-ui" }
reaper-embed = { path = "../reaper-lib/crates/reaper-embed" }
reaper-test = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
reaper-test-macro = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
reaper-launcher = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
fragile = "2.0.1"
crossbeam-channel = "0.5"
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
palette = "0.7.3"

# FTS design system (wraps lumen-blocks, lucide-dioxus, layout, typography)
fts-ui = { git = "https://github.com/FastTrackStudios/fts-ui.git", branch = "main" }

# Lumen blocks (Dioxus shadcn-inspired components)
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
dioxus-time = { git = "https://github.com/ealmloff/dioxus-std", rev = "7e0c41ef8c5514e46e8ac657227568660cf38987" }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }

# Dioxus UI framework (0.7.9 — matches dioxus-flake's pinned dx)
dioxus = "0.7.9"
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }

# macOS dependencies for swell-ui (using exact versions for compatibility)
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies (optional, for cross-platform)
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

image = "0.25"
ab_glyph = "0.2"
imageproc = "0.25"

# Anyrender - 2D rendering abstraction (WGPU/Vello backend)
anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_svg = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }

# Linebender graphics crates (matching anyrender's versions)
vello = { version = "0.7", features = ["wgpu"] }
peniko = "0.6"
kurbo = "0.13"
color = "0.3"
wgpu = "27"
pollster = "0.4"

# Redirect bearcove/vox.git transitive deps to the FTS fork (fixes wasm32 compilation).
[patch."https://github.com/bearcove/vox.git"]
vox = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-core = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-types = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-postcard = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-stream = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-websocket = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-schema = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-codegen = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }
vox-inprocess = { git = "https://github.com/Codys-Wright/vox.git", rev = "5ce8cdd9" }

# ── Vendored patches ──────────────────────────────────────────────────
# moire: unify crates.io moire with the git rev that vox pulls in,
# avoiding duplicate moire-runtime #[ctor] registrations that crash.
[patch.crates-io]
moire = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-macros-noop = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-runtime = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-tokio = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-trace-types = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-types = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-wasm = { git = "https://github.com/bearcove/moire", rev = "13eac79" }
moire-wire = { git = "https://github.com/bearcove/moire", rev = "13eac79" }

# WASM dev profile: opt-level 1 avoids "too many locals" error in walrus
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
