[workspace]
resolver = "2"
members = [
    "crates/editor-state",
    "crates/editor-view",
    "crates/editor",
    "examples/playground",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Cody Wright <acodywright@gmail.com>"]
repository = ""
rust-version = "1.80"

[workspace.dependencies]
# Internal
editor-state = { path = "crates/editor-state" }
editor-view = { path = "crates/editor-view" }
editor = { path = "crates/editor" }

# UI
dioxus = "0.7"

# Doc model
ropey = "1.6"

# General
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
