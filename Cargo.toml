[workspace]
members = [
    "crates/fts-extensions",
    "crates/ui-test-standalone",
    "crates/ui-snapshot",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# FTS side repos are declared as pinned git dependencies for reproducible
# manifests. The local-development patch sections below redirect these packages
# back to sibling checkouts while iterating across repos.
fts-launcher = { git = "https://github.com/FastTrackStudios/fts-launcher.git", rev = "698a29121c2d20c24cba5a58d608c6f5da0f56a0", features = ["native"] }
dynamic-template = { git = "https://github.com/FastTrackStudios/dynamic-template.git", rev = "d4467d3807b970476c09641d6c240321653f5148" }
dynamic-template-proto = { git = "https://github.com/FastTrackStudios/dynamic-template.git", rev = "d4467d3807b970476c09641d6c240321653f5148" }
session = { git = "https://github.com/FastTrackStudios/session.git", rev = "189f942bd9fc07513ed913c488b36871f661849d" }
sync = { git = "https://github.com/FastTrackStudios/sync.git", rev = "e542c64e1af5c9ddbb70a7c1ec0829f78f46ad71" }
sync-proto = { git = "https://github.com/FastTrackStudios/sync.git", rev = "e542c64e1af5c9ddbb70a7c1ec0829f78f46ad71" }
reaper-input = { git = "https://github.com/FastTrackStudios/input.git", rev = "7f06a6acf027956c94b6fa2cab5b50c425ca1067" }
keyflow = { git = "https://github.com/FastTrackStudios/keyflow.git", rev = "887a231cef3e6aca698a67e37b61f65ca42297ce", default-features = false }
crossbeam-channel = "0.5"
once_cell = "1"
eyre = "0.6"
fragile = "2"
reaper-high = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-low = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
daw = { git = "https://github.com/FastTrackStudios/daw.git", rev = "baa648803fbe3fd0d19dbd314fbe37fdd2a9a38a" }
fts-ui = { git = "https://github.com/FastTrackStudios/fts-ui.git", rev = "d9f01261cb59708300cc5b31fa7fe6bd766a66aa" }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reaper-test = { git = "https://github.com/FastTrackStudios/daw.git", rev = "baa648803fbe3fd0d19dbd314fbe37fdd2a9a38a" }

# ── Local development patches ─────────────────────────────────────────────
# Keep these active when working from the FastTrackStudio sibling checkout.
# Comment them out after pushing the pinned side-repo commits if you want to
# validate the remote-pinned graph.
[patch."https://github.com/FastTrackStudios/fts-launcher.git"]
fts-launcher = { path = "../fts-launcher" }

[patch."https://github.com/FastTrackStudios/daw.git"]
daw = { path = "../daw/crates/daw" }
daw-proto = { path = "../daw/crates/daw-proto" }
daw-control = { path = "../daw/crates/daw-control" }
daw-control-sync = { path = "../daw/crates/daw-control-sync" }
daw-extension-runtime = { path = "../daw/crates/daw-extension-runtime" }
daw-module = { path = "../daw/crates/daw-module" }
daw-standalone = { path = "../daw/crates/daw-standalone" }
daw-reaper-embed = { path = "../daw/crates/daw-reaper-embed" }
daw-reaper-dioxus = { path = "../daw/crates/daw-reaper-dioxus" }
dawfile-reaper = { path = "../daw/crates/dawfile-reaper" }
dawfile-ableton = { path = "../daw/crates/dawfile-ableton" }
reaper-test = { path = "../daw/crates/reaper-test" }
reaper-launcher = { path = "../daw/crates/reaper-launcher" }

[patch."https://github.com/FastTrackStudios/input.git"]
reaper-input = { path = "../input/crates/reaper-input" }

[patch."https://github.com/FastTrackStudios/input_actions.git"]
