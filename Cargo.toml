[workspace.metadata.crane]
name = "fasttrackstudio"

[workspace]
members = [
    "crates/*/*",
    "apps/tests/*",
    "apps/fts-control/*",
    "apps/fasttrackstudio/*",
    "apps/fts-cli",
    "apps/signal-cli",
    "apps/session-cli",
    "apps/reaper-extension",
    "xtask",
]
resolver = "2"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.package]
edition = "2021"
rust-version = "1.82"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/roam"
authors = ["FastTrack Studio"]

[workspace.dependencies]
# Facet ecosystem - use crates.io 0.44.x to match git main branch
facet = { version = "0.44" }
facet-core = { version = "0.44" }
facet-default = { version = "0.44" }
facet-format = { version = "0.44" }
facet-json = { version = "0.44" }
facet-postcard = { version = "0.44" }
facet-pretty = { version = "0.44" }
facet-toml = { version = "0.44" }
facet-value = { version = "0.44" }
facet-yaml = { version = "0.44" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
anyhow = "1.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures = "0.3"

# Roam crates (bearcove upstream — pinned, latest main needs peeps sub-crates not yet published)
roam = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-codegen = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-frame = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-hash = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-schema = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-service-macros = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-inprocess = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-stream = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-task-local = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-tracing = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-websocket = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-local = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-http-bridge = { git = "https://github.com/bearcove/roam.git", branch = "main" }
subject-rust = { git = "https://github.com/bearcove/roam.git", branch = "main" }
ur-taking-me-with-you = { git = "https://github.com/bearcove/roam.git", branch = "main", features = ["tokio"] }
shm-primitives = { git = "https://github.com/bearcove/roam.git", branch = "main" }

# Instrumentation
moire = { git = "https://github.com/bearcove/peeps", branch = "main", features = ["diagnostics"] }

# Keyflow/Engraver crates (sibling repo — facade pattern)
# NOTE: keyflow-proto, keyflow-text, keyflow-midi, engraver-proto are INTERNAL.
# Access them through the `keyflow` or `engraver` facade crates.
keyflow = { path = "../keyflow/crates/keyflow" }
engraver = { path = "../keyflow/crates/engraver" }
keyflow-ui = { path = "../keyflow/crates/keyflow-ui" }

# DAW facade crate (sibling repo — single public API surface)
daw = { path = "../daw/crates/daw" }
daw-ui = { path = "../daw/crates/daw-ui" }
daw-cli = { path = "../daw/apps/daw" }
# NOTE: daw-proto, daw-control, daw-control-sync, daw-reaper, daw-standalone,
# dawfile-reaper are INTERNAL. Access them through the `daw` facade crate.
# Use features: sync, reaper, standalone, file
signal-cli = { path = "apps/signal-cli" }
session-cli = { path = "apps/session-cli" }

# Dock UI (sibling repo — local paths)
dock-proto = { path = "../dock-dioxus/crates/dock-proto" }
dock-dioxus = { path = "../dock-dioxus/crates/dock-dioxus" }

# Actions / Input (sibling repo — local paths)
actions-proto = { path = "../input_actions/crates/actions-proto" }
actions-registry = { path = "../input_actions/crates/actions-registry" }
actions-standalone = { path = "../input_actions/crates/actions-standalone" }
actions-keybindings = { path = "../input_actions/crates/actions-keybindings" }
input-dioxus = { path = "../input_actions/crates/input-dioxus" }
input = { path = "../input_actions/crates/input" }
input-reaper = { path = "crates/reaper/input-reaper" }

# Dynamic template (sibling repo — local paths)
color-palette = { path = "../dynamic-template/crates/color-palette" }
dynamic-template-proto = { path = "../dynamic-template/crates/dynamic-template-proto" }
dynamic-template = { path = "../dynamic-template/crates/dynamic-template" }

# Shared infrastructure
daw-allocator = { path = "crates/shared/daw-allocator" }

# Local crates
macromod = { path = "crates/macromod/macromod" }
# NOTE: session-proto is listed here for use by session-ui (internal domain crate only).
# App crates must NOT depend on session-proto directly — use the `session` facade instead.
session-proto = { path = "crates/session/session-proto" }
session = { path = "crates/session/session" }
session-ui = { path = "crates/session/session-ui" }
audio-controls = { path = "../daw/crates/audio-controls" }
signal = { path = "crates/signal/signal" }
signal-ui = { path = "crates/signal/signal-ui", default-features = false }
utils = { path = "crates/shared/utils" }
sync-proto = { path = "crates/sync/sync-proto" }
sync = { path = "crates/sync/sync" }
sync-ui = { path = "crates/sync/sync-ui" }

# REAPER extension dependencies
reaper-low = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-medium = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-high = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-macros = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-common-types = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master", features = ["palette"] }
# FTS REAPER crates (in-workspace)
swell-ui = { path = "crates/reaper/swell-ui" }
reaper-embed = { path = "crates/reaper/reaper-embed" }
reaper-test = { path = "../daw/crates/reaper-test" }
reaper-test-macro = { path = "../daw/crates/reaper-test-macro" }
reaper-extension = { path = "apps/reaper-extension" }
fragile = "2.0.1"
crossbeam-channel = "0.5"
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
palette = "0.7.3"

# FTS design system (wraps lumen-blocks, lucide-dioxus, layout, typography)
fts-ui = { path = "../../fts-ui/crates/fts-ui" }

# Lumen blocks (Dioxus shadcn-inspired components)
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
dioxus-time = { git = "https://github.com/ealmloff/dioxus-std", rev = "7e0c41ef8c5514e46e8ac657227568660cf38987" }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }

# Dioxus UI framework (pinned to 0.7.2 - native 0.7.3 not yet on crates.io)
dioxus = "0.7.2"
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }

# macOS dependencies for swell-ui (using exact versions for compatibility)
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies (optional, for cross-platform)
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

image = "0.25"
ab_glyph = "0.2"
imageproc = "0.25"

# Anyrender - 2D rendering abstraction (WGPU/Vello backend)
anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_svg = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }

# Linebender graphics crates (matching anyrender's versions)
vello = { version = "0.7", features = ["wgpu"] }
peniko = "0.6"
kurbo = "0.13"
color = "0.3"
wgpu = "27"
pollster = "0.4"

# WASM dev profile: opt-level 1 avoids "too many locals" error in walrus
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
