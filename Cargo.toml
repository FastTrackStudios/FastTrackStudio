[workspace]
members = [
    "apps/cli",
    "apps/desktop",
    "apps/mobile",
    "apps/tui",
    "crates/macromod",
    "crates/nam-manager",
    "crates/signal",
    "crates/signal-audio",
    "crates/signal-browser",
    "crates/signal-controller",
    "crates/signal-daw-bridge",
    "crates/signal-extension",
    "crates/fts-signal-controller",
    "crates/signal-import",
    "crates/signal-live",
    "crates/signal-proto",
    "crates/signal-sampler",
    "crates/signal-storage",
    "crates/signal-ui",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── Facade crate ─────────────────────────────────────────────────────
# The only public API surface for the signal domain.
# Apps depend on `signal`; never on signal-proto, signal-live, etc.
signal = { path = "crates/signal" }
# App crate (binary + lib)
signal-cli = { path = "apps/cli" }
signal-desktop = { path = "apps/desktop" }
signal-mobile = { path = "apps/mobile" }
# UI crate (Dioxus components with feature flags)
signal-ui = { path = "crates/signal-ui", default-features = false }
# Headless browser data layer (no Dioxus) — consumed by signal-ui and future TUI/CLI.
signal-browser = { path = "crates/signal-browser" }
# NOTE: signal-proto, signal-controller, signal-live, signal-storage,
# signal-import, signal-daw-bridge, nam-manager are INTERNAL.
# Access them through the `signal` facade crate.

# ── Local utility crates ─────────────────────────────────────────────
macromod       = { path = "crates/macromod" }
signal-audio   = { path = "crates/signal-audio" }
signal-sampler = { path = "crates/signal-sampler" }

# ── DSP crates (split FTS plugin repos) ───────────────────────────────
# Using local paths directly (same as [patch] overrides) to avoid
# git submodule fetch issues with stale nih-plug submodule rev.
eq-dsp = { path = "../Plugins/FTS-EQ/crates/eq-dsp" }
fts-dsp = { path = "../Plugins/FTS-Audiocore/crates/fts-dsp" }
cpal = "0.17"

# ── Facet reflection ─────────────────────────────────────────────────
facet = { version = "0.44" }
facet-styx = { version = "2.0" }
facet-toml = { version = "0.44" }

# ── ROAM service framework (latest main) ─────────────────────────────
vox = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
ur-taking-me-with-you = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }

# ── DAW facade crate (sibling repo — single public API surface) ──────
daw = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-cli = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
# NOTE: daw-proto, daw-control, daw-control-sync, daw-reaper, daw-standalone,
# dawfile-reaper are INTERNAL. Access them through the `daw` facade crate.

# ── Shared infrastructure ────────────────────────────────────────────
audio-controls = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
reaper-test = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }

# ── Sibling repos ────────────────────────────────────────────────────
actions-proto = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }
dock-dioxus = { git = "https://git.starcommand.live/FastTrackStudios/dock-dioxus.git", branch = "main", default-features = false }
dock-proto = { git = "https://git.starcommand.live/FastTrackStudios/dock-dioxus.git", branch = "main" }

# Utils from FastTrackStudio monorepo
utils = { git = "https://git.starcommand.live/FastTrackStudios/FastTrackStudio.git", branch = "main" }

# ── Plugin framework ───────────────────────────────────────────────────
nih_plug = { git = "https://git.starcommand.live/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }
# Blitz-based Dioxus renderer — used by ALL GUI contexts (desktop standalone,
# REAPER embedded, VST3/CLAP plugin). Guarantees the same rendering pipeline
# everywhere. Use open_standalone_with_state() in signal-desktop and
# create_dioxus_editor_with_state() in fts-signal-plugin.
nih_plug_dioxus = { git = "https://git.starcommand.live/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }
fts-plugin-core = { path = "../Plugins/FTS-Audiocore/crates/fts-plugin-core", default-features = false }
audio-gui = { path = "../Plugins/FTS-Audiocore/crates/audio-gui" }
atomic_float = "1"
crossbeam-channel = "0.5"
midir = "0.10"

# ── UI ────────────────────────────────────────────────────────────────
dioxus = "=0.7.3"
fts-ui = { git = "https://git.starcommand.live/FastTrackStudios/fts-ui.git", branch = "main" }
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }

# ── Async runtime ────────────────────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# ── Serialization ────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# ── Observability ────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moire = { version = "1.0", features = ["diagnostics"] }

# ── Utilities ────────────────────────────────────────────────────────
eyre = "0.6"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
clap = { version = "4", features = ["derive"] }

# ── Local development overrides ──────────────────────────────────────
# Uncomment the sections below to use local checkouts instead of GitHub.
# This gives you instant rebuilds when iterating across repos.
#
# [patch."https://git.starcommand.live/FastTrackStudios/daw.git"]
# daw = { path = "../daw/crates/daw" }
# daw-cli = { path = "../daw/apps/daw" }
# daw-extension-runtime = { path = "../daw/crates/daw-extension-runtime" }
# audio-controls = { path = "../daw/crates/audio-controls" }
# reaper-test = { path = "../daw/crates/reaper-test" }
# fts-devtools = { path = "../daw/crates/fts-devtools" }
#
# [patch."https://git.starcommand.live/FastTrackStudios/input_actions.git"]
# actions-proto = { path = "../input_actions/crates/actions-proto" }
#
# [patch."https://git.starcommand.live/FastTrackStudios/dock-dioxus.git"]
# dock-dioxus = { path = "../dock-dioxus/crates/dock-dioxus" }
# dock-proto = { path = "../dock-dioxus/crates/dock-proto" }
#
# [patch."https://git.starcommand.live/FastTrackStudios/FastTrackStudio.git"]
# utils = { path = "../FastTrackStudio/crates/shared/utils" }
#
# [patch."https://git.starcommand.live/FastTrackStudios/fts-ui.git"]
# fts-ui = { path = "../fts-ui/crates/fts-ui" }
#
# ── Split FTS plugin repo local overrides ───────────────────────────────
[patch."https://git.starcommand.live/FastTrackStudios/FTS-Plugins.git"]
eq-dsp = { path = "../Plugins/FTS-EQ/crates/eq-dsp" }
fts-dsp = { path = "../Plugins/FTS-Audiocore/crates/fts-dsp" }
audio-gui = { path = "../Plugins/FTS-Audiocore/crates/audio-gui" }
fts-plugin-core = { path = "../Plugins/FTS-Audiocore/crates/fts-plugin-core" }

# ── nih-plug unification ────────────────────────────────────────────────
[patch."https://git.starcommand.live/FastTrackStudios/nih-plug.git"]
nih_plug = { path = "../forks/nih-plug" }

# ── Blitz patches (FTS fork with post-processing support) ──────────────
# Required by nih_plug_dioxus / audio-gui for embedded plugin UIs.
[patch."https://github.com/DioxusLabs/blitz.git"]
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git" }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-net = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git" }

# Redirect bearcove/vox.git transitive deps to the FTS fork (fixes noisy eprintln! debug logs).
[patch."https://github.com/bearcove/vox.git"]
vox = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-core = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-types = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-postcard = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-stream = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-websocket = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-shm = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-schema = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-service-macros = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-macros-core = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-macros-parse = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-codegen = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
vox-inprocess = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
shm-primitives = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }
facet-cbor = { git = "https://github.com/Codys-Wright/vox.git", rev = "2a2f793b" }

# ── Vendored patches ──────────────────────────────────────────────────
# moire: FTS fork — tolerates broken frame-pointer chains on NixOS glibc.
# All moire crates must point to the same fork rev to avoid type mismatches.
[patch."https://github.com/bearcove/moire"]
moire = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-macros-noop = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-runtime = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-tokio = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-trace-capture = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-trace-types = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-types = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-wasm = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-wire = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }

[patch.crates-io]
# Blitz crates — FTS fork with post-processing support
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git" }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-net = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-shell = { git = "https://github.com/DioxusLabs/blitz.git" }
stylo_taffy = { git = "https://github.com/DioxusLabs/blitz.git" }
# moire: unify crates.io moire with the FTS fork (includes NixOS frame-pointer fix)
# All crates must be listed to prevent duplicate moire-runtime #[ctor] crash.
moire = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-macros-noop = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-runtime = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-tokio = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-trace-capture = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-trace-types = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-types = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-wasm = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-wire = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "6d856f2" }

[workspace.lints.rust]
dead_code = "allow"
unused = "allow"

[workspace.lints.clippy]
