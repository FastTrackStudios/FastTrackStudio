[workspace.metadata.crane]
name = "fasttrackstudio"

[workspace]
members = [
    "cells/*/*",
    "crates/*/*",
    "xtask",
    "apps/tests/*",
    "apps/fts-control/*",
    "apps/fasttrackstudio/*",
]
resolver = "2"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.package]
edition = "2021"
rust-version = "1.82"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/roam"
authors = ["FastTrack Studio"]

[workspace.dependencies]
# Facet ecosystem
facet = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-default = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-format = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-json = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-postcard = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-pretty = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-toml = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-value = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-yaml = { git = "https://github.com/facet-rs/facet", branch = "main" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
anyhow = "1.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures = "0.3"

# Roam crates (bearcove upstream)
roam = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-codegen = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-frame = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-hash = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-schema = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-service-macros = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-session = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-stream = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-task-local = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-telemetry = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-tracing = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-websocket = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-wire = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-local = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-http-bridge = { git = "https://github.com/bearcove/roam.git", branch = "main" }
subject-rust = { git = "https://github.com/bearcove/roam.git", branch = "main" }
ur-taking-me-with-you = { git = "https://github.com/bearcove/roam.git", branch = "main", features = ["tokio"] }
shm-primitives = { git = "https://github.com/bearcove/roam.git", branch = "main" }

# Keyflow/Engraver crates (FastTrackStudios/keyflow)
keyflow = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "master" }
keyflow-proto = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "master" }
keyflow-text = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "master" }
keyflow-midi = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "master" }
engraver = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "master" }
engraver-proto = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "master" }
keyflow-ui = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "master" }

# DAW crates (FastTrackStudios/daw)
dawfile-reaper = { git = "https://github.com/FastTrackStudios/daw.git", branch = "master" }
daw-proto = { git = "https://github.com/FastTrackStudios/daw.git", branch = "master" }
daw-control = { git = "https://github.com/FastTrackStudios/daw.git", branch = "master" }
daw-standalone = { git = "https://github.com/FastTrackStudios/daw.git", branch = "master" }
daw-reaper = { git = "https://github.com/FastTrackStudios/daw.git", branch = "master" }
daw-ui = { git = "https://github.com/FastTrackStudios/daw.git", branch = "master" }

# Dock UI (FastTrackStudios/dock-dioxus)
dock-proto = { git = "https://github.com/FastTrackStudios/dock-dioxus.git", branch = "master" }
dock-dioxus = { git = "https://github.com/FastTrackStudios/dock-dioxus.git", branch = "master" }

# Actions / Input (FastTrackStudios/input_actions)
actions-proto = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "master" }
actions-registry = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "master" }
actions-standalone = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "master" }
actions-keybindings = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "master" }
input-dioxus = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "master" }
input = { git = "https://github.com/FastTrackStudios/input_actions.git", branch = "master" }
input-reaper = { git = "https://github.com/FastTrackStudios/FTS-Extensions.git", branch = "main" }

# Dynamic template (FastTrackStudios/dynamic-template)
color-palette = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "master" }
dynamic-template-proto = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "master" }
dynamic-template = { git = "https://github.com/FastTrackStudios/dynamic-template.git", branch = "master" }

# Local crates
session-proto = { path = "crates/session/session-proto" }
session = { path = "crates/session/session" }
session-ui = { path = "crates/session/session-ui" }
audio-controls = { git = "https://github.com/FastTrackStudios/daw.git", branch = "master" }
signal = { path = "crates/signal/signal" }
signal-proto = { path = "crates/signal/signal-proto" }
signal-storage = { path = "crates/signal/signal-storage" }
signal-live = { path = "crates/signal/signal-live" }
signal-controller = { path = "crates/signal/signal-controller" }
signal-ui = { path = "crates/signal/signal-ui", default-features = false }
sync-proto = { path = "crates/sync/sync-proto" }
sync = { path = "crates/sync/sync" }
sync-ui = { path = "crates/sync/sync-ui" }
gateway-proto = { path = "cells/gateway/gateway-proto" }

# REAPER extension dependencies
reaper-low = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-medium = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-high = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-macros = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-common-types = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master", features = ["palette"] }
# FTS Extensions (FastTrackStudios/FTS-Extensions)
swell-ui = { git = "https://github.com/FastTrackStudios/FTS-Extensions.git", branch = "main" }
reaper-embed = { git = "https://github.com/FastTrackStudios/FTS-Extensions.git", branch = "main" }
fragile = "2.0.1"
crossbeam-channel = "0.5"
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
palette = "0.7.3"

# Lumen blocks (Dioxus shadcn-inspired components)
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }
dioxus-time = { git = "https://github.com/ealmloff/dioxus-std", rev = "7e0c41ef8c5514e46e8ac657227568660cf38987" }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }

# Dioxus UI framework (pinned to 0.7.2 - native 0.7.3 not yet on crates.io)
dioxus = "0.7.2"
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }

# macOS dependencies for swell-ui (using exact versions for compatibility)
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies (optional, for cross-platform)
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

image = "0.25"

# Anyrender - 2D rendering abstraction (WGPU/Vello backend)
anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_svg = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }

# Linebender graphics crates (matching anyrender's versions)
vello = { version = "0.7", features = ["wgpu"] }
peniko = "0.6"
kurbo = "0.13"
color = "0.3"
wgpu = "27"
pollster = "0.4"
