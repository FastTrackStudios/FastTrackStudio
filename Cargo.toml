[patch.crates-io]
# Blitz from the FTS fork (0.3.0-beta.1 line, upstream 02523b83 +
# fts-focus: focus-follows-pointerdown for all focusable content —
# upstream only click-focuses text inputs, leaving the editor's
# tabindex div unfocusable by mouse). dioxus git pins `=0.3.0-beta.1`
# and the vendored dioxus-test needs post-beta.1 APIs
# (Node::outer_html_pretty). One rev across all blitz crates.
blitz-dom = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-traits = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-paint = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-shell = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-net = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-html = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
# Vendored one-line fix: quote scalars containing `<`/`>` — upstream
# (facet-rs/facet) styx-format emits them bare but styx-parse rejects
# them, so serialized keybind configs (`keys "<C-s>"`) could not be
# re-parsed. Drop the vendor once upstream fixes can_be_bare.
styx-format = { path = "libs/vendor/styx-format" }
# Vendored phon rc.5 + derive support for parse/display opaque scalars
# (Uuid, chrono DateTime/NaiveDate, url, …). Upstream rc.5 PANICS (and the
# reply path aborts the process) the first time a vox RPC reply contains
# such a field — every task-server list/stats call died. Drop the vendor
# once upstream phon derives these scalars.
phon = { path = "libs/vendor/phon" }
# Vendored phon-jit rc.5 with a one-line build.rs fix: force the stable,
# call-based stencils. Upstream's nightly detection can be true while no real
# nightly is present (the pinned nix toolchain), so it compiled the `become`
# (explicit tail calls) stencils on stable rustc 1.94 → E0658, breaking the
# macOS-aarch64 build. Drop the vendor once phon-jit builds on stable.
phon-jit = { path = "libs/vendor/phon-jit" }
# Editor's vendored mermaid-rs-renderer fork (web_time::Instant so the
# layouter works on wasm32) — see libs/editor/vendor/.
mermaid-rs-renderer = { path = "libs/editor/vendor/mermaid-rs-renderer" }

