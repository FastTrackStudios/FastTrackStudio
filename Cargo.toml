[workspace]
# Vertical-slice reset: tasks + projects remain; auth is provided by architect-auth.
members = [
    "apps/*",
    "crates/*",
    "features/*/*",
    "features/*/tests/native",
    "xtask",
    # CodeMirror-style editor — subtree-imported from
    # github.com/.../Editor. Lives under `external/editor/` so its
    # internal Cargo.toml + git history stay intact. We re-expose
    # its crates here so the rest of Task can depend on them.
    "external/editor/crates/editor-state",
    "external/editor/crates/editor-syntax",
    "external/editor/crates/editor-view",
    "external/editor/crates/editor-vim",
    "external/editor/crates/editor-typst",
    "external/editor/crates/editor-mermaid",
    "external/editor/crates/editor",
    # Vendored fork of `mermaid-rs-renderer` 0.2.2 with web-time
    # patched in for wasm32 compat. Lives next to the editor it
    # supports.
    "external/editor/vendor/mermaid-rs-renderer",
    # Editor playground — Dioxus app that dogfoods the editor.
    # Built with `dx serve --package playground`.
    "external/editor/examples/playground",
]
exclude = [
    "features/project/spec",    "features/project/tests",
]
resolver = "2"

[workspace.metadata.crane]
name = "task"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Codys-Wright/Task"

[workspace.dependencies]
async-trait = "0.1"
chrono = "0.4"
keybindings = "0.0.2"
editor-types = "0.0.2"
vim = { path = "crates/vim" }
eyre = "0.6"
futures = "0.3"
rrule = "0.11"
thiserror = "2.0"
tracing = "0.1"
project = { path = "features/project/project" }
project-proto = { path = "features/project/project-proto" }
project-crdt = { path = "features/project/project-crdt" }
project-db = { path = "features/project/project-db" }
project-ui = { path = "features/project/project-ui" }
knowledge-proto = { path = "features/knowledge/knowledge-proto" }
knowledge-crdt = { path = "features/knowledge/knowledge-crdt" }
knowledge-ui = { path = "features/knowledge/knowledge-ui" }

obsidian-compat = { path = "crates/obsidian-compat" }
publish-core = { path = "crates/publish-core" }
# Legacy Logseq-style outliner — kept until the new editor
# grows a vault/page layer that supersedes it.
editor-outliner = { path = "crates/editor-outliner" }
# File-backed vault layer. Modeled on `obsidian-compat` (clean
# small modules, native-only `cfg`, walker / watcher / mutate)
# but adds block-id awareness: a `BlockIndex` maps every
# `id:: <uuid>` line in the vault to its containing page +
# anchor offset.
vault = { path = "crates/vault" }
# CodeMirror-style editor (subtree). `editor` is the umbrella
# crate that re-exports the others — apps consume that.
editor-state = { path = "external/editor/crates/editor-state" }
editor-syntax = { path = "external/editor/crates/editor-syntax" }
editor-view = { path = "external/editor/crates/editor-view" }
editor-vim = { path = "external/editor/crates/editor-vim" }
editor-typst = { path = "external/editor/crates/editor-typst" }
editor-mermaid = { path = "external/editor/crates/editor-mermaid" }
editor = { path = "external/editor/crates/editor" }

# Deps the editor's inner crates inherit via `workspace = true`.
# `serde`, `serde_json` are already declared elsewhere in the
# workspace deps block — only the editor-specific ones go here.
ropey = "1.6"
# Tree-sitter syntax highlighting — same versions as the editor
# subtree's original workspace, kept default-features-off so we
# don't drag in everything by default.
arborium = { version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
arborium-tree-sitter = "2.16.0"
attachments-proto = { path = "features/attachments/attachments-proto" }
architect-auth = { path = "../architect-auth/crates/architect-auth" }

# Filesystem walker — used by knowledge-sync to crawl Obsidian vault
# directories. Server-only dep; never reaches wasm.
walkdir = "2"
# Parallel file IO for the vault scanner.
rayon = "1"

# Fuzzy matcher used by the knowledge live-preview editor pickers
# (wikilink/blockref/tag/slash-command). Same crate used internally by
# helix and other rust TUIs — fast prefix-friendly bonuses + Unicode
# normalization. Wasm-clean.
nucleo-matcher = "0.3"
fts-ui = { path = "../FastTrackStudio/fts-ui/crates/fts-ui", default-features = false }

# Ordered-map for round-trippable frontmatter key preservation
# (needed by knowledge-proto's obsidian helpers).
indexmap = "2"

# Regex engine — knowledge-proto uses it for link/embed/tag scanning.
regex = "1"

# YAML parsing/serialization for Obsidian frontmatter round-trip.
serde_yaml = "0.9"

[workspace.dependencies.facet]
version = "0.46"
features = [
    "reflect",
    "chrono",
    "uuid",
]

[workspace.dependencies.facet-core]
version = "0.46"

[workspace.dependencies.facet-json]
version = "0.46"

[workspace.dependencies.facet-pretty]
version = "0.46"

[workspace.dependencies.facet-reflect]
version = "0.46"

[workspace.dependencies.facet-yaml]
version = "0.46"

[workspace.dependencies.daw]
path = "../FastTrackStudio/daw/crates/daw"

[workspace.dependencies.keyflow]
path = "../FastTrackStudio/keyflow/crates/keyflow"

[workspace.dependencies.lumen-blocks]
git = "https://github.com/Leaf-Computer/lumen-blocks.git"
tag = "v0.2.0"

[workspace.dependencies.moire]
git = "https://git.starcommand.live/codywright/moire"
rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624"

# Loro — CRDT engine, source of truth for every feature's data.
# SeaORM stores the doc's snapshot + update log as opaque bytes.
[workspace.dependencies.loro]
version = "1.12"
default-features = false

# Loro internals — needed for `EphemeralStore` (awareness/cursor
# sync) which the public `loro` crate doesn't re-export. Pinned
# to the same minor as `loro` so the type identities line up.
[workspace.dependencies.loro-internal]
version = "1.12"
default-features = false

# CalDAV/CardDAV/WebDAV-Sync client (RFC 4791 + RFC 6352 + RFC 6578).
# Picked over `kitchen-fridge` because it actually implements VEVENT
# (kitchen-fridge's upstream is VTODO-first with VEVENT support
# documented as "fairly trivial but not yet"), supports sync-token
# incremental fetches, and ships HTTP/2 + connection pooling. We
# wrap it in a Loro-backed bridge — the architect `calendar` CRDT
# is our local source of truth, so kitchen-fridge's bundled Cache /
# Provider abstractions would be redundant.
[workspace.dependencies.fast-dav-rs]
version = "0.4"

# iCalendar parser / builder. Used by `caldav-sync` to map between
# raw `BEGIN:VEVENT…` text and `calendar_proto::CalendarEvent`
# (and the inverse for push). Active maintenance, dual-licensed,
# uses the same `rrule` crate we have at the workspace level.
[workspace.dependencies.icalendar]
version = "0.17"

# Markdown parser used by `chat-ui/src/ai/markdown.rs` to render
# assistant message bodies. `default-features = false` drops the
# `simd` + `gen-tests` optional deps so the crate stays wasm-clean.
[workspace.dependencies.pulldown-cmark]
version = "0.10"
default-features = false

# Dioxus — UI lib. Single workspace dep; per-crate `[features]`
# enable the platform target. Pattern lifted from dioxus-flake's
# packages/web/desktop/mobile setup so `cargo check --workspace`
# works inside the nix dev shell.
[workspace.dependencies.dioxus]
version = "0.7.9"
default-features = false
features = ["lib"]

[workspace.dependencies.dioxus-router]
version = "0.7.9"
default-features = false

[workspace.dependencies.dioxus-ssr]
version = "0.7.9"

# Web-sys / wasm-bindgen — wired only in crates that use them and
# always behind `#[cfg(target_arch = "wasm32")]` source gates. They
# do compile on native (stub wrappers in wasm-bindgen-shared) so
# leaving them on a native-buildable crate's Cargo.toml is fine.
[workspace.dependencies.web-sys]
version = "0.3.98"

[workspace.dependencies.wasm-bindgen]
version = "0.2"

[workspace.dependencies.wasm-bindgen-futures]
version = "0.4"

[workspace.dependencies.js-sys]
version = "0.3"

[workspace.dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[workspace.dependencies.indexed_db_futures]
version = "0.6"
features = ["serde", "cursors", "indices", "typed-arrays", "async-upgrade", "tx-done", "version-change"]

[workspace.dependencies.futures-channel]
version = "0.3"

[workspace.dependencies.futures-util]
version = "0.3"
default-features = false
features = ["std"]

[workspace.dependencies.task-ui]
path = "crates/task-ui"

# CRDT lib + SeaORM persistence — path deps pointing at architect's
# in-repo libs. Same rev as the architect/macros/architect dep below.
[workspace.dependencies.crdt]
path = "../architect/libs/crdt"

[workspace.dependencies.crdt-seaorm]
path = "../architect/libs/crdt-seaorm"

[workspace.dependencies.serde]
