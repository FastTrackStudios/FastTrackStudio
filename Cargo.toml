# keyflow @ b45a620 requests actions-proto from codeberg input_actions.git on
# `branch=main`, whose tip pins a vox rev that splits the graph. Cargo forbids
# patching a source to the SAME source, so we redirect to the FTS-owned GitHub
# mirror at the rev whose workspace targets vox @ 30ef2ffe. Same content, the
# only rev unification cargo will accept for a same-repo transitive pin.
[patch."https://codeberg.org/FastTrackStudios/input_actions.git"]
actions-proto = { git = "https://github.com/FastTrackStudios/input_actions.git", rev = "8018e6d514ae1b4e5cac673273290dac92a73a10" }

# Unify vox onto a single source. `architect` (../architect) pins vox at
# the codeberg fork (rev 30ef2ffe — matching architect's current pin, which
# carries the Uuid/chrono opaque-scalar serialization fix and rustls TLS
# for native vox-websocket, so wss:// servers are reachable), while the
# workspace deps point at bearcove/vox. Two identical-content vox copies
# means architect's generated `Handler` impls don't unify across them and
# every proto's dispatcher fails the trait bound. Redirect bearcove/vox
# at the published codeberg rev so the graph carries exactly one
# `vox-types` — the same source+rev architect already uses (no local path
# dep, so this is portable to fresh clones / CI).
[patch."https://github.com/bearcove/vox"]
vox                = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-core           = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-codegen        = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-jit            = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-jit-abi        = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-jit-cal        = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-macros-core    = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-macros-parse   = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-postcard       = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-schema         = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-service-macros = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-types          = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
vox-websocket      = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }
facet-cbor         = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a" }

# keyflow @ b45a620 pulls daw-proto (for its timing primitives) from codeberg
# daw.git on `branch=main`, whose tip pins a vox rev that splits the graph.
# Cargo forbids patching a source to the SAME source, so redirect to the
# FTS-owned GitHub mirror at the daw rev (f2902b9) whose workspace targets
# vox @ 30ef2ffe. This also gives daw-proto its runtime-only (wasm-friendly)
# vox profile — otherwise an unpinned daw-proto requests vox's full
# (tokio-net) features and the editor's wasm build can't link mio.
[patch."https://codeberg.org/FastTrackStudios/daw.git"]
daw-proto = { git = "https://github.com/FastTrackStudios/daw.git", rev = "f2902b98527755609797437d2a3f93ea95341f3b" }

# keyflow still declares color-palette / music-catalog from the starcommand
# dynamic-template host (branch = main). Redirect that source to the codeberg
# mirror — the canonical migrated repo (its main is vox-fork-aligned) — so the
# graph carries no starcommand sources. (The clean fix is keyflow's own
# Cargo.toml lines 102-103; this patch migrates Task's view in the meantime.)
[patch."https://git.starcommand.live/FastTrackStudios/dynamic-template.git"]
color-palette = { git = "https://codeberg.org/FastTrackStudios/dynamic-template.git", branch = "main" }
music-catalog = { git = "https://codeberg.org/FastTrackStudios/dynamic-template.git", branch = "main" }

# Redirect every transitive bearcove/moire reference (vox's
# moire-runtime / moire-tokio / moire-types, etc.) to the codywright
# fork at the same rev as the workspace dep above. Without this,
# vox + architect end up with two parallel moire compilations.

[patch."https://github.com/bearcove/moire"]
moire             = { git = "https://codeberg.org/FastTrackStudios/moire", rev = "7a2f1dc" }
