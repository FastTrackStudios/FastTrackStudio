    # ── features/standalone / surfaces / daw-ui ───────────────────────
    "features/standalone/daw-standalone",
    "features/surfaces/daw-csi",
    "features/daw-ui/daw-ui",
    "features/daw-ui/daw-theme",
    "features/daw-ui/daw-theme-art",
    "features/daw-ui/daw-theme-reaper",
    # ── crates/session — session domain core (wave 3) ─────────────────
    "crates/session/session",
    "crates/session/proto",
    "crates/session/ui",
    "features/guide",
    "features/song",
    "features/reaper/session-extension",
    # ── crates/keyflow — keyflow domain core (wave 3) ─────────────────
    "crates/keyflow/keyflow",
    "crates/keyflow/cli",
    "crates/keyflow/keyflow-proto",
    "crates/keyflow/keyflow-syntax",
    "crates/keyflow/keyflow-text",
    "crates/keyflow/keyflow-chordpro",
    "crates/keyflow/keyflow-midi",
    "crates/keyflow/keyflow-live",
    "crates/keyflow/keyflow-lsp",
    "crates/keyflow/keyflow-musicxml",
    "crates/keyflow/keyflow-musx",
    "crates/keyflow/keyflow-annotate",
    "crates/keyflow/keyflow-orchestra",
    "crates/keyflow/keyflow-sync",
    "crates/keyflow/keyflow-daw-analysis",
    "crates/keyflow/keyflow-ui",
    "crates/keyflow/tree-sitter-keyflow",
    # ── features/engraver ─────────────────────────────────────────────
    "features/engraver/engraver",
    "features/engraver/proto",
    "features/engraver/score",
    # ── features/dynamic-template (subtree-imported, wave 3) ──────────
    "features/dynamic-template/dynamic-template",
    "features/dynamic-template/dynamic-template-proto",
    "features/dynamic-template/dynamic-template-extension",
    "features/dynamic-template/music-catalog",
    "features/chord-tool/chord-tool",
    "features/chord-tool/chord-tool-daw",
    "features/midi-tools/midi-tools",
    "features/midi-tools/midi-tools-daw",
    "features/midi-tools/midi-tools-ui",
    "features/dynamic-template/color-palette",
    "features/dynamic-template/tests",
    # ── crates/signal — signal domain core (wave 4) ───────────────────
    # `signal` is the facade — the only public API surface for the signal
    # domain. proto/live/storage/controller/import/daw-bridge are INTERNAL
    # (signal-ui / signal-browser / signal-grid-ui are the documented
    # exceptions: Dioxus components / the headless browser data layer).
    "crates/signal/signal",
    "crates/signal/proto",
    "crates/signal/ui",
    "crates/signal/live",
    "crates/signal/storage",
    "crates/signal/controller",
    "crates/signal/import",
    "crates/signal/browser",
    "crates/signal/space",
    "crates/signal/space/proto",
    "crates/signal/grid",
    "crates/signal/grid-ui",
    "crates/signal/daw-bridge",
    "crates/signal/rig-host",
    "crates/signal/rigs-proto",
    "crates/signal/widgets",
    # ── features/fx — built-in FX (wave 4; vendored from FTS plugin repos)
    # Facade crates (eq / comp / reverb / delay / …) are the public deps;
    # the -dsp crates are internal (like signal-proto under the facade).
    # The per-FX -ui/-profiles crates + apps/ plugin binaries moved along
    # inside each FX dir; they stay implicit members via path deps.
    "features/fx/saturate/saturate",
    "features/fx/saturate/saturate-dsp",
    "features/fx/saturate/saturate-profiles",
    "features/fx/saturate/saturate-ui",
    "features/fx/trigger/trigger",
    "features/fx/trigger/trigger-dsp",
    "features/fx/trigger/trigger-ui",
    "features/fx/eq/eq",
    "features/fx/eq/eq-dsp",
    "features/fx/eq/eq-profiles",
    "features/fx/eq/eq-ui",
    "features/fx/eq/apps/eq-standalone",
    "features/fx/eq/spectrum-analyzer/spectrum-analyzer",
    "features/fx/eq/spectrum-analyzer/spectrum-analyzer-dsp",
    "features/fx/comp/comp",
    "features/fx/comp/comp-dsp",
    "features/fx/comp/comp-profiles",
    "features/fx/comp/comp-ui",
    "features/fx/comp/limiter-ui",
    "features/fx/reverb/reverb",
    "features/fx/reverb/reverb-dsp",
    "features/fx/reverb/reverb-profiles",
    "features/fx/reverb/reverb-ui",
    "features/fx/delay/delay",
    "features/fx/delay/delay-dsp",
    "features/fx/delay/delay-profiles",
    "features/fx/delay/delay-ui",
    "features/fx/pitch/pitch",
    "features/fx/pitch/pitch-dsp",
    "features/fx/tune/tune",
    "features/fx/tune/tune-dsp",
    # ── features/expression-editor — the note+curve editing surface,
    #    shared by the MPE editor and the audio pitch editor
    "features/expression-editor/expression-editor-audio",
    "features/expression-editor/expression-editor-core",
    "features/expression-editor/expression-editor-daw",
    "features/expression-editor/expression-editor-reaper",
    "features/expression-editor/expression-editor-tools",
    "features/expression-editor/expression-editor-ui",
    "features/fx/level/level",
    "features/fx/level/level-dsp",
    "features/fx/modulation/modulation",
    "features/fx/modulation/chorus-dsp",
    "features/fx/modulation/modulation-profiles",
    "features/fx/modulation/modulation-ui",
    "features/fx/multiband",
    "features/fx/modulation/pattern-ui",
    "features/fx/modulation/trem-dsp",
    "features/fx/modulation/wah-dsp",
    "features/fx/signal-fx",
    "features/fx/macromod",
    # ── features/rigs / sampler / nam / plugin-host (wave 4) ──────────
    "features/rigs/bass",
    "features/rigs/bass/proto",
    "features/rigs/bass/ui",
    "features/rigs/guitar",
    "features/rigs/guitar/proto",
    "features/rigs/guitar/ui",
    "features/rigs/keys",
    "features/rigs/keys/proto",
    "features/rigs/keys/ui",
    "features/rigs/synth/proto",
    "features/rigs/synth/ui",
    "features/rigs/synth/rig",
    "features/rigs/ekit",
    "features/rigs/ekit/proto",
    "features/rigs/ekit/ui",
    "features/rigs/orchestra",
    "features/rigs/drums",
    "features/rigs/drums/proto",
    "features/rigs/drums/ui",
    "features/rigs/synth",
    "features/rigs/wurli/openwurli-dsp",
    "features/sampler/signal-sampler",
    "features/sampler/signal-sampler-clap",
    "features/sampler/packs-proto",
    "features/sampler/pack-library",
    "features/nam",
    "features/plugin-host",
    "features/reaper/signal-extension",
    "features/reaper/signal-reaper-controller",
    # ── crates/patchbay — PipeWire studio-routing domain ──────────────
    # `patchbay` is the facade (engine + services); `patchbay-proto` is
    # the wire contract; `patchbay-ui` the Dioxus surface.
    "crates/patchbay/patchbay",
    "crates/patchbay/proto",
    "crates/patchbay/ui",
    # ── apps ──────────────────────────────────────────────────────────
    "apps/fasttrackstudio",
    "apps/patchbay",
    "apps/patchbay/web",
    "apps/installer",
    "apps/fasttrackstudio/cli",
    "apps/site",
    # ── apps/plugins — CLAP/VST3 plugin shells (nice-plug cdylibs) ─────
    "apps/plugins/level",
    "apps/plugins/tune",
    "apps/plugins/saturate",
    "apps/plugins/comp",
    "apps/plugins/reverb",
    "apps/plugins/nam",
    "apps/plugins/delay",
    "apps/plugins/eq",
    "apps/plugins/modulation",
    "apps/plugins/guide",
    "apps/plugins/signal",
    "apps/plugins/gate",
    "apps/plugins/limiter",
    "apps/plugins/meter",
    "apps/plugins/pitch",
    "apps/plugins/unison",
    "apps/plugins/trigger",
    "apps/plugins/xtask",
    "apps/plugins/host",
    # ── apps/extensions — DAW-host extension cdylibs ──────────────────
    #    (apps/extensions/<host>-fts-extensions; reaper is the first host)
    "apps/extensions/reaper-fts-extensions",
    "apps/extensions/reaper-fts-extensions/actions",
    "apps/extensions/reaper-fts-extensions/xtask",
    # daw-domain REAPER integration-test runner (`just daw-reaper-test`)
    "features/reaper/daw-reaper/xtask",
    # ── libs/fts-ui extras ────────────────────────────────────────────
    "libs/fts-ui/ui-snapshot",
    # ── Task (subtree-imported, workspace dissolved into the root) ────
    #    apps/task/ is the product home (cli / desktop / mobile /
    #    server / web + docs, deploy, plans, skills, …); crates/task/
    #    carries the small shared crates; features/task/ the feature
    #    trios (vault / wiki / agent / email / task / view / …).
    #    apps/task is listed explicitly — the dir also holds non-crate
    #    product files (docs/, plans/, Justfile, …) a glob would trip on.
    "apps/task/cli",
    "apps/task/desktop",
    "apps/task/mobile",
    "apps/task/server",
    "apps/task/web",
    "crates/task/*",
    "features/task/*/*",
    # Email feature harness — standalone Dioxus binary exercising the
    # email-* crates without the full task-ui shell.
    "features/task/email/examples/email-client",
]
exclude = [
    # features/task/*/* would otherwise parse examples/ and plans/ dirs
    # as crate manifests.
    "features/task/email/examples",
    "features/task/email/plans",
    # Quarantined pdf renderer (fulgur/stylo trips a rustc trait-solver
    # recursion limit inside the big workspace graph); it keeps its own
    # [workspace]. `task-pdf-render` is the stdin/stdout interop point.
    "apps/task/libs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/FastTrackStudios/FastTrackStudio"

[workspace.dependencies]
# ── Internal — every moved crate, path declared ONCE here ─────────────
fts-chrome = { path = "libs/fts-chrome" }
fts-ui = { path = "libs/fts-ui/fts-ui" }
fts-ui-audio = { path = "libs/fts-ui/fts-ui-audio" }
fts-plug-ui = { path = "libs/fts-ui/fts-plug-ui" }
fts-ui-showcase = { path = "libs/fts-ui/showcase" }
fts-story-core = { path = "libs/fts-story/fts-story-core" }
fts-story-macros = { path = "libs/fts-story/fts-story-macros" }
fts-story-runtime = { path = "libs/fts-story/fts-story-runtime" }
fts-story-shell = { path = "libs/fts-story/fts-story-shell" }
fts-story-snapshots = { path = "libs/fts-story/fts-story-snapshots" }
fts-story-parity = { path = "libs/fts-story/fts-story-parity" }
fts-story-fuzz = { path = "libs/fts-story/fts-story-fuzz" }
dock-dioxus = { path = "libs/dock/dock-dioxus", default-features = false }
dock-proto = { path = "libs/dock/dock-proto" }
# nice-plug lives in its own fork repo (upstream RustAudio/nice-plug's
# baseview-03 branch + the FTS delta: nice-plug-dioxus, embedded editors,
# rich track-info, param rescan). The ONE sanctioned exception to
# path-deps-only — it left the tree so it can track upstream.
nice-plug = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-dioxus = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-xtask = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
utils = { path = "libs/utils" }
vox-discover = { path = "libs/vox-discover" }
installer-core = { path = "libs/installer-core" }
engine-launcher = { path = "libs/engine-launcher" }
neural-amp-modeler = { path = "libs/neural-amp-modeler" }
audiocore-core = { path = "crates/audiocore/audiocore-core" }
audiocore-dsp = { path = "crates/audiocore/audiocore-dsp", default-features = false }
audiocore-gui = { path = "crates/audiocore/audiocore-gui" }
fts-modulation = { path = "crates/audiocore/fts-modulation" }
fts-sample = { path = "crates/audiocore/fts-sample" }
fts-themes = { path = "crates/audiocore/fts-themes" }
meter-dsp = { path = "crates/audiocore/meter-dsp" }
meter-ui = { path = "crates/audiocore/meter-ui" }
# Canonical MIDI facade. Defaults OFF at the root: daw-proto re-exports
# `midicore::MidiEvent` and must not drag midicore's `vox` service traits
# (nor the `midir` feature — midicore-midir pins midir 0.10/alsa-sys 0.3,
# colliding with daw's midir 0.11/alsa-sys 0.4 via `links = "alsa"`).
# Consumers that want the vox surface set `features = ["vox"]` themselves.
midicore = { path = "crates/midicore/midicore", default-features = false }
midicore-proto = { path = "crates/midicore/midicore-proto" }
midicore-midir = { path = "crates/midicore/midicore-midir" }
midicore-ui = { path = "crates/midicore/midicore-ui" }
# NI Komplete Kontrol keyboard driver (Light Guide / per-key RGB LEDs).
kontrol = { path = "crates/kontrol/kontrol" }
actions-proto = { path = "crates/input/actions-proto" }
input-config-proto = { path = "crates/input/input-config-proto" }
# Editor (subtree-imported from FastTrackStudios/Editor — the text/
# markdown/keyflow editor stack used by apps/site and Task)
editor = { path = "libs/editor/crates/editor" }
editor-crdt = { path = "libs/editor/crates/editor-crdt" }
editor-keyflow = { path = "libs/editor/crates/editor-keyflow" }
editor-keyflow-lang = { path = "libs/editor/crates/editor-keyflow-lang" }
editor-lsp = { path = "libs/editor/crates/editor-lsp" }
editor-mermaid = { path = "libs/editor/crates/editor-mermaid" }
editor-state = { path = "libs/editor/crates/editor-state" }
editor-syntax = { path = "libs/editor/crates/editor-syntax" }
editor-typst = { path = "libs/editor/crates/editor-typst" }
editor-view = { path = "libs/editor/crates/editor-view" }
editor-vim = { path = "libs/editor/crates/editor-vim" }
arborium = { version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
arborium-tree-sitter = "2.16.0"
ropey = "1.6"
actions-registry = { path = "crates/input/actions-registry" }
actions-keybindings = { path = "crates/input/actions-keybindings" }
actions-standalone = { path = "crates/input/actions-standalone" }
actions-reaper = { path = "features/reaper/actions-reaper" }
input = { path = "crates/input/input" }
input-dioxus = { path = "crates/input/input-dioxus" }
input-keybinds = { path = "crates/input/input-keybinds" }

# ── daw domain (wave 2) ───────────────────────────────────────────────
# Facade crate — the only public API surface for the daw domain.
# daw-proto, daw-control, daw-standalone, dawfile-* are INTERNAL to the
# domain; consumers outside it go through the `daw` facade.
daw = { path = "crates/daw/daw" }
daw-proto = { path = "crates/daw/proto" }
daw-actions = { path = "crates/daw/actions" }
daw-control = { path = "crates/daw/control" }
daw-module = { path = "crates/daw/module" }
fts-devtools = { path = "libs/devtools/fts-devtools" }
daw-test-macro = { path = "libs/devtools/daw-test-macro" }
daw-audio-graph = { path = "features/audio/daw-audio-graph" }
daw-audio-io = { path = "features/audio/daw-audio-io" }
# RT-aware allocator — offloads RT deallocation to background thread
daw-allocator = { path = "features/audio/daw-allocator" }
fts-audio-proto = { path = "features/audio/fts-audio-proto" }
audio-controls = { path = "features/audio/audio-controls" }
daw-synchronization = { path = "features/sync/daw-synchronization" }
daw-link = { path = "features/sync/daw-link" }
daw-network = { path = "features/sync/daw-network" }
daw-audio-sync = { path = "features/sync/daw-audio-sync" }
dawfile-aaf = { path = "features/dawfile/dawfile-aaf" }
dawfile-ableton = { path = "features/dawfile/dawfile-ableton" }
dawfile-dawproject = { path = "features/dawfile/dawfile-dawproject" }
dawfile-logic = { path = "features/dawfile/dawfile-logic" }
dawfile-protools = { path = "features/dawfile/dawfile-protools" }
dawfile-reaper = { path = "features/dawfile/dawfile-reaper" }
# default = all-formats; the daw facade opts into formats individually,
# so the root entry keeps defaults OFF and consumers that want every
# importer set `default-features = true`.
daw-reaper = { path = "features/reaper/daw-reaper", default-features = false }
daw-bridge = { path = "features/reaper/daw-bridge" }
# Extension runtime — integrated REAPER extension helpers
daw-extension-runtime = { path = "features/reaper/daw-extension-runtime" }
daw-reaper-dioxus = { path = "features/reaper/daw-reaper-dioxus" }
daw-reaper-dioxus-ext = { path = "features/reaper/daw-reaper-dioxus-ext" }
daw-reaper-embed = { path = "features/reaper/daw-reaper-embed" }
reaper-launcher = { path = "features/reaper/reaper-launcher" }
fts-icons = { path = "features/reaper/fts-icons" }
