[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
# Match the FTS convention (see daw / architect): allow the `unused` family
# (covers unused_mut, dead_code, unused_variables, …) so macro-scaffolding and
# illustrative test helpers don't fail the `-D warnings` push gate.
dead_code = "allow"
unused = "allow"
unused_unsafe = "allow"

[workspace.lints.clippy]

[workspace.lints.rustdoc]
# Match the FTS convention (daw / architect): broken intra-doc links are
# real but noisy on a fast-moving codebase and shouldn't block the push gate.
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.dependencies]
# Internal crates
actions-proto = { path = "crates/actions-proto" }
actions-keybindings = { path = "crates/actions-keybindings" }
actions-registry = { path = "crates/actions-registry" }
input = { path = "crates/input" }

# Roam RPC framework. Pinned to the FastTrackStudios vox fork @ f31f1040 on
# Codeberg (vox 0.8.2, latest) — a single vox across the graph, carrying the
# vox-jit-abi __rust_alloc-scan fix. `runtime` (no default tokio-net transport)
# keeps the wasm build mio-free.
vox = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "30ef2ffe6fd8681eac9e2bf97602e38bba8f688a", default-features = false, features = ["runtime"] }

# Facet reflection — align the whole stack to the current 0.46 line.
facet = { version = "0.46" }

# REAPER bindings (FTS fork with v7.63 ruler lane APIs)
reaper-high = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# Dioxus UI framework (for input-dioxus)
dioxus = "0.7.2"

# Common dependencies
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
