[workspace]
members = [
    "apps/server",
    "apps/sync-demo",
    "crates/fasttrackaudio",
    "crates/task-core",
    "crates/task-cli",
    "features/auth/auth",
    "features/auth/auth-db",
    "xtask", "features/threads/threads", "features/threads/threads-proto", "features/threads/threads-crdt", "features/threads/threads-db", "features/threads/tests/native", "features/chat/chat", "features/chat/chat-proto", "features/chat/chat-crdt", "features/chat/chat-db", "features/chat/tests/native", "features/conference/conference", "features/conference/conference-proto", "features/conference/conference-crdt", "features/conference/conference-db", "features/conference/tests/native", "features/asset/asset", "features/asset/asset-proto", "features/asset/asset-crdt", "features/asset/asset-db", "features/asset/tests/native", "features/person/person", "features/person/person-proto", "features/person/person-crdt", "features/person/person-db", "features/person/tests/native", "features/location/location", "features/location/location-proto", "features/location/location-crdt", "features/location/location-db", "features/location/tests/native", "features/project/project", "features/project/project-proto", "features/project/project-crdt", "features/project/project-db", "features/project/tests/native", "features/timer/timer", "features/timer/timer-proto", "features/timer/timer-crdt", "features/timer/timer-db", "features/timer/tests/native", "features/invoice/invoice", "features/invoice/invoice-proto", "features/invoice/invoice-crdt", "features/invoice/invoice-db", "features/invoice/tests/native", "features/finance/finance", "features/finance/finance-proto", "features/finance/finance-crdt", "features/finance/finance-db", "features/finance/tests/native", "features/inventory/inventory", "features/inventory/inventory-proto", "features/inventory/inventory-crdt", "features/inventory/inventory-db", "features/inventory/tests/native", "features/cookbook/cookbook", "features/cookbook/cookbook-proto", "features/cookbook/cookbook-crdt", "features/cookbook/cookbook-db", "features/cookbook/tests/native", "features/fitness/fitness", "features/fitness/fitness-proto", "features/fitness/fitness-crdt", "features/fitness/fitness-db", "features/fitness/tests/native", "features/calendar/calendar", "features/calendar/calendar-proto", "features/calendar/calendar-crdt", "features/calendar/calendar-db", "features/calendar/tests/native", "features/email/email", "features/email/email-proto", "features/email/email-crdt", "features/email/email-db", "features/email/tests/native", "features/agent/agent", "features/agent/agent-proto", "features/agent/agent-crdt", "features/agent/agent-db", "features/agent/tests/native",
]
# UI crates (task-ui + apps/{web,desktop,mobile}) live outside this workspace
# so server/CLI builds do not pick up WASM/Dioxus-only dependency and target
# constraints. Each UI crate carries its own Cargo.toml and Cargo.lock.
exclude = [
    "apps/web",
    "apps/desktop",
    "apps/mobile",
    "crates/task-ui",
    "features/agent/agent-ui",
    "features/asset/asset-ui",
    "features/calendar/calendar-ui",
    "features/chat/chat-ui",
    "features/conference/conference-ui",
    "features/cookbook/cookbook-ui",
    "features/email/email-ui",
    "features/finance/finance-ui",
    "features/fitness/fitness-ui",
    "features/inventory/inventory-ui",
    "features/invoice/invoice-ui",
    "features/location/location-ui",
    "features/person/person-ui",
    "features/project/project-ui",
    "features/threads/threads-ui",
    "features/timer/timer-ui",
]
resolver = "2"

[workspace.metadata.crane]
name = "task"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Codys-Wright/Task"

