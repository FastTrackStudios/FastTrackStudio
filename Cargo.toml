[workspace]
members = [
    "apps/daw/cli",
    "apps/daw/native",
    "crates/daw",
    "crates/daw-control",
    "crates/daw-proto",
    "features/backends/reaper/daw-reaper",
    "features/standalone/daw-standalone",
    "features/audio/daw-audio-graph",
    "features/backends/reaper/dawfile-reaper",
    "features/backends/protools/dawfile-protools",
    "features/backends/ableton/dawfile-ableton",
    "features/backends/aaf/dawfile-aaf",
    "features/backends/logic/dawfile-logic",
    "features/backends/dawproject/dawfile-dawproject",
    "features/ui/daw-ui",
    "features/ui/daw-theme-reaper",
    "crates/daw-test-macro",
    "features/backends/reaper/reaper-launcher",
    "features/audio/daw-allocator",
    "features/sync/daw-audio-sync",
    "features/backends/reaper/daw-bridge",
    "features/backends/reaper/daw-perf-test",
    "features/audio/fts-audio-proto",
    "crates/fts-devtools",
    "features/backends/reaper/daw-extension-runtime",
    "crates/daw-module",
    "features/backends/reaper/daw-reaper-embed",
    "features/backends/reaper/daw-reaper-dioxus",
    "features/backends/reaper/daw-reaper-dioxus-ext",
    "features/backends/reaper/daw-reaper-dioxus-ext-test",
    "features/sync/daw-synchronization",
    "features/sync/daw-network",
    "features/sync/daw-link",
    "apps/example-extension",
    "apps/example-plugin",
    "xtask",
]
resolver = "2"

[workspace.metadata.crane]
name = "daw"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
memmap2 = "0.9"
# Facade crate — the only public API surface for the daw domain
daw = { path = "crates/daw" }
# UI crate stays public (Dioxus components with feature flags)
daw-ui = { path = "features/ui/daw-ui", default-features = false }
# RT-aware allocator — offloads RT deallocation to background thread
daw-allocator = { path = "features/audio/daw-allocator" }
# Extension runtime — integrated REAPER extension helpers
daw-extension-runtime = { path = "features/backends/reaper/daw-extension-runtime" }
daw-reaper = { path = "features/backends/reaper/daw-reaper" }
# Sync stack — public sibling crates (cannot be folded under the `daw`
# facade because each depends on `daw` itself, see lib.rs note).
daw-synchronization = { path = "features/sync/daw-synchronization" }
daw-network = { path = "features/sync/daw-network" }
# FTS design system — used by `daw-ui`'s `reaper-test-panels` feature so the
# Native vs Desktop renderer demo panels can ship from this repo.
fts-ui = { git = "https://codeberg.org/FastTrackStudios/fts-ui.git", rev = "d9f01261cb59708300cc5b31fa7fe6bd766a66aa" }
# NOTE: daw-proto, daw-control, daw-control-sync, daw-reaper, daw-standalone,
# dawfile-reaper are INTERNAL. Access them through the `daw` facade crate.

# Facet reflection — align the stack to the current 0.46 line.
facet = { version = "0.46" }
facet-json = { version = "0.46" }

# architect framework — defines #[architect::rpc] for sync-trait → vox
# bridge generation plus the Entity derive for CRUD-shaped data.
# Consumed from git.starcommand.live so daw is usable as a git dependency
# (a local path dep escapes the repo and breaks downstream `cargo metadata`).
architect = { git = "https://codeberg.org/FastTrackStudios/architect.git", branch = "main" }

# VOX service framework (pinned to FastTrackStudios fork)
vox = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "f31f10400c245740a072fa61bb96ef3a3fc2bd93", default-features = false, features = ["runtime"] }
vox-types = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "f31f10400c245740a072fa61bb96ef3a3fc2bd93" }
vox-stream = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "f31f10400c245740a072fa61bb96ef3a3fc2bd93" }

# CLI
clap = { version = "4", features = ["derive"] }

# Plugin framework
nih_plug = { git = "https://codeberg.org/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }

# CLAP plugin hosting (Rust-native CLAP host + extension bindings).
# Pinned to the prokopyl/clack upstream — same revs as fts-analyzer
# so workspaces line up.
clack-host = { git = "https://github.com/prokopyl/clack" }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = [
    "clack-host",
    "audio-ports",
    "note-ports",
    "params",
    "state",
    "latency",
    "gui",
    "timer",
    "log",
    "thread-check",
    "tail",
] }

# VST3 plugin hosting (auto-generated COM bindings from the official
# Steinberg SDK headers). MIT/Apache-2.0 — does NOT contaminate with
# GPL the way RustAudio's vst3-sys would.
vst3 = "0.3"
libloading = "0.8"

# Sibling repos
actions-proto = { git = "https://codeberg.org/FastTrackStudios/input_actions.git", branch = "main" }
dock-dioxus = { git = "https://codeberg.org/FastTrackStudios/dock-dioxus.git", branch = "main", default-features = false }
dock-proto = { git = "https://codeberg.org/FastTrackStudios/dock-dioxus.git", branch = "main" }

# Testing — the harness now lives inside the `daw` facade behind the
# `test-harness` feature; consumers enable that feature instead of
# depending on a standalone `reaper-test` crate.
reaper-launcher = { path = "features/backends/reaper/reaper-launcher" }

# REAPER bindings (FTS fork with v7.63 ruler lane APIs)
reaper-low = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# swell-ui from FTS reaper-lib — typed Window/Hwnd wrappers around SWELL.
# Used by daw-reaper for nudge / resize / center geometry actions.
swell-ui = { git = "https://codeberg.org/FastTrackStudios/reaper-lib.git", branch = "main" }

# UI
dioxus = "0.7.2"

# Async runtime
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
enumflags2 = "0.7"

# Observability
tracing = { version = "0.1", features = ["std"] }
moire = { version = "1.0" }  # diagnostics feature disabled — causes SIGBUS on NixOS

# GPU rendering stack (used by daw-reaper-embed / daw-reaper-dioxus)
wgpu = { version = "29", features = ["wgsl"] }
vello = { version = "0.9", features = ["wgpu"] }
skrifa = "0.37"
pollster = "0.4"
anyrender_vello = "0.10"

# Dioxus native rendering (used by daw-reaper-dioxus)
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git", features = [
    "prelude", "svg", "system-fonts", "autofocus", "incremental",
    # data: URLs (theme image skins are delivered as data-URI PNGs)
    "data-uri",
] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git" }
dioxus-devtools = "0.7"

# Platform UI bindings
cocoa = "0.26"
objc = "0.2.7"

# Utilities
eyre = "0.6"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
crossbeam-channel = "0.5"
fragile = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Local development overrides ──────────────────────────────────────
# Uncomment to use local checkouts instead of GitHub.

# [patch."https://codeberg.org/FastTrackStudios/input_actions.git"]
# actions-proto = { path = "../input_actions/crates/actions-proto" }

# [patch."https://codeberg.org/FastTrackStudios/keyflow.git"]
# keyflow = { path = "../keyflow/crates/keyflow" }

# [patch."https://codeberg.org/FastTrackStudios/dock-dioxus.git"]
# dock-dioxus = { path = "../dock-dioxus/crates/dock-dioxus" }
# dock-proto = { path = "../dock-dioxus/crates/dock-proto" }

# [patch."https://codeberg.org/FastTrackStudios/dynamic-template.git"]
# color-palette = { path = "../dynamic-template/crates/color-palette" }
# music-catalog = { path = "../dynamic-template/crates/music-catalog" }
# dynamic-template-proto = { path = "../dynamic-template/crates/dynamic-template-proto" }

# [patch."https://codeberg.org/FastTrackStudios/session.git"]
# session = { path = "../session/crates/session" }
# session-ui = { path = "../session/crates/session-ui" }

# [patch."https://codeberg.org/FastTrackStudios/monarchy.git"]
# monarchy = { path = "../monarchy/crates/monarchy" }

# (no vox patch needed — daw, architect, and input_actions all pin the same
# Codeberg vox fork @ f31f1040 = vox 0.8.2, so the graph shares one vox.)

# reaper-rs source unification: daw pins reaper-low/medium to Codeberg, but
# swell-ui (from Codeberg reaper-lib) still pulls them from the legacy
# git.starcommand.live URL at the same rev. Cargo treats the two URLs as
# distinct sources → duplicate reaper_low → `RECT`/type mismatches across the
# boundary. Redirect the starcommand.live reaper-rs URL to Codeberg so the
# whole graph shares one reaper-rs. (Drop once reaper-lib repoints upstream.)
[patch."https://git.starcommand.live/FastTrackStudios/reaper-rs.git"]
reaper-low = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# moire: FTS fork — tolerates broken frame-pointer chains on NixOS glibc.
# All moire crates must point to the same fork rev to avoid duplicate
# moire-runtime #[ctor] registrations that crash CLAP plugin scanning.
# Blitz is consumed directly from upstream DioxusLabs/blitz — no local patch.

[patch."https://github.com/bearcove/moire"]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[patch.crates-io]
# Dioxus pinned to upstream DioxusLabs/dioxus v0.7.9 (rev 3e43ffa6) to match the
# `dx` CLI version. We previously pinned a FastTrackStudios fork (32d9f51, based
# on 0.7.6) that carried two `packages/desktop` patches for a dioxus-desktop
# WebView embed host — that approach was abandoned (REAPER embedding uses
# dioxus-native/Blitz instead), so the fork is dead weight and we track upstream.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus" }
dioxus-asset-resolver = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-asset-resolver" }
dioxus-cli-config = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-cli-config" }
dioxus-config-macros = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-config-macros" }
dioxus-core = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-core" }
dioxus-core-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-core-macro" }
dioxus-core-types = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-core-types" }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-devtools" }
dioxus-devtools-types = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-devtools-types" }
dioxus-document = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-document" }
dioxus-history = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-history" }
dioxus-hooks = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-hooks" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-html" }
dioxus-html-internal-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-html-internal-macro" }
dioxus-rsx = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-rsx" }
dioxus-signals = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-signals" }
dioxus-stores = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-stores" }
dioxus-stores-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "dioxus-stores-macro" }
generational-box = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "generational-box" }
manganis = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "manganis" }
manganis-core = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "manganis-core" }
manganis-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "3e43ffa6cf1488d5388c888eb5f2494a006ae6de", package = "manganis-macro" }

moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[workspace.lints.rust]
dead_code = "allow"
unused = "allow"
# `unused_unsafe` is a rustc lint (was mis-filed under [lints.clippy], which
# made clippy::unused_unsafe an unknown-lint error under -D warnings).
unused_unsafe = "allow"

[workspace.lints.rustdoc]
# Broken intra-doc links are noisy on a fast-moving codebase. They're
# real bugs (renames that didn't update doc comments) but block CI from
# unrelated work. Re-tighten per-crate once a sweep is done.
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
# Stylistic lints that don't reflect actual bugs and create churn on a
# fast-moving codebase. Re-enable on a per-crate basis if/when a crate
# wants to be strict about these.
#
# To take effect, each crate's Cargo.toml needs `[lints] workspace = true`.
field_reassign_with_default = "allow"
manual_clamp = "allow"
needless_range_loop = "allow"
not_unsafe_ptr_arg_deref = "allow"
only_used_in_recursion = "allow"
unnecessary_sort_by = "allow"
unusual_byte_groupings = "allow"
