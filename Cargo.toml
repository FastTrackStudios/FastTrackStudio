[workspace]
members = [".", ]
resolver = "2"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
# Keyflow/Engraver
keyflow = { git = "https://codeberg.org/FastTrackStudios/keyflow.git", branch = "main" }

# The standalone Editor (contenteditable widget), shared with Task and
# keyflow's examples/web-editor. `editor-keyflow-lang` supplies keyflow syntax
# highlighting + IDE diagnostics decorations; `editor-keyflow` renders `.kf`
# source to a live SVG preview. Web/wasm only.
editor = { git = "https://codeberg.org/FastTrackStudios/Editor.git", branch = "main" }
editor-keyflow = { git = "https://codeberg.org/FastTrackStudios/Editor.git", branch = "main" }
editor-keyflow-lang = { git = "https://codeberg.org/FastTrackStudios/Editor.git", branch = "main" }

# FTS design system
fts-ui = { path = "../fts-ui/crates/fts-ui" }
lucide-dioxus = { git = "https://github.com/Leaf-Computer/lucide.git", rev = "e3e509d5855324e893aef838747cccb2d115dc15", features = ["all-icons"] }

# Anyrender / Vello rendering
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
vello = { version = "0.9", features = ["wgpu"] }
peniko = "0.6"

[package]
name = "fasttrackstudio-web"
version = "0.1.0"
authors = ["Cody Wright <acodywright@gmail.com>"]
edition = "2024"
description = "FastTrackStudio Web App - Documentation, chart browser, and more"

[dependencies]
# Dioxus web framework
dioxus = { version = "0.7.9", features = ["router"] }

# UI component library (shadcn-inspired, Tailwind-styled)
lucide-dioxus = { workspace = true }

# Chart parsing and layout
keyflow = { workspace = true, features = ["engraver", "text", "highlighting"] }

# Live contenteditable editor + keyflow language bindings (homepage demo)
editor = { workspace = true }
editor-keyflow = { workspace = true }
editor-keyflow-lang = { workspace = true }

# FTS design system (components, layout, typography, theme tokens)
fts-ui = { workspace = true }

# Color type used by the engraver's SVG export config
peniko = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Archive creation for multi-file exports
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Logging
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Override fontique to disable system feature (not available on WASM)
fontique = { version = "0.2", default-features = false, features = ["std"] }
parley = { version = "0.2", default-features = false, features = ["std"] }

# Override uuid to enable js feature for WASM (uses browser crypto API)
uuid = { version = "1.0", features = ["serde", "v4", "js"] }

# WASM-specific utilities
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "registry"] }

# Async timers for WASM — "futures" feature backs the debounced live-preview
# render task in LiveEditor.
gloo-timers = { version = "0.3", features = ["futures"] }

# Web APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Navigator",
    "CanvasRenderingContext2d",
    "Performance",
    "Location",
    # Mouse/touch interaction
    "MouseEvent",
    "WheelEvent",
    "EventTarget",
    "AddEventListenerOptions",
    "DomRect",
    # Resize observation
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "ResizeObserverBoxOptions",
    # File download
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    # SVG fallback rendering
    "HtmlImageElement",
] }

# Async runtime for WASM
tokio = { version = "1.0", default-features = false, features = ["sync"] }

# Random number generation for WASM (needed for getrandom 0.2 used by uuid)
getrandom = { version = "0.2", features = ["js"] }
# getrandom 0.3 pulled in by iroh/pkarr - need wasm_js feature for wasm32
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Desktop/server dependencies
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# opt-level 1 prevents "too many locals" WASM errors caused by unoptimized debug builds
opt-level = 1

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[lints]
workspace = true

[patch."https://codeberg.org/FastTrackStudios/keyflow.git"]
keyflow = { path = "/home/cody/Development/FastTrackStudio/keyflow/crates/keyflow" }
engraver = { path = "/home/cody/Development/FastTrackStudio/keyflow/crates/engraver" }
engraver-proto = { path = "/home/cody/Development/FastTrackStudio/keyflow/crates/engraver-proto" }
keyflow-proto = { path = "/home/cody/Development/FastTrackStudio/keyflow/crates/keyflow-proto" }
keyflow-text = { path = "/home/cody/Development/FastTrackStudio/keyflow/crates/keyflow-text" }
keyflow-ui = { path = "/home/cody/Development/FastTrackStudio/keyflow/crates/keyflow-ui" }

[patch."https://codeberg.org/FastTrackStudios/daw.git"]
# TEMPORARY: daw-module's own tokio dep inherits the daw workspace's
# full-featured tokio, which pulls mio and breaks wasm32 builds (this repo's
# only wasm consumer of daw-module, via keyflow's unconditional dependency
# on it). Fixed locally (scoped, non-workspace tokio dep, "rt" only) but not
# yet pushed to daw.git@main — that repo currently has unrelated local WIP
# blocking its pre-commit gate. Drop this patch once the fix lands upstream.
daw-module = { path = "/run/media/Development/FastTrackStudio/daw/crates/daw-module" }

