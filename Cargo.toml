[workspace]
# Vertical-slice reset: tasks + projects remain; auth is provided by architect-auth.
members = [
    "apps/*",
    "crates/*",
    "features/*/*",
# `features/*/tests/native` glob — gone since `features/project/tests/`
# was deleted alongside the project crates. Re-add if a feature
# grows native integration tests again.
#    "features/*/tests/native",
    "xtask",
    # CodeMirror-style editor — subtree-imported from
    # github.com/.../Editor. Lives under `features/editor/` so its
    # internal Cargo.toml + git history stay intact. We re-expose
    # its crates here so the rest of Task can depend on them.
    "features/editor/crates/editor-state",
    "features/editor/crates/editor-syntax",
    "features/editor/crates/editor-view",
    "features/editor/crates/editor-vim",
    "features/editor/crates/editor-typst",
    "features/editor/crates/editor-mermaid",
    "features/editor/crates/editor",
    # Vendored fork of `mermaid-rs-renderer` 0.2.2 with web-time
    # patched in for wasm32 compat. Lives next to the editor it
    # supports.
    "features/editor/vendor/mermaid-rs-renderer",
    # Editor playground — Dioxus app that dogfoods the editor.
    # Built with `dx serve --package playground`.
    "features/editor/examples/playground",
    # Email feature harness — same pattern as the editor
    # playground: standalone Dioxus binary that exercises the
    # email-* crates without pulling in the full task-ui shell.
    "features/email/examples/email-client",
    # Parked: legacy Logseq-style shell. Kept buildable so we can
    # mine pieces (virt-folder, properties pane, tasks-kanban) into
    # the new editor + vault stack on demand.
]
exclude = [
    # `features/editor/` keeps its imported `crates/` + `vendor/`
    # + `examples/` subdirs so the editor's internal layout
    # stays intact. Each real crate is listed above explicitly;
    # exclude the intermediate parent dirs from the
    # `features/*/*` glob so cargo doesn't try to parse them as
    # manifests.
    "features/editor/crates",
    "features/editor/vendor",
    "features/editor/examples",
    "features/editor/docs",
    "features/editor/plans",
    "features/editor/tests",
    # The `features/*/*` glob would otherwise try to parse
    # `features/email/examples/` and `features/email/plans/`
    # as crate manifests.
    "features/email/examples",
    "features/email/plans",
    # `crates/legacy/` parks older shells we want to keep readable
    # without forcing them into the workspace member glob.
    "crates/legacy",
]
resolver = "2"

[workspace.metadata.crane]
name = "task"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Codys-Wright/Task"

[workspace.dependencies]
async-trait = "0.1"
chrono = "0.4"
keybindings = "0.0.2"
editor-types = "0.0.2"
vim = { path = "crates/vim" }
eyre = "0.6"
futures = "0.3"
rrule = "0.11"
thiserror = "2.0"
tracing = "0.1"
# `project` feature crates (project, project-proto, project-crdt,
# project-db) deleted along with the Loro entity layer. Tasks +
# projects are now plain markdown pages under the vault. The legacy
# `project-ui` shell is parked.
project-ui = { path = "crates/legacy/project-ui" }
# `knowledge` feature deleted. File-backed `vault` is now the
# only storage path. Pieces of the old stack survive as legacy
# parks under `crates/legacy/` (knowledge-ui shell,
# editor-outliner Logseq port, publish-core static-site engine);
# kept readable so we can mine them later, not in the workspace
# member glob.
knowledge-ui = { path = "crates/legacy/knowledge-ui" }
publish-core = { path = "crates/legacy/publish-core" }
editor-outliner = { path = "crates/legacy/editor-outliner" }

vault-obsidian = { path = "features/vault/vault-obsidian" }
# `wiki` feature — Task's port of Karpathy's LLM-Wiki pattern
# (see nashsu/llm_wiki). `wiki-proto` is the wire contract; a
# `wiki-live` backend, agent-driven ingest glue, and the
# `Wiki/` directory layout under each vault all stack on top.
# See `plans/wiki-feature.md` for the design + slice plan.
wiki-proto = { path = "features/wiki/wiki-proto" }
wiki-live = { path = "features/wiki/wiki-live" }
wiki-graph = { path = "features/wiki/wiki-graph" }
# `agent` feature — LLM-agent integration. `agent-proto` is
# the wire contract (sessions, messages, tools, kanban,
# approvals, streaming events). Backends live in sibling
# crates (`agent-hermes` for in-process Hermes,
# `agent-codex` for the Codex CLI monitor, etc.).
# Binding crates layer per-feature prompts/parsers on top
# (`agent-wiki` drives `wiki-proto`, future `agent-task`
# drives the task feature, etc.).
# See `plans/agent-feature.md`.
agent-proto = { path = "features/agent/agent-proto" }
agent-wiki = { path = "features/agent/agent-wiki" }
agent-codex = { path = "features/agent/agent-codex" }
# First-party task feature. Tasks = markdown pages with
# TaskNotes-shape frontmatter (mirrors callumalpass/tasknotes
# so existing vaults round-trip without conversion). Lives at
# `features/task/task/`.
task = { path = "features/task/task" }
# File-backed vault layer. Modeled on `vault-obsidian` (clean
# small modules, native-only `cfg`, walker / watcher / mutate)
# but adds block-id awareness: a `BlockIndex` maps every
# `id:: <uuid>` line in the vault to its containing page +
# anchor offset.
vault = { path = "features/vault/vault" }
vault-live = { path = "features/vault/vault-live" }
vault-proto = { path = "features/vault/vault-proto" }
# Email feature — wire contract + backends. Same shape as
# `vault-proto`: one `#[architect::rpc] trait EmailSync` proto
# crate, sibling backend crates (`email-imap`, `email-jmap`,
# `email-maildir`, `email-nextcloud`) impl it, and
# `email-store` caches behind the same surface.
email-proto = { path = "features/email/email-proto" }
email-imap = { path = "features/email/email-imap" }
email-smtp = { path = "features/email/email-smtp" }
email-jmap = { path = "features/email/email-jmap" }
email-maildir = { path = "features/email/email-maildir" }
email-nextcloud = { path = "features/email/email-nextcloud" }
email-store = { path = "features/email/email-store" }
email-secret = { path = "features/email/email-secret" }
email-config = { path = "features/email/email-config" }
email-autoconfig = { path = "features/email/email-autoconfig" }
# Per-account sync engine — wraps any EmailSync backend in a
# periodic reconciliation loop and broadcasts merged events.
# Mirrors pimalaya's neverest+mirador split out of himalaya.
email-sync = { path = "features/email/email-sync" }
# Cross-entity link layer — connects emails to tasks / projects /
# notes / people via a many-to-many index. Used by other
# features to record "this email is about this project."
email-link = { path = "features/email/email-link" }
# CodeMirror-style editor (subtree). `editor` is the umbrella
# crate that re-exports the others — apps consume that.
editor-state = { path = "features/editor/crates/editor-state" }
editor-syntax = { path = "features/editor/crates/editor-syntax" }
editor-view = { path = "features/editor/crates/editor-view" }
editor-vim = { path = "features/editor/crates/editor-vim" }
editor-typst = { path = "features/editor/crates/editor-typst" }
editor-mermaid = { path = "features/editor/crates/editor-mermaid" }
editor = { path = "features/editor/crates/editor" }

# Deps the editor's inner crates inherit via `workspace = true`.
# `serde`, `serde_json` are already declared elsewhere in the
# workspace deps block — only the editor-specific ones go here.
ropey = "1.6"
# Tree-sitter syntax highlighting — same versions as the editor
# subtree's original workspace, kept default-features-off so we
# don't drag in everything by default.
arborium = { version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
arborium-tree-sitter = "2.16.0"
attachments-proto = { path = "features/attachments/attachments-proto" }
# `locations` — typed view of place pages (`type: location`)
# in a `vault::Vault`. Studios / rooms / storage / venues
# carry a stable `id` so other features reference them by
# uuid through renames.
locations = { path = "features/locations/locations" }
# `inventory` — typed view of gear/equipment pages
# (`type: item`). References locations by `location_id`;
# rides on top of `vault` like `task` does.
inventory = { path = "features/inventory/inventory" }
view = { path = "features/view/view" }
view-gantt = { path = "features/view/view-gantt" }
view-kanban = { path = "features/view/view-kanban" }
view-calendar = { path = "features/view/view-calendar" }
view-table = { path = "features/view/view-table" }
view-heatmap = { path = "features/view/view-heatmap" }
# Scheduling — personal day-templates + cal.com-style bookable
# event types, sync over CalDAV (future). Trio + facade follow the
# vault pattern; `scheduling-proto` is wasm-clean.
scheduling = { path = "features/scheduling/scheduling" }
scheduling-proto = { path = "features/scheduling/scheduling-proto", default-features = false }
scheduling-ui = { path = "features/scheduling/scheduling-ui" }
architect-auth = { path = "../architect-auth/crates/architect-auth" }

# Git feature — issue + PR workflow on top of forges
# (GitHub now, Forgejo next). `git-proto` is the wire
# contract: three `#[architect::rpc]` traits — `RepoCatalog`,
# `IssueTracker`, `ReviewSurface`. Backends in sibling crates
# impl whichever traits the forge supports. `git-config` owns
# `RepoBinding` + `IssueLink` persistence. See
# `plans/git-feature.md`.
git-proto = { path = "features/git/git-proto" }
git-github = { path = "features/git/git-github" }
git-config = { path = "features/git/git-config" }
octocrab = "0.46"

# Filesystem walker — used by knowledge-sync to crawl Obsidian vault
# directories. Server-only dep; never reaches wasm.
walkdir = "2"
# Parallel file IO for the vault scanner.
rayon = "1"

# Fuzzy matcher used by the knowledge live-preview editor pickers
# (wikilink/blockref/tag/slash-command). Same crate used internally by
# helix and other rust TUIs — fast prefix-friendly bonuses + Unicode
# normalization. Wasm-clean.
nucleo-matcher = "0.3"
fts-ui = { path = "../FastTrackStudio/fts-ui/crates/fts-ui", default-features = false }

# Ordered-map for round-trippable frontmatter key preservation
# (needed by knowledge-proto's obsidian helpers).
indexmap = "2"

# Regex engine — knowledge-proto uses it for link/embed/tag scanning.
regex = "1"

# YAML parsing/serialization for Obsidian frontmatter round-trip.
serde_yaml = "0.9"

[workspace.dependencies.facet]
version = "0.46"
features = [
    "reflect",
    "chrono",
    "uuid",
]

[workspace.dependencies.facet-core]
version = "0.46"

[workspace.dependencies.facet-json]
version = "0.46"

[workspace.dependencies.facet-pretty]
version = "0.46"

[workspace.dependencies.facet-reflect]
version = "0.46"

[workspace.dependencies.facet-yaml]
version = "0.46"

[workspace.dependencies.keyflow]
path = "../FastTrackStudio/keyflow/crates/keyflow"

[workspace.dependencies.lumen-blocks]
git = "https://github.com/Leaf-Computer/lumen-blocks.git"
tag = "v0.2.0"

[workspace.dependencies.moire]
git = "https://git.starcommand.live/codywright/moire"
rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624"

# Loro — CRDT engine, source of truth for every feature's data.
# SeaORM stores the doc's snapshot + update log as opaque bytes.
[workspace.dependencies.loro]
version = "1.12"
default-features = false

# Loro internals — needed for `EphemeralStore` (awareness/cursor
# sync) which the public `loro` crate doesn't re-export. Pinned
# to the same minor as `loro` so the type identities line up.
[workspace.dependencies.loro-internal]
version = "1.12"
default-features = false

# CalDAV/CardDAV/WebDAV-Sync client (RFC 4791 + RFC 6352 + RFC 6578).
# Picked over `kitchen-fridge` because it actually implements VEVENT
# (kitchen-fridge's upstream is VTODO-first with VEVENT support
# documented as "fairly trivial but not yet"), supports sync-token
# incremental fetches, and ships HTTP/2 + connection pooling. We
# wrap it in a Loro-backed bridge — the architect `calendar` CRDT
# is our local source of truth, so kitchen-fridge's bundled Cache /
# Provider abstractions would be redundant.
[workspace.dependencies.fast-dav-rs]
version = "0.4"

# iCalendar parser / builder. Used by `caldav-sync` to map between
# raw `BEGIN:VEVENT…` text and `calendar_proto::CalendarEvent`
# (and the inverse for push). Active maintenance, dual-licensed,
# uses the same `rrule` crate we have at the workspace level.
[workspace.dependencies.icalendar]
version = "0.17"

# Markdown parser used by `chat-ui/src/ai/markdown.rs` to render
# assistant message bodies. `default-features = false` drops the
# `simd` + `gen-tests` optional deps so the crate stays wasm-clean.
[workspace.dependencies.pulldown-cmark]
version = "0.10"
default-features = false

# Dioxus — UI lib. Single workspace dep; per-crate `[features]`
# enable the platform target. Pattern lifted from dioxus-flake's
# packages/web/desktop/mobile setup so `cargo check --workspace`
# works inside the nix dev shell.
[workspace.dependencies.dioxus]
version = "0.7.9"
default-features = false
features = ["lib"]

[workspace.dependencies.dioxus-router]
version = "0.7.9"
default-features = false

[workspace.dependencies.dioxus-ssr]
version = "0.7.9"

# Web-sys / wasm-bindgen — wired only in crates that use them and
# always behind `#[cfg(target_arch = "wasm32")]` source gates. They
# do compile on native (stub wrappers in wasm-bindgen-shared) so
# leaving them on a native-buildable crate's Cargo.toml is fine.
[workspace.dependencies.web-sys]
version = "0.3.98"

[workspace.dependencies.wasm-bindgen]
version = "0.2"

[workspace.dependencies.wasm-bindgen-futures]
version = "0.4"

[workspace.dependencies.js-sys]
version = "0.3"

[workspace.dependencies.gloo-timers]
