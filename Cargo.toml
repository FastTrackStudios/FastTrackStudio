[workspace]
members = [
    "apps/app/cli",
    "apps/app/server",
    "apps/app/db",
    "apps/app/tests/e2e",
    "features/example/example",
    "features/example/example-proto",
    "features/example/example-db",
    "features/example/example-memory",
    "features/example/example-crdt",
    "features/example/example-ui",
    "features/example/tests/native",
    "macros/architect",
    "macros/architect-derive",
    "macros/architect-rpc-derive",
    "macros/crdt-derive",
    "examples/external-stub",
    "examples/custom-server",
    "examples/layered-services",
    "crates/architect-cli",
    "libs/crdt",
    "libs/crdt-seaorm", "features/foo/foo", "features/foo/foo-proto", "features/foo/foo-crdt", "features/foo/foo-db", "features/foo/tests/native", "features/bar/bar", "features/bar/bar-proto", "features/bar/bar-crdt", "features/bar/bar-db", "features/bar/tests/native",
]
# Build the production graph by default; xtask is opt-in via `cargo xtask`.
default-members = [
    "apps/app/cli",
    "apps/app/server",
    "apps/app/db",
    "apps/app/tests/e2e",
    "features/example/example",
    "features/example/example-proto",
    "features/example/example-db",
    "features/example/example-memory",
    "features/example/example-crdt",
    "features/example/example-ui",
    "features/example/tests/native",
    "macros/architect",
    "macros/architect-derive",
    "macros/architect-rpc-derive",
    "macros/crdt-derive",
    "examples/external-stub",
    "examples/custom-server",
    "libs/crdt",
    "libs/crdt-seaorm", "features/foo/foo", "features/foo/foo-proto", "features/foo/foo-crdt", "features/foo/foo-db", "features/foo/tests/native", "features/bar/bar", "features/bar/bar-proto", "features/bar/bar-crdt", "features/bar/bar-db", "features/bar/tests/native",
]
# Crates with wasm32 / Dioxus target deps that don't survive a workspace
# host build sit outside; each invokes cargo directly.
exclude = [
    "apps/app/web",
    "apps/app/desktop",
    "apps/app/ui",
    "features/example/tests/web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"
repository = "https://git.starcommand.live/codywright/architect"

[workspace.dependencies]
# Shared async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
eyre = "0.6"
thiserror = "2"

# Time + IDs
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }

# Serialization: vox uses facet for wire encoding.
facet = { version = "0.46", features = ["reflect", "chrono", "uuid"] }
facet-pretty = "0.46"

# Test-data + db-seed generation. Architect emits #[derive(Dummy)] on
# every Create/Update/List/Model struct when the `fake` feature is on,
# letting tests + seeding loops generate values deterministically (via
# a seeded RNG) or randomly (default Faker distribution).
fake = { version = "4", features = ["derive", "uuid", "chrono"] }

# CLI argument + config parser. Same shape across xtask, apps/app/cli,
# and any future user-facing binary so flags / env / config files all
# work consistently.
figue = "4"
owo-colors = "4"
camino = "1"
heck = "0.5"
facet-core = "0.46"

# vox — Rust-native RPC. Service traits define the schema; the macro
# emits typed client + dispatcher for every transport.
# Wasm-clean by construction: no transport features, just `runtime`
# (pulls vox-core, gives `#[vox::service]` + the generated `<Trait>Client`
# type). Server crates additionally enable `transport-websocket` if they
# use `vox::serve` — we go through axum directly so we only need this.
# Wasm clients depend on `vox-websocket` directly, not through this dep.
# Pattern lifted from vox's own `rust/wasm-browser-tests` crate.
vox = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830", default-features = false, features = ["runtime"] }
vox-core = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-types = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-websocket = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }

# Loro — CRDT engine. Local-first state lives inside a LoroDoc;
# SeaORM stores the doc's snapshot + update log as opaque bytes.
# Wasm-clean: Loro ships first-class WASM.
loro = { version = "1.12", default-features = false }

# Moiré — runtime graph instrumentation. Pinned to our fork at
# codywright/moire which layers (a) forge's NixOS frame-pointer
# termination fix and (b) a flake.nix that builds moire-web with
# its frontend bundled. The `[patch."..."]` block at the bottom
# redirects every transitive bearcove/moire reference (incl. vox's)
# to this same fork so the runtime graph stays coherent.
moire = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }

# Database — SeaORM with SQLite for the reference. Real projects pick
# their own backend without changing the crudcrate-generated traits.
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

# crudcrate — derives the wasm-clean DTO struct + auto-generated
# ExampleRepo vox trait from a single Model definition. Server picks
# up the SeaORM bits via the `server` feature; wasm clients see only
# the DTO + trait.
crudcrate = { git = "https://github.com/FastTrackStudios/crudcrate", rev = "f666e52018cfa3b2c58518a01645735cddf774f9", features = ["derive"] }

# HTTP
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Wasm
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# The architect derive crate — owns the macro that emits the wire
# struct + the SeaORM Model + the auto-generated vox repo trait,
# all from one source struct. Every entity crate depends on this.
architect = { path = "macros/architect" }

# Proto crate — referenced by everything else as a path dep so
# entity changes flow uniformly to every surface.
example = { path = "features/example/example" }
example-proto = { path = "features/example/example-proto" }
example-db = { path = "features/example/example-db" }
example-memory = { path = "features/example/example-memory" }
example-crdt = { path = "features/example/example-crdt" }
example-stub-backend = { path = "examples/external-stub" }

# Local-first CRDT layer — generic LoroDoc wrapper, EntityCrdt trait,
# Persistence trait. Backend-agnostic: pair with crdt-seaorm on the
# server, with crdt-indexeddb (future) in the browser, or run with the
# bundled in-memory persistence for tests.
crdt = { path = "libs/crdt" }
crdt-seaorm = { path = "libs/crdt-seaorm" }

# Object-safe async traits (Persistence). Hot-path traits in this
# workspace use Rust 2024 async-fn-in-trait via #[vox::service]; we
# only reach for async-trait where dyn-dispatch is needed.
async-trait = "0.1"
foo = { path = "features/foo/foo" }
foo-proto = { path = "features/foo/foo-proto" }
foo-crdt = { path = "features/foo/foo-crdt" }
foo-db = { path = "features/foo/foo-db" }
bar = { path = "features/bar/bar" }
bar-proto = { path = "features/bar/bar-proto" }
bar-crdt = { path = "features/bar/bar-crdt" }
bar-db = { path = "features/bar/bar-db" }

# Redirect every transitive bearcove/moire reference (e.g. vox's
# moire-runtime / moire-tokio / moire-types) to our fork at the same
# rev as the workspace dep above. Without this, vox + architect would
# end up with two parallel moire compilations, two parallel entity
# graphs, and the dashboard would see only half the picture.
[patch."https://github.com/bearcove/moire"]
moire             = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-macros      = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-macros-noop = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-runtime     = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-tokio       = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-trace-capture = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-trace-types = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-types       = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-wasm        = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-wire        = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
