[workspace]
members = ["crates/*", "tests", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
color-palette = { path = "crates/color-palette" }
music-catalog = { path = "crates/music-catalog" }
dynamic-template-proto = { path = "crates/dynamic-template-proto" }
dynamic-template = { path = "crates/dynamic-template" }

# Monarchy hierarchy framework
monarchy = { git = "https://codeberg.org/FastTrackStudios/monarchy.git", branch = "main" }

# Facet reflection framework — matches monarchy's facet version
facet = "0.46"
facet-core = "0.46"
facet-format = "0.47"
facet-json = "0.46"
facet-value = "0.46"

# ROAM service framework — FTS fork (carries the vox-jit-abi __rust_alloc-scan
# fix; without it the encode worker hangs on complex/allocating RPC returns).
vox = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "f31f10400c245740a072fa61bb96ef3a3fc2bd93" }

# Sibling repos
daw = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main", features = ["reaper"] }
daw-proto = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
daw-reaper = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
daw-standalone = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
actions-proto = { git = "https://codeberg.org/FastTrackStudios/input_actions.git", branch = "main" }

# Testing
reaper-test = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.48", features = ["full"] }

# Observability
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"

# ── Vendored patches ──────────────────────────────────────────────────
# moire: unify crates.io moire with the git rev that vox pulls in,
# avoiding duplicate moire-runtime #[ctor] registrations that crash.
[patch.crates-io]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

# dioxus: daw pulls REAPER UI features (daw-reaper → daw-reaper-dioxus →
# patched dioxus). Mirror daw's dioxus-git patch so the dep graph resolves.
dioxus = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus" }
dioxus-asset-resolver = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-asset-resolver" }
dioxus-cli-config = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-cli-config" }
dioxus-config-macros = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-config-macros" }
dioxus-core = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-core" }
dioxus-core-macro = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-core-macro" }
dioxus-core-types = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-core-types" }
dioxus-devtools = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-devtools" }
dioxus-devtools-types = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-devtools-types" }
dioxus-document = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-document" }
dioxus-history = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-history" }
dioxus-hooks = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-hooks" }
dioxus-html = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-html" }
dioxus-html-internal-macro = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-html-internal-macro" }
dioxus-rsx = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-rsx" }
dioxus-signals = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-signals" }
dioxus-stores = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-stores" }
dioxus-stores-macro = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "dioxus-stores-macro" }
generational-box = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "generational-box" }
manganis = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "manganis" }
manganis-core = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "manganis-core" }
manganis-macro = { git = "https://codeberg.org/FastTrackStudios/dioxus", rev = "2a776101ae2544244c296734561d71bc0ebb46a6", package = "manganis-macro" }

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
dead_code = "allow"

[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"
