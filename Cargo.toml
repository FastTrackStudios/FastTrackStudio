[workspace]
members = [
    "apps/daw",
    "crates/audio-controls",
    "crates/daw",
    "crates/daw-control",
    "crates/daw-proto",
    "crates/daw-reaper",
    "crates/daw-standalone",
    "crates/daw-audio-graph",
    "crates/dawfile-reaper",
    "crates/dawfile-protools",
    "crates/dawfile-ableton",
    "crates/dawfile-aaf",
    "crates/dawfile-logic",
    "crates/dawfile-dawproject",
    "crates/daw-ui",
    "crates/reaper-test",
    "crates/reaper-test-macro",
    "crates/reaper-launcher",
    "crates/daw-allocator",
    "crates/daw-audio-sync",
    "crates/daw-bridge",
    "crates/daw-perf-test",
    "crates/fts-audio-proto",
    "crates/fts-devtools",
    "crates/daw-extension-runtime",
    "crates/daw-module",
    "crates/daw-reaper-embed",
    "crates/daw-reaper-dioxus",
    "crates/daw-reaper-dioxus-ext",
    "crates/daw-reaper-dioxus-ext-test",
    "crates/daw-synchronization",
    "crates/daw-network",
    "crates/daw-link",
    "apps/example-extension",
    "apps/example-plugin",
    "xtask",
]
resolver = "2"

[workspace.metadata.crane]
name = "daw"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Facade crate — the only public API surface for the daw domain
daw = { path = "crates/daw" }
# App crate (binary + lib)
daw-cli = { path = "apps/daw" }
# UI crate stays public (Dioxus components with feature flags)
daw-ui = { path = "crates/daw-ui", default-features = false }
# Widget crate stays public (standalone Dioxus widgets)
audio-controls = { path = "crates/audio-controls" }
# RT-aware allocator — offloads RT deallocation to background thread
daw-allocator = { path = "crates/daw-allocator" }
# Extension runtime — integrated REAPER extension helpers
daw-extension-runtime = { path = "crates/daw-extension-runtime" }
daw-reaper = { path = "crates/daw-reaper" }
# Sync stack — public sibling crates (cannot be folded under the `daw`
# facade because each depends on `daw` itself, see lib.rs note).
daw-synchronization = { path = "crates/daw-synchronization" }
daw-network = { path = "crates/daw-network" }
daw-link = { path = "crates/daw-link" }
# Dev tooling — REAPER extension install/symlink helpers (for xtask use)
fts-devtools = { path = "crates/fts-devtools" }
# FTS design system — used by `daw-ui`'s `reaper-test-panels` feature so the
# Native vs Desktop renderer demo panels can ship from this repo.
fts-ui = { git = "https://git.starcommand.live/FastTrackStudios/fts-ui.git", rev = "d9f01261cb59708300cc5b31fa7fe6bd766a66aa" }
# NOTE: daw-proto, daw-control, daw-control-sync, daw-reaper, daw-standalone,
# dawfile-reaper are INTERNAL. Access them through the `daw` facade crate.

# Facet reflection — align the stack to the current 0.46 line.
facet = { version = "0.46" }
facet-json = { version = "0.46" }

# architect framework — defines #[architect::rpc] for sync-trait → vox
# bridge generation plus the Entity derive for CRUD-shaped data.
architect = { git = "https://git.starcommand.live/FastTrackStudios/architect.git", branch = "main" }
architect-rpc-derive = { git = "https://git.starcommand.live/FastTrackStudios/architect.git", branch = "main" }

# VOX service framework (pinned to FastTrackStudios fork)
vox = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-types = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-stream = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
vox-ffi = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }
ur-taking-me-with-you = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }

# CLI
clap = { version = "4", features = ["derive"] }

# Plugin framework
nih_plug = { git = "https://git.starcommand.live/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }

# CLAP plugin hosting (Rust-native CLAP host + extension bindings).
# Pinned to the prokopyl/clack upstream — same revs as fts-analyzer
# so workspaces line up.
clack-host = { git = "https://github.com/prokopyl/clack" }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = [
    "clack-host",
    "audio-ports",
    "note-ports",
    "params",
    "state",
    "latency",
    "gui",
    "timer",
    "log",
    "thread-check",
    "tail",
] }

# VST3 plugin hosting (auto-generated COM bindings from the official
# Steinberg SDK headers). MIT/Apache-2.0 — does NOT contaminate with
# GPL the way RustAudio's vst3-sys would.
vst3 = "0.3"
libloading = "0.8"

# Sibling repos
actions-proto = { git = "https://git.starcommand.live/FastTrackStudios/input_actions.git", branch = "main" }
dock-dioxus = { git = "https://git.starcommand.live/FastTrackStudios/dock-dioxus.git", branch = "main", default-features = false }
dock-proto = { git = "https://git.starcommand.live/FastTrackStudios/dock-dioxus.git", branch = "main" }

# Testing
reaper-test = { path = "crates/reaper-test" }
reaper-launcher = { path = "crates/reaper-launcher" }

# REAPER bindings (FTS fork with v7.63 ruler lane APIs)
reaper-low = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# swell-ui from FTS reaper-lib — typed Window/Hwnd wrappers around SWELL.
# Used by daw-reaper for nudge / resize / center geometry actions.
swell-ui = { git = "https://git.starcommand.live/FastTrackStudios/reaper-lib.git", branch = "main" }

# UI
dioxus = "0.7.2"

# Async runtime
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
enumflags2 = "0.7"

# Observability
tracing = { version = "0.1", features = ["std"] }
moire = { version = "1.0" }  # diagnostics feature disabled — causes SIGBUS on NixOS

# GPU rendering stack (used by daw-reaper-embed / daw-reaper-dioxus)
wgpu = { version = "28", features = ["wgsl"] }
vello = { version = "0.8", features = ["wgpu"] }
skrifa = "0.37"
pollster = "0.4"
anyrender_vello = "0.8"

# Dioxus native rendering (used by daw-reaper-dioxus)
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git", features = [
    "prelude", "svg", "system-fonts", "autofocus", "incremental",
] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git" }
dioxus-devtools = "0.7"

# Platform UI bindings
cocoa = "0.26"
objc = "0.2.7"

# File watching
notify = "8"

# Utilities
eyre = "0.6"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
crossbeam-channel = "0.5"
fragile = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

