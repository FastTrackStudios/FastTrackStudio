# FastTrackStudio — ONE root workspace.
#
# Every crate in the tree is a member here (libs/, crates/, features/,
# apps/) — the old per-domain workspaces (daw, session, signal, keyflow,
# FastTrackStudio, Plugins) are fully dissolved. One lockfile, one
# target/, one [workspace.dependencies] table carrying every intra-repo
# path dep exactly once. See LAYOUT.md for the shape; parked/legacy code

[workspace]
resolver = "3"
members = [
    # ── libs/architect — the entity/RPC framework (subtree-imported, ──
    #    history preserved; framework changes are ordinary in-tree work)
    "libs/architect/architect",
    "libs/vendor/dioxus-test",
    "libs/vendor/world",
    "libs/architect/macros/architect-derive",
    "libs/architect/macros/architect-rpc-derive",
    "libs/architect/macros/architect-action-derive",
    "libs/architect/atom",
    "libs/architect/form",
    "libs/architect/auth/architect-auth",
    "libs/architect/auth/auth",
    "libs/architect/auth/auth-proto",
    "libs/architect/auth/auth-db",
    "libs/architect/auth/auth-client",
    "libs/architect/auth/tests/native",
    "libs/architect/permissions",
    "libs/architect/permissions/proto",
    "libs/architect/crdt/crdt",
    "libs/architect/crdt/crdt-derive",
    "libs/architect/crdt/crdt-seaorm",
    # ── libs/ — UI + infrastructure libraries ─────────────────────────
    "libs/fts-chrome",
    "libs/fts-ui/fts-ui",
    "libs/fts-ui/fts-ui-audio",
    "libs/fts-ui/fts-plug-ui",
    "libs/fts-ui/showcase",
