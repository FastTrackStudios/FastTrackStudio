[workspace]
members = ["crates/monarchy", "crates/monarchy-derive"]
resolver = "2"

[workspace.lints.rust]
dead_code = "allow"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Facet ecosystem - use crates.io 0.43.x to match roam's constraint
facet = { version = "0.46" }
facet-core = { version = "0.46" }
facet-json = { version = "0.46" }
facet-toml = { version = "0.46" }
facet-postcard = { version = "0.46" }
facet-pretty = { version = "0.46" }
facet-value = { version = "0.46" }
facet-yaml = { version = "0.46" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Internal crates
monarchy = { path = "crates/monarchy" }
monarchy_derive = { path = "crates/monarchy-derive" }
