[workspace]
members = [
    "crates/fts-extensions",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
fts-launcher = { path = "../fts-launcher", features = ["native"] }
dynamic-template = { path = "../dynamic-template/crates/dynamic-template" }
dynamic-template-proto = { path = "../dynamic-template/crates/dynamic-template-proto" }
session = { path = "../session/crates/session" }
sync = { path = "../sync/crates/sync" }
sync-proto = { path = "../sync/crates/sync-proto" }
reaper-input = { path = "../fts-reaper-input/crates/reaper-input" }
keyflow = { path = "../keyflow/crates/keyflow", default-features = false }
crossbeam-channel = "0.5"
once_cell = "1"
eyre = "0.6"
fragile = "2"
reaper-high = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-low  = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
daw = { path = "../daw/crates/daw" }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Patch dynamic-template's git deps to use local paths
[patch."https://github.com/FastTrackStudios/daw.git"]
daw = { path = "../daw/crates/daw" }
daw-proto = { path = "../daw/crates/daw-proto" }
daw-control = { path = "../daw/crates/daw-control" }
daw-control-sync = { path = "../daw/crates/daw-control-sync" }
daw-extension-runtime = { path = "../daw/crates/daw-extension-runtime" }
daw-standalone = { path = "../daw/crates/daw-standalone" }
dawfile-reaper = { path = "../daw/crates/dawfile-reaper" }
dawfile-ableton = { path = "../daw/crates/dawfile-ableton" }
reaper-test = { path = "../daw/crates/reaper-test" }

[patch."https://github.com/FastTrackStudios/monarchy.git"]
monarchy = { path = "../monarchy/crates/monarchy" }

[patch."https://github.com/FastTrackStudios/input_actions.git"]
actions-proto = { path = "../input_actions/crates/actions-proto" }

[patch."https://github.com/Codys-Wright/vox.git"]
vox = { path = "../vox/rust/vox" }

[patch."https://github.com/FastTrackStudios/dynamic-template.git"]
color-palette = { path = "../dynamic-template/crates/color-palette" }
music-catalog = { path = "../dynamic-template/crates/music-catalog" }
dynamic-template-proto = { path = "../dynamic-template/crates/dynamic-template-proto" }

[patch."https://github.com/FastTrackStudios/session.git"]
session = { path = "../session/crates/session" }

# Unify Blitz: upstream DioxusLabs/blitz → FastTrackStudios/blitz fork
[patch."https://github.com/DioxusLabs/blitz.git"]
dioxus-native = { git = "https://github.com/FastTrackStudios/blitz" }
dioxus-native-dom = { git = "https://github.com/FastTrackStudios/blitz" }
blitz = { git = "https://github.com/FastTrackStudios/blitz" }
blitz-dom = { git = "https://github.com/FastTrackStudios/blitz" }
blitz-html = { git = "https://github.com/FastTrackStudios/blitz" }
blitz-net = { git = "https://github.com/FastTrackStudios/blitz" }
blitz-paint = { git = "https://github.com/FastTrackStudios/blitz" }
blitz-shell = { git = "https://github.com/FastTrackStudios/blitz" }
blitz-traits = { git = "https://github.com/FastTrackStudios/blitz" }
stylo_taffy = { git = "https://github.com/FastTrackStudios/blitz" }

[patch."https://github.com/bearcove/moire"]
moire = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-macros-noop = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-runtime = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-tokio = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-trace-capture = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }

[patch.crates-io]
moire = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-macros-noop = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-runtime = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-tokio = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
moire-trace-capture = { git = "https://github.com/FastTrackStudios/moire.git", rev = "6d856f2" }
