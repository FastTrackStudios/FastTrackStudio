# ── Dev profile (carried from the dissolved signal workspace) ──────────
# The live rig runs from `fasttrackstudio --engine` (formerly signal-engine/signal-rigd): the vendored NAM C++
# core and the DSP crates are unusable at opt-level 0 (~10-50x slower,
# xruns), so dependencies build at release opt in dev while the thin
# app/UI workspace crates stay at light opt for fast rebuilds.
[profile.dev]
opt-level = 1

# dx web builds: native debuginfo in the wasm module blew past
# Chrome's 1 GiB WebAssembly module cap (1.14 GB observed). Wasm dev
# builds don't need it — strip it and dev bundles come back to a
# loadable size.
[profile.wasm-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

# The in-browser setlist player renders daw-standalone's full graph in wasm —
# mirror the dev-profile audio-path opt overrides here explicitly (package
# overrides may not carry through `inherits`), so dx dev bundles mix ~20
# stems in realtime instead of grinding the main thread.
[profile.wasm-dev.package."*"]
opt-level = 3
[profile.wasm-dev.package.audiocore-dsp]
opt-level = 3
[profile.wasm-dev.package.daw-audio-graph]
opt-level = 3
[profile.wasm-dev.package.daw-standalone]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# `package."*"` covers DEPENDENCIES only — workspace members stay at the
# base opt-level. The audio path is ours, so the hot crates get full opt
# even in dev builds: a debug rig must never xrun. (Launch paths default
# to --release regardless; this is the safety net for dev runs.)
[profile.dev.package.audiocore-dsp]
opt-level = 3
[profile.dev.package.daw-audio-graph]
opt-level = 3
[profile.dev.package.daw-audio-io]
opt-level = 3
[profile.dev.package.daw-standalone]
opt-level = 3
[profile.dev.package.neural-amp-modeler]
opt-level = 3
[profile.dev.package.signal-sampler]
opt-level = 3
[profile.dev.package.signal-guitar]
opt-level = 3
[profile.dev.package.signal-fx]
opt-level = 3
[profile.dev.package.eq-dsp]
opt-level = 3
[profile.dev.package.comp-dsp]
opt-level = 3
[profile.dev.package.reverb-dsp]
opt-level = 3
[profile.dev.package.delay-dsp]
opt-level = 3
[profile.dev.package.pitch-dsp]
opt-level = 3
[profile.dev.package.trigger-dsp]
