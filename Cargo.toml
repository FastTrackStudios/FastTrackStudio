[workspace]
members = [
    "cells/*/*",
    "crates/*/*",
    "modules/dawfile/*",
    "modules/cell-runtime",
    "modules/host-client",
    "modules/host-runtime",
    "modules/integration-tests",
    "modules/actions/actions-proto",
    "modules/actions/actions-registry",
    "modules/actions/actions-standalone",
    "modules/actions/actions-keybindings",
    "modules/actions/input-dioxus",
    "modules/actions/input-reaper",
    "modules/actions/input",
    "modules/signal/*",
    "libs/*",
    "xtask",
    "apps/tests/*",
    "apps/fts-control/*",
    "apps/fasttrackstudio/*",
    "apps/reaper-extension",
]
exclude = []
resolver = "2"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.package]
edition = "2021"
rust-version = "1.82"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/roam"
authors = ["FastTrack Studio"]

[workspace.dependencies]
# Facet ecosystem
facet = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-default = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-format = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-json = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-postcard = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-pretty = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-toml = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-value = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-yaml = { git = "https://github.com/facet-rs/facet", branch = "main" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
anyhow = "1.0"

# Proc-macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures = "0.3"

# Roam crates (bearcove upstream)
roam = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-codegen = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-frame = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-hash = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-schema = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-service-macros = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-session = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-shm = { git = "https://github.com/bearcove/roam.git", branch = "main", features = ["tracing"] }
roam-stream = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-task-local = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-telemetry = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-tracing = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-websocket = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-wire = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-local = { git = "https://github.com/bearcove/roam.git", branch = "main" }
roam-http-bridge = { git = "https://github.com/bearcove/roam.git", branch = "main" }
subject-rust = { git = "https://github.com/bearcove/roam.git", branch = "main" }
ur-taking-me-with-you = { git = "https://github.com/bearcove/roam.git", branch = "main", features = ["tokio"] }
shm-primitives = { git = "https://github.com/bearcove/roam.git", branch = "main" }

# Local modules
dawfile-reaper = { path = "modules/dawfile/dawfile-reaper" }
integration-tests = { path = "modules/integration-tests" }
cell-runtime = { path = "modules/cell-runtime" }
host-client = { path = "modules/host-client" }
host-runtime = { path = "modules/host-runtime" }

# Monarchy crates
monarchy = { path = "crates/monarchy/monarchy" }
monarchy_derive = { path = "crates/monarchy/monarchy-derive" }

# Color palette crate
color-palette = { path = "crates/color/color-palette" }

# Dynamic template crates
dynamic-template-proto = { path = "cells/dynamic-template/dynamic-template-proto" }

# Keyflow/Engraver crates
keyflow = { path = "cells/keyflow/keyflow" }
keyflow-proto = { path = "cells/keyflow/keyflow-proto" }
keyflow-text = { path = "cells/keyflow/keyflow-text" }
keyflow-midi = { path = "cells/keyflow/keyflow-midi" }
engraver = { path = "cells/keyflow/engraver" }
engraver-proto = { path = "cells/keyflow/engraver-proto" }
keyflow-ui = { path = "cells/keyflow/keyflow-ui" }

# Protocol crates
cell-host-proto = { path = "cells/cell-host/cell-host-proto" }
session-proto = { path = "cells/session/session-proto" }
daw-proto = { path = "cells/daw/daw-proto" }
daw-control = { path = "cells/daw/daw-control" }
session = { path = "cells/session/session" }
session-ui = { path = "cells/session/session-ui" }
signal = { path = "cells/legacy-signal/signal" }
signal-proto = { path = "cells/legacy-signal/signal-proto" }
audio-controls = { path = "cells/legacy-signal/audio-controls" }
signal-control = { path = "cells/legacy-signal/signal-control" }
signal-storage = { path = "cells/legacy-signal/signal-storage" }
signal-ui = { path = "cells/legacy-signal/signal-ui" }
signal2 = { package = "signal2", path = "modules/signal/signal" }
signal2-proto = { package = "signal2-proto", path = "modules/signal/signal-proto" }
signal2-storage = { package = "signal2-storage", path = "modules/signal/signal-storage" }
signal2-live = { package = "signal2-live", path = "modules/signal/signal-live" }
signal2-controller = { package = "signal2-controller", path = "modules/signal/signal-controller" }
signal2-ui = { package = "signal2-ui", path = "modules/signal/signal-ui" }
sync-proto = { path = "cells/sync/sync-proto" }
sync = { path = "cells/sync/sync" }
sync-ui = { path = "cells/sync/sync-ui" }
dock-proto = { path = "cells/dock/dock-proto" }
dock-dioxus = { path = "cells/dock/dock-dioxus" }
gateway-proto = { path = "cells/gateway/gateway-proto" }
host-manager-proto = { path = "cells/host-manager/host-manager-proto" }
host-manager = { path = "cells/host-manager/host-manager" }
daw-standalone = { path = "cells/daw/daw-standalone" }
daw-reaper = { path = "cells/daw/daw-reaper" }
actions-proto = { path = "modules/actions/actions-proto" }
actions-registry = { path = "modules/actions/actions-registry" }
actions-standalone = { path = "modules/actions/actions-standalone" }
actions-keybindings = { path = "modules/actions/actions-keybindings" }
input-dioxus = { path = "modules/actions/input-dioxus" }
input-reaper = { path = "modules/actions/input-reaper" }
input = { path = "modules/actions/input" }

# REAPER extension dependencies
reaper-low = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-medium = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-high = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-macros = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-common-types = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master", features = ["palette"] }
swell-ui = { path = "libs/swell-ui" }
fragile = "2.0.1"
crossbeam-channel = "0.5"
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
palette = "0.7.3"

# Dioxus UI framework (pinned to 0.7.2 - native 0.7.3 not yet on crates.io)
dioxus = "0.7.2"
# Dioxus native renderer (GPU-accelerated, no WebView) - using latest git for performance improvements
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "b88144ed", features = ["prelude", "system-fonts"] }
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }

# macOS dependencies for swell-ui (using exact versions for compatibility)
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies (optional, for cross-platform)
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

# Image crate - pinned to 0.25.6 for blitz-dom compatibility (dioxus-native)
image = "=0.25.6"

# Anyrender - 2D rendering abstraction (WGPU/Vello backend)
anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }

# Linebender graphics crates (matching anyrender's versions)
peniko = "0.6"
kurbo = "0.13"
color = "0.3"
