[profile.wasm-dev]
opt-level = 1
inherits = "dev"
# Drop debuginfo so the wasm bundle stays small (~26MB instead of
# ~500MB). The dev `inherits = "dev"` default is debug=2 which
# dominates wasm size and freezes browsers loading the page.
debug = false
strip = "debuginfo"

# Use the local FastTrackStudio input_actions checkout during development so
# dependent crates share the same updated vox/facet stack.
[patch."https://github.com/FastTrackStudios/input_actions.git"]
actions-proto = { path = "../FastTrackStudio/input_actions/crates/actions-proto" }

# Redirect every transitive bearcove/vox reference (architect pulls
# vox from bearcove; this workspace pulls from Codys-Wright/vox at
# the same rev). Without this, architect's `axum_ws::serve` builds a
# Handler bound against bearcove's `vox_types::Handler` and the
# Dispatchers we instantiate here implement Codys-Wright's — same
# code, different SourceId, no impl found. Same trick as the moire
# patch below.
[patch."https://github.com/bearcove/vox"]
vox           = { git = "https://github.com/Codys-Wright/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
vox-core      = { git = "https://github.com/Codys-Wright/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
vox-types     = { git = "https://github.com/Codys-Wright/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
vox-websocket = { git = "https://github.com/Codys-Wright/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }

# Redirect every transitive bearcove/moire reference (vox's
# moire-runtime / moire-tokio / moire-types, etc.) to the codywright
# fork at the same rev as the workspace dep above. Without this,
# vox + architect end up with two parallel moire compilations.
[patch."https://github.com/bearcove/moire"]
moire             = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-macros      = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-macros-noop = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-runtime     = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-tokio       = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-trace-capture = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-trace-types = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-types       = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-wasm        = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }
moire-wire        = { git = "https://git.starcommand.live/codywright/moire", rev = "aea86f91f84cdf6052e4310e8a0541d87f37c624" }

[workspace.dependencies.architect]
path = "../architect/macros/architect"

[workspace.dependencies.printpdf]
version = "0.7"
default-features = false

[workspace.dependencies.fake]
version = "4"
features = ["derive", "uuid", "chrono"]

# architect's `architect` crate (path dep above) depends on
# `sea-orm = { workspace = true }` resolved against architect's own
# workspace, which uses crates.io sea-orm 1.x. Task uses the
# FastTrackStudios sea-orm fork — without these patches we'd get two
# parallel sea-orm crates in the graph and every architect-emitted
# RepoStorage type would be incompatible with our DatabaseConnection.
[patch.crates-io.sea-orm]
git = "https://github.com/FastTrackStudios/sea-orm"
rev = "d01afa40d79227a4a2de85b50e76849300890766"

[patch.crates-io.sea-orm-migration]
git = "https://github.com/FastTrackStudios/sea-orm"
rev = "d01afa40d79227a4a2de85b50e76849300890766"

# Vendored fork of `mermaid-rs-renderer` 0.2.2 — the upstream
# crate calls `std::time::Instant::now()` unconditionally from
# its layout pipeline, which panics on `wasm32-unknown-unknown`.
# Our fork swaps that for `web_time::Instant` so editor-mermaid
# can render diagrams in the browser. Subtree-imported with the
# editor, lives at `features/editor/vendor/mermaid-rs-renderer`.
[patch.crates-io.mermaid-rs-renderer]
path = "features/editor/vendor/mermaid-rs-renderer"
