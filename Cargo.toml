[workspace]
members = ["xtask"]

# Stylistic clippy lints allowed during stabilization (same policy as daw/fts-ui):
# they're churn, not bugs. Tighten in a later cleanup sweep.
[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"

[package]
name = "fts-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "FastTrackStudios launcher for Reaper — audio production workflow launcher"
repository = "https://git.starcommand.live/FastTrackStudios/fts-launcher"

[lib]
name = "fts_launcher"
path = "src/lib.rs"

[[bin]]
name = "fts-launcher-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["native"]
native = ["daw/reaper-ui"]
desktop = []
standalone = ["native", "dep:winit", "dep:tracing-subscriber"]

[dependencies]
# Core launcher engine and UI — always included. Git deps (not local paths)
# so the repo resolves on a clean CI runner; uncomment the [patch] block at
# the bottom for local cross-repo development.
launcher-core = { git = "https://git.starcommand.live/FastTrackStudios/dioxus-launcher.git", branch = "main" }
launcher-ui = { git = "https://git.starcommand.live/FastTrackStudios/dioxus-launcher.git", branch = "main", default-features = false }
providers = { git = "https://git.starcommand.live/FastTrackStudios/dioxus-launcher.git", branch = "main" }
fts-ui = { git = "https://git.starcommand.live/FastTrackStudios/fts-ui.git", branch = "main" }

# Dioxus native renderer (Blitz)
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git", features = ["prelude"] }

# DAW API (safe Rust, async, generic)
daw = { git = "https://git.starcommand.live/FastTrackStudios/daw.git", branch = "main" }
reaper-high = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# Standalone binary deps (optional)
winit = { version = "=0.31.0-beta.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
facet = "0.46"
facet-styx = "3.0"

# Logging
tracing = "0.1"

[lints]
workspace = true

# dioxus: fts-launcher pulls daw with `native` (reaper-ui) → daw-reaper-dioxus
# → patched dioxus. Replicate daw's dioxus-git patch ([patch] only applies at
# the building workspace root).
[patch.crates-io]
dioxus = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus" }
dioxus-asset-resolver = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-asset-resolver" }
dioxus-cli-config = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-cli-config" }
dioxus-config-macros = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-config-macros" }
dioxus-core = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-core" }
dioxus-core-macro = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-core-macro" }
dioxus-core-types = { git = "https://git.starcommand.live/codywright/dioxus", rev = "32d9f5154fa9124b05be73b82e8b04fe717a730f", package = "dioxus-core-types" }
