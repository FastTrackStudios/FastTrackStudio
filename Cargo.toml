    "libs/dock/dock-dioxus",
    "libs/dock/dock-proto",
    "libs/utils",
    "libs/spaced-repetition",
    "libs/monarchy/monarchy",
    "libs/monarchy/monarchy-derive",
    "libs/vox-discover",
    "libs/installer-core",
    "libs/engine-launcher",
    "libs/neural-amp-modeler",
    # ── crates/ — domain cores ────────────────────────────────────────
    "crates/audiocore/audiocore-core",
    "crates/audiocore/audiocore-dsp",
    "crates/audiocore/audiocore-gui",
    "crates/audiocore/fts-modulation",
    "crates/audiocore/fts-sample",
    "crates/audiocore/fts-themes",
    "crates/audiocore/meter-dsp",
    "crates/audiocore/meter-ui",
    "crates/midicore/midicore",
    "crates/midicore/midicore-proto",
    "crates/midicore/midicore-midir",
    "crates/midicore/midicore-ui",
    "crates/kontrol/kontrol",
    "crates/input/actions-proto",
    "crates/input/input-config-proto",
    "libs/editor/crates/editor",
    "libs/editor/crates/editor-crdt",
    "libs/editor/crates/editor-keyflow",
    "libs/editor/crates/editor-keyflow-lang",
    "libs/editor/crates/editor-lsp",
    "libs/editor/crates/editor-mermaid",
    "libs/editor/crates/editor-state",
    "libs/editor/crates/editor-syntax",
    "libs/editor/crates/editor-typst",
    "libs/editor/crates/editor-view",
    "libs/editor/crates/editor-vim",
    "libs/editor/examples/playground",
    "crates/input/actions-registry",
    "crates/input/actions-keybindings",
    "crates/input/actions-standalone",
    "crates/input/input",
    "crates/input/input-dioxus",
    "crates/input/input-keybinds",
    # ── crates/daw — daw domain core (wave 2) ─────────────────────────
