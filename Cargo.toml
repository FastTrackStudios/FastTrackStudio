[workspace]
# Glob-driven membership. Scaffolder writes the dirs, cargo picks
# them up; this file doesn't need touching when a new feature lands.
members = [
    "apps/*",
    "crates/*",
    "features/*/*",
    "features/*/tests/native",
    "xtask",
]
# Only non-crate directories that `features/*/*` accidentally catches:
# `features/<name>/spec` (tracey markdown) and `features/<name>/tests`
# (parent of the `tests/native` crate, which IS picked up by the
# explicit member pattern above). Two lines per feature until cargo
# grows glob-exclude support.
exclude = [
    "features/agent/spec",      "features/agent/tests",
    "features/asset/spec",      "features/asset/tests",
    "features/caldav/spec",     "features/caldav/tests",
    "features/calendar/spec",   "features/calendar/tests",
    "features/chat/spec",       "features/chat/tests",
    "features/conference/spec", "features/conference/tests",
    "features/cookbook/spec",   "features/cookbook/tests",
    "features/email/spec",      "features/email/tests",
    "features/finance/spec",    "features/finance/tests",
    "features/fitness/spec",    "features/fitness/tests",
    "features/inventory/spec",  "features/inventory/tests",
    "features/invoice/spec",    "features/invoice/tests",
    "features/location/spec",   "features/location/tests",
    "features/person/spec",     "features/person/tests",
    "features/project/spec",    "features/project/tests",
    "features/threads/spec",    "features/threads/tests",
    "features/timer/spec",      "features/timer/tests",
]
resolver = "2"

