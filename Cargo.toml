# (vox patch block removed — all pins now point at bearcove/vox directly)

# moire: FTS fork — tolerates broken frame-pointer chains on NixOS glibc.
# All moire crates must point to the same fork rev to avoid duplicate
# moire-runtime #[ctor] registrations that crash CLAP plugin scanning.
# Blitz: redirect upstream DioxusLabs/blitz git refs to local sibling checkout.
# Local ../blitz tracks DioxusLabs/blitz upstream main; daw-reaper-dioxus uses
# this to compile against the live blitz API rather than a fixed git rev.
[patch."https://github.com/DioxusLabs/blitz.git"]
dioxus-native = { path = "../blitz/packages/dioxus-native" }
dioxus-native-dom = { path = "../blitz/packages/dioxus-native-dom" }
blitz = { path = "../blitz/packages/blitz" }
blitz-dom = { path = "../blitz/packages/blitz-dom" }
blitz-html = { path = "../blitz/packages/blitz-html" }
blitz-net = { path = "../blitz/packages/blitz-net" }
blitz-paint = { path = "../blitz/packages/blitz-paint" }
blitz-shell = { path = "../blitz/packages/blitz-shell" }
blitz-traits = { path = "../blitz/packages/blitz-traits" }
stylo_taffy = { path = "../blitz/packages/stylo_taffy" }

[patch."https://github.com/bearcove/moire"]
moire = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://git.starcommand.live/FastTrackStudios/moire.git", rev = "7a2f1dc" }
