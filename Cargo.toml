[workspace]
members = [
    "cells/*/*",
    "modules/cell-runtime",
    "modules/host-client",
    "modules/host-runtime",
    "modules/integration-tests",
    "modules/actions/actions-proto",
    "modules/actions/actions-registry",
    "modules/actions/actions-standalone",
    "libs/*",
    "xtask",
    "apps/tests/*",
    "apps/fts-control/*",
    "apps/fasttrackstudio/*",
    "apps/reaper-extension",
]
exclude = ["reference/roam"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/roam"

[workspace.dependencies]
# Facet ecosystem
facet = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-default = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-format = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-json = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-postcard = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-pretty = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-toml = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-value = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-yaml = { git = "https://github.com/facet-rs/facet", branch = "main" }

# Common dependencies
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures = "0.3"

# Roam crates from fork with OTLP improvements
roam = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-codegen = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-frame = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-hash = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-schema = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-service-macros = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-session = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-shm = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields", features = ["tracing"] }
roam-stream = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-task-local = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-telemetry = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-tracing = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-websocket = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-wire = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-local = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
roam-http-bridge = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
subject-rust = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }
ur-taking-me-with-you = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields", features = ["tokio"] }
shm-primitives = { git = "https://github.com/Codys-Wright/roam", branch = "fix/otlp-skip-none-fields" }

# Local modules
integration-tests = { path = "modules/integration-tests" }
cell-runtime = { path = "modules/cell-runtime" }
host-client = { path = "modules/host-client" }
host-runtime = { path = "modules/host-runtime" }

# Protocol crates
cell-host-proto = { path = "cells/cell-host/cell-host-proto" }
session-proto = { path = "cells/session/session-proto" }
daw-proto = { path = "cells/daw/daw-proto" }
daw-control = { path = "cells/daw/daw-control" }
session = { path = "cells/session/session" }
gateway-proto = { path = "cells/gateway/gateway-proto" }
host-manager-proto = { path = "cells/host-manager/host-manager-proto" }
host-manager = { path = "cells/host-manager/host-manager" }
daw-standalone = { path = "cells/daw/daw-standalone" }
actions-proto = { path = "modules/actions/actions-proto" }
actions-registry = { path = "modules/actions/actions-registry" }
actions-standalone = { path = "modules/actions/actions-standalone" }

# REAPER extension dependencies
reaper-low = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-medium = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-high = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-macros = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-common-types = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master", features = ["palette"] }
swell-ui = { path = "libs/swell-ui" }
fragile = "2.0.1"
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
palette = "0.7.3"
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }

# macOS dependencies for swell-ui (using exact versions for compatibility)
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies (optional, for cross-platform)
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"
