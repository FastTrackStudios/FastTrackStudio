[workspace]
members = [
    "apps/server",
    "crates/fasttrackaudio",
    "crates/task-core",
    "crates/task-cli",
    "crates/task-db",
    "integrations/obsidian/plugin",
    "xtask",
]
# UI crates (task-ui + apps/{web,desktop,mobile}) live outside this workspace
# because fts-ui's own Cargo.toml has path-deps to a sibling fts-story repo.
# Including them here would force every cargo invocation in this workspace to
# resolve fts-story, which breaks server/cli builds (especially under Nix).
# Each UI crate carries its own Cargo.toml with inline deps and gets its own
# Cargo.lock; they all share the live ../FastTrackStudio/fts-ui sibling.
exclude = [
    "apps/web",
    "apps/desktop",
    "apps/mobile",
    "crates/task-ui",
]
resolver = "2"

[workspace.metadata.crane]
name = "task"

[workspace.package]
version = "0.1.0"
authors = ["Cody Wright"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Codys-Wright/Task"

[workspace.dependencies]
async-trait = "0.1"
chrono = "0.4"
eyre = "0.6"
futures = "0.3"
rrule = "0.11"
thiserror = "2.0"
tracing = "0.1"

[workspace.dependencies.facet]
version = "0.46"
features = [
    "reflect",
    "chrono",
    "uuid",
]

[workspace.dependencies.facet-core]
version = "0.46"

[workspace.dependencies.facet-json]
version = "0.46"

[workspace.dependencies.facet-pretty]
version = "0.46"

[workspace.dependencies.facet-reflect]
version = "0.46"

[workspace.dependencies.facet-yaml]
version = "0.46"

[workspace.dependencies.daw]
path = "../FastTrackStudio/daw/crates/daw"

[workspace.dependencies.keyflow]
path = "../FastTrackStudio/keyflow/crates/keyflow"

[workspace.dependencies.lumen-blocks]
git = "https://github.com/Leaf-Computer/lumen-blocks.git"
tag = "v0.2.0"

[workspace.dependencies.moire]
version = "1.0.0"
git = "https://github.com/bearcove/moire"
rev = "13eac79"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.serde_json]
version = "1"

[workspace.dependencies.shm-primitives]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.tokio]
version = "1"
features = ["full"]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
    "v5",
    "v7",
]

[workspace.dependencies.task-core]
path = "crates/task-core"

[workspace.dependencies.vox]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"
features = ["transport-websocket"]

[workspace.dependencies.vox-core]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.vox-codegen]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.vox-inprocess]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.vox-local]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.vox-schema]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.vox-stream]
