[workspace]
members = [
    "crates/fts-extensions",
    "crates/ui-test-standalone",
    "crates/ui-snapshot",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# FTS side repos are declared as pinned git dependencies for reproducible
# manifests. The local-development patch sections below redirect these packages
# back to sibling checkouts while iterating across repos.
fts-launcher = { git = "https://github.com/FastTrackStudios/fts-launcher.git", rev = "698a29121c2d20c24cba5a58d608c6f5da0f56a0", features = ["native"] }
dynamic-template = { git = "https://github.com/FastTrackStudios/dynamic-template.git", rev = "d4467d3807b970476c09641d6c240321653f5148" }
dynamic-template-proto = { git = "https://github.com/FastTrackStudios/dynamic-template.git", rev = "d4467d3807b970476c09641d6c240321653f5148" }
session = { git = "https://github.com/FastTrackStudios/session.git", rev = "189f942bd9fc07513ed913c488b36871f661849d" }
sync = { git = "https://github.com/FastTrackStudios/sync.git", rev = "7830a5a0b46afff799d6cfb18a0d9834f35a3d3f" }
sync-proto = { git = "https://github.com/FastTrackStudios/sync.git", rev = "7830a5a0b46afff799d6cfb18a0d9834f35a3d3f" }
reaper-input = { git = "https://github.com/FastTrackStudios/input.git", rev = "7f06a6acf027956c94b6fa2cab5b50c425ca1067" }
keyflow = { git = "https://github.com/FastTrackStudios/keyflow.git", rev = "c57b122ec309a8aade59b07b84041bc98a195a85", default-features = false }
crossbeam-channel = "0.5"
once_cell = "1"
eyre = "0.6"
fragile = "2"
reaper-high = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-low = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
daw = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://github.com/FastTrackStudios/daw.git", branch = "main" }
keyflow-daw-analysis = { git = "https://github.com/FastTrackStudios/keyflow.git", branch = "main" }
fts-ui = { git = "https://github.com/FastTrackStudios/fts-ui.git", rev = "d9f01261cb59708300cc5b31fa7fe6bd766a66aa" }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reaper-test = { git = "https://github.com/FastTrackStudios/daw.git", rev = "273dbaa1ef5e4dfac9cd35988e13d2b4b954ab6e" }

# ── Local development patches ─────────────────────────────────────────────
# Keep these active when working from the FastTrackStudio sibling checkout.
# Comment them out after pushing the pinned side-repo commits if you want to
# validate the remote-pinned graph.
[patch."https://github.com/FastTrackStudios/fts-launcher.git"]
fts-launcher = { path = "../fts-launcher" }

[patch."https://github.com/FastTrackStudios/daw.git"]
daw = { path = "../daw/crates/daw" }
daw-extension-runtime = { path = "../daw/crates/daw-extension-runtime" }
reaper-test = { path = "../daw/crates/reaper-test" }
reaper-launcher = { path = "../daw/crates/reaper-launcher" }

[patch."https://github.com/FastTrackStudios/keyflow.git"]
keyflow = { path = "../keyflow/crates/keyflow" }
keyflow-daw-analysis = { path = "../keyflow/crates/keyflow-daw-analysis" }

[patch."https://github.com/FastTrackStudios/input.git"]
reaper-input = { path = "../input/crates/reaper-input" }

[patch."https://github.com/FastTrackStudios/input_actions.git"]
actions-proto = { path = "../input_actions/crates/actions-proto" }
input = { path = "../input_actions/crates/input" }

[patch."https://github.com/FastTrackStudios/monarchy.git"]
monarchy = { path = "../monarchy/crates/monarchy" }

[patch."https://github.com/FastTrackStudios/dynamic-template.git"]
color-palette = { path = "../dynamic-template/crates/color-palette" }
music-catalog = { path = "../dynamic-template/crates/music-catalog" }
dynamic-template = { path = "../dynamic-template/crates/dynamic-template" }
dynamic-template-proto = { path = "../dynamic-template/crates/dynamic-template-proto" }

[patch."https://github.com/FastTrackStudios/session.git"]
session = { path = "../session/crates/session" }
session-ui = { path = "../session/crates/session-ui" }

[patch."https://github.com/FastTrackStudios/sync.git"]
sync = { path = "../sync/crates/sync" }
sync-proto = { path = "../sync/crates/sync-proto" }
sync-ui = { path = "../sync/crates/sync-ui" }

[patch."https://github.com/FastTrackStudios/fts-ui.git"]
fts-ui = { path = "../fts-ui/crates/fts-ui" }

[patch."https://github.com/bearcove/vox.git"]
vox = { git = "https://github.com/Codys-Wright/vox.git", rev = "ccb46b5416100d38430cb082d71bf0377428c241" }
vox-core = { git = "https://github.com/Codys-Wright/vox.git", rev = "ccb46b5416100d38430cb082d71bf0377428c241" }
vox-types = { git = "https://github.com/Codys-Wright/vox.git", rev = "ccb46b5416100d38430cb082d71bf0377428c241" }
vox-postcard = { git = "https://github.com/Codys-Wright/vox.git", rev = "ccb46b5416100d38430cb082d71bf0377428c241" }
vox-stream = { git = "https://github.com/Codys-Wright/vox.git", rev = "ccb46b5416100d38430cb082d71bf0377428c241" }
vox-schema = { git = "https://github.com/Codys-Wright/vox.git", rev = "ccb46b5416100d38430cb082d71bf0377428c241" }
vox-macros-core = { git = "https://github.com/Codys-Wright/vox.git", rev = "ccb46b5416100d38430cb082d71bf0377428c241" }
vox-macros-parse = { git = "https://github.com/Codys-Wright/vox.git", rev = "ccb46b5416100d38430cb082d71bf0377428c241" }

# Unify Blitz: upstream DioxusLabs/blitz -> FastTrackStudios/blitz fork.
[patch."https://github.com/DioxusLabs/blitz.git"]
dioxus-native = { path = "../blitz/packages/dioxus-native" }
