rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.vox-types]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.vox-websocket]
git = "https://github.com/Codys-Wright/vox"
rev = "ccb46b5416100d38430cb082d71bf0377428c241"

[workspace.dependencies.sea-orm]
git = "https://github.com/FastTrackStudios/sea-orm"
rev = "d01afa40d79227a4a2de85b50e76849300890766"
features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json", "facet"]

[workspace.dependencies.sea-orm-migration]
git = "https://github.com/FastTrackStudios/sea-orm"
rev = "d01afa40d79227a4a2de85b50e76849300890766"

[workspace.dependencies.crudcrate]
