[workspace]
members = [
    "apps/cli",
    "apps/desktop",
    "apps/mobile",
    "apps/native",
    "apps/tui",
    "crates/macromod",
    "crates/nam-manager",
    "crates/signal",
    "crates/signal-audio",
    "crates/signal-browser",
    "crates/signal-controller",
    "crates/signal-daw-bridge",
    # signal-daw is parked: it depends on daw-standalone extensions (Block
    # plugin format / per-mic bus output) that aren't upstream on Codeberg yet.
    # Re-add once those land in the codeberg daw. See [[project_signal_on_daw]].
    # "crates/signal-daw",
    "crates/signal-extension",
    "crates/fts-signal-controller",
    "crates/signal-import",
    "crates/signal-live",
    "crates/signal-proto",
    "crates/signal-sampler",
    "crates/signal-storage",
    "crates/signal-ui",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── Facade crate ─────────────────────────────────────────────────────
# The only public API surface for the signal domain.
# Apps depend on `signal`; never on signal-proto, signal-live, etc.
signal = { path = "crates/signal" }
# App crate (binary + lib)
signal-cli = { path = "apps/cli" }
signal-desktop = { path = "apps/desktop" }
signal-mobile = { path = "apps/mobile" }
# UI crate (Dioxus components with feature flags)
signal-ui = { path = "crates/signal-ui", default-features = false }
# Headless browser data layer (no Dioxus) — consumed by signal-ui and future TUI/CLI.
signal-browser = { path = "crates/signal-browser" }
# NOTE: signal-proto, signal-controller, signal-live, signal-storage,
# signal-import, signal-daw-bridge, nam-manager are INTERNAL.
# Access them through the `signal` facade crate.

# ── Local utility crates ─────────────────────────────────────────────
macromod       = { path = "crates/macromod" }
signal-audio   = { path = "crates/signal-audio" }
signal-sampler = { path = "crates/signal-sampler" }

# ── DSP crates (split FTS plugin repos) ───────────────────────────────
# Using local paths directly (same as [patch] overrides) to avoid
# git submodule fetch issues with stale nih-plug submodule rev.
eq-dsp = { path = "../Plugins/FTS-EQ/crates/eq-dsp" }
fts-dsp = { path = "../Plugins/FTS-Audiocore/crates/fts-dsp" }
cpal = "0.17"

# ── Facet reflection ─────────────────────────────────────────────────
# Pinned to 0.46 to match the daw + vox (bearcove) stack. facet-styx 4.0
# resolves against facet ^0.46.
facet = { version = "0.46" }
facet-styx = { version = "4.0" }
facet-toml = { version = "0.46" }

# ── ROAM service framework ───────────────────────────────────────────
# vox 0.8.2 fork, direct from Codeberg @ f31f104 — the exact rev daw +
# architect pin, so the graph contains a single vox/facet source.
vox = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "f31f10400c245740a072fa61bb96ef3a3fc2bd93" }
ur-taking-me-with-you = { git = "https://github.com/bearcove/vox", rev = "27eef573efd388bddaad0befdd59143a7e98b830" }

# ── DAW facade crate (sibling repo — single public API surface) ──────
# Source is Codeberg, but currently [patch]ed to the local checkout below:
# daw's vox-0.8.2 alignment (f431088) is NOT yet pushed to codeberg (cb/main
# daw still uses bearcove vox 0.5). Drop the local patch once it lands.
daw = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
daw-cli = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
daw-extension-runtime = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
# NOTE: daw-proto, daw-control, daw-control-sync, daw-reaper, daw-standalone,
# dawfile-reaper are INTERNAL. Access them through the `daw` facade crate.

# ── Shared infrastructure ────────────────────────────────────────────
audio-controls = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
# NOTE: the standalone `reaper-test` crate was removed from daw main and folded
# into the `daw` facade behind the `test-harness` feature, re-exported as
# `daw::test` (alias `ReaperTestContext`, `#[reaper_test]` macro). Test crates
# now enable `daw[test-harness]` and `use daw::test::*` instead.

# ── Sibling repos ────────────────────────────────────────────────────
actions-proto = { git = "https://codeberg.org/FastTrackStudios/input_actions.git", branch = "main" }
dock-dioxus = { git = "https://codeberg.org/FastTrackStudios/dock-dioxus.git", branch = "main", default-features = false }
dock-proto = { git = "https://codeberg.org/FastTrackStudios/dock-dioxus.git", branch = "main" }

# Utils from FastTrackStudio monorepo
utils = { git = "https://codeberg.org/FastTrackStudios/FastTrackStudio.git", branch = "main" }

# ── Plugin framework ───────────────────────────────────────────────────
nih_plug = { git = "https://codeberg.org/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }
# Blitz-based Dioxus renderer — used by ALL GUI contexts (desktop standalone,
# REAPER embedded, VST3/CLAP plugin). Guarantees the same rendering pipeline
# everywhere. Use open_standalone_with_state() in signal-desktop and
# create_dioxus_editor_with_state() in fts-signal-plugin.
nih_plug_dioxus = { git = "https://codeberg.org/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }
fts-plugin-core = { path = "../Plugins/FTS-Audiocore/crates/fts-plugin-core", default-features = false }
audio-gui = { path = "../Plugins/FTS-Audiocore/crates/audio-gui" }
atomic_float = "1"
crossbeam-channel = "0.5"
midir = "0.10"

# ── UI ────────────────────────────────────────────────────────────────
dioxus = "=0.7.9"
fts-ui = { git = "https://codeberg.org/FastTrackStudios/fts-ui.git", branch = "main" }
lumen-blocks = { git = "https://github.com/Leaf-Computer/lumen-blocks.git", tag = "v0.2.0" }

# ── Async runtime ────────────────────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# ── Serialization ────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# ── Observability ────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# NOTE: the `diagnostics` feature is intentionally OFF. At moire rev 7a2f1dc its
# trace-capture ctor validates the frame-pointer chain at startup and aborts on
# NixOS glibc ("frame pointer chain too shallow") — SIGABRT before main. daw
# main disables it for the same reason. signal doesn't use moire diagnostics.
moire = { version = "1.0" }

# ── Utilities ────────────────────────────────────────────────────────
eyre = "0.6"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
clap = { version = "4", features = ["derive"] }

# ── Local development overrides ──────────────────────────────────────
# All external deps now resolve DIRECT from Codeberg / GitHub — no local path
# patches. daw cb/main (74e84e3) pins codeberg vox f31f104; architect cb/main
# (afbb663) pins codeberg vox f31f104 with the macro `::vox`-path fix;
# input_actions main is aligned. To iterate locally on a sibling repo, add a
# `[patch."https://codeberg.org/FastTrackStudios/<repo>.git"]` block pointing at
# its checkout (mind the daw `features/`-layout paths).
#
# [patch."https://codeberg.org/FastTrackStudios/dock-dioxus.git"]
# dock-dioxus = { path = "../dock-dioxus/crates/dock-dioxus" }
# dock-proto = { path = "../dock-dioxus/crates/dock-proto" }
#
# [patch."https://codeberg.org/FastTrackStudios/FastTrackStudio.git"]
# utils = { path = "../FastTrackStudio/crates/shared/utils" }
#
# [patch."https://codeberg.org/FastTrackStudios/fts-ui.git"]
# fts-ui = { path = "../fts-ui/crates/fts-ui" }
#
# ── Split FTS plugin repo local overrides ───────────────────────────────
[patch."https://git.starcommand.live/FastTrackStudios/FTS-Plugins.git"]
eq-dsp = { path = "../Plugins/FTS-EQ/crates/eq-dsp" }
fts-dsp = { path = "../Plugins/FTS-Audiocore/crates/fts-dsp" }
audio-gui = { path = "../Plugins/FTS-Audiocore/crates/audio-gui" }
fts-plugin-core = { path = "../Plugins/FTS-Audiocore/crates/fts-plugin-core" }

# ── nih-plug unification ────────────────────────────────────────────────
# NOTE: the local-path patch (`nih_plug = { path = "../forks/nih-plug" }`) was
# removed. That checkout sits on `master`, which lacks `nih_plug_dioxus` and the
# reaper-embed-ui API additions (`rescan_param_info`, `set_normalized_value`,
# the `reaper-embed-ui` `ParamPtr`), so it diverged from the `nih_plug` that
# `nih_plug_dioxus` (reaper-embed-ui) links against — producing two nih_plug
# versions in the graph. Both now resolve from the `reaper-embed-ui` branch.
#
# The FTS-Audiocore plugin crates (fts-plugin-core, audio-gui — path deps) pull
# nih-plug from the github.com mirror via their own workspace, while signal uses
# the starcommand.live origin. Same commit, different URL = two sources. Redirect
# the github mirror onto the starcommand origin so the whole graph shares one
# nih_plug / nih_plug_dioxus.
# Local editable checkout of the reaper-embed-ui branch while porting
# nih_plug_dioxus to current DioxusLabs/blitz. Both the starcommand origin and
# the github mirror (pulled by FTS-Audiocore plugin crates) redirect here, so
# the whole graph shares one editable nih_plug / nih_plug_dioxus.
[patch."https://codeberg.org/FastTrackStudios/nih-plug.git"]
nih_plug = { path = "../forks/nih-plug-port" }
nih_plug_dioxus = { path = "../forks/nih-plug-port/nih_plug_dioxus" }

[patch."https://github.com/FastTrackStudios/nih-plug.git"]
nih_plug = { path = "../forks/nih-plug-port" }
nih_plug_dioxus = { path = "../forks/nih-plug-port/nih_plug_dioxus" }

# NOTE: the bearcove/vox → Codys-Wright-fork [patch] block was removed.
# It was forcing daw's clean upstream-bearcove vox deps onto the old fork,
# pulling facet 0.44/0.45 alongside the 0.46 stack and breaking the build.
# All vox deps now point at upstream bearcove directly (see above), matching
# daw main. The fork's eprintln! debug-log fix is no longer applied here.

# ── Vendored patches ──────────────────────────────────────────────────
# moire: FTS fork — tolerates broken frame-pointer chains on NixOS glibc.
# All moire crates must point to the same fork rev to avoid type mismatches.
[patch."https://github.com/bearcove/moire"]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[patch.crates-io]
# Blitz crates — upstream DioxusLabs/blitz, pinned to one rev so nih_plug_dioxus,
# fts-ui, and signal all share a single blitz/dioxus-native. Bump in lockstep
# with nih_plug_dioxus (it tracks this rev's API).
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
blitz-net = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
blitz-shell = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
stylo_taffy = { git = "https://github.com/DioxusLabs/blitz.git", rev = "0e0027ab6eba536cfa03445baac48efed31609e4" }
# moire: unify crates.io moire with the FTS fork (includes NixOS frame-pointer fix)
# All crates must be listed to prevent duplicate moire-runtime #[ctor] crash.
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[workspace.lints.rust]
dead_code = "allow"
unused = "allow"

[workspace.lints.clippy]

# ── Dev profile: release-like runtime for `dx serve` (no --release needed) ──
# `dx serve` builds the dev profile. Optimize all dependencies — including the
# audio DSP crates (signal-sampler/signal-audio/daw) and wgpu/blitz/vello — to
# release opt-level so the player shows real performance by default, while the
# thin app/UI crates stay at light opt for fast hot-reload rebuilds.
# For exact release numbers, run `dx serve --release`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
