# FastTrackStudio — the aggregate.
#
# Everything that was a product moved to its own repo in August 2026.
# What is left is packaging: the installer that assembles the shipped
# products into one thing a user can install, and the release machinery
# around it. No domain logic lives here.
#
#   daw / session / signal   the libraries and their apps
#   fts-extensions           the DAW-host extensions
#   Ignition, patchbay       separate products
#   fasttrackstudio.app      the marketing site
#
# See CLAUDE.md for the layering and the rules the split taught us.

[workspace]
resolver = "3"

members = [
    "apps/installer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/FastTrackStudio"

[workspace.dependencies]
installer-core = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"
serde_json = "1.0"
eyre = "0.6"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
# Kept from the monorepo. The blanket allows these replaced are WHY ~30k
# lines of dead code accumulated silently there.
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

# The monorepo's long clippy allow-list is deliberately NOT carried: it
# existed to keep 238 crates of legacy code quiet. One installer crate
# starts clean.

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
