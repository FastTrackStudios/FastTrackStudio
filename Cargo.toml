[workspace]
members = [
    "apps/reaper_extension",
    "apps/plugins/wgpu_reaper_demo",
    "apps/plugins/gain",
    "apps/plugins/guide",
    "apps/native-testing",
    "apps/fts-native",
    # "apps/native-test",  # Excluded - old test app
    # "apps/fts-control",  # Temporarily excluded - uses dioxus "native" which conflicts with git blitz
    "libs/macros",
    "libs/monarchy",
    "libs/monarchy-derive",
    "libs/pdf",
    "libs/swell-ui",
    "libs/reaper-embed",
    "modules/actions",
    "modules/daw",
    "modules/dynamic-template",
    "modules/fts",
    "modules/fts-plugin-core",
    "modules/microservice",
    "modules/plugin-hub",
    "modules/plugins/ui",
    "modules/plugins/gain",
    "modules/peer-2-peer",
    "packages/keyflow",
    # "packages/charts",    # Deprecated - functionality in keyflow
    # "packages/engraver",  # Merged into keyflow
    "xtask",
    "apps/desktop",
    "apps/mobile",
    "apps/web",
    "modules/ui",
    "modules/api",
    "modules/rppxml",
    "modules/fx",
    "modules/visibility-manager",
]
# Exclude submodules that have their own workspaces
exclude = ["libs/nih-plug", "libs/vendor/blitz", "libs/vendor/anyrender", "libs/vendor/reaper-rs", "libs/vendor/baseview", "apps/fts-control"]
# Temporarily using resolver = "2" for stylo compatibility
# Rust 2024 implies resolver = "3" (Rust-version aware)
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/codywright/FastTrackStudio"

[workspace.metadata.crane]
name = "fts-workspace"

[workspace.dependencies]
actions = { path = "modules/actions" }
anyhow = "1.0"
async-trait = "0.1"
atomic_float = "1.0"
dioxus = { version = "0.7.1", features = ["router"], default-features = false }
fragile = "2.0.1"
futures = "0.3"
libloading = "0.9"
lumen-blocks = { path = "libs/lumen-blocks/blocks" }
nih_plug = { path = "libs/nih-plug" }
nih_plug_dioxus = { path = "libs/nih-plug/nih_plug_dioxus" }
nom = "8.0.0"

objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"
palette = "0.7.3"
rand = "0.8"
raw-window-handle = "0.4.2"
scopeguard = "1.1.0"
serde_json = "1.0"
specta-typescript = "0.0.9"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
taurpc = "0.5.2"
thiserror = "1.0"
tracing = "0.1"
dioxus-sdk-time = "0.7"
lucide-dioxus = "2"
ui = { path = "modules/ui" }

# Roam RPC framework (facet must match roam's version exactly)
roam = { git = "https://github.com/bearcove/roam.git", rev = "1407c929" }
facet = { version = "0.43.2", git = "https://github.com/facet-rs/facet", branch = "main", features = ["camino", "reflect", "uuid"] }
microservice = { path = "modules/microservice" }

[workspace.dependencies.chrono]
version = "0.4"
features = ["serde"]

[workspace.dependencies.reaper-common-types]
git = "https://github.com/helgoboss/reaper-rs.git"
branch = "master"
features = ["palette"]
package = "reaper-common-types"

[workspace.dependencies.reaper-high]
git = "https://github.com/helgoboss/reaper-rs.git"
branch = "master"

[workspace.dependencies.reaper-low]
git = "https://github.com/helgoboss/reaper-rs.git"
branch = "master"

[workspace.dependencies.reaper-medium]
git = "https://github.com/helgoboss/reaper-rs.git"
branch = "master"

[workspace.dependencies.rxrust]
git = "https://github.com/rxRust/rxRust"
rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83"

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.specta]
version = "2.0.0-rc.22"
features = [
    "derive",
    "uuid",
]

[workspace.dependencies.tarpc]
version = "0.37"
features = ["full"]

[workspace.dependencies.tauri]
version = "2"
features = []

[workspace.dependencies.tauri-build]
version = "2"
features = []

[workspace.dependencies.tokio]
version = "1.0"

[workspace.dependencies.irpc]
version = "0.11.0"
features = ["rpc", "derive", "quinn_endpoint_setup"]

[workspace.dependencies.tower]
version = "0.4"
features = ["util"]

[workspace.dependencies.winapi]
version = "0.3"
features = [
    "winuser",
    "uxtheme",
]

[workspace.dependencies.syn]
version = "2.0"
features = ["full", "extra-traits"]

[workspace.dependencies.quote]
version = "1.0"

[workspace.dependencies.proc-macro2]
version = "1.0"

[workspace.lints.rust]
# Use deny instead of forbid to allow specific crates (like daw with roam) to override
unsafe_code = "deny"
# Allow unused code for now - will clean up later
# This allows unused variables, imports, functions, etc. without causing build failures
unused = { level = "allow", priority = -1 }
# Rust 2024 recommended lints
future_incompatible = "warn"
nonstandard_style = "warn"

# Override nih_plug for any dependency that pulls it from git
# This ensures all packages use our local submodule with REAPER embed UI support
[patch."https://github.com/Cmdv/nih-plug.git"]
nih_plug = { path = "libs/nih-plug" }

# Override reaper-rs crates from upstream git to use our local fork
# This allows us to add missing functionality like KBD_OnMainActionEx
[patch."https://github.com/helgoboss/reaper-rs.git"]
reaper-common-types = { path = "libs/vendor/reaper-rs/main/common-types" }
reaper-high = { path = "libs/vendor/reaper-rs/main/high" }
reaper-low = { path = "libs/vendor/reaper-rs/main/low" }
reaper-medium = { path = "libs/vendor/reaper-rs/main/medium" }
reaper-macros = { path = "libs/vendor/reaper-rs/main/macros" }
reaper-fluent = { path = "libs/vendor/reaper-rs/main/fluent" }
reaper-rx = { path = "libs/vendor/reaper-rs/main/rx" }

# Override blitz crates from upstream git to use our local fork with post-processing support
[patch."https://github.com/DioxusLabs/blitz.git"]
dioxus-native = { path = "libs/vendor/blitz/packages/dioxus-native" }
dioxus-native-dom = { path = "libs/vendor/blitz/packages/dioxus-native-dom" }
blitz-dom = { path = "libs/vendor/blitz/packages/blitz-dom" }
blitz-html = { path = "libs/vendor/blitz/packages/blitz-html" }
blitz-net = { path = "libs/vendor/blitz/packages/blitz-net" }
blitz-paint = { path = "libs/vendor/blitz/packages/blitz-paint" }
blitz-traits = { path = "libs/vendor/blitz/packages/blitz-traits" }
blitz-shell = { path = "libs/vendor/blitz/packages/blitz-shell" }
stylo_taffy = { path = "libs/vendor/blitz/packages/stylo_taffy" }

# Also patch crates-io versions for other crates that use these
[patch.crates-io]
# Blitz crates - local submodule
dioxus-native = { path = "libs/vendor/blitz/packages/dioxus-native" }
dioxus-native-dom = { path = "libs/vendor/blitz/packages/dioxus-native-dom" }
blitz-dom = { path = "libs/vendor/blitz/packages/blitz-dom" }
blitz-html = { path = "libs/vendor/blitz/packages/blitz-html" }
blitz-net = { path = "libs/vendor/blitz/packages/blitz-net" }
blitz-paint = { path = "libs/vendor/blitz/packages/blitz-paint" }
blitz-traits = { path = "libs/vendor/blitz/packages/blitz-traits" }
blitz-shell = { path = "libs/vendor/blitz/packages/blitz-shell" }
stylo_taffy = { path = "libs/vendor/blitz/packages/stylo_taffy" }
# Stylo crates - local vendor with derive_more v1 fix for Rust 1.92+ compatibility
stylo = { path = "libs/vendor/stylo/style" }
selectors = { path = "libs/vendor/stylo/selectors" }
# Anyrender crates - local submodule
anyrender = { path = "libs/vendor/anyrender/crates/anyrender" }
anyrender_vello = { path = "libs/vendor/anyrender/crates/anyrender_vello" }
anyrender_vello_cpu = { path = "libs/vendor/anyrender/crates/anyrender_vello_cpu" }
anyrender_vello_hybrid = { path = "libs/vendor/anyrender/crates/anyrender_vello_hybrid" }
anyrender_svg = { path = "libs/vendor/anyrender/crates/anyrender_svg" }
wgpu_context = { path = "libs/vendor/anyrender/crates/wgpu_context" }
# Facet - roam requires git version, patch crates.io to avoid duplicates
facet = { git = "https://github.com/facet-rs/facet", branch = "main" }

# Profile settings for WASM builds
# The "too many locals" error occurs when compiling large Rust projects to WASM in debug mode
# We optimize web app in dev mode to reduce local variables

[profile.dev.package.web]
# Enable basic optimization to reduce WASM locals in dev builds
opt-level = 1

[profile.dev.package.keyflow]
# Keyflow is a large dependency - optimize it to reduce locals
opt-level = 1

[profile.dev.package.vello]
# Vello generates many locals - optimize it
opt-level = 2

[profile.dev.package.wgpu]
# WGPU is another large dependency
opt-level = 2

[profile.dev.package.parley]
# Text layout generates many locals
opt-level = 2

[profile.dev.package.daw]
# DAW module optimization
opt-level = 1

[profile.dev.package.facet]
# Reflection framework optimization
opt-level = 2

[profile.dev.package.roam]
# RPC framework optimization
opt-level = 2

# =============================================================================
# Release profile for WASM (production) - maximum optimization
# =============================================================================
[profile.release]
lto = true
opt-level = "s"  # Optimize for size (alternatives: "z" for smallest, 3 for speed)
codegen-units = 1
strip = true  # Strip symbols for smaller binary

# Custom profile for WASM development - balances speed with size
[profile.wasm-dev]
inherits = "dev"
opt-level = 2  # Good optimization without long compile times
debug = false  # Disable debug info to reduce WASM size

[profile.wasm-dev.package."*"]
# Apply opt-level 2 to all dependencies for WASM dev
opt-level = 2

[workspace.lints.clippy]
# Core lints - treat as errors
all = { level = "deny", priority = -1 }
# Performance-critical lints
redundant_clone = { level = "warn", priority = 1 }
needless_collect = { level = "warn", priority = 1 }
clone_on_copy = { level = "warn", priority = 1 }
# Style lints
needless_borrow = { level = "warn", priority = 1 }
manual_ok_or = { level = "warn", priority = 1 }
map_unwrap_or = { level = "warn", priority = 1 }
# Pedantic lints - more strict, enable as warnings
pedantic = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
