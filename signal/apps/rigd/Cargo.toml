[package]
name = "signal-rigd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The headless rig daemon: the 100%-headless guitar-rig core serving its vox
# router over a WebSocket. Every GUI — browser wasm, desktop, tablets on the
# same network, an embedded pedalboard's front panel — is a remote client of
# this process. This is the same router the desktop app serves in-process.

[dependencies]
signal-guitar.workspace = true
# Enables the native PipeWire duplex backend on the shared sampler core.
signal-sampler = { workspace = true, features = ["pipewire"] }
architect = { workspace = true, features = ["vox", "server-axum"] }
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
