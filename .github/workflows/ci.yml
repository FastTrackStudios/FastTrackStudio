name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NIXPKGS_ALLOW_UNFREE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling repos
        run: |
          cd ..
          for repo in daw input_actions keyflow monarchy dock-dioxus dynamic-template; do
            gh repo clone FastTrackStudios/$repo -- --depth 1
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: fasttrackstudio
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Clippy
        run: nix develop --impure --command cargo clippy -p fts-cli -p dynamic-template-extension -- -D warnings

      - name: Format
        run: |
          git fetch --depth=1 origin main
          base=$(git merge-base origin/main HEAD)
          files=$(git diff --name-only "$base" HEAD -- '*.rs')
          if [ -n "$files" ]; then
            nix develop --impure --command rustfmt --edition 2024 --check $files
          fi

      - name: Tests
        run: nix develop --impure --command cargo nextest run --workspace
