[package]
name = "daw-standalone"
version.workspace = true
edition.workspace = true

[[bin]]
name = "daw-standalone"
path = "src/main.rs"

[lib]
name = "daw_standalone"
path = "src/lib.rs"

[dependencies]
daw-proto = { path = "../daw-proto" }
extension-runtime = { path = "../../../modules/extension-runtime" }
roam-session = { workspace = true }
roam-wire = "0.6"

# In-memory state management
parking_lot = "0.12"

# Utilities
tracing = { workspace = true }
wasm-timer = "0.2"  # Cross-platform timing (works in WASM)
