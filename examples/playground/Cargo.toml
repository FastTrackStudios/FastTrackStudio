[package]
name = "playground"
description = "Dioxus dogfooding app for the editor crate. Run with `dx serve --package playground`."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
editor = { workspace = true }
dioxus = { workspace = true }

# Switch platforms with --no-default-features --features web|desktop.
[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
