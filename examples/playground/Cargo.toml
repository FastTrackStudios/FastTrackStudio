[package]
name = "playground"
description = "Dioxus dogfooding app for the editor crate. Run with `dx serve --package playground`."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
editor = { workspace = true }
dioxus = { workspace = true }
tracing = { workspace = true }

# File / stdout logging is desktop-only — wasm can't open files.
# A future commit can add `tracing-wasm` for the browser path.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Switch platforms with --no-default-features --features web|desktop.
[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

# wasm-only: web_sys for URL query reading. Lives under the
# target-cfg deps so the desktop build doesn't pull it in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
