[package]
name = "app-ui"
version = "0.1.0"
edition = "2024"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

# Runtime UI shell for the example app.
#
# Composes one or more feature-ui crates (just `example-ui` here, but
# the DAW analogue would pull in timeline-ui, mixing-ui, automation-ui,
# ...) into the pages and chrome that `apps/web` and `apps/desktop`
# mount as their root component.

[dependencies]
# Single dep root — facade re-exports the wire types + vox client.
example = { path = "../features/example/example", features = ["vox"] }
# Feature-scoped Dioxus components.
example-ui = { path = "../features/example/example-ui" }
dioxus = { version = "0.7.9", default-features = false, features = ["lib", "router"] }
# v0.8.2-with-Uuid fork (see root Cargo.toml) — same rev as the server so
# the wire schema agrees.
vox = { git = "https://git.starcommand.live/FastTrackStudios/vox", rev = "f31f10400c245740a072fa61bb96ef3a3fc2bd93", default-features = false, features = ["runtime"] }
vox-core = { git = "https://git.starcommand.live/FastTrackStudios/vox", rev = "f31f10400c245740a072fa61bb96ef3a3fc2bd93" }
vox-websocket = { git = "https://git.starcommand.live/FastTrackStudios/vox", rev = "f31f10400c245740a072fa61bb96ef3a3fc2bd93" }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
# Headless smoke test: mount the full App (router + connection lifecycle)
# in a VirtualDom and render it without a window.
dioxus-ssr = "0.7"
