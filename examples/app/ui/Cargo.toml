[package]
name = "app-ui"
version = "0.1.0"
edition = "2024"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

# Runtime UI shell for the example app.
#
# Composes one or more feature-ui crates (just `example-ui` here, but
# the DAW analogue would pull in timeline-ui, mixing-ui, automation-ui,
# ...) into the pages and chrome that `apps/web` and `apps/desktop`
# mount as their root component.

[dependencies]
# Single dep root — facade re-exports the wire types + vox client.
example = { path = "../features/example/example", features = ["vox"] }
# Feature-scoped Dioxus components.
example-ui = { path = "../features/example/example-ui" }
dioxus = { version = "0.7.9", default-features = false, features = ["lib", "router"] }
vox = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5", default-features = false, features = ["runtime"] }
vox-core = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
vox-websocket = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
uuid = { version = "1", features = ["v4", "js"] }
