[package]
name = "app-web"
version = "0.1.0"
edition = "2024"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

# Dioxus web target. Renders `app_ui::App` and connects to
# `apps/server`'s vox WebSocket. The same `example-proto` crate that
# the server uses is consumed here without the `server` feature, so
# we get typed `ExampleServiceClient` methods without a separate
# schema.

[dependencies]
# Outside the workspace — referenced by relative path.
example-proto = { path = "../features/example/example-proto" }
app-ui = { path = "../ui" }

dioxus = { version = "0.7.9", default-features = false, features = ["lib", "web", "launch", "router"] }
vox = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5", default-features = false, features = ["runtime"] }
vox-core = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
vox-websocket = { git = "https://github.com/bearcove/vox", rev = "fd3167b6d6b89b60edd9c78f7b8890f5a87571d5" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
