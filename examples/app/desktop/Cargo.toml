[package]
name = "app-desktop"
version = "0.1.0"
edition = "2024"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

# Native Dioxus desktop target. Same UI as the web app — the platform
# differences are confined to this binary; `app-ui` stays
# platform-agnostic.

[dependencies]
app-ui = { path = "../ui" }
# In-process backend: serve the full service router (repo + ExampleService)
# over a vox in-memory link — the desktop runs the whole stack, no server.
# `app-server` is depended on for its `service_router` lib fn (no default
# features → no backend/sea-orm baggage, just the generic composition).
app-server = { path = "../server", default-features = false }
example-memory = { path = "../features/example/example-memory" }
architect = { path = "../../../macros/architect", default-features = false, features = ["local"] }

dioxus = { version = "0.7.9", default-features = false, features = ["lib", "desktop", "launch", "router"] }
# v0.8.2-with-Uuid fork (see root Cargo.toml) — same rev as the server.
vox = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "1db8b13904e5a74fedc22f95eb07071a24258191", default-features = false, features = ["runtime"] }
vox-core = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "1db8b13904e5a74fedc22f95eb07071a24258191" }
vox-websocket = { git = "https://codeberg.org/FastTrackStudios/vox.git", rev = "1db8b13904e5a74fedc22f95eb07071a24258191" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
