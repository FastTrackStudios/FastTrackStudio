[package]
name = "app-desktop"
version = "0.1.0"
edition = "2024"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

# Native Dioxus desktop target. Same UI as the web app — the platform
# differences are confined to this binary; `app-ui` stays
# platform-agnostic.

[dependencies]
example-proto = { path = "../features/example/example-proto" }
app-ui = { path = "../ui" }

dioxus = { version = "0.7.9", default-features = false, features = ["lib", "desktop", "launch", "router"] }
vox = { git = "https://github.com/bearcove/vox", rev = "230dcd5bb1e5aedd1309308c64de07781fad5b57", default-features = false, features = ["runtime"] }
vox-core = { git = "https://github.com/bearcove/vox", rev = "230dcd5bb1e5aedd1309308c64de07781fad5b57" }
vox-websocket = { git = "https://github.com/bearcove/vox", rev = "230dcd5bb1e5aedd1309308c64de07781fad5b57" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
